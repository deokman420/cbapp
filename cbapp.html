        showStatus("Clock window created!");
        return newWindow;
      }

      function toggleClock() {
        const clock = document.getElementById("clock");
        const clockButton = document.getElementById("clock-toggle");
        if (clock && clock.style.display === "none") {
          restoreWindow("clock");
          return;
        }
        if (clock) {
          clock.remove();
          if (window._clockInterval) { clearInterval(window._clockInterval); window._clockInterval = null; }
          clockVisible = false;
          clockButton.textContent = "Clock";
          clockButton.classList.remove("active");
        } else {
          addClock();
        }
        saveSession();
      }

      function updateClock(windowId) {
        if (!windowId) return;
        const timeDiv = document.getElementById(`clock-time-${windowId}`);
        const dateDiv = document.getElementById(`clock-date-${windowId}`);
        const formatSelect = document.getElementById(
          `clock-format-${windowId}`
        );
        const easternDiv = document.getElementById("clock-eastern");
        const centralDiv = document.getElementById("clock-central");
        const mountainDiv = document.getElementById("clock-mountain");
        const pacificDiv = document.getElementById("clock-pacific");
        if (
          timeDiv &&
          dateDiv &&
          formatSelect &&
          easternDiv &&
          centralDiv &&
          mountainDiv &&
          pacificDiv
        ) {
          const now = new Date();
          const options = {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          };
          dateDiv.textContent = now.toLocaleDateString(undefined, options);
          const is24Hour = formatSelect.value === "24";
          timeDiv.textContent = now.toLocaleTimeString(undefined, {
            hour12: !is24Hour,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          const easternTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/New_York" })
          );
          const centralTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/Chicago" })
          );
          const mountainTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/Denver" })
          );
          const pacificTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" })
          );
          easternDiv.textContent = easternTime.toLocaleTimeString(undefined, {
            hour12: !is24Hour,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          centralDiv.textContent = centralTime.toLocaleTimeString(undefined, {
            hour12: !is24Hour,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          mountainDiv.textContent = mountainTime.toLocaleTimeString(undefined, {
            hour12: !is24Hour,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          pacificDiv.textContent = pacificTime.toLocaleTimeString(undefined, {
            hour12: !is24Hour,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        }
      }
      let stopwatchInterval = null;
      let stopwatchStart = null;
      let stopwatchElapsed = 0;

      function updateStopwatchDisplay() {
        const display = document.getElementById("stopwatch-display");
        if (!display) return;
        let elapsed = stopwatchElapsed;
        if (stopwatchStart) {
          elapsed += Date.now() - stopwatchStart;
        }
        const ms = elapsed % 1000;
        const totalSeconds = Math.floor(elapsed / 1000);
        const s = totalSeconds % 60;
        const m = Math.floor(totalSeconds / 60) % 60;
        const h = Math.floor(totalSeconds / 3600);
        display.textContent =
          `${h.toString().padStart(2, "0")}:` +
          `${m.toString().padStart(2, "0")}:` +
          `${s.toString().padStart(2, "0")}.` +
          `${ms.toString().padStart(3, "0")}`;
      }

      function startStopwatch() {
        if (!stopwatchStart) {
          stopwatchStart = Date.now();
          stopwatchInterval = setInterval(updateStopwatchDisplay, 31);
        }
      }

      function pauseStopwatch() {
        if (stopwatchStart) {
          stopwatchElapsed += Date.now() - stopwatchStart;
          stopwatchStart = null;
          clearInterval(stopwatchInterval);
          updateStopwatchDisplay();
        }
      }

      function resetStopwatch() {
        stopwatchElapsed = 0;
        stopwatchStart = null;
        clearInterval(stopwatchInterval);
        updateStopwatchDisplay();
      }

      function addLog() {
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }
        const windowsContainer = document.getElementById("windows");
        const newWindow = document.createElement("div");
        newWindow.className = "log-window";
        newWindow.id = "log";
        newWindow.style.zIndex = nextWindowZ();
        newWindow.dataset.width = 400;
        newWindow.dataset.height = 400;
        // These were "400" without a unit - invalid, so the log window silently
        // collapsed to its 350x150 min-size in the top-left corner.
        newWindow.style.width = "400px";
        newWindow.style.height = "400px";
        placeWindow(newWindow, 400, 400);
        newWindow.innerHTML = `
                <div class="log-header">
                    <span class="log-title">Log</span>
                    <div class="log-controls">
                        <span class="edit-window" onclick="startRename('log')" title="Rename" role="button" tabindex="0">✏️</span>
                        <span class="minimize-window" onclick="minimizeWindow('log')" title="Minimize" role="button" tabindex="0">🗕</span>
                        <span class="lock-window" onclick="toggleWindowLock('log')" title="Lock editing, dragging and resizing" role="button" tabindex="0" aria-pressed="false">🔓</span>
                        <span class="close-log" onclick="toggleLog()" title="Close" role="button" tabindex="0">×</span>
                    </div>
                </div>
                <div class="log-content">
                    <div class="log-input-container">
                        <input type="text" class="log-input" id="log-input" placeholder="Enter log description...">
                        <button onclick="addLogEntry()">Log</button>
                    </div>
                    <div class="log-list" id="log-list"></div>
                </div>
            `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow("log");
        refreshChrome();
        const logInput = document.getElementById("log-input");
        logInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addLogEntry();
          }
        });
        restoreLogEntries();
        logVisible = true;
        document.getElementById("log-toggle").textContent = "Log";
        document.getElementById("log-toggle").classList.add("active");
        saveSession();
        showStatus("Log window opened!");
        return newWindow;
      }

      function toggleLog() {
        const log = document.getElementById("log");
        const logButton = document.getElementById("log-toggle");
        if (log && log.style.display === "none") {
          restoreWindow("log");
          return;
        }
        if (log) {
          log.remove();
          logVisible = false;
          logButton.textContent = "Log";
          logButton.classList.remove("active");
          showStatus("Log window hidden.");
        } else {
          addLog();
        }
        saveSession();
      }

      // Single builder for new and restored entries so the two can't drift, and
      // so both get the delete control the log previously lacked entirely - it
      // was append-only with no way to remove a mistyped line.
      function createLogItem(entry) {
        const logItem = document.createElement("div");
        logItem.className = "log-item";
        const ts = document.createElement("span");
        ts.className = "timestamp";
        ts.textContent = entry.timestamp;
        const sep = document.createTextNode(": ");
        const desc = document.createElement("span");
        desc.className = "description";
        desc.textContent = entry.description;
        const del = document.createElement("button");
        del.className = "log-delete";
        del.textContent = "×";
        del.title = "Delete this entry";
        del.setAttribute("aria-label", `Delete log entry: ${entry.description}`);
        del.onclick = (e) => {
          e.stopPropagation();
          const i = logEntries.indexOf(entry);
          if (i > -1) logEntries.splice(i, 1);
          logItem.remove();
          saveSession();
          showStatus("Log entry deleted.");
        };
        logItem.appendChild(ts);
        logItem.appendChild(sep);
        logItem.appendChild(desc);
        logItem.appendChild(del);
        return logItem;
      }

      function addLogEntry() {
        const logInput = document.getElementById("log-input");
        const logList = document.getElementById("log-list");
        if (!logInput || !logList) return;
        const description = logInput.value.trim();
        if (!description) {
          showStatus("Log entry cannot be empty.");
          logInput.focus();
          return;
        }
        const timestamp = new Date().toLocaleString("en-US", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        const entry = { timestamp, description };
        logEntries.push(entry);
        logList.appendChild(createLogItem(entry));
        logInput.value = "";
        logInput.focus();
        logList.scrollTop = logList.scrollHeight;
        saveSession();
        showStatus("Log entry added.");
      }

      function restoreLogEntries() {
        const logList = document.getElementById("log-list");
        if (!logList) return;
        logList.innerHTML = "";
        logEntries.forEach((entry) => logList.appendChild(createLogItem(entry)));
        logList.scrollTop = logList.scrollHeight;
      }

      // Pointer Events rather than mouse events: the old handler was
      // mousedown/mousemove/mouseup only, so on a touch screen a window could
      // not be moved at all. Pointer events cover mouse, touch and pen through
      // one path, and setPointerCapture keeps the drag alive if the finger
      // outruns the header.
      /* Which element actually carries a window's size. For a note it is the
         .textarea-container — the window sizes itself to fit via
         updateWindowSize(), so resizing the window directly would be undone on
         the next sync. Sticky notes and task lists size themselves. Everything
         else (calculator, clock, log, help) has never been resizable. */
      function resizeTargetFor(element) {
        if (
          element.classList.contains("sticky-note-window") ||
          element.classList.contains("task-window")
        ) {
          return element;
        }
        return element.querySelector(".textarea-container");
      }

      /* Floor for anything that declares no min-* of its own. .sticky-note-window
         is the one resizable type missing from the min-width/min-height rule the
         other six share, so without this a note could be dragged down to a
         sliver with its own header clipped out of sight. Applied in the grip
         rather than in CSS deliberately: a min-* on the element would also
         change native resize in the off state, and could inflate a sticky note
         restored from an older session. */
      const GRIP_MIN_W = 240;
      const GRIP_MIN_H = 140;

      function attachResizeGrip(element) {
        const target = resizeTargetFor(element);
        if (!target) return;
        if (element.querySelector(":scope > .resize-grip")) return;

        const grip = document.createElement("div");
        grip.className = "resize-grip";
        grip.setAttribute("aria-hidden", "true");
        element.appendChild(grip);

        let gripPointerId = null;
        let start = null;

        let gripFrame = null;
        let pending = null;

        const paint = () => {
          gripFrame = null;
          if (!pending) return;
          target.style.width = `${pending.w}px`;
          target.style.height = `${pending.h}px`;
        };

        const onMove = (e) => {
          if (e.pointerId !== gripPointerId) return;
          // Same screen->world conversion as dragging. This is the whole fix:
          // the pointer delta is divided by the zoom, so the corner tracks the
          // cursor instead of running at 1/zoom speed.
          const p = screenToWorld(e.clientX, e.clientY);
          pending = {
            w: Math.max(start.minW, start.w + (p.x - start.px)),
            h: Math.max(start.minH, start.h + (p.y - start.py)),
          };
          // Deferred to the frame like the drag: a resize writes width and
          // height, which relayouts the window and everything inside it, so
          // doing it per pointer event rather than per frame is the most
          // expensive thing either gesture could do.
          if (gripFrame === null) gripFrame = requestAnimationFrame(paint);
        };

        const end = (e) => {
          if (gripPointerId === null || (e && e.pointerId !== gripPointerId))
            return;
          try {
            grip.releasePointerCapture(gripPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          gripPointerId = null;
          document.body.style.userSelect = "";
          if (gripFrame !== null) {
            cancelAnimationFrame(gripFrame);
            gripFrame = null;
          }
          paint(); // land the final size, never a frame behind the pointer
          pending = null;
          grip.removeEventListener("pointermove", onMove);
          grip.removeEventListener("pointerup", end);
          grip.removeEventListener("pointercancel", end);
          // The size itself is persisted by each window type's existing
          // ResizeObserver; this is for the map, which has no observer.
          if (view.on) scheduleMapWindows();
          saveSession();
        };

        grip.addEventListener("pointerdown", (e) => {
          if (element.dataset.locked === "true") return;
          if (gripPointerId !== null) return;
          if (e.button !== undefined && e.button !== 0) return;
          // Never let this reach the header drag or the canvas pan.
          e.preventDefault();
          e.stopPropagation();
          gripPointerId = e.pointerId;
          const cs = getComputedStyle(target);
          const p = screenToWorld(e.clientX, e.clientY);
          start = {
            px: p.x,
            py: p.y,
            w: target.offsetWidth,
            h: target.offsetHeight,
            // The min-* the element already declares, so the grip can't shrink
            // a window past what CSS would have stopped at anyway, falling back
            // to the floor above for the types that declare none. max-* needs
            // no handling: it still clamps the width we set.
            minW: parseFloat(cs.minWidth) || GRIP_MIN_W,
            minH: parseFloat(cs.minHeight) || GRIP_MIN_H,
          };
          element.style.zIndex = nextWindowZ();
          document.body.style.userSelect = "none";
          try {
            grip.setPointerCapture(e.pointerId);
          } catch (err) {
            /* the listeners below still track it */
          }
          grip.addEventListener("pointermove", onMove);
          grip.addEventListener("pointerup", end);
          grip.addEventListener("pointercancel", end);
        });
      }

      function makeDraggable(element) {
        const header = element.querySelector(HEADER_SELECTOR);
        if (!header) return;
        // Every window type already funnels through here, so the grip needs no
        // separate wiring in each of the seven add* functions.
        attachResizeGrip(element);

        let dragPointerId = null;
        let offsetX = 0;
        let offsetY = 0;
        // Measured once per drag. Reading offsetWidth/offsetHeight inside the
        // move handler was a layout read immediately after a style write, which
        // forces a synchronous re-layout on every single pointer event — the
        // classic thrash, and the reason dragging felt heavier than panning
        // did. Neither the window's size nor the clamp can change mid-drag, so
        // neither needs re-reading. In the off state clampBounds() also calls
        // getBoundingClientRect() on the toolbar, so this removes a second
        // forced layout per event.
        let dragW = 0;
        let dragH = 0;
        let dragBounds = null;
        let dragFrame = null;

        const onPointerMove = (e) => {
          if (e.pointerId !== dragPointerId) return;
          // The grab offset and the pointer are both converted to world
          // coordinates, so a drag tracks the cursor exactly at any zoom.
          // offsetWidth/offsetHeight are layout pixels, which are already world
          // units — the scale lives on the parent, not on the window.
          const p = screenToWorld(e.clientX, e.clientY);
          // clampSpot() rather than an inlined clamp: the vertical limit now
          // depends on the window's x (it opens up either side of the toolbar),
          // so it has to be resolved per move, not frozen at pointerdown. The
          // bounds object it reads is still measured once — no layout here.
          const { x, y } = clampSpot(
            dragW,
            dragH,
            p.x - offsetX,
            p.y - offsetY,
            dragBounds
          );
          // dataset stays synchronous — it is the source of truth and costs no
          // layout. Only the paint is deferred to the frame.
          element.dataset.x = x;
          element.dataset.y = y;
          if (dragFrame === null) {
            dragFrame = requestAnimationFrame(() => {
              dragFrame = null;
              element.style.left = `${element.dataset.x}px`;
              element.style.top = `${element.dataset.y}px`;
            });
          }
        };

        const endDrag = (e) => {
          if (dragPointerId === null || (e && e.pointerId !== dragPointerId)) return;
          try {
            header.releasePointerCapture(dragPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          dragPointerId = null;
          document.body.style.userSelect = "";
          element.classList.remove("dragging");
          // A frame may still be queued holding the last position; land it now
          // so the window can never settle a pixel behind where it was dropped.
          if (dragFrame !== null) {
            cancelAnimationFrame(dragFrame);
            dragFrame = null;
          }
          element.style.left = `${element.dataset.x}px`;
          element.style.top = `${element.dataset.y}px`;
          if (view.on) scheduleMapWindows();
          header.removeEventListener("pointermove", onPointerMove);
          header.removeEventListener("pointerup", endDrag);
          header.removeEventListener("pointercancel", endDrag);
          saveSession();
        };

        header.addEventListener("pointerdown", (e) => {
          // A locked window simply refuses the drag here. This used to be done
          // by nulling the handler and setting pointer-events:none on the
          // header, which also killed the lock and close buttons inside it and
          // forced toggleWindowLock to re-implement this whole handler.
          if (element.dataset.locked === "true") return;
          // Don't start a drag from a control in the title bar.
          if (e.target.closest("[role='button'], button, input, select")) return;
          if (e.button !== undefined && e.button !== 0) return; // left/primary only
          if (dragPointerId !== null) return; // ignore a second finger
          if (spacePanHeld) return; // space is held: the gesture is a pan

          dragPointerId = e.pointerId;
          // Where inside the window the grab happened, in world units. Read
          // from dataset rather than getBoundingClientRect(), which reports the
          // *transformed* box once the canvas is zoomed and would make the
          // window jump to the cursor by the scale factor on the first move.
          const p = screenToWorld(e.clientX, e.clientY);
          offsetX = p.x - (parseFloat(element.dataset.x) || 0);
          offsetY = p.y - (parseFloat(element.dataset.y) || 0);
          // Every layout read the drag needs, taken once, before any writes.
          dragW = element.offsetWidth;
          dragH = element.offsetHeight;
          dragBounds = clampBounds();
          element.style.zIndex = nextWindowZ();
          document.body.style.userSelect = "none";
          element.classList.add("dragging");
          try {
            header.setPointerCapture(e.pointerId);
          } catch (err) {
            /* not fatal - the listeners below still track the drag */
          }
          header.addEventListener("pointermove", onPointerMove);
          header.addEventListener("pointerup", endDrag);
          header.addEventListener("pointercancel", endDrag);
        });
      }

      const HEADER_SELECTOR =
        ".window-header, .task-header, .clock-header, .log-header, .calculator-header, .help-header, .sticky-note-header";

      // What "locked" freezes inside a window. Text fields go readOnly rather
      // than disabled so a locked note can still be read, scrolled and copied;
      // everything else (buttons, checkboxes, selects, colour swatches) is
      // disabled outright. Title-bar controls are excluded - you must always be
      // able to unlock, minimize or close.
      function lockableControls(windowElement) {
        return Array.from(
          windowElement.querySelectorAll("textarea, input, select, button")
        ).filter((el) => !el.closest(HEADER_SELECTOR));
      }

      function applyWindowLock(windowElement, isLocked) {
        windowElement.dataset.locked = isLocked;
        // Unlocking must hand resize back to the stylesheet, not force "both"
        // onto every type: a note frame has no resize handle (it grows from its
        // inner .textarea-container), and the clock/calculator/log/help windows
        // are fixed-size by design.
        const resizables = [
          windowElement,
          ...windowElement.querySelectorAll(".textarea-container"),
        ];
        resizables.forEach((el) => {
          if (isLocked) el.style.resize = "none";
          else el.style.removeProperty("resize");
        });

        lockableControls(windowElement).forEach((el) => {
          const isTextField =
            el.tagName === "TEXTAREA" ||
            (el.tagName === "INPUT" &&
              ["text", "number", "search", ""].includes(el.type));
          const prop = isTextField ? "readOnly" : "disabled";
          if (isLocked) {
            // Remember the pre-lock state so unlocking doesn't, say, make the
            // calculator's always-readonly display editable.
            if (el.dataset.prevLockState === undefined) {
              el.dataset.prevLockState = el[prop] ? "1" : "0";
            }
            el[prop] = true;
          } else if (el.dataset.prevLockState !== undefined) {
            el[prop] = el.dataset.prevLockState === "1";
            delete el.dataset.prevLockState;
          }
        });

        const lockBtn = windowElement.querySelector(
          ".lock-window, .sticky-lock-window"
        );
        if (lockBtn) {
          lockBtn.textContent = isLocked ? "🔒" : "🔓";
          lockBtn.classList.toggle("locked", isLocked);
          lockBtn.title = isLocked
            ? "Unlock this window"
            : "Lock editing, dragging and resizing";
          lockBtn.setAttribute("aria-pressed", String(isLocked));
        }
      }

      // Lock = frozen content, no dragging, no resizing. Everything hangs off
      // dataset.locked, which makeDraggable() reads, so this no longer has to
      // null out and rebuild the drag handler (a near-copy of makeDraggable
      // that had already drifted from it).
      function toggleWindowLock(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        const isLocked = windowElement.dataset.locked !== "true";
        applyWindowLock(windowElement, isLocked);
        const label =
          windowElement.querySelector(
            ".window-title, .task-title, .sticky-note-title, .clock-title, .log-title, .calculator-title, .help-title"
          )?.textContent || "Window";
        showStatus(`${label} ${isLocked ? "locked" : "unlocked"}.`);
        saveSession();
      }

      function setActiveWindow(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        // Already on top and already marked - don't churn the z-index counter
        // on every mousedown, which used to inflate it without bound.
        const alreadyActive = windowElement.classList.contains("active");
        activeWindow = windowId;
        // The old selector omitted sticky notes, the calculator and help, so
        // those could keep a stale .active while another window was focused.
        document
          .querySelectorAll(WINDOW_SELECTOR)
          .forEach((win) => win.classList.remove("active"));
        windowElement.classList.add("active");
        if (view.on) scheduleMapWindows(); // repaint the highlighted block
        if (!alreadyActive) {
          windowElement.style.zIndex = nextWindowZ();
        }
      }

      function updateLineNumbers(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          const lines = textarea.value.split("\n").length;
          lineNumbers.innerHTML =
            Array.from({ length: lines }, (_, i) => i + 1).join("<br>") || "1";
        }
      }

      function syncScroll(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          lineNumbers.scrollTop = textarea.scrollTop;
        }
      }

      function closeWindow(windowId) {
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          disconnectResizeObserver(windowId);
          windowElement.remove();
          if (activeWindow === windowId) {
            activeWindow = null;
            // Fall back to whatever is visually on top, not to whichever
            // happens to be first in document order.
            const remaining = Array.from(
              document.querySelectorAll(WINDOW_SELECTOR)
            ).filter((el) => el.style.display !== "none");
            if (remaining.length) {
              const topMost = remaining.reduce((a, b) =>
                (parseInt(b.style.zIndex) || 0) > (parseInt(a.style.zIndex) || 0)
                  ? b
                  : a
              );
              setActiveWindow(topMost.id);
            }
          }
          refreshChrome();
          debouncedSave(80);
        }
      }

      let currentEditable = null;

      function startRename(windowId) {
        if (currentEditable) endRename();
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          const titleSpan = windowElement.querySelector(
            ".window-title, .task-title, .sticky-note-title"
          );
          titleSpan.contentEditable = true;
          titleSpan.focus();
          document.execCommand("selectAll", false, null); // Select all text for easy editing
          currentEditable = { windowId, element: titleSpan };

          // Listen for Enter, Escape, or blur
          titleSpan.addEventListener("keydown", handleRenameKeydown);
          titleSpan.addEventListener("blur", endRename);
          document.addEventListener("mousedown", handleOutsideClick);
        }
      }

      function handleRenameKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          endRename();
        } else if (e.key === "Escape") {
          e.preventDefault();
          cancelRename();
        }
      }

      function handleOutsideClick(e) {
        if (
          currentEditable &&
          !e.target.closest(".window-title, .task-title, .sticky-note-title")
        ) {
          endRename();
        }
      }

      function endRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if empty, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = element.textContent.trim() || defaultName;

          currentEditable = null;
          saveSession();
        }
      }

      function cancelRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if cancelled, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = defaultName;

          currentEditable = null;
          saveSession();
        }
      }
      // One copy path for both buttons. Prefers the async Clipboard API and
      // falls back to execCommand, which is what actually works under file://.
      // The old code selected the textarea and left it selected, so a copy
      // could be followed by a keystroke that wiped the note.
      async function copyToClipboard(text, emptyMessage) {
        if (!text) {
          showStatus(emptyMessage || "Nothing to copy.");
          return false;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            showStatus("Copied to clipboard.");
            return true;
          } catch {
            /* fall through to execCommand */
          }
        }
        // Copy via an offscreen field so the user's own selection and caret in
        // the note are left untouched.
        const scratch = document.createElement("textarea");
        scratch.value = text;
        scratch.setAttribute("readonly", "");
        scratch.style.cssText = "position:fixed;top:-1000px;opacity:0;";
        document.body.appendChild(scratch);
        scratch.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch {
          ok = false;
        }
        document.body.removeChild(scratch);
        showStatus(ok ? "Copied to clipboard." : "Copy failed — select and press Ctrl+C.");
        return ok;
      }

      function copyText() {
        if (!activeWindow) {
          showStatus("Select a note first, then copy.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Copy only works on a note.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Per-window one-click copy (the Copy button in each note/T2 format row).
      // Targets its own window rather than relying on activeWindow.
      function copyNoteText(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) {
          showStatus("Copy failed: note not found.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Paste had three problems: navigator.clipboard.readText() does not exist
      // under file:// (which is how this app is meant to be run), it silently
      // REPLACED the note instead of inserting at the cursor, and every failure
      // collapsed into one unhelpful "Failed to paste text."
      async function pasteText() {
        if (!activeWindow) {
          showStatus("Select a note first, then paste.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Paste only works into a note.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot paste: window is locked.");
          return;
        }

        let text = null;
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            text = await navigator.clipboard.readText();
          } catch {
            text = null; // blocked by permission, or unavailable on file://
          }
        }

        if (text === null) {
          // execCommand("paste") is disallowed from script in every current
          // browser, so the honest fallback is to focus the field and let the
          // user's own Ctrl+V through - the browser will then paste natively.
          textarea.focus();
          showStatus("Press Ctrl+V to paste into this note.");
          return;
        }

        insertIntoNote(activeWindow, text);
        showStatus("Pasted from clipboard.");
      }

      // Insert at the caret, replacing any selection, rather than overwriting
      // the whole note - and keep undo history intact where the browser
      // supports it.
      function insertIntoNote(windowId, text) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) return;
        textarea.focus();
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        let inserted = false;
        try {
          inserted = document.execCommand("insertText", false, text);
        } catch {
          inserted = false;
        }
        if (!inserted) {
          textarea.value =
            textarea.value.slice(0, start) + text + textarea.value.slice(end);
          textarea.selectionStart = textarea.selectionEnd = start + text.length;
        }
        updateLineNumbers(windowId);
        updateCounts(windowId);
        updateWindowSize(windowId);
        saveSession();
      }

      function toUpperCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toUpperCase();
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Converted to uppercase.");
        } else {
          showStatus("Cannot convert: Window is locked.");

      }

      function toLowerCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toLowerCase();

          updateCounts(windowId);

      function updateCounts(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const countDiv = document.getElementById(`counts-${windowId}`);
        if (textarea && countDiv) {
          const text = textarea.value;
          const words = text
            .trim()
            .split(/\s+/)
            .filter((word) => word.length > 0).length;
          countDiv.textContent = `Words: ${words}, Characters: ${text.length}`;
        }
      }

      function searchReplace() {
        if (!activeWindow) {
          showStatus("No active window selected.");
          return;
        }
        const searchInput = document.getElementById("search-input").value;
        const replaceInput = document.getElementById("replace-input").value;
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Search only works on a note. Select one first.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot replace: window is locked.");
          return;
        }
        if (!searchInput) {
          showStatus("Enter something to search for.");
          document.getElementById("search-input").focus();
          return;
        }
        // Users type literal text here, not regular expressions. Passing it
        // straight to RegExp made "(" throw and characters like "." match
        // anything. Escape it and count the hits so there's real feedback.
        const escaped = searchInput.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp(escaped, "g");
        const matches = textarea.value.match(pattern);
        if (!matches) {
          showStatus(`No matches for "${searchInput}".`);
          return;
        }
        textarea.value = textarea.value.replace(pattern, replaceInput);
        updateLineNumbers(activeWindow);
        updateCounts(activeWindow);
        updateWindowSize(activeWindow);
        saveSession();
        showStatus(
          `Replaced ${matches.length} match${matches.length === 1 ? "" : "es"}.`
        );
      }

        const panel = document.getElementById("search-replace");

      let _statusTimer = null;
      function showStatus(message) {
        const status = document.getElementById("status");
        if (!status) return;
        // Each call used to start its own un-cancelled 3s timer, so a burst of
        // messages left earlier timers to hide the newest one early.
        if (_statusTimer) clearTimeout(_statusTimer);
        status.textContent = message;
        status.style.display = "block";
        status.classList.remove("showing");
        void status.offsetWidth; // restart the entry animation
        status.classList.add("showing");
        _statusTimer = setTimeout(() => {
          status.style.display = "none";
          status.classList.remove("showing");
          _statusTimer = null;
        }, 3000);
      }
