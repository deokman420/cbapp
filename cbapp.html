        </div>
    `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow(clkid);
        refreshChrome();
        updateClock(clkid);
        // Its own ticker. One shared interval meant the second clock to open
        // silently stopped the first one.
        const clockState = stateFor(clkid);
        clearInterval(clockState.tick);
        clockState.tick = setInterval(() => updateClock(clkid), 1000);
        saveSession();
        showStatus("Clock window created!");
        return newWindow;
      }

      function toggleClock() {
        const clkid = deskInstanceId("clock");
        const clock = document.getElementById(clkid);
        if (clock && clock.style.display === "none") {
          restoreWindow(clkid);
          return;
        }
        if (clock) {
          clock.remove();
          // Takes the tick, the stopwatch and the countdown down with it.
          stopInstanceTimers(clkid);
          refreshChrome();
        } else {
          addClock();
        }
        saveSession();
      }

      /* One options object for all five readouts, and the reason it exists:
         hour: "2-digit" was used for both formats, so 12-hour time read
         "07:44:17 PM" — a leading zero no clock face or phone shows on a
         12-hour dial. 24-hour keeps it, where 07:44 is the correct form. */
      function clockTimeFormat(is24Hour) {
        return {
          hour12: !is24Hour,
          hour: is24Hour ? "2-digit" : "numeric",
          minute: "2-digit",
          second: "2-digit",
        };
      }

      function updateClock(windowId) {
        if (!windowId) return;
        const timeDiv = instancePart(windowId, "clock-time");
        const dateDiv = instancePart(windowId, "clock-date");
        const formatSelect = instancePart(windowId, "clock-format");
        const easternDiv = instancePart(windowId, "clock-eastern");
        const centralDiv = instancePart(windowId, "clock-central");
        const mountainDiv = instancePart(windowId, "clock-mountain");
        const pacificDiv = instancePart(windowId, "clock-pacific");
        if (
          timeDiv &&
          dateDiv &&
          formatSelect &&
          easternDiv &&
          centralDiv &&
          mountainDiv &&
          pacificDiv
        ) {
          const now = new Date();
          const options = {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          };
          dateDiv.textContent = now.toLocaleDateString(undefined, options);
          const is24Hour = formatSelect.value === "24";
          const timeFormat = clockTimeFormat(is24Hour);
          timeDiv.textContent = now.toLocaleTimeString(undefined, timeFormat);
          const easternTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/New_York" })
          );
          const centralTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/Chicago" })
          );
          const mountainTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/Denver" })
          );
          const pacificTime = new Date(
            now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" })
          );
          easternDiv.textContent = easternTime.toLocaleTimeString(
            undefined,
            timeFormat
          );
          centralDiv.textContent = centralTime.toLocaleTimeString(
            undefined,
            timeFormat
          );
          mountainDiv.textContent = mountainTime.toLocaleTimeString(
            undefined,
            timeFormat
          );
          pacificDiv.textContent = pacificTime.toLocaleTimeString(
            undefined,
            timeFormat
          );
        }
      }
      function updateStopwatchDisplay(windowId) {
        const display = instancePart(windowId, "stopwatch-display");
        if (!display) return;
        const sw = stateFor(windowId).stopwatch;
        let elapsed = sw.elapsed;
        if (sw.start) {
          elapsed += Date.now() - sw.start;
        }
        const ms = elapsed % 1000;
        const totalSeconds = Math.floor(elapsed / 1000);
        const s = totalSeconds % 60;
        const m = Math.floor(totalSeconds / 60) % 60;
        const h = Math.floor(totalSeconds / 3600);
        display.textContent =
          `${h.toString().padStart(2, "0")}:` +
          `${m.toString().padStart(2, "0")}:` +
          `${s.toString().padStart(2, "0")}.` +
          `${ms.toString().padStart(3, "0")}`;
      }

      function startStopwatch(windowId) {
        const sw = stateFor(windowId).stopwatch;
        if (!sw.start) {
          sw.start = Date.now();
          sw.interval = setInterval(
            () => updateStopwatchDisplay(windowId),
            31
          );
        }
      }

      function pauseStopwatch(windowId) {
        const sw = stateFor(windowId).stopwatch;
        if (sw.start) {
          sw.elapsed += Date.now() - sw.start;
          sw.start = null;
          clearInterval(sw.interval);
          sw.interval = null;
          updateStopwatchDisplay(windowId);
        }
      }

      function resetStopwatch(windowId) {
        const sw = stateFor(windowId).stopwatch;
        sw.elapsed = 0;
        sw.start = null;
        clearInterval(sw.interval);
        sw.interval = null;
        updateStopwatchDisplay(windowId);
      }

      function addLog(targetMode) {
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }
        const windowsContainer = document.getElementById("windows");
        const newWindow = document.createElement("div");
        newWindow.className = "log-window";
        const logid = deskInstanceId("log", targetMode);
        newWindow.id = logid;
        if (targetMode) newWindow.dataset.mode = targetMode;
        newWindow.style.zIndex = nextWindowZ();
        newWindow.dataset.width = 400;
        newWindow.dataset.height = 400;
        // These were "400" without a unit - invalid, so the log window silently
        // collapsed to its 350x150 min-size in the top-left corner.
        newWindow.style.width = "400px";
        newWindow.style.height = "400px";
        placeWindow(newWindow, 400, 400);
        newWindow.innerHTML = `
                <div class="log-header">
                    <span class="log-title">Log</span>
                    <div class="log-controls">
                        <span class="edit-window" onclick="startRename('${logid}')" title="Rename" role="button" tabindex="0">✏️</span>
                        <span class="minimize-window" onclick="minimizeWindow('${logid}')" title="Minimize" role="button" tabindex="0">🗕</span>
                        <span class="lock-window" onclick="toggleWindowLock('${logid}')" title="Freeze editing, dragging and resizing (not encryption)" role="button" tabindex="0" aria-pressed="false">🔓</span>
                        <span class="close-log" onclick="closeWindow('${logid}')" title="Close" role="button" tabindex="0">×</span>
                    </div>
                </div>
                <div class="log-content">
                    <div class="log-input-container">
                        <input type="text" class="log-input" id="log-input-${logid}" placeholder="Enter log description...">
                        <button onclick="addLogEntry('${logid}')">Log</button>
                    </div>
                    <div class="log-list" id="log-list-${logid}"></div>
                </div>
            `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow(logid);
        refreshChrome();
        const logInput = instancePart(logid, "log-input");
        logInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addLogEntry(logid);
          }
        });
        restoreLogEntries(logid);
        saveSession();
        showStatus("Log window opened!");
        return newWindow;
      }

      function toggleLog() {
        const logid = deskInstanceId("log");
        const log = document.getElementById(logid);
        if (log && log.style.display === "none") {
          restoreWindow(logid);
          return;
        }
        if (log) {
          log.remove();
          stopInstanceTimers(logid);
          refreshChrome();
          showStatus("Log window hidden.");
        } else {
          addLog();
        }
        saveSession();
      }

      // Single builder for new and restored entries so the two can't drift, and
      // so both get the delete control the log previously lacked entirely - it
      // was append-only with no way to remove a mistyped line.
      function createLogItem(windowId, entry) {
        const logItem = document.createElement("div");
        logItem.className = "log-item";
        const ts = document.createElement("span");
        ts.className = "timestamp";
        ts.textContent = entry.timestamp;
        const sep = document.createTextNode(": ");
        const desc = document.createElement("span");
        desc.className = "description";
        desc.textContent = entry.description;
        const del = document.createElement("button");
        del.className = "log-delete";
        del.textContent = "×";
        del.title = "Delete this entry";
        del.setAttribute("aria-label", `Delete log entry: ${entry.description}`);
        del.onclick = (e) => {
          e.stopPropagation();
          const entries = stateFor(windowId).entries;
          const i = entries.indexOf(entry);
          if (i > -1) entries.splice(i, 1);
          logItem.remove();
          saveSession();
          showStatus("Log entry deleted.");
        };
        logItem.appendChild(ts);
        logItem.appendChild(sep);
        logItem.appendChild(desc);
        logItem.appendChild(del);
        return logItem;
      }

      function addLogEntry(windowId) {
        const logInput = instancePart(windowId, "log-input");
        const logList = instancePart(windowId, "log-list");
        if (!logInput || !logList) return;
        const description = logInput.value.trim();
        if (!description) {
          showStatus("Log entry cannot be empty.");
          logInput.focus();
          return;
        }
        const timestamp = new Date().toLocaleString("en-US", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        const entry = { timestamp, description };
        stateFor(windowId).entries.push(entry);
        logList.appendChild(createLogItem(windowId, entry));
        logInput.value = "";
        logInput.focus();
        logList.scrollTop = logList.scrollHeight;
        saveSession();
        showStatus("Log entry added.");
      }

      /* Rebuild one Calc / Clock / Log / Help from its record. The desk comes
         from the record's own `mode`, not from whatever is on screen: this runs
         before the view is restored, so currentMode() is still the boot default
         and would put everything on the plain view. A record written before
         v3.2.10 says nothing, and the caller's later fallback pass adopts those
         onto whichever desk was showing — so windowed is the right guess here
         and `restoredMode` is left alone for it to correct. */
      function restoreSingleton(kind, record) {
        const mode = record.mode === CANVAS ? CANVAS : WINDOWED;
        const id = deskInstanceId(kind.base, mode);
        // A pre-v3.2.13 session can name the same desk twice — its `calculator`
        // record with mode:canvas, plus a `calculator-canvas` key from a later
        // save. Two windows would collide on one id; first record wins.
        if (document.getElementById(id)) return;
        if (kind.base === "clock") addClock(mode);
        else if (kind.base === "calculator") addCalculator(mode);
        else if (kind.base === "log") addLog(mode);
        else if (kind.base === "calendar") addCalendar(mode);
        else toggleHelpWindow(mode);

        const el = document.getElementById(id);
        if (!el) return;
        el.style.left = `${record.position.left}px`;
        el.style.top = `${record.position.top}px`;
        el.dataset.x = record.position.left;
        el.dataset.y = record.position.top;

        if (kind.base === "clock") {
          const format = instancePart(id, "clock-format");
          if (format) format.value = record.clockFormat;
          updateClock(id);
        } else if (kind.base === "calendar") {
          // addCalendar() opened it on today; a saved selection moves it back to
          // the day the user was looking at...
          if (record.selected) {
            const day = parseDateKey(record.selected);
            el.dataset.selected = record.selected;
            el.dataset.viewYear = day.getFullYear();
            el.dataset.viewMonth = day.getMonth();
          }
          /* ...and the saved month wins over the day's own, because they are
             genuinely independent: paging to next March while today stays
             selected is a normal thing to leave a calendar sitting on. Sessions
             written before v4.0.3 carry no month and keep the old behaviour. */
          if (record.viewYear !== null && record.viewMonth !== null) {
            el.dataset.viewYear = record.viewYear;
            el.dataset.viewMonth = record.viewMonth;
          }
          // The header offers ✏️ Rename, so a saved name has to come back —
          // clock and log write one too and this is where it gets applied.
          const title = el.querySelector(".calendar-title");
          if (title && record.name) title.textContent = record.name;
          renderCalendar(id);
        } else if (kind.base === "calculator") {
          stateFor(id).history = record.history || [];
          updateCalculatorHistory(id);
        } else if (kind.base === "log") {
          stateFor(id).entries = record.logs || [];
          restoreLogEntries(id);
        }

        if (record.minimized) el.style.display = "none";
        if (record.mode) el.dataset.restoredMode = record.mode;
        if (record.locked) applyWindowLock(el, true);
      }

      function restoreLogEntries(windowId) {
        const logList = instancePart(windowId, "log-list");
        if (!logList) return;
        logList.innerHTML = "";
        stateFor(windowId).entries.forEach((entry) =>
          logList.appendChild(createLogItem(windowId, entry))
        );
        logList.scrollTop = logList.scrollHeight;
      }

      // Pointer Events rather than mouse events: the old handler was
      // mousedown/mousemove/mouseup only, so on a touch screen a window could
      // not be moved at all. Pointer events cover mouse, touch and pen through
      // one path, and setPointerCapture keeps the drag alive if the finger
      // outruns the header.
      /* Which element actually carries a window's size. For a note it is the
         .textarea-container — the window sizes itself to fit via
         updateWindowSize(), so resizing the window directly would be undone on
         the next sync. Sticky notes and task lists size themselves. Everything
         else (calculator, clock, log, help) has never been resizable. */
      function resizeTargetFor(element) {
        if (
          element.classList.contains("sticky-note-window") ||
          element.classList.contains("task-window")
        ) {
          return element;
        }
        return element.querySelector(".textarea-container");
      }

      /* Floor for anything that declares no min-* of its own. .sticky-note-window
         is the one resizable type missing from the min-width/min-height rule the
         other six share, so without this a note could be dragged down to a
         sliver with its own header clipped out of sight. Applied in the grip
         rather than in CSS deliberately: a min-* on the element would also
         change native resize in the off state, and could inflate a sticky note
         restored from an older session. */
      const GRIP_MIN_W = 240;
      const GRIP_MIN_H = 140;

      function attachResizeGrip(element) {
        const target = resizeTargetFor(element);
        if (!target) return;
        if (element.querySelector(":scope > .resize-grip")) return;

        const grip = document.createElement("div");
        grip.className = "resize-grip";
        grip.setAttribute("aria-hidden", "true");
        element.appendChild(grip);

        let gripPointerId = null;
        let start = null;

        let gripFrame = null;
        let pending = null;

        const paint = () => {
          gripFrame = null;
          if (!pending) return;
          target.style.width = `${pending.w}px`;
          target.style.height = `${pending.h}px`;
        };

        const onMove = (e) => {
          if (e.pointerId !== gripPointerId) return;
          // Same screen->world conversion as dragging. This is the whole fix:
          // the pointer delta is divided by the zoom, so the corner tracks the
          // cursor instead of running at 1/zoom speed.
          const p = screenToWorld(e.clientX, e.clientY);
          pending = {
            w: Math.max(start.minW, start.w + (p.x - start.px)),
            h: Math.max(start.minH, start.h + (p.y - start.py)),
          };
          // Deferred to the frame like the drag: a resize writes width and
          // height, which relayouts the window and everything inside it, so
          // doing it per pointer event rather than per frame is the most
          // expensive thing either gesture could do.
          if (gripFrame === null) gripFrame = requestAnimationFrame(paint);
        };

        const end = (e) => {
          if (gripPointerId === null || (e && e.pointerId !== gripPointerId))
            return;
          try {
            grip.releasePointerCapture(gripPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          gripPointerId = null;
          document.body.style.userSelect = "";
          if (gripFrame !== null) {
            cancelAnimationFrame(gripFrame);
            gripFrame = null;
          }
          paint(); // land the final size, never a frame behind the pointer
          pending = null;
          grip.removeEventListener("pointermove", onMove);
          grip.removeEventListener("pointerup", end);
          grip.removeEventListener("pointercancel", end);
          // The size itself is persisted by each window type's existing
          // ResizeObserver; this is for the map, which has no observer.
          if (view.on) scheduleMapWindows();
          saveSession();
        };

        grip.addEventListener("pointerdown", (e) => {
          if (element.dataset.locked === "true") return;
          if (gripPointerId !== null) return;
          if (e.button !== undefined && e.button !== 0) return;
          // Never let this reach the header drag or the canvas pan.
          e.preventDefault();
          e.stopPropagation();
          gripPointerId = e.pointerId;
          const cs = getComputedStyle(target);
          const p = screenToWorld(e.clientX, e.clientY);
          start = {
            px: p.x,
            py: p.y,
            w: target.offsetWidth,
            h: target.offsetHeight,
            // The min-* the element already declares, so the grip can't shrink
            // a window past what CSS would have stopped at anyway, falling back
            // to the floor above for the types that declare none. max-* needs
            // no handling: it still clamps the width we set.
            minW: parseFloat(cs.minWidth) || GRIP_MIN_W,
            minH: parseFloat(cs.minHeight) || GRIP_MIN_H,
          };
          element.style.zIndex = nextWindowZ();
          document.body.style.userSelect = "none";
          try {
            grip.setPointerCapture(e.pointerId);
          } catch (err) {
            /* the listeners below still track it */
          }
          grip.addEventListener("pointermove", onMove);
          grip.addEventListener("pointerup", end);
          grip.addEventListener("pointercancel", end);
        });
      }

      function makeDraggable(element) {
        const header = element.querySelector(HEADER_SELECTOR);
        if (!header) return;
        // Every window type already funnels through here, so the grip needs no
        // separate wiring in each of the seven add* functions.
        attachResizeGrip(element);

        let dragPointerId = null;
        let offsetX = 0;
        let offsetY = 0;
        // Measured once per drag. Reading offsetWidth/offsetHeight inside the
        // move handler was a layout read immediately after a style write, which
        // forces a synchronous re-layout on every single pointer event — the
        // classic thrash, and the reason dragging felt heavier than panning
        // did. Neither the window's size nor the clamp can change mid-drag, so
        // neither needs re-reading. In the off state clampBounds() also calls
        // getBoundingClientRect() on the toolbar, so this removes a second
        // forced layout per event.
        let dragW = 0;
        let dragH = 0;
        let dragBounds = null;
        let dragFrame = null;

        const onPointerMove = (e) => {
          if (e.pointerId !== dragPointerId) return;
          // The grab offset and the pointer are both converted to world
          // coordinates, so a drag tracks the cursor exactly at any zoom.
          // offsetWidth/offsetHeight are layout pixels, which are already world
          // units — the scale lives on the parent, not on the window.
          const p = screenToWorld(e.clientX, e.clientY);
          // clampSpot() rather than an inlined clamp: the vertical limit now
          // depends on the window's x (it opens up either side of the toolbar),
          // so it has to be resolved per move, not frozen at pointerdown. The
          // bounds object it reads is still measured once — no layout here.
          const { x, y } = clampSpot(
            dragW,
            dragH,
            p.x - offsetX,
            p.y - offsetY,
            dragBounds
          );
          // dataset stays synchronous — it is the source of truth and costs no
          // layout. Only the paint is deferred to the frame.
          element.dataset.x = x;
          element.dataset.y = y;
          if (dragFrame === null) {
            dragFrame = requestAnimationFrame(() => {
              dragFrame = null;
              element.style.left = `${element.dataset.x}px`;
              element.style.top = `${element.dataset.y}px`;
            });
          }
        };

        const endDrag = (e) => {
          if (dragPointerId === null || (e && e.pointerId !== dragPointerId)) return;
          try {
            header.releasePointerCapture(dragPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          dragPointerId = null;
          document.body.style.userSelect = "";
          element.classList.remove("dragging");
          // A frame may still be queued holding the last position; land it now
          // so the window can never settle a pixel behind where it was dropped.
          if (dragFrame !== null) {
            cancelAnimationFrame(dragFrame);
            dragFrame = null;
          }
          element.style.left = `${element.dataset.x}px`;
          element.style.top = `${element.dataset.y}px`;
          if (view.on) scheduleMapWindows();
          header.removeEventListener("pointermove", onPointerMove);
          header.removeEventListener("pointerup", endDrag);
          header.removeEventListener("pointercancel", endDrag);
          saveSession();
        };

        header.addEventListener("pointerdown", (e) => {
          // A locked window simply refuses the drag here. This used to be done
          // by nulling the handler and setting pointer-events:none on the
          // header, which also killed the lock and close buttons inside it and
          // forced toggleWindowLock to re-implement this whole handler.
          if (element.dataset.locked === "true") return;
          // Don't start a drag from a control in the title bar.
          if (e.target.closest("[role='button'], button, input, select")) return;
          if (e.button !== undefined && e.button !== 0) return; // left/primary only
          if (dragPointerId !== null) return; // ignore a second finger
          if (spacePanHeld) return; // space is held: the gesture is a pan

          dragPointerId = e.pointerId;
          // Where inside the window the grab happened, in world units. Read
          // from dataset rather than getBoundingClientRect(), which reports the
          // *transformed* box once the canvas is zoomed and would make the
          // window jump to the cursor by the scale factor on the first move.
          const p = screenToWorld(e.clientX, e.clientY);
          offsetX = p.x - (parseFloat(element.dataset.x) || 0);
          offsetY = p.y - (parseFloat(element.dataset.y) || 0);
          // Every layout read the drag needs, taken once, before any writes.
          dragW = element.offsetWidth;
          dragH = element.offsetHeight;
          dragBounds = clampBounds();
          element.style.zIndex = nextWindowZ();
          document.body.style.userSelect = "none";
          element.classList.add("dragging");
          try {
            header.setPointerCapture(e.pointerId);
          } catch (err) {
            /* not fatal - the listeners below still track the drag */
          }
          header.addEventListener("pointermove", onPointerMove);
          header.addEventListener("pointerup", endDrag);
          header.addEventListener("pointercancel", endDrag);
        });
      }

      const HEADER_SELECTOR =
        ".window-header, .task-header, .clock-header, .log-header, .calendar-header, .calculator-header, .help-header, .sticky-note-header";

      // What "frozen" freezes inside a window. This is NOT encryption or access
      // control — anyone can unfreeze with one click. Text fields go readOnly
      // rather than disabled so a frozen note can still be read, scrolled and
      // copied; everything else (buttons, checkboxes, selects, colour swatches)
      // is disabled. Title-bar controls are excluded — you must always be able
      // to unfreeze, minimize or close.
      /* `data-lock-exempt` is for controls that NAVIGATE rather than edit. A
         frozen note stays readable and scrollable on purpose — text fields go
         readOnly rather than disabled precisely so it can be read — and the
         calendar's month arrows, day cells and search box are the same kind of
         thing: looking at another day is not an edit. Without the exemption a
         frozen calendar could only ever show the one day it was frozen on, which
         is not what "freeze editing, dragging and resizing" promises. */
      function lockableControls(windowElement) {
        return Array.from(
          windowElement.querySelectorAll("textarea, input, select, button")
        ).filter(
          (el) =>
            !el.closest(HEADER_SELECTOR) &&
            el.dataset.lockExempt !== "true"
        );
      }

      function applyWindowLock(windowElement, isLocked) {
        windowElement.dataset.locked = isLocked;
        // Unlocking must hand resize back to the stylesheet, not force "both"
        // onto every type: a note frame has no resize handle (it grows from its
        // inner .textarea-container), and the clock/calculator/log/help windows
        // are fixed-size by design.
        const resizables = [
          windowElement,
          ...windowElement.querySelectorAll(".textarea-container"),
        ];
        resizables.forEach((el) => {
          if (isLocked) el.style.resize = "none";
          else el.style.removeProperty("resize");
        });

        lockableControls(windowElement).forEach((el) => {
          const isTextField =
            el.tagName === "TEXTAREA" ||
            (el.tagName === "INPUT" &&
              ["text", "number", "search", ""].includes(el.type));
          const prop = isTextField ? "readOnly" : "disabled";
          if (isLocked) {
            // Remember the pre-lock state so unlocking doesn't, say, make the
            // calculator's always-readonly display editable.
            if (el.dataset.prevLockState === undefined) {
              el.dataset.prevLockState = el[prop] ? "1" : "0";
            }
            el[prop] = true;
          } else if (el.dataset.prevLockState !== undefined) {
            el[prop] = el.dataset.prevLockState === "1";
            delete el.dataset.prevLockState;
          }
        });

        const lockBtn = windowElement.querySelector(
          ".lock-window, .sticky-lock-window"
        );
        if (lockBtn) {
          lockBtn.textContent = isLocked ? "🔒" : "🔓";
          lockBtn.classList.toggle("locked", isLocked);
          lockBtn.title = isLocked
            ? "Unfreeze this window (not a security unlock)"
            : "Freeze editing, dragging and resizing (not encryption)";
          lockBtn.setAttribute("aria-pressed", String(isLocked));
        }
      }

      // Freeze = content frozen, no dragging, no resizing. Not secrecy.
      // Everything hangs off dataset.locked, which makeDraggable() reads.
      function windowLabel(windowElement) {
        return (
          windowElement.querySelector(
            ".window-title, .task-title, .sticky-note-title, .clock-title, .log-title, .calendar-title, .calculator-title, .help-title"
          )?.textContent || "Window"
        ).trim();
      }

      function toggleWindowLock(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        const isLocked = windowElement.dataset.locked !== "true";
        applyWindowLock(windowElement, isLocked);
        showStatus(
          `${windowLabel(windowElement)} ${isLocked ? "frozen" : "unfrozen"} (layout only — use Protect to encrypt).`
        );
        saveSession();
      }

      /* Frozen windows used to swallow input in silence, and a session restored
         with a frozen window put the user in front of controls that simply did
         not respond: readOnly fields take keystrokes and drop them, and a
         disabled button does not even dispatch a click. The lock icon in the
         title bar was the only clue, and it is 16px of a window you did not
         freeze in this sitting. Say it out loud instead. */
      const FROZEN_IGNORED_KEYS = new Set([
        "Tab",
        "Escape",
        "Shift",
        "Control",
        "Alt",
        "Meta",
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "ArrowDown",
        "Home",
        "End",
        "PageUp",
        "PageDown",
      ]);

      function wireFrozenFeedback(element) {
        const explain = (e) => {
          if (element.dataset.locked !== "true") return;
          // The title-bar controls are never frozen — unfreeze, minimize and
          // close have to keep working, so they must not draw the message.
          if (e.target instanceof Element && e.target.closest(HEADER_SELECTOR)) {
            return;
          }
          /* Nor for a control the freeze deliberately spared. v4.0.3 taught
             lockableControls about data-lock-exempt and forgot to teach this, so a
             frozen calendar paged its month perfectly well while insisting it was
             frozen — and evicted whatever the status line was showing, on every
             keystroke in the search box. Two notions of "what a freeze covers"
             have to agree. */
          if (
            e.target instanceof Element &&
            e.target.closest('[data-lock-exempt="true"]')
          ) {
            return;
          }
          if (e.type === "keydown") {
            // Reading a frozen window is allowed: navigation keys and the
            // copy/select-all shortcuts are not attempts to edit.
            if (FROZEN_IGNORED_KEYS.has(e.key)) return;
            if (e.ctrlKey || e.metaKey) return;
          }
          showStatus(
            `${windowLabel(element)} is frozen — click 🔒 in its title bar to unfreeze it.`
          );
        };
        /* pointerdown on the window, not click on the control: a disabled
           button dispatches no pointer event of its own, so the event that
           reaches here has the surrounding row as its target. Capture phase so
           a frozen control's own handler cannot swallow it first. */
        element.addEventListener("pointerdown", explain, true);
        element.addEventListener("keydown", explain, true);
      }

      function setActiveWindow(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        // Already on top and already marked - don't churn the z-index counter
        // on every mousedown, which used to inflate it without bound.
        const alreadyActive = windowElement.classList.contains("active");
        activeWindow = windowId;
        // The old selector omitted sticky notes, the calculator and help, so
        // those could keep a stale .active while another window was focused.
        document
          .querySelectorAll(WINDOW_SELECTOR)
          .forEach((win) => win.classList.remove("active"));
        windowElement.classList.add("active");
        if (view.on) scheduleMapWindows(); // repaint the highlighted block
        if (!alreadyActive) {
          windowElement.style.zIndex = nextWindowZ();
        }
      }

      function updateLineNumbers(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          const lines = textarea.value.split("\n").length;
          lineNumbers.innerHTML =
            Array.from({ length: lines }, (_, i) => i + 1).join("<br>") || "1";
        }
      }

      function syncScroll(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          lineNumbers.scrollTop = textarea.scrollTop;
        }
      }

      /* One path for every window type. The Clock, Calculator and Log used to
         need routing through their toggle*() because that is where their
         bookkeeping lived — the lit toolbar button, a *Visible flag, the 1s
         interval — and closing one any other way left a stuck button and a
         ticker running for the life of the tab. The lit state is derived now
         and the timers hang off the instance, so stopping them here covers it. */
      function closeWindow(windowId) {
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          disconnectResizeObserver(windowId);
          stopInstanceTimers(windowId);
          windowElement.remove();
          if (activeWindow === windowId) {
            activeWindow = null;
            // Fall back to whatever is visually on top, not to whichever
            // happens to be first in document order.
            const remaining = modeWindows().filter(
              (el) => el.style.display !== "none"
            );
            if (remaining.length) {
              const topMost = remaining.reduce((a, b) =>
                (parseInt(b.style.zIndex) || 0) > (parseInt(a.style.zIndex) || 0)
                  ? b
                  : a
              );
              setActiveWindow(topMost.id);
            }
          }
          refreshChrome();
          debouncedSave(80);
        }
      }

      let currentEditable = null;

      // The Log window carries a ✏️ like any other and endRename() has a
      // dedicated "log" default-name branch, but .log-title was missing from
      // this list — so clicking it threw on a null titleSpan and did nothing.
      const RENAME_TITLE_SELECTOR =
        ".window-title, .task-title, .sticky-note-title, .log-title";

      function startRename(windowId) {
        if (currentEditable) endRename();
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          const titleSpan = windowElement.querySelector(RENAME_TITLE_SELECTOR);
          if (!titleSpan) return;
          titleSpan.contentEditable = true;
          titleSpan.focus();
          document.execCommand("selectAll", false, null); // Select all text for easy editing
          currentEditable = { windowId, element: titleSpan };

          // Listen for Enter, Escape, or blur
          titleSpan.addEventListener("keydown", handleRenameKeydown);
          titleSpan.addEventListener("blur", endRename);
          document.addEventListener("mousedown", handleOutsideClick);
        }
      }

      function handleRenameKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          endRename();
        } else if (e.key === "Escape") {
          e.preventDefault();
          cancelRename();
        }
      }

      function handleOutsideClick(e) {
        if (currentEditable && !e.target.closest(RENAME_TITLE_SELECTOR)) {
          endRename();
        }
      }

      function endRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if empty, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = element.textContent.trim() || defaultName;

          currentEditable = null;
          saveSession();
        }
      }

      function cancelRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if cancelled, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = defaultName;

          currentEditable = null;
          saveSession();
        }
      }
      // One copy path for both buttons. Prefers the async Clipboard API and
      // falls back to execCommand, which is what actually works under file://.
      // The old code selected the textarea and left it selected, so a copy
      // could be followed by a keystroke that wiped the note.
      async function copyToClipboard(text, emptyMessage) {
        if (!text) {
          showStatus(emptyMessage || "Nothing to copy.");
          return false;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            showStatus("Copied to clipboard.");
            return true;
          } catch {
            /* fall through to execCommand */
          }
        }
        // Copy via an offscreen field so the user's own selection and caret in
        // the note are left untouched.
        const scratch = document.createElement("textarea");
        scratch.value = text;
        scratch.setAttribute("readonly", "");
        scratch.style.cssText = "position:fixed;top:-1000px;opacity:0;";
        document.body.appendChild(scratch);
        scratch.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch {
          ok = false;
        }
        document.body.removeChild(scratch);
        showStatus(ok ? "Copied to clipboard." : "Copy failed — select and press Ctrl+C.");
        return ok;
      }

      function copyText() {
        if (!activeWindow) {
          showStatus("Select a note first, then copy.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Copy only works on a note.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Per-window one-click copy (the Copy button in each note/T2 format row).
      // Targets its own window rather than relying on activeWindow.
      function copyNoteText(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) {
          showStatus("Copy failed: note not found.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Paste had three problems: navigator.clipboard.readText() does not exist
      // under file:// (which is how this app is meant to be run), it silently
      // REPLACED the note instead of inserting at the cursor, and every failure
      // collapsed into one unhelpful "Failed to paste text."
      async function pasteText() {
        if (!activeWindow) {
          showStatus("Select a note first, then paste.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Paste only works into a note.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot paste: window is frozen.");
          return;
        }

        let text = null;
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            text = await navigator.clipboard.readText();
          } catch {
            text = null; // blocked by permission, or unavailable on file://
          }
        }

        if (text === null) {
          // execCommand("paste") is disallowed from script in every current
          // browser, so the honest fallback is to focus the field and let the
          // user's own Ctrl+V through - the browser will then paste natively.
          textarea.focus();
          showStatus("Press Ctrl+V to paste into this note.");
          return;
        }

        insertIntoNote(activeWindow, text);
        showStatus("Pasted from clipboard.");
      }

      // Insert at the caret, replacing any selection, rather than overwriting
      // the whole note - and keep undo history intact where the browser
      // supports it.
      function insertIntoNote(windowId, text) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) return;
        textarea.focus();
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        let inserted = false;
        try {
          inserted = document.execCommand("insertText", false, text);
        } catch {
          inserted = false;
        }
        if (!inserted) {
          textarea.value =
            textarea.value.slice(0, start) + text + textarea.value.slice(end);
          textarea.selectionStart = textarea.selectionEnd = start + text.length;
        }
        updateLineNumbers(windowId);
        updateCounts(windowId);
        updateWindowSize(windowId);
        saveSession();
      }

      function toUpperCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toUpperCase();
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Converted to uppercase.");
        } else {
          showStatus("Cannot convert: window is frozen.");
        }
      }

      function toLowerCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toLowerCase();
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Converted to lowercase.");
        } else {
          showStatus("Cannot convert: window is frozen.");
        }
      }

      function updateCounts(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const countDiv = document.getElementById(`counts-${windowId}`);
        if (textarea && countDiv) {
          const text = textarea.value;
          const words = text
            .trim()
            .split(/\s+/)
            .filter((word) => word.length > 0).length;
          countDiv.textContent = `Words: ${words}, Characters: ${text.length}`;
        }
      }

      function searchReplace() {
        if (!activeWindow) {
          showStatus("No active window selected.");
          return;
        }
        const searchInput = document.getElementById("search-input").value;
        const replaceInput = document.getElementById("replace-input").value;
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Search only works on a note. Select one first.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot replace: window is frozen.");
          return;
        }
        if (!searchInput) {
          showStatus("Enter something to search for.");
          document.getElementById("search-input").focus();
          return;
        }
        // Users type literal text here, not regular expressions. Passing it
        // straight to RegExp made "(" throw and characters like "." match
        // anything. Escape it and count the hits so there's real feedback.
        const escaped = searchInput.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp(escaped, "g");
        const matches = textarea.value.match(pattern);
        if (!matches) {
          showStatus(`No matches for "${searchInput}".`);
          return;
        }
        textarea.value = textarea.value.replace(pattern, replaceInput);
        updateLineNumbers(activeWindow);
        updateCounts(activeWindow);
        updateWindowSize(activeWindow);
        saveSession();
        showStatus(
          `Replaced ${matches.length} match${matches.length === 1 ? "" : "es"}.`
        );
      }

      function toggleSearchReplace() {
        const panel = document.getElementById("search-replace");
        const opened = panel.classList.toggle("active");
        const searchBtn = document.getElementById("search-btn");
        if (searchBtn) searchBtn.classList.toggle("active", opened);
        if (opened) document.getElementById("search-input").focus();
      }

      let _statusTimer = null;
      function showStatus(message) {
        const status = document.getElementById("status");
        if (!status) return;
        // Each call used to start its own un-cancelled 3s timer, so a burst of
        // messages left earlier timers to hide the newest one early.
        if (_statusTimer) clearTimeout(_statusTimer);
        status.textContent = message;
        status.style.display = "block";
        status.classList.remove("showing");
        void status.offsetWidth; // restart the entry animation
        status.classList.add("showing");
        _statusTimer = setTimeout(() => {
          status.style.display = "none";
          status.classList.remove("showing");
          _statusTimer = null;
        }, 3000);
      }

      function toggleTheme() {
        const body = document.body;
        const newMode = body.classList.contains("light-mode")
          ? "dark-mode"
          : "light-mode";
        /* Swap the theme token, don't overwrite className. <body> is no longer
           only a theme flag — it also carries canvas-on — and assigning the
           whole className wiped that, so switching theme while the big canvas
           was on silently took the grid, the minimap, the zoom widget and the
           grab cursor with it. view.on stayed true, so panning and zooming kept
           working with none of their chrome, and the next applyView() put it
           all back, which made it look intermittent rather than broken. */

        body.classList.add(newMode);

        // Dark theme pencil (white)
        const lightIconSvg = `PHN2ZyB4bWxucyA9ICJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgdmlld0JveCA9ICIwIDAgMjQgMjQiPjxwYXRoIGZpbGw9IiNGRkZGRkYiIGQ9Ik0yMC43MSw3LjA0QzIxLjEsNi42NSAyMS4xLDYgMjAuNzEsNS42M0wxOC4zNywzLjI5QzE4LDIuOSAxNy4zNSwyLjkgMTYuOTYsMy4yOUwxNS4xMiw1LjEyTDE4Ljg3LDguODdNMywxNy4yNVYyMUg2Ljc1TDE3LjgxLDkuOTNMMTQuMDYsNi4xOEwzLDE3LjI1WiIvPjwvc3ZnPg==`;

      function toggleNavMenu() {
        const navMenu = document.querySelector(".nav-menu");
        const collapsed = navMenu.classList.toggle("collapsed");
        const toggle = navMenu.querySelector(".nav-toggle");

          toggle.setAttribute("aria-expanded", String(!collapsed));

            "aria-label",
            collapsed ? "Expand toolbar" : "Collapse toolbar"

        }
      }
      function openInstructions(isT2 = false) {

        if (textarea && windowElement) {
          if (isT2) {

            const templateText = `Company URL Or Company ID -
Case Number -
Customer Name -

Customer Goal -
How can T2 help? -

            // T2 is just a normal Note pre-filled with the template text — same

            t2Container.style.width = "903px";
            t2Container.style.height = "470px";

            // the raw viewport, which ignored the toolbar and could park a

              windowElement.offsetHeight
            );
          } else {
            textarea.value = `CB App - Self-contained single file app

      const RESET_WARNING =
        "This closes every window and deletes all CB App data saved in this " +
        "browser: the session, any leftover keys from older versions, and any " +
        "passphrase protection for this tab. Use Backup first if you want to " +
        "keep it.";

      /**
       * The gate in front of Reset (v3.2.14). Resolves true only if the reset
       * should go ahead.
       *
       * Protection has to mean more than "your notes are unreadable" — a
       * passphrase that stops someone reading the desks but not throwing them
       * away is barely a lock. So when the session is protected, Reset asks for
       * the passphrase, not just for a click.
       *
       * Three cases, deliberately different:
       *  - unprotected: a plain confirm, as before, just in the app's own box.
       *  - protected and open: the passphrase is in memory, so check against it.
       *  - protected and locked: nothing can verify it but the ciphertext, so
       *    try to decrypt. Failing that there is the ERASE escape below,
       *    because a forgotten passphrase must not brick the app forever.
       */
      async function confirmReset() {
        const envelope = sessionLocked ? readStoredEnvelope() : null;
        if (sessionLocked && envelope) return confirmResetLocked(envelope);
        if (sessionPassphrase) return confirmResetProtected();
        // Locked with nothing encrypted actually stored is not a protected
        // session, whatever the banner says — treat it as the plain case.
        return confirmDialog({
          title: "Reset CB App?",
          message: RESET_WARNING,
          okLabel: "Reset everything",
          danger: true,
        });
      }

      // Protected and open, so the passphrase in memory is the thing to check.
      function confirmResetProtected() {
        return requireSessionPassphrase({
          title: "Reset CB App?",
          message:
            RESET_WARNING +
            "\n\nThis session is passphrase-protected, so Reset needs the passphrase.",
          okLabel: "Reset everything",
          cancelStatus: "Reset cancelled — nothing was deleted.",
        });
      }

      /**
       * The gate for destroying a session this tab never opened. Locked means
       * `sessionPassphrase` is empty, so the only thing that can judge an
       * answer is the ciphertext itself.
       *
       * Shared by Reset and Import (v3.2.16), which differ only in wording:
       * both delete the stored session outright, so both have to ask.
       */
      async function confirmDestroyLocked(
        envelope,
        { title, message, okLabel, cancelStatus, eraseMessage } = {}
      ) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const pass = await promptPassphrase({
            title,
            message,
            label: "Passphrase",
            okLabel,
          });
          if (pass === null) {
            showStatus(cancelStatus);
            return false;
          }
          if (await verifyEnvelopePassphrase(envelope, pass)) return true;
          if (attempt < 2) window.alert("Wrong passphrase. Try again.");
        }
        // Escape hatch, reachable only after three genuine failures. It is
        // friction, not a second lock — a wrong passphrase three times over is
        // exactly the state of someone who has lost it, and leaving them with a
        // session that can never be opened *or* cleared would be worse than
        // this. Every other path still demands the real passphrase.
        const typed = await promptPassphrase({
          title: "Erase the session without the passphrase?",
          message: eraseMessage,
          label: "Type ERASE to confirm",
          okLabel: "Erase permanently",
          masked: false,
        });
        if ((typed || "").trim().toUpperCase() !== "ERASE") {
          showStatus(cancelStatus);
          return false;
        }
        return true;
      }

      function confirmResetLocked(envelope) {
        return confirmDestroyLocked(envelope, {
          title: "Reset a protected session?",
          message:
            "The session saved in this browser is encrypted and has not been " +
            "opened. Reset deletes it permanently, so it needs the passphrase.",
          okLabel: "Reset everything",
          cancelStatus: "Reset cancelled — the locked session is untouched.",
          eraseMessage:
            "Wrong passphrase three times. If it is lost, this session can " +
            "never be opened again and the only way forward is to delete it.\n\n" +
            "Type ERASE to delete it permanently. This cannot be undone.",
        });
      }

      /**
       * Import writes over whatever is saved here, so it destroys the current
       * session exactly as Reset does — and it did it behind a single click.
       * Same gate as Reset (v3.2.16), asked before the file is even parsed:
       * unlocking an encrypted backup replaces `sessionPassphrase` with the
       * file's, and by then there is nothing left to check the *current*
       * session's passphrase against.
       *
       * An unprotected session is unchanged — no passphrase to ask for, and
       * Import has never stopped to confirm one.
       */
      async function confirmImportOverCurrent() {
        const envelope = sessionLocked ? readStoredEnvelope() : null;
        if (sessionLocked && envelope) {
          return confirmDestroyLocked(envelope, {
            title: "Replace a protected session?",
            message:
              "The session saved in this browser is encrypted and has not been " +
              "opened. Importing deletes it permanently, so it needs the " +
              "passphrase. Cancel if you still want to try unlocking it.",
            okLabel: "Replace it",
            cancelStatus: "Import cancelled — the locked session is untouched.",
            eraseMessage:
              "Wrong passphrase three times. If it is lost, the session saved " +
              "here can never be opened again, and importing over it is one way " +
              "forward.\n\nType ERASE to delete it and import anyway. This " +
              "cannot be undone.",
          });
        }
        if (sessionPassphrase) {
          return requireSessionPassphrase({
            title: "Replace this protected session?",
            message:
              "Importing deletes the session saved in this browser and replaces " +
              "it with the contents of the file. This session is " +
              "passphrase-protected, so that needs the passphrase.",
            okLabel: "Replace it",
            cancelStatus: "Import cancelled — nothing was changed.",
          });
        }
        return true;
      }

      // Bound to the Reset button. Destroys the saved session, so confirm
      // first when there is actually something to lose — and prove the
      // passphrase first when the session is protected. See confirmReset().
      async function loadSession(skipConfirm = false) {
        try {
          const hasWork =
            document.querySelectorAll(WINDOW_SELECTOR).length > 0 ||
            ALL_SESSION_KEYS.some((k) => !!localStorage.getItem(k));
          if (hasWork && skipConfirm !== true) {
            if (!(await confirmReset())) return;
          }
          performReset();
        } catch (e) {
          console.error("Failed to reset UI:", e);
          showStatus("Failed to reset UI.");
        }
      }

      /**
       * The reset itself, with no questions asked. Split out from loadSession()
       * so it stays synchronous: Import calls it mid-flow and then keeps
       * working on the state it just cleared, which an awaited call would let
       * it do out of order.
       */
      function performReset() {
        try {
          // Clear every key this app owns (not the entire origin).
          clearAllSessionStorage();
          clearSessionSecrets();
          // Reset is still the way out of a session nobody can open — the gate
          // in confirmReset() asks for the passphrase and, failing that, for
          // ERASE, but by here the answer was given. The ciphertext is gone
          // now, so there is nothing left to protect and
          // saving must resume — including after a boot that failed to read
          // the old copy and left the boot gate shut.
          exitLockedState();
          booted = true;
          clearSaveFailure();
          updateProtectButton();

          // Reset UI state
          document.getElementById("windows").innerHTML = ""; // Remove all windows
          document.body.className = "dark-mode"; // Set default theme
          // "Fresh UI" includes the view: a reset that left you panned into an
          // empty corner of a three-screen canvas would look like a blank page.
          view.on = false;
          view.x = 0;
          view.y = 0;
          view.zoom = 1;
          worldSize = { w: 0, h: 0 };
          // Or the next canvas toggle would return to the viewpoint of the
          // session the user just deleted.
          canvasViewMemory = null;
          applyView();
          document.querySelector(".nav-menu").classList.remove("collapsed"); // Expand nav menu
          document.getElementById("search-replace").classList.remove("active"); // Hide search/replace

          // Reset global variables
          windowCount = 0;
          noteCount = 0;
          taskCount = 0;
          stickyCount = 0;
          t2Count = 0;
          activeWindow = null;
          zIndexCounter = 1;
          dropAllInstanceState();
          // A preference is data too: Reset means the defaults are back, not
          // that a mute from the deleted session outlives it.
          alertSoundOn = true;
          syncAlertSoundButton();
          // Events are the most emphatically "data" thing in the app, and Reset
          // says it clears all CB App browser data.
          calendarEvents = [];

          cascadeIndex = 0;
          cascadeAnchor = null;
          refreshChrome();
          showStatus("UI reset to fresh state — all CB App browser data cleared.");
        } catch (e) {
          console.error("Failed to reset UI:", e);
          showStatus("Failed to reset UI.");
        }
      }

      function loadSessionFromStorage(session) {
        // Rebuild quietly: suppress the add*() helpers' internal saveSession() calls
        // so we never persist a half-built DOM, then write one complete snapshot below.
        restoring = true;
        let skippedOnRestore = 0;
        try {
        // Restore theme — the token only, for the same reason toggleTheme()
        // does: the canvas classes on <body> are not the theme's to clear.
        document.body.classList.remove("light-mode", "dark-mode");
        document.body.classList.add(
          session.theme === "dark-mode" ? "dark-mode" : "light-mode"
        );

        // Only a real boolean speaks here; anything else means a session from
        // before the jingle existed, which keeps the default (on).
        if (typeof session.timerSound === "boolean") {
          alertSoundOn = session.timerSound;
        }
        syncAlertSoundButton();

        /* Events before windows: restoreSingleton() builds the calendar windows
           further down and each one renders from this store on the way in. */
        calendarEvents = Array.isArray(session.events) ? session.events : [];

        // Restore windows
        Object.keys(session).forEach((key) => {
          if (key.startsWith("window")) {
            const windowData = session[key];
            let newWindow;
            if (windowData.isTaskWindow) {
              newWindow = addTaskWindow();
            } else {
              newWindow = addWindow();
            }
            // add*() returns null once MAX_WINDOWS is hit. A saved session can
            // legitimately hold more windows than the current cap, and this
            // used to dereference the null and abort the entire restore -
            // losing every window after it, not just the extra one.
            if (!newWindow) {
              skippedOnRestore++;
              return;
            }
            const windowElement = document.getElementById(newWindow.id);

            // Restore position, size, and content
            windowElement.style.left = `${windowData.position.left}px`;
            windowElement.style.top = `${windowData.position.top}px`;
            /* Sessions written before v3.2.10 can carry width:0/height:0 for
               any window that was minimised when they were saved (offsetWidth
               reads 0 while display:none). Restoring that literally rebuilds a
               0px window that comes back from the chip bar invisible, so treat
               a zero as "no saved size" and leave the default. */
            if (windowData.width) windowElement.style.width = `${windowData.width}px`;
            if (windowData.height)
              windowElement.style.height = `${windowData.height}px`;
            windowElement.dataset.x = windowData.position.left;
            windowElement.dataset.y = windowData.position.top;
            windowElement.dataset.width = windowData.width;
            windowElement.dataset.height = windowData.height;
            // Reapply the resize target's OWN box before the ResizeObserver's
            // first callback runs, so updateWindowSize() derives the window
            // from the size the user actually chose rather than the default the
            // markup ships with. Absent in pre-3.1.3 sessions — those keep the
            // old behaviour rather than being resized to something arbitrary.
            const restoreTarget = resizeTargetFor(windowElement);
            if (
              restoreTarget &&
              restoreTarget !== windowElement &&
              windowData.containerWidth &&
              windowData.containerHeight
            ) {
              restoreTarget.style.width = `${windowData.containerWidth}px`;
              restoreTarget.style.height = `${windowData.containerHeight}px`;
            }
            if (windowData.zIndex) windowElement.style.zIndex = windowData.zIndex;
            if (windowData.minimized) windowElement.style.display = "none";
            if (windowData.mode) windowElement.dataset.restoredMode = windowData.mode;

            if (windowData.isTaskWindow) {
              // Restore tasks
              const taskList = windowElement.querySelector(".task-list");
              if (taskList && windowData.tasks) {
                taskList.innerHTML = "";
                windowData.tasks.forEach((task) => {
                  taskList.appendChild(
                    createTaskItem(newWindow.id, task.text, task.completed)
                  );
                });
              }
              const title = windowElement.querySelector(".task-title");
              if (title) title.textContent = windowData.name;
            } else {
              const textarea = document.getElementById(
                `clipboard-${newWindow.id}`
              );
              if (textarea) textarea.value = windowData.content;
              const title = windowElement.querySelector(".window-title");
              if (title) title.textContent = windowData.name;
              updateLineNumbers(newWindow.id);
              updateCounts(newWindow.id);
            }
            // Lock LAST. Applied before the content was rebuilt, it missed the
            // task checkboxes and delete buttons created just above, leaving a
            // "locked" task list whose items were still fully interactive.
            // applyWindowLock, not toggleWindowLock: restoring sets the state
            // directly rather than flipping it, and fires no status toast.
            if (windowData.locked) {
              applyWindowLock(windowElement, true);
            }
          } else if (SINGLETON_KEY_KIND[key] && session[key].visible) {
            restoreSingleton(SINGLETON_KEY_KIND[key], session[key]);
          } else if (key.startsWith("sticky-note")) {
            const stickyNoteData = session[key];
            const newStickyNote = addStickyNote();
            if (!newStickyNote) {
              skippedOnRestore++;
              return;
            }
            const stickyNoteElement = document.getElementById(newStickyNote.id);
            stickyNoteElement.style.left = `${stickyNoteData.position.left}px`;
            stickyNoteElement.style.top = `${stickyNoteData.position.top}px`;
            // Same zero-size guard as notes above.
            if (stickyNoteData.width)
              stickyNoteElement.style.width = `${stickyNoteData.width}px`;
            if (stickyNoteData.height)
              stickyNoteElement.style.height = `${stickyNoteData.height}px`;
            stickyNoteElement.dataset.x = stickyNoteData.position.left;
            stickyNoteElement.dataset.y = stickyNoteData.position.top;
            if (stickyNoteData.zIndex)
              stickyNoteElement.style.zIndex = stickyNoteData.zIndex;
            if (stickyNoteData.minimized)
              stickyNoteElement.style.display = "none";
            if (stickyNoteData.mode)
              stickyNoteElement.dataset.restoredMode = stickyNoteData.mode;

            const content = stickyNoteElement.querySelector(
              ".sticky-note-content"
            );
            if (content) content.value = stickyNoteData.content;

            // Reapply colours only when they were a deliberate choice.
            // Sessions written before v3.0 have no customColor flag and stored
            // whatever the theme default was at creation time; reapplying those
            // is what left old notes stuck dark on a light canvas. Treat a
            // stored colour matching any known default as "not a choice".
            const bgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.color
              : !!stickyNoteData.color && !isDefaultStickyColor(stickyNoteData.color);
            const fgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.textColor
              : !!stickyNoteData.textColor &&
                !isDefaultStickyColor(stickyNoteData.textColor);

            if (bgIsChoice) {
              stickyNoteElement.style.backgroundColor = stickyNoteData.color;
            }
            if (fgIsChoice && content) {
              content.style.color = stickyNoteData.textColor;
              // Keep the title/toolbar legible against a custom background.
              stickyNoteElement.style.color = stickyNoteData.textColor;
            }
            if (bgIsChoice || fgIsChoice) {
              stickyNoteElement.dataset.customColor = "true";
            }
            syncStickySwatches(stickyNoteElement);
            const title = stickyNoteElement.querySelector(".sticky-note-title");
            if (title && stickyNoteData.name) {
              title.textContent = stickyNoteData.name;
            }
            // Lock last, after the content exists. This used to be applied
            // twice - once here and again by a hand-rolled copy below - which
            // toggled it straight back off. One call, one source of truth.
            if (stickyNoteData.locked) {
              applyWindowLock(stickyNoteElement, true);
            }
          }
        });
        // Keep new windows above everything restored (clear the highest restored z).
        const maxRestoredZ = Math.max(
          0,
          ...[...document.querySelectorAll(".window, .task-window, .sticky-note-window")]
            .map((el) => parseInt(el.style.zIndex) || 0)
        );
        zIndexCounter = Math.max(
          session.zIndexCounter || 0,
          maxRestoredZ + 1,
          zIndexCounter
        );
        // A session saved before the cap existed can carry huge z-indices that
        // would sit above the toolbar; renumber everything into 1..n.
        if (zIndexCounter >= WINDOW_Z_MAX) compactWindowZ();
        } finally {
          restoring = false;
        }
        // Restore the canvas view *before* the clamp below. That clamp pulls
        // every window into bounds, and which bounds apply depends entirely on
        // whether the big canvas is on — restoring the view afterwards would
        // drag every far-flung window back into a single screen on each reload
        // and silently collapse the canvas.
        const savedView = session.canvas;
        view.on = !!(savedView && savedView.on);
        /* x/y/zoom always describe the canvas viewpoint, whichever desk was
           showing when this was saved, so it is remembered either way — that
           is what puts the user back where they were on the canvas rather than
           at the default centre.

           Only if there is one to remember. A session written before v3.2.12
           says nothing about `seen`, and every one of those that had never
           opened the canvas carries the placeholder {0, 0, zoom 1} — which is
           precisely the top-left corner. Read that back as the "never been" it
           actually stood for. A real viewpoint from that era is anything else
           and still survives the upgrade; the only thing given up is a user
           who deliberately parked at the exact corner at 1:1, who gets centred
           once. */
        const seenCanvas =
          savedView == null
            ? false
            : savedView.seen == null
              ? !(
                  savedView.x === 0 &&
                  savedView.y === 0 &&
                  savedView.zoom === 1
                )
              : savedView.seen;
        canvasViewMemory =
          savedView && seenCanvas
            ? {
                x: parseFloat(savedView.x) || 0,
                y: parseFloat(savedView.y) || 0,
                zoom: Math.min(
                  ZOOM_MAX,
                  Math.max(ZOOM_MIN, parseFloat(savedView.zoom) || 1)
                ),
              }
            : null;
        if (view.on) {
          if (canvasViewMemory) {
            computeWorldSize();
            view.zoom = canvasViewMemory.zoom;
            view.x = canvasViewMemory.x;
            view.y = canvasViewMemory.y;
          } else {
            // Booting straight onto a canvas that has never been positioned.
            centerCanvasView();
          }
        } else {
          view.zoom = 1;
          view.x = 0;
          view.y = 0;
        }
        /* A session written before v3.2.10 has no mode on any window. Adopt
           those onto whichever desk was showing when it was saved — that is
           the desk the user was looking at them on, so nothing appears to
           vanish on the upgrade. Windows restored with an explicit mode keep
           it; addWindow() stamped them with the boot-time default on the way
           in, which is why this runs over everything rather than just the
           untagged. */
        const fallbackMode = view.on ? CANVAS : WINDOWED;
        document.querySelectorAll(WINDOW_SELECTOR).forEach((el) => {
          if (!el.dataset.restoredMode) el.dataset.mode = fallbackMode;
          else el.dataset.mode = el.dataset.restoredMode;
          delete el.dataset.restoredMode;
        });
        applyModeVisibility();
        applyView();
        // A session saved on a large display used to restore partly or wholly
        // off-screen on a smaller one, with no way to drag anything back.
        // Only this desk: the other one's coordinates mean something else, and
        // its windows measure 0 while hidden.
        modeWindows().forEach((el) => clampWindowIntoView(el));
        refreshChrome();
        // One complete, consistent write now that the whole DOM is rebuilt.
        saveSession();
        // Reported by the caller so its own "Session restored!" doesn't
        // immediately overwrite the warning.
        return skippedOnRestore;
      }

      // Boot: restore this browser's session. Nothing else can write to it.
      window.onload = async () => {
        // Ahead of everything else, and unconditional: a session that fails to
        // load leaves the app in a state the user has to reason about, and the
        // build they are reasoning about is the first thing worth knowing.
        // downloadCbApp() clones the live DOM, so the stamp travels with the
        // copy without needing a second write on that path.
        const versionEl = document.getElementById("download-app-version");
        if (versionEl) versionEl.textContent = `v${CB_APP_VERSION}`;

        /* One-time purge of the retired calendar feature's stale storage key —
           v4.0.0's `session.events` is a different thing entirely and lives
           inside the session, not under this key.

           try/catch because merely touching localStorage throws SecurityError
           where site data is blocked by policy, and this line runs OUTSIDE the
           try that guards the session load below. Unguarded it took the whole of
           window.onload down with it, which since v4.0.0 also means
           startAlertScheduler() never runs — a calendar that silently never fires
           a reminder. Every other purge in this file already wraps its
           removeItem; this one did not. */
        try {
          localStorage.removeItem("calendarEvents");
        } catch (e) {
          /* storage denied — the purge is best-effort and boot must continue */
        }
        // Same, for the retired embedded-export mechanism (<= v3.2.6). Left in
        // place these are inert, but they are also the wreckage of the bug —
        // a displaced session under .prev that nothing will ever offer back.
        purgeRetiredExportKeys();
        updateProtectButton();

        /* The file on disk is just the program now; an exported copy carries
           no session, and a pre-3.2.7 export's payload is ignored outright.
           The only thing that decides what opens is this browser's storage.

           Guarded for the same reason as the purge above: a policy that blocks
           site data makes the mere act of reading throw, and an exception here
           aborted the rest of boot — including the alert scheduler at the end, so
           reminders never fired and nothing said why. A browser that will not let
           us read will not let us write either, so this is also the honest moment
           to say that nothing is being saved. */
        let rawToLoad = null;
        try {
          rawToLoad = localStorage.getItem(SESSION_KEY);
        } catch (e) {
          console.warn("Storage is not available:", e);
          reportSaveFailure(
            "This browser is not allowing CB App to store data — nothing will be saved this session."
          );
        }

        if (rawToLoad) {
          try {
            const session = await parseAndUnlockSession(rawToLoad, {
              promptReason:
                "Your CB App session is passphrase-protected. Enter the passphrase:",
            });
            if (!session) {
              // Wrong passphrase or cancelled. The ciphertext in localStorage
              // is still the only copy of their work, and the very next
              // autosave would overwrite it with an empty plaintext session —
              // which is how this used to destroy the data outright. Lock
              // instead: refuse every write, and offer unlimited retries.
              const stored = localStorage.getItem(SESSION_KEY);
              let storedEnvelope = null;
              try {
                const parsed = JSON.parse(stored || "");
                if (isEncryptedEnvelope(parsed)) storedEnvelope = parsed;
              } catch (e) {
                /* not an envelope — nothing to protect */
              }
              if (storedEnvelope) {
                enterLockedState(storedEnvelope);
                // Safe to release the boot gate: sessionLocked now refuses
                // every write on its own, and Unlock needs saves to work again.
                booted = true;
                showStatus(
                  "Session locked — wrong passphrase or cancelled. Nothing was lost; click 🔒 to try again."
                );
              } else {
                // Something is in storage that we could not turn into a
                // session, and it is not an envelope we can offer to unlock.
