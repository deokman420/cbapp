    <script type="text/javascript">
      // --- Session security (v3.2.0) -----------------------------------------
      // Storage keys, optional AES-GCM passphrase wrap, and strict import
      // validation. Passphrase stays in memory only for this tab session.
      const SESSION_KEY = "notepadSession";
      // Written only by the embedded-export restore retired in v3.2.7. Nothing
      // creates them any more; they are listed so Reset and the boot-time
      // purge still clear them out of browsers that used an older build.
      const RETIRED_EXPORT_KEYS = ["notepadSession.prev", "cbappConsumedExport"];
      const ALL_SESSION_KEYS = [SESSION_KEY, ...RETIRED_EXPORT_KEYS];
      const SESSION_FORMAT_VERSION = 1;
      const MAX_SESSION_CHARS = 4500000;
      const MAX_NOTE_CHARS = 800000;
      const MAX_NAME_CHARS = 200;
      const MAX_TASKS = 500;
      const MAX_LOGS = 500;
      const MAX_HISTORY = 200;
      const PBKDF2_ITERATIONS = 210000;

      // In-memory only — never written to localStorage or to any file.
      // sessionCryptoKey is derived once per unlock/protect so saves do not
      // re-run PBKDF2 on every keystroke.
      let sessionPassphrase = null;
      let sessionCryptoKey = null;
      let sessionKeySalt = null; // Uint8Array, paired with sessionCryptoKey

      // Set when boot found an encrypted session it could not open (wrong
      // passphrase, or the prompt was cancelled). The stored ciphertext is
      // still the user's only copy, so EVERY write is refused while this is
      // true — otherwise the first autosave of the empty screen overwrites it
      // with a plaintext snapshot of nothing and the data is gone for good.
      // Cleared only by a successful unlock, or by an explicit Reset.
      let sessionLocked = false;
      // The envelope we could not open, kept so Unlock can retry without a
      // reload. In memory only; the ciphertext also stays in localStorage.
      let lockedEnvelope = null;

      function clearSessionSecrets() {
        sessionPassphrase = null;
        sessionCryptoKey = null;
        sessionKeySalt = null;
      }

      function clearAllSessionStorage() {
        ALL_SESSION_KEYS.forEach((k) => {
          try {
            localStorage.removeItem(k);
          } catch (e) {
            /* ignore */
          }
        });
      }

      function purgeRetiredExportKeys() {
        RETIRED_EXPORT_KEYS.forEach((k) => {
          try {
            localStorage.removeItem(k);
          } catch (e) {
            /* ignore */
          }
        });
      }

      function isEncryptedEnvelope(obj) {
        return (
          !!obj &&
          typeof obj === "object" &&
          !Array.isArray(obj) &&
          obj.enc === true &&
          obj._cbapp === SESSION_FORMAT_VERSION &&
          typeof obj.salt === "string" &&
          typeof obj.iv === "string" &&
          typeof obj.ct === "string" &&
          obj.alg === "AES-GCM-256" &&
          obj.kdf === "PBKDF2-SHA256-210000"
        );
      }

      function bufToB64(buf) {
        const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
        let s = "";
        for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s);
      }

      function b64ToBytes(b64) {
        if (typeof b64 !== "string" || b64.length > 8000000) {
          throw new Error("Invalid base64 payload");
        }
        const s = atob(b64);
        const bytes = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
        return bytes;
      }

      async function deriveAesKey(passphrase, saltBytes) {
        const enc = new TextEncoder();
        const material = await crypto.subtle.importKey(
          "raw",
          enc.encode(passphrase),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: saltBytes,
            iterations: PBKDF2_ITERATIONS,
            hash: "SHA-256",
          },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function ensureSessionKey(passphrase, saltBytes) {
        if (
          sessionCryptoKey &&
          sessionPassphrase === passphrase &&
          sessionKeySalt &&
          saltBytes &&
          sessionKeySalt.length === saltBytes.length &&
          sessionKeySalt.every((b, i) => b === saltBytes[i])
        ) {
          return sessionCryptoKey;
        }
        const key = await deriveAesKey(passphrase, saltBytes);
        sessionPassphrase = passphrase;
        sessionCryptoKey = key;
        sessionKeySalt = new Uint8Array(saltBytes);
        return key;
      }

      async function encryptSessionObject(session, passphrase) {
        // Reuse salt+key across saves in this tab; new IV every encrypt.
        const salt =
          sessionKeySalt && sessionPassphrase === passphrase
            ? sessionKeySalt
            : crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await ensureSessionKey(passphrase, salt);
        const plain = new TextEncoder().encode(JSON.stringify(session));
        const ct = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          key,
          plain
        );
        return {
          _cbapp: SESSION_FORMAT_VERSION,
          enc: true,
          alg: "AES-GCM-256",
          kdf: "PBKDF2-SHA256-210000",
          salt: bufToB64(salt),
          iv: bufToB64(iv),
          ct: bufToB64(ct),
        };
      }

      async function decryptSessionEnvelope(envelope, passphrase) {
        const salt = b64ToBytes(envelope.salt);
        const iv = b64ToBytes(envelope.iv);
        if (salt.length !== 16 || iv.length !== 12) {
          throw new Error("Invalid envelope parameters");
        }
        const key = await ensureSessionKey(passphrase, salt);
        const plainBuf = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          key,
          b64ToBytes(envelope.ct)
        );
        const session = JSON.parse(new TextDecoder().decode(plainBuf));
        return validateSessionObject(session);
      }

      function isDangerousKey(key) {
        return (
          key === "__proto__" ||
          key === "constructor" ||
          key === "prototype"
        );
      }

      function assertPlainObject(value, label) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new Error(`Invalid session: ${label} must be an object`);
        }
        if (Object.getPrototypeOf(value) !== Object.prototype) {
          // JSON.parse always yields plain objects; reject exotic prototypes.
          throw new Error(`Invalid session: ${label} has unexpected prototype`);
        }
      }

      function assertString(value, label, maxLen) {
        if (typeof value !== "string") {
          throw new Error(`Invalid session: ${label} must be a string`);
        }
        if (value.length > maxLen) {
          throw new Error(`Invalid session: ${label} is too long`);
        }
      }

      function assertFiniteNumber(value, label) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          throw new Error(`Invalid session: ${label} must be a finite number`);
        }
      }

      function sanitizeColorString(value, label) {
        if (value === undefined || value === null || value === "") return "";
        assertString(value, label, 64);
        const v = value.trim().toLowerCase();
        // Only allow hex / rgb(a) that normalizeColor already understands.
        if (
          /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/.test(v) ||
          /^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(\s*,\s*(0|1|0?\.\d+))?\s*\)$/.test(
            v
          )
        ) {
          return v;
        }
        throw new Error(`Invalid session: ${label} is not a safe colour`);
      }

      function sanitizePosition(pos, label) {
        assertPlainObject(pos, label);
        const left = pos.left;
        const top = pos.top;
        // Positions may be numbers or numeric strings from older sessions.
        const lx =
          typeof left === "number" ? left : parseFloat(String(left));
        const ty = typeof top === "number" ? top : parseFloat(String(top));
        if (!Number.isFinite(lx) || !Number.isFinite(ty)) {
          throw new Error(`Invalid session: ${label} position`);
        }
        if (Math.abs(lx) > 1e7 || Math.abs(ty) > 1e7) {
          throw new Error(`Invalid session: ${label} position out of range`);
        }
        return { left: String(lx), top: String(ty) };
      }

      function sanitizeWindowRecord(data, label, { isSticky = false } = {}) {
        assertPlainObject(data, label);
        for (const k of Object.keys(data)) {
          if (isDangerousKey(k)) {
            throw new Error(`Invalid session: dangerous key in ${label}`);
          }
        }
        const out = {
          position: sanitizePosition(data.position || { left: 50, top: 50 }, label),
          width:
            data.width === undefined
              ? undefined
              : (assertFiniteNumber(Number(data.width), `${label}.width`),
                Number(data.width)),
          height:
            data.height === undefined
              ? undefined
              : (assertFiniteNumber(Number(data.height), `${label}.height`),
                Number(data.height)),
          zIndex:
            data.zIndex === undefined
              ? 0
              : (assertFiniteNumber(Number(data.zIndex), `${label}.zIndex`),
                Number(data.zIndex)),
          minimized: !!data.minimized,
          locked: !!data.locked,
          name:
            data.name === undefined
              ? undefined
              : (assertString(String(data.name), `${label}.name`, MAX_NAME_CHARS),
                String(data.name).slice(0, MAX_NAME_CHARS)),
          content:
            data.content === undefined
              ? ""
              : (assertString(String(data.content), `${label}.content`, MAX_NOTE_CHARS),
                String(data.content)),
          isTaskWindow: !!data.isTaskWindow,
        };
        if (data.containerWidth !== undefined) {
          assertFiniteNumber(Number(data.containerWidth), `${label}.containerWidth`);
          out.containerWidth = Number(data.containerWidth);
        }
        if (data.containerHeight !== undefined) {
          assertFiniteNumber(Number(data.containerHeight), `${label}.containerHeight`);
          out.containerHeight = Number(data.containerHeight);
        }
        if (Array.isArray(data.tasks)) {
          if (data.tasks.length > MAX_TASKS) {
            throw new Error(`Invalid session: too many tasks in ${label}`);
          }
          out.tasks = data.tasks.map((t, i) => {
            assertPlainObject(t, `${label}.tasks[${i}]`);
            assertString(String(t.text ?? ""), `${label}.tasks[${i}].text`, 2000);
            return { text: String(t.text ?? "").slice(0, 2000), completed: !!t.completed };
          });
        } else {
          out.tasks = [];
        }
        if (isSticky) {
          out.color = sanitizeColorString(data.color || "", `${label}.color`);
          out.textColor = sanitizeColorString(
            data.textColor || "",
            `${label}.textColor`
          );
          out.customColor = !!data.customColor;
        }
        return out;
      }

      /**
       * Strict allowlist validation for imported / embedded / decrypted sessions.
       * Throws on anything unexpected. Returns a cleaned plain object.
       */
      function validateSessionObject(raw) {
        assertPlainObject(raw, "session");
        for (const k of Object.keys(raw)) {
          if (isDangerousKey(k)) {
            throw new Error("Invalid session: dangerous key");
          }
        }
        const out = {};
        const known = new Set([
          "theme",
          "canvas",
          "clock",
          "calculator",
          "log",
          "help",
          "zIndexCounter",
        ]);
        for (const key of Object.keys(raw)) {
          if (key.startsWith("window")) {
            out[key] = sanitizeWindowRecord(raw[key], key, { isSticky: false });
            continue;
          }
          if (key.startsWith("sticky-note")) {
            out[key] = sanitizeWindowRecord(raw[key], key, { isSticky: true });
            continue;
          }
          if (!known.has(key)) {
            // Drop unknown top-level keys rather than fail — forward compatible.
            continue;
          }
          if (key === "theme") {
            out.theme =
              raw.theme === "light-mode" ? "light-mode" : "dark-mode";
          } else if (key === "zIndexCounter") {
            const z = Number(raw.zIndexCounter) || 0;
            assertFiniteNumber(z, "zIndexCounter");
            out.zIndexCounter = Math.min(Math.max(0, Math.floor(z)), 10000);
          } else if (key === "canvas") {
            if (raw.canvas == null) continue;
            assertPlainObject(raw.canvas, "canvas");
            out.canvas = {
              on: !!raw.canvas.on,
              x: Number.isFinite(Number(raw.canvas.x))
                ? Number(raw.canvas.x)
                : 0,
              y: Number.isFinite(Number(raw.canvas.y))
                ? Number(raw.canvas.y)
                : 0,
              zoom: Number.isFinite(Number(raw.canvas.zoom))
                ? Number(raw.canvas.zoom)
                : 1,
            };
          } else if (key === "clock" && raw.clock) {
            assertPlainObject(raw.clock, "clock");
            out.clock = {
              visible: !!raw.clock.visible,
              position: sanitizePosition(
                raw.clock.position || { left: 50, top: 50 },
                "clock"
              ),
              width: String(raw.clock.width ?? "200").slice(0, 20),
              height: String(raw.clock.height ?? "150").slice(0, 20),
              name: String(raw.clock.name || "Clock").slice(0, MAX_NAME_CHARS),
              clockFormat: raw.clock.clockFormat === "24" ? "24" : "12",
              locked: !!raw.clock.locked,
              minimized: !!raw.clock.minimized,
            };
          } else if (key === "calculator" && raw.calculator) {
            assertPlainObject(raw.calculator, "calculator");
            let history = Array.isArray(raw.calculator.history)
              ? raw.calculator.history.slice(0, MAX_HISTORY)
              : [];
            history = history.map((h, i) => {
              assertPlainObject(h, `calculator.history[${i}]`);
              return {
                expression: String(h.expression ?? "").slice(0, 500),
                result: String(h.result ?? "").slice(0, 100),
              };
            });
            out.calculator = {
              visible: !!raw.calculator.visible,
              history,
              position: sanitizePosition(
                raw.calculator.position || { left: 50, top: 50 },
                "calculator"
              ),
              width: String(raw.calculator.width ?? "250").slice(0, 20),
              locked: !!raw.calculator.locked,
              minimized: !!raw.calculator.minimized,
            };
          } else if (key === "log" && raw.log) {
            assertPlainObject(raw.log, "log");
            let logs = Array.isArray(raw.log.logs)
              ? raw.log.logs.slice(0, MAX_LOGS)
              : [];
            logs = logs.map((l, i) => {
              assertPlainObject(l, `log.logs[${i}]`);
              return {
                timestamp: String(l.timestamp ?? "").slice(0, 80),
                description: String(l.description ?? "").slice(0, 4000),
              };
            });
            out.log = {
              visible: !!raw.log.visible,
              position: sanitizePosition(
                raw.log.position || { left: 50, top: 50 },
                "log"
              ),
              width: String(raw.log.width ?? "300").slice(0, 20),
              height: String(raw.log.height ?? "300").slice(0, 20),
              name: String(raw.log.name || "Log").slice(0, MAX_NAME_CHARS),
              locked: !!raw.log.locked,
              minimized: !!raw.log.minimized,
              logs,
            };
          } else if (key === "help" && raw.help) {
            assertPlainObject(raw.help, "help");
            out.help = {
              visible: !!raw.help.visible,
              position: sanitizePosition(
                raw.help.position || { left: 50, top: 50 },
                "help"
              ),
              minimized: !!raw.help.minimized,
              locked: !!raw.help.locked,
            };
          }
        }
        return out;
      }

      async function persistSessionPayload(session) {
        // Second gate behind saveSession(): nothing may overwrite a locked
        // session's ciphertext, whatever the caller.
        if (sessionLocked) return false;
        let payload;
        if (sessionPassphrase) {
          payload = await encryptSessionObject(session, sessionPassphrase);
        } else {
          payload = session;
        }
        const serialized = JSON.stringify(payload);
        if (serialized.length > MAX_SESSION_CHARS) {
          reportSaveFailure(
            "Session too large to save — save a Backup, then close or trim a window."
          );
          return false;
        }
        localStorage.setItem(SESSION_KEY, serialized);
        clearSaveFailure();
        return true;
      }

      /**
       * Masked replacement for window.prompt() when the answer is a secret.
       * Resolves to the entered string, or null if the user cancels.
       * The field starts obscured; "Show" reveals it for the sighted-typo case
       * and flips back on every open so a passphrase is never left on screen.
       */
      function promptPassphrase({ title, message, label, okLabel } = {}) {
        const modal = document.getElementById("pass-modal");
        const input = document.getElementById("pass-modal-input");
        const reveal = document.getElementById("pass-modal-reveal");
        const form = document.getElementById("pass-modal-form");
        const okBtn = document.getElementById("pass-modal-ok");
        const cancelBtn = document.getElementById("pass-modal-cancel");
        const errorEl = document.getElementById("pass-modal-error");
        const labelEl = document.getElementById("pass-modal-label");
        // No modal in the DOM (e.g. a stripped copy of the page) — fall back
        // rather than leaving the caller hanging on a promise that never settles.
        if (!modal || !input || !form) {
          return Promise.resolve(window.prompt(message || title || "Passphrase"));
        }

        document.getElementById("pass-modal-title").textContent =
          title || "Passphrase";
        document.getElementById("pass-modal-message").textContent = message || "";
        labelEl.textContent = label || "Passphrase";
        okBtn.textContent = okLabel || "OK";
        errorEl.textContent = "";
        input.value = "";
        setRevealed(false);
        const returnFocus =
          document.activeElement instanceof HTMLElement
            ? document.activeElement
            : null;
        modal.classList.add("open");
        input.focus();

        function setRevealed(on) {
          input.type = on ? "text" : "password";
          reveal.textContent = on ? "Hide" : "Show";
          reveal.setAttribute("aria-pressed", on ? "true" : "false");
          reveal.setAttribute(
            "aria-label",
            on ? "Hide passphrase" : "Show passphrase"
          );
        }

        return new Promise((resolve) => {
          function close(value) {
            modal.classList.remove("open");
            // Never leave the secret sitting in the DOM or visible next time.
            input.value = "";
            setRevealed(false);
            reveal.removeEventListener("click", onReveal);
            form.removeEventListener("submit", onSubmit);
            cancelBtn.removeEventListener("click", onCancel);
            modal.removeEventListener("keydown", onKey);
            modal.removeEventListener("mousedown", onBackdrop);
            if (returnFocus && document.contains(returnFocus)) {
              returnFocus.focus();
            }
            resolve(value);
          }
          function onReveal() {
            setRevealed(input.type === "password");
            input.focus();
          }
          function onSubmit(e) {
            e.preventDefault();
            close(input.value);
          }
          function onCancel() {
            close(null);
          }
          function onKey(e) {
            if (e.key === "Escape") {
              e.stopPropagation();
              onCancel();
            } else if (e.key === "Tab") {
              // Keep focus inside the dialog: it is the only thing on screen.
              const focusables = [input, reveal, cancelBtn, okBtn];
              const i = focusables.indexOf(document.activeElement);
              if (i === -1) return;
              e.preventDefault();
              const next = e.shiftKey ? i - 1 : i + 1;
              focusables[(next + focusables.length) % focusables.length].focus();
            }
          }
          function onBackdrop(e) {
            if (e.target === modal) onCancel();
          }
          reveal.addEventListener("click", onReveal);
          form.addEventListener("submit", onSubmit);
          cancelBtn.addEventListener("click", onCancel);
          modal.addEventListener("keydown", onKey);
          modal.addEventListener("mousedown", onBackdrop);
        });
      }

      async function unlockEnvelopeWithPrompt(envelope, reason) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const pass = await promptPassphrase({
            title: "Unlock session",
            message:
              reason ||
              "This CB App session is passphrase-protected. Enter the passphrase:",
            okLabel: "Unlock",
          });
          if (pass === null) return null; // cancelled
          if (!pass) {
            window.alert("Passphrase cannot be empty.");
            continue;
          }
          try {
            const session = await decryptSessionEnvelope(envelope, pass);
            // sessionPassphrase / key cached inside decryptSessionEnvelope
            return session;
          } catch (e) {
            window.alert(
              attempt < 2
                ? "Wrong passphrase (or corrupted data). Try again."
                : "Wrong passphrase. Session was not loaded."
            );
          }
        }
        return null;
      }

      /**
       * Enter the locked state: the stored session is encrypted and we could
       * not open it. Saving is suspended (see saveSession) so the ciphertext
       * survives, and the user gets an unlimited number of further tries via
       * the banner — three per round, as many rounds as they want.
       */
      function enterLockedState(envelope) {
        sessionLocked = true;
        lockedEnvelope = envelope || lockedEnvelope;
        clearSessionSecrets();
        const banner = document.getElementById("locked-banner");
        if (banner) banner.style.display = "block";
        // The empty state promises "everything you type is saved
        // automatically", which is exactly false right now.
        const hint = document.querySelector("#empty-state .empty-hint");
        if (hint) {
          hint.dataset.unlockedText = hint.dataset.unlockedText || hint.innerHTML;
          hint.textContent =
            "Your saved session is encrypted and was not opened. Nothing is being saved until you unlock it — click the 🔒 banner to try the passphrase again.";
        }
        updateProtectButton();
      }

      function exitLockedState() {
        sessionLocked = false;
        lockedEnvelope = null;
        const banner = document.getElementById("locked-banner");
        if (banner) banner.style.display = "none";
        const hint = document.querySelector("#empty-state .empty-hint");
        if (hint && hint.dataset.unlockedText) {
          hint.innerHTML = hint.dataset.unlockedText;
          delete hint.dataset.unlockedText;
        }
        updateProtectButton();
      }

      /**
       * Bound to the locked banner. Re-prompts for the passphrase and, on
       * success, restores the session and resumes saving. On failure nothing
       * is written and the banner stays — the ciphertext is never at risk.
       */
      async function retryUnlockSession() {
        if (!sessionLocked) return;
        let envelope = lockedEnvelope;
        if (!envelope) {
          // Re-read from storage in case this tab was reloaded into the state.
          try {
            const parsed = JSON.parse(localStorage.getItem(SESSION_KEY) || "");
            if (isEncryptedEnvelope(parsed)) envelope = parsed;
          } catch (e) {
            /* fall through to the no-envelope case below */
          }
        }
        if (!envelope) {
          // Nothing encrypted is actually stored — release the brake.
          exitLockedState();
          showStatus("No encrypted session found — saving resumed.");
          return;
        }
        const session = await unlockEnvelopeWithPrompt(
          envelope,
          "Your CB App session is passphrase-protected. Enter the passphrase:"
        );
        if (!session) {
          showStatus(
            "Still locked — nothing was saved or lost. Click the banner to try again."
          );
          return;
        }
        // Anything on screen was typed while locked, so by definition it was
        // never saved. Restoring appends, so without this the two would merge
        // into a session that is neither. Ask before discarding it.
        if (document.querySelectorAll(WINDOW_SELECTOR).length > 0) {
          if (
            !window.confirm(
              "Unlock and restore your saved session?\n\nAnything on screen now was typed while the session was locked, so it was never saved. It will be replaced by the restored session. Use Backup first if you want to keep it."
            )
          ) {
            showStatus("Still locked — nothing was changed.");
            return;
          }
          clearScreenForRestore();
        }
        exitLockedState();
        loadSessionFromStorage(session);
        saveSession();
        updateProtectButton();
        showStatus("Session unlocked and restored.");
      }

      /**
       * Empty the screen without touching storage, so a restore replays into a
       * clean slate. Reset() does this too, but it also destroys the saved
       * session — which is the opposite of what unlocking wants.
       */
      function clearScreenForRestore() {
        document.getElementById("windows").innerHTML = "";
        ["calculator", "clock", "log", "help-window"].forEach((id) => {
          document.getElementById(id)?.remove();
        });
        windowCount = 0;
        noteCount = 0;
        taskCount = 0;
        stickyCount = 0;
        t2Count = 0;
        calculatorCount = 0;
        clockCount = 0;
        activeWindow = null;
        zIndexCounter = 1;
        calculatorVisible = false;
        clockVisible = false;
        logVisible = false;
        calculatorHistory = [];
        logEntries = [];
        [
          ["calculator-toggle", "Calc"],
          ["clock-toggle", "Clock"],
          ["log-toggle", "Log"],
        ].forEach(([id, label]) => {
          const btn = document.getElementById(id);
          if (btn) {
            btn.textContent = label;
            btn.classList.remove("active");
          }
        });
        cascadeIndex = 0;
        cascadeAnchor = null;
        refreshChrome();
      }

      /**
       * Parse a raw localStorage / file string into a validated session object.
       * Handles plaintext JSON sessions and encrypted envelopes.
       */
      async function parseAndUnlockSession(raw, { promptReason } = {}) {
        if (typeof raw !== "string" || !raw || raw.length > MAX_SESSION_CHARS + 1000) {
          throw new Error("Session payload missing or too large");
        }
        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch (e) {
          throw new Error("Session is not valid JSON");
        }
        if (isEncryptedEnvelope(parsed)) {
          const unlocked = await unlockEnvelopeWithPrompt(
            parsed,
            promptReason
          );
          if (!unlocked) return null;
          return unlocked;
        }
        // Legacy / plaintext
        return validateSessionObject(parsed);
      }

      function updateProtectButton() {
        const btn = document.getElementById("protect-toggle");
        if (!btn) return;
        if (sessionLocked) {
          // Protecting on top of a locked session makes no sense — the way
          // forward is to open the one that is already there.
          btn.textContent = "Unlock";
          btn.classList.add("active");
          btn.setAttribute(
            "data-tooltip",
            "Your saved session is encrypted and was not opened — unlock it to resume saving"
          );
          btn.setAttribute(
            "aria-label",
            "Unlock the encrypted session to resume saving"
          );
          return;
        }
        if (sessionPassphrase) {
          btn.textContent = "Unprotect";
          btn.classList.add("active");
          btn.setAttribute(
            "data-tooltip",
            "Remove passphrase protection (saves notes in plaintext again)"
          );
          btn.setAttribute(
            "aria-label",
            "Remove passphrase protection (saves notes in plaintext again)"
          );
        } else {
          btn.textContent = "Protect";
          btn.classList.remove("active");
          btn.setAttribute(
            "data-tooltip",
            "Encrypt this browser's session with a passphrase"
          );
          btn.setAttribute(
            "aria-label",
            "Encrypt this browser's session with a passphrase"
          );
        }
      }

      async function toggleSessionProtection() {
        if (sessionLocked) {
          // The button reads "Unlock" in this state.
          await retryUnlockSession();
          return;
        }
        if (sessionPassphrase) {
          if (
            !window.confirm(
              "Remove passphrase protection?\n\nYour session will be saved in plaintext in this browser again. Backups will also be plaintext unless you re-enable Protect."
            )
          ) {
            return;
          }
          clearSessionSecrets();
          try {
            const snap = buildSessionSnapshot();
            await persistSessionPayload(snap);
            updateProtectButton();
            showStatus("Passphrase protection removed — session is plaintext.");
          } catch (e) {
            showStatus("Failed to remove protection.");
          }
          return;
        }
        const pass = await promptPassphrase({
          title: "Protect this session",
          message:
            "Choose a passphrase to encrypt this session in the browser and in backups.\n\nYou will need it every time you open CB App on this origin. It is never stored — only you know it.",
          label: "New passphrase (6+ characters)",
          okLabel: "Continue",
        });
        if (pass === null) return;
        if (!pass || pass.length < 6) {
          window.alert("Use a passphrase of at least 6 characters.");
          return;
        }
        const again = await promptPassphrase({
          title: "Confirm passphrase",
          message: "Type the same passphrase again to confirm.",
          label: "Confirm passphrase",
          okLabel: "Protect",
        });
        if (again === null) return;
        if (pass !== again) {
          window.alert("Passphrases did not match.");
          return;
        }
        try {
          // Fresh salt for a newly protected session.
          sessionCryptoKey = null;
          sessionKeySalt = null;
          sessionPassphrase = pass;
          const snap = buildSessionSnapshot();
          const ok = await persistSessionPayload(snap);
          if (!ok) {
            clearSessionSecrets();
            showStatus("Could not save encrypted session.");
            return;
          }
          updateProtectButton();
          showStatus("Session encrypted with your passphrase.");
        } catch (e) {
          clearSessionSecrets();
          console.error(e);
          showStatus("Encryption failed — is Web Crypto available?");
        }
      }

      // Normalise "rgb(43, 39, 24)" / "#2B2718" / "" to "#2b2718" so stored
      // colours can be compared against the theme defaults.
      function normalizeColor(value) {
        if (!value) return "";
        const v = String(value).trim().toLowerCase();
        const rgb = v.match(/^rgba?\(([^)]+)\)$/);
        if (rgb) {
          const [r, g, b] = rgb[1].split(",").map((n) => parseInt(n, 10));
          if ([r, g, b].some(Number.isNaN)) return v;
          return (
            "#" +
            [r, g, b].map((n) => n.toString(16).padStart(2, "0")).join("")
          );
        }
        if (/^#[0-9a-f]{3}$/.test(v)) {
          return "#" + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
        }
        return v;
      }

      // Every sticky-note colour this app has ever used as a *default*. A
      // stored colour matching one of these was never a deliberate choice - it
      // was just whatever the theme happened to be when the note was made -
      // so it must not be reapplied over the current theme.
      const DEFAULT_STICKY_COLORS = new Set([
        "#2b2718", "#fff6c9", // current --sticky-bg
        "#f6ecd2", "#3b3210", // current --sticky-text
        "#141820", "#ffffff", // --bg-card, used as the default before v3.0
        "#e2e8f0", "#0f172a", // --text, likewise
        "#444444", "#ffff88", // pre-v2 sticky background
        "#000000",            // pre-v2 fallback text colour
      ]);

      function isDefaultStickyColor(value) {
        return DEFAULT_STICKY_COLORS.has(normalizeColor(value));
      }

      // Mark the note as deliberately recoloured. Without this flag there is no
      // way to tell a user's choice from a baked-in theme default, which is why
      // notes created before v3.0 stayed dark forever after switching to light.
      function changeStickyNoteColor(windowId, color) {
        const stickyNote = document.getElementById(windowId);
        if (stickyNote) {
          stickyNote.style.backgroundColor = color;
          stickyNote.dataset.customColor = "true";
          saveSession();
          showStatus("Sticky note colour changed.");
        }
      }

      function changeStickyNoteTextColor(windowId, color) {
        const stickyNote = document.getElementById(windowId);
        const stickyNoteContent = stickyNote?.querySelector(
          ".sticky-note-content"
        );
        if (stickyNoteContent) {
          stickyNoteContent.style.color = color;
          // Also set it on the note itself so the title, the toolbar labels and
          // the Reset button inherit it. They otherwise stay on the theme token
          // and go unreadable against a custom background - dark brown text on
          // a purple note, for instance.
          stickyNote.style.color = color;
          stickyNote.dataset.customColor = "true";
          saveSession();
          showStatus("Sticky note text colour changed.");
        }
      }

      // Drop a note's inline colours so it inherits the theme tokens again.
      function resetStickyColors(windowId) {
        const stickyNote = document.getElementById(windowId);
        if (!stickyNote) return;
        stickyNote.style.removeProperty("background-color");
        stickyNote.style.removeProperty("color");
        stickyNote
          .querySelector(".sticky-note-content")
          ?.style.removeProperty("color");
        delete stickyNote.dataset.customColor;
        syncStickySwatches(stickyNote);
        saveSession();
        showStatus("Sticky note follows the theme again.");
      }

      // One-click copy of a sticky note's body text.
      function copyStickyNoteText(windowId) {
        const content = document
          .getElementById(windowId)
          ?.querySelector(".sticky-note-content");
        if (!content) {
          showStatus("Copy failed: sticky note not found.");
          return;
        }
        copyToClipboard(content.value, "This sticky note is empty.");
      }

      // Point the two swatch inputs at what the note will settle on.
      // Deliberately reads the inline style or the theme *token* rather than
      // the computed colour: .sticky-note-window transitions its background
      // over 0.3s, so sampling getComputedStyle mid-switch captures a garbage
      // intermediate value like #9a9475.
      function syncStickySwatches(stickyNote) {
        const contentEl = stickyNote.querySelector(".sticky-note-content");
        const bg = stickyNote.querySelector('input[type="color"][id^="sticky-note-color-"]');
        const fg = stickyNote.querySelector('input[type="color"][id^="sticky-note-text-color-"]');
        const tokens = getComputedStyle(document.body);
        if (bg) {
          bg.value =
            normalizeColor(stickyNote.style.backgroundColor) ||
            normalizeColor(tokens.getPropertyValue("--sticky-bg")) ||
            "#2b2718";
        }
        if (fg) {
          fg.value =
            normalizeColor(contentEl && contentEl.style.color) ||
            normalizeColor(tokens.getPropertyValue("--sticky-text")) ||
            "#f6ecd2";
        }
      }

      // Sticky notes that were never deliberately recoloured must follow the
      // theme; ones the user painted keep their colours.
      function refreshStickyThemeColors() {
        const notes = document.querySelectorAll(".sticky-note-window");
        notes.forEach((note) => {
          if (note.dataset.customColor !== "true") {
            note.style.removeProperty("background-color");
            note.style.removeProperty("color");
            note
              .querySelector(".sticky-note-content")
              ?.style.removeProperty("color");
          }
        });
        // Read the swatches back on the next frame. Custom properties changed
        // on <body> do not resolve synchronously - reading getComputedStyle in
        // the same pass (even after forcing layout) returns the *previous*
        // theme's colours, leaving the pickers one theme behind.
        requestAnimationFrame(() =>
          notes.forEach((note) => syncStickySwatches(note))
        );
      }

      let windowCount = 0;
      let noteCount = 0;
      let taskCount = 0;
      let stickyCount = 0;
      let t2Count = 0;
      let calculatorCount = 0;
      let clockCount = 0;
      let activeWindow = null;
      // lockedWindows removed along with the orphaned toggleLock(): lock state
      // lives on each element's dataset.locked, which is what toggleWindowLock()
      // and saveSession() actually read.
      let zIndexCounter = 1;
      let restoring = false; // true only while loadSessionFromStorage rebuilds the DOM
      // False until boot has finished deciding what this browser's session is.
      // Boot is async — it awaits the unlock prompt, which a user can sit in
      // front of for as long as they like. Reloading during that window used to
      // fire beforeunload -> saveSession() against a blank DOM, with no
      // passphrase yet in hand, replacing the ciphertext with an empty
      // plaintext session. Refuse every write until boot says otherwise;
      // storage already holds the truth, so there is nothing to lose by waiting.
      let booted = false;
      let activeTool = null;
      let offsetX = 0;
      let offsetY = 0;
      let calculatorVisible = false;
      let clockVisible = false;
      let logVisible = false;
      let calculatorHistory = [];
      let logEntries = [];
      const MAX_WINDOWS = 25;

      // Every window type used to spawn at a fixed spot - notes, calculator,
      // clock and help all dead-centre, tasks at 50,50, log at 0,0 - so opening
      // three things buried them in one pile. Windows now cascade, stay clear of
      // the toolbar, and wrap back to the start when they run out of room.
      const WINDOW_SELECTOR =
        ".window, .task-window, .clock-window, .log-window, .calculator, .sticky-note-window, .help-window";
      const CASCADE_STEP = 32;
      let cascadeIndex = 0;

      // Windows live strictly below the fixed chrome (toolbar 1000, download
      // chip and minimized bar 1001, search 2400, toast 2500, tooltip 3000).
      // zIndexCounter used to climb to 2147483640, so after enough focus
      // switches a window would render on top of the toolbar and the download
      // link. When the ceiling is reached the stack is compacted instead.
      const WINDOW_Z_MAX = 900;

      function nextWindowZ() {
        if (zIndexCounter >= WINDOW_Z_MAX) compactWindowZ();
        return ++zIndexCounter;
      }

      // Re-number the open windows 1..n, preserving their current order, so the
      // counter can keep going without ever reaching the chrome layer.
      function compactWindowZ() {
        const ordered = Array.from(document.querySelectorAll(WINDOW_SELECTOR))
          .map((el) => ({ el, z: parseInt(el.style.zIndex) || 0 }))
          .sort((a, b) => a.z - b.z);
        ordered.forEach((item, i) => {
          item.el.style.zIndex = i + 1;
        });
        zIndexCounter = ordered.length;
      }

      function navMenuBounds() {
        const nav = document.querySelector(".nav-menu");
        return nav ? nav.getBoundingClientRect() : null;
      }

      /* ==========================================================
         BIG CANVAS — view state
         ----------------------------------------------------------
         Window left/top have always been screen pixels, because nothing could
         scroll or scale. They are now *world* pixels, and the view is what maps
         world to screen:

             screen = world * zoom + pan

         While the canvas is off the view is the identity transform (pan 0,
         zoom 1), so world and screen coordinates are the same number and every
         existing code path — including sessions saved by earlier versions —
         behaves exactly as it did before. That is the whole reason the maths is
         written as one path rather than branching on the mode everywhere.
         ========================================================== */
      const CANVAS_MULTIPLE = 3; // world is 3 viewports wide and tall
      const ZOOM_MIN = 0.25;
      const ZOOM_MAX = 2;
      const ZOOM_STEP = 1.15;
      const view = { on: false, x: 0, y: 0, zoom: 1 };

      // Grow-only: shrinking the world after windows have been parked out
      // there would strand them past the clamp, with no way to reach them.
      let worldSize = { w: 0, h: 0 };

      /* The world must still cover the screen at maximum zoom-out, so the
         multiple is whichever is larger: the 3 viewports we want at 1:1, or
         the 1/ZOOM_MIN viewports the screen spans once fully zoomed out.

         At 3 viewports with ZOOM_MIN 0.25 the world was 3834px wide but the
         screen spanned 4 viewports of it, so below 1/3 zoom the scaled world
         was *smaller* than the viewport. clampPan() then took its centring
         branch and parked it in the middle, leaving a dead margin all round —
         160px each side at 25% on a 1278px screen. The grid is a fixed
         backdrop so it kept painting across that margin, which made it read as
         reachable canvas, but clampBounds() works in world coordinates: a
         dragged window stopped dead at the world edge, well inboard of the
         screen edge, looking like it was being forced back toward the centre. */
      const WORLD_MULTIPLE = Math.max(CANVAS_MULTIPLE, 1 / ZOOM_MIN);

      function computeWorldSize() {
        const w = Math.max(
          worldSize.w,
          Math.round(window.innerWidth * WORLD_MULTIPLE)
        );
        const h = Math.max(
          worldSize.h,
          Math.round(window.innerHeight * WORLD_MULTIPLE)
        );
        worldSize = { w, h };
        return worldSize;
      }

      function screenToWorld(clientX, clientY) {
        return {
          x: (clientX - view.x) / view.zoom,
          y: (clientY - view.y) / view.zoom,
        };
      }

      // Hard limits for dragging: the world while the canvas is on, the visible
      // viewport while it is off. Distinct from canvasBounds(), which answers a
      // different question — where a *new* window should be dropped so the user
      // can see it. The two were the same rect until the canvas existed.
      function clampBounds() {
        if (!view.on) return canvasBounds();
        const world = computeWorldSize();
        const pad = 12;
        return {
          left: pad,
          top: pad,
          right: world.w - pad,
          bottom: world.h - pad,
        };
      }

      // Keep the world covering the viewport: pan can never open a gap at an
      // edge, and once the whole world fits on screen it is centred instead.
      function clampPan() {
        const world = computeWorldSize();
        const scaledW = world.w * view.zoom;
        const scaledH = world.h * view.zoom;
        view.x =
          scaledW <= window.innerWidth
            ? (window.innerWidth - scaledW) / 2
            : Math.min(0, Math.max(window.innerWidth - scaledW, view.x));
        view.y =
          scaledH <= window.innerHeight
            ? (window.innerHeight - scaledH) / 2
            : Math.min(0, Math.max(window.innerHeight - scaledH, view.y));
      }

      /* The first version of this ran synchronously from every pointermove and
         wheel event, and rewrote the layer's width, height, transform and the
         zoom label on each one. Pointer events fire faster than the screen
         refreshes, so that was several full style-and-layout passes per frame,
         and setting width/height on a 3700px layer holding every open window
         invalidated layout for that whole subtree each time. That is what made
         panning and zooming feel like they were skipping.

         Now: coalesce to one write per animation frame, and inside that write
         only touch what actually changed. The transform is the only thing that
         changes on a normal pan, and on its own it is compositor work rather
         than layout work. */
      let viewFrame = null;
      let lastGeometry = "";
      let lastLabel = "";

      function scheduleView() {
        if (viewFrame !== null) return;
        viewFrame = requestAnimationFrame(() => {
          viewFrame = null;
          applyView();
        });
      }

      function applyView() {
        const layer = document.getElementById("windows");
        if (!layer) return;
        document.body.classList.toggle("canvas-on", view.on);
        const toggle = document.getElementById("canvas-toggle");
        if (toggle) {
          toggle.classList.toggle("active", view.on);
          toggle.setAttribute("aria-pressed", String(view.on));
        }
        const grid = document.getElementById("canvas-grid");
        if (!view.on) {
          // Back to the plain full-screen layer, with no transform at all
          // rather than a scale(1) — an identity transform still creates a
          // containing block and a stacking context, and the point of the off
          // state is that it is indistinguishable from the old build.
          layer.style.transform = "";
          layer.style.width = "";
          layer.style.height = "";
          lastGeometry = "";
          return;
        }
        const world = computeWorldSize();
        clampPan();

        // Layout-invalidating writes, skipped unless the world actually grew.
        const geometry = `${world.w}x${world.h}`;
        if (geometry !== lastGeometry) {
          layer.style.width = `${world.w}px`;
          layer.style.height = `${world.h}px`;
          lastGeometry = geometry;
        }

        // translate3d rather than translate: the z-component is what gets this
        // onto its own compositor layer on most engines.
        layer.style.transform = `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

        // The grid is a fixed backdrop, so the view moves it by shifting the
        // pattern rather than by transforming a giant painted surface.
        if (grid) {
          const cell = 48 * view.zoom;
          grid.style.backgroundSize = `${cell}px ${cell}px`;
          grid.style.backgroundPosition = `${view.x}px ${view.y}px`;
        }

        const label = document.getElementById("zoom-level");
        const text = `${Math.round(view.zoom * 100)}%`;
        if (label && text !== lastLabel) {
          label.textContent = text;
          lastLabel = text;
        }
        drawMapViewport();
      }

      /* ==========================================================
         Minimap
         ----------------------------------------------------------
         Two update paths on purpose. The viewport frame moves on every pan and
         zoom, so it is one style write per frame. The window blocks only change
         when a window is added, closed, moved or resized, so they are rebuilt
         on a debounce — rebuilding 25 nodes inside the pan loop would put back
         exactly the per-frame DOM churn the render loop above removes.
         ========================================================== */
      const MAP_WIDTH = 168;

      function mapScale() {
        const world = computeWorldSize();
        return MAP_WIDTH / world.w;
      }

      function sizeMap() {
        const map = document.getElementById("canvas-map");
        if (!map) return null;
        const world = computeWorldSize();
        const s = mapScale();
        map.style.width = `${MAP_WIDTH}px`;
        map.style.height = `${Math.round(world.h * s)}px`;
        return s;
      }

      function drawMapViewport() {
        const frame = document.getElementById("map-viewport");
        if (!frame || !view.on) return;
        const s = sizeMap();
        if (!s) return;
        // The world rectangle currently on screen, in map pixels.
        const tl = screenToWorld(0, 0);
        const br = screenToWorld(window.innerWidth, window.innerHeight);
        frame.style.left = `${tl.x * s}px`;
        frame.style.top = `${tl.y * s}px`;
        frame.style.width = `${Math.max(4, (br.x - tl.x) * s)}px`;
        frame.style.height = `${Math.max(4, (br.y - tl.y) * s)}px`;
      }

      let mapTimer = null;
      function scheduleMapWindows() {
        if (mapTimer) clearTimeout(mapTimer);
        mapTimer = setTimeout(() => {
          mapTimer = null;
          drawMapWindows();
        }, 120);
      }

      function drawMapWindows() {
        const inner = document.getElementById("canvas-map-inner");
        if (!inner || !view.on) return;
        const s = sizeMap();
        if (!s) return;
        inner.querySelectorAll(".map-window").forEach((n) => n.remove());
        const frame = document.getElementById("map-viewport");
        document.querySelectorAll(WINDOW_SELECTOR).forEach((el) => {
          if (el.style.display === "none") return; // minimised
          const block = document.createElement("div");
          block.className = "map-window";
          if (el.classList.contains("active")) block.classList.add("map-active");
          block.style.left = `${(parseFloat(el.dataset.x) || 0) * s}px`;
          block.style.top = `${(parseFloat(el.dataset.y) || 0) * s}px`;
          block.style.width = `${Math.max(2, el.offsetWidth * s)}px`;
          block.style.height = `${Math.max(2, el.offsetHeight * s)}px`;
          inner.insertBefore(block, frame);
        });
        drawMapViewport();
      }

      // Click or drag the map to jump — the fastest way back to a window you
      // have panned away from, and the reason the map is a control and not
      // just a readout.
      (function wireMap() {
        const map = document.getElementById("canvas-map");
        if (!map) return;
        let dragging = false;
        const jumpTo = (e) => {
          const s = mapScale();
          const r = map.getBoundingClientRect();
          // Centre the viewport on the clicked world point.
          const worldX = (e.clientX - r.left) / s;
          const worldY = (e.clientY - r.top) / s;
          view.x = window.innerWidth / 2 - worldX * view.zoom;
          view.y = window.innerHeight / 2 - worldY * view.zoom;
          scheduleView();
        };
        map.addEventListener("pointerdown", (e) => {
          if (!view.on) return;
          dragging = true;
          try {
            map.setPointerCapture(e.pointerId);
          } catch (err) {
            /* not fatal */
          }
          jumpTo(e);
        });
        map.addEventListener("pointermove", (e) => {
          if (dragging && view.on) jumpTo(e);
        });
        const stop = () => {
          if (!dragging) return;
          dragging = false;
          saveSession();
        };
        map.addEventListener("pointerup", stop);
        map.addEventListener("pointercancel", stop);

        // The map advertises role="button" and sits in the tab order, but only
        // pointer events were bound — so it was reachable by keyboard and did
        // nothing at all, which is worse than not being focusable. Arrows pan;
        // Enter/Space recentres on the windows.
        map.addEventListener("keydown", (e) => {
          if (!view.on) return;
          const PAN = 80;
          const nudge = { ArrowLeft: [PAN, 0], ArrowRight: [-PAN, 0], ArrowUp: [0, PAN], ArrowDown: [0, -PAN] }[e.key];
          if (nudge) {
            e.preventDefault();
            view.x += nudge[0];
            view.y += nudge[1];
            scheduleView();
            debouncedSave(300);
            return;
          }
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            zoomToFit();
          }
        });
      })();

      // Gestures mark themselves as in-flight so the compositor hint goes on
      // for the duration and comes off shortly after the last event.
      let interactionTimer = null;
      function markInteracting() {
        document.body.classList.add("canvas-interacting");
        if (interactionTimer) clearTimeout(interactionTimer);
        interactionTimer = setTimeout(() => {
          document.body.classList.remove("canvas-interacting");
          interactionTimer = null;
        }, 220);
      }

      // Zoom about a fixed screen point, so the thing under the cursor (or the
      // centre of the screen, for the buttons) stays under it.
      function setZoom(nextZoom, anchorX, anchorY) {
        if (!view.on) return;
        const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, nextZoom));
        if (z === view.zoom) return;
        const ax = anchorX === undefined ? window.innerWidth / 2 : anchorX;
        const ay = anchorY === undefined ? window.innerHeight / 2 : anchorY;
        const before = screenToWorld(ax, ay);
        view.zoom = z;
        view.x = ax - before.x * z;
        view.y = ay - before.y * z;
        scheduleView();
        // Neither setZoom nor zoomToFit persisted anything, and the wheel
        // handler's debouncedSave sits AFTER its `if (e.ctrlKey) … return`, so
        // Ctrl+wheel, the +/− buttons and Fit all reverted to 100% on reload —
        // at a pan that HAD been saved, so you came back somewhere you never
        // were. Debounced: zooming is a stream of small steps.
        debouncedSave(400);
      }

      function zoomBy(direction, anchorX, anchorY) {
        setZoom(
          direction > 0 ? view.zoom * ZOOM_STEP : view.zoom / ZOOM_STEP,
          anchorX,
          anchorY
        );
      }

      // The answer to "where did my window go" on a canvas three times the
      // size of the screen.
      function zoomToFit() {
        if (!view.on) return;
        const windows = Array.from(
          document.querySelectorAll(WINDOW_SELECTOR)
        ).filter((el) => el.style.display !== "none");
        if (!windows.length) {
          resetView();
          return;
        }
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        windows.forEach((el) => {
          const x = parseFloat(el.dataset.x) || 0;
          const y = parseFloat(el.dataset.y) || 0;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x + el.offsetWidth);
          maxY = Math.max(maxY, y + el.offsetHeight);
        });
        const margin = 40;
        const vw = window.innerWidth;
        const nav = navMenuBounds();
        const vh = nav && nav.height ? window.innerHeight - nav.height - 24 : window.innerHeight;
        const zoom = Math.min(
          ZOOM_MAX,
          Math.max(
            ZOOM_MIN,
            Math.min(
              (vw - margin * 2) / Math.max(1, maxX - minX),
              (vh - margin * 2) / Math.max(1, maxY - minY)
            )
          )
        );
        view.zoom = zoom;
        view.x = (vw - (maxX - minX) * zoom) / 2 - minX * zoom;
        view.y = (vh - (maxY - minY) * zoom) / 2 - minY * zoom;
        applyView();
        saveSession();
        showStatus(`Fitted ${windows.length} window${windows.length === 1 ? "" : "s"}.`);
      }

      function resetView() {
        if (!view.on) return;
        view.zoom = 1;
        // Centre on the middle of the world rather than its corner: the corner
        // is empty, and windows are placed into whatever is on screen.
        const world = computeWorldSize();
        view.x = (window.innerWidth - world.w) / 2;
        view.y = (window.innerHeight - world.h) / 2;
        applyView();
        saveSession();
      }

      function toggleCanvasMode(force) {
        const next = force === undefined ? !view.on : !!force;
        if (next === view.on) return;
        view.on = next;
        if (next) {
          const world = computeWorldSize();
          /* Entering used to just set pan to (0,0), which is the world's
             top-left CORNER — and since clampPan() caps pan at 0, that left no
             world above or to the left, so dragging down and to the right was
             dead on arrival. Half the directions simply did not work.

             The windows are in screen coordinates, i.e. world coordinates in
             the first viewport-sized cell of a 3x3 world. Shift every one of
             them into the middle cell and cancel the shift in the pan: the
             screen position of everything is unchanged to the pixel
             (screen = world + pan, and both terms moved by equal and opposite
             amounts), but now there is a full viewport of canvas in every
             direction. */
          const offsetX = Math.round((world.w - window.innerWidth) / 2);
          const offsetY = Math.round((world.h - window.innerHeight) / 2);
          document.querySelectorAll(WINDOW_SELECTOR).forEach((el) => {
            const x = (parseFloat(el.dataset.x) || 0) + offsetX;
            const y = (parseFloat(el.dataset.y) || 0) + offsetY;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.dataset.x = x;
            el.dataset.y = y;
          });
          view.zoom = 1;
          view.x = -offsetX;
          view.y = -offsetY;
          // The staircase anchor is a world coordinate from before the shift,
          // so leaving it set would drop the next window a full viewport away
          // from the pile it is supposed to cascade from.
          cascadeAnchor = null;
          applyView();
          drawMapWindows();
          showStatus("Big canvas on — drag the background to pan, Ctrl+wheel to zoom.");
        } else {
          // Leaving: anything parked outside the viewport would be unreachable
          // with no way to pan to it, so pull it all back in and say so.
          view.zoom = 1;
          view.x = 0;
          view.y = 0;
          applyView();
          let moved = 0;
          document.querySelectorAll(WINDOW_SELECTOR).forEach((el) => {
            const beforeX = parseFloat(el.dataset.x) || 0;
            const beforeY = parseFloat(el.dataset.y) || 0;
            clampWindowIntoView(el);
            if (
              Math.abs((parseFloat(el.dataset.x) || 0) - beforeX) > 0.5 ||
              Math.abs((parseFloat(el.dataset.y) || 0) - beforeY) > 0.5
            )
              moved++;
          });
          showStatus(
            moved
              ? `Big canvas off — ${moved} window${moved === 1 ? "" : "s"} pulled back on screen.`
              : "Big canvas off."
          );
        }
        saveSession();
      }

      // Usable canvas: where a new window should be dropped so it lands in
      // sight. Off, that is the viewport minus whatever edge the toolbar
      // occupies; on, it is the slice of the world currently on screen.
      function canvasBounds() {
        const pad = 12;
        const nav = navMenuBounds();
        const openTop = pad;
        const openBottom = window.innerHeight - pad;
        let top = openTop;
        let bottom = openBottom;
        if (nav && nav.height) {
          // Toolbar is bottom-anchored on desktop, top-anchored on narrow screens.
          if (nav.top > window.innerHeight / 2) bottom = nav.top - pad;
          else top = nav.bottom + pad;
        }
        if (view.on) {
          const tl = screenToWorld(pad, top);
          const br = screenToWorld(window.innerWidth - pad, bottom);
          return { left: tl.x, top: tl.y, right: br.x, bottom: br.y };
        }
        return {
          left: pad,
          top,
          right: window.innerWidth - pad,
          bottom,
          // The toolbar's column, plus the limits that apply outside it, so
          // clampSpot() can give back the strip down each side. Only meaningful
          // off-canvas: on the big canvas the toolbar floats over world space
          // rather than bounding it, and the world clamp has no nav at all.
          openTop,
          openBottom,
          nav:
            nav && nav.height
              ? { left: nav.left - pad, right: nav.right + pad }
              : null,
        };
      }

      /* Clamp a window into bounds, keeping it clear of the toolbar — but only
         where the toolbar actually is.

         The toolbar is a centred island: on a 1900px screen it spans about 560
         to 1340, roughly 41% of the width. The clamp treated its top edge as a
         floor across the *whole* width, so a window parked at the far left —
         its right edge 400px clear of the toolbar — still stopped dead level
         with the toolbar's top, with ~120px of completely empty canvas beneath
         it. Two dead strips, one down each side, for an obstacle that isn't
         there. (Pre-existing since v3.0; the big canvas just made the wasted
         space easier to see.)

         So the horizontal clamp is resolved first, and the vertical limits are
         then chosen based on whether the window overlaps the toolbar's column
         at that x. Anything clear of it gets the full viewport. */
      function clampSpot(width, height, x, y, b) {
        const maxX = Math.max(b.left, b.right - width);
        const cx = Math.min(Math.max(b.left, x), maxX);

        let top = b.top;
        let bottom = b.bottom;
        if (b.nav) {
          const clearsToolbar = cx + width <= b.nav.left || cx >= b.nav.right;
          if (clearsToolbar) {
            top = b.openTop;
            bottom = b.openBottom;
          }
        }
        const maxY = Math.max(top, bottom - height);
        return { x: cx, y: Math.min(Math.max(top, y), maxY) };
      }

      function clampToCanvas(width, height, x, y) {
        return clampSpot(width, height, x, y, clampBounds());
      }

      // Position a freshly created window. The first one on an empty canvas is
      // centred; every one after that steps down-right from that same anchor,
      // so the pile reads as a predictable staircase rather than scattering
      // (centring each window on its own size put them all back on top of each
      // other, just slightly offset).
      let cascadeAnchor = null;

      function placeWindow(element, width, height) {
        const b = canvasBounds();
        const openCount = document.querySelectorAll(WINDOW_SELECTOR).length;

        // The anchor is a world coordinate, and on the big canvas the visible
        // slice of the world moves. An anchor left over from before a pan would
        // put the new window somewhere off-screen — you press Note and nothing
        // appears. If it is no longer in view, start the staircase again here.
        if (
          view.on &&
          cascadeAnchor &&
          (cascadeAnchor.x < b.left ||
            cascadeAnchor.y < b.top ||
            cascadeAnchor.x > b.right ||
            cascadeAnchor.y > b.bottom)
        ) {
          cascadeAnchor = null;
        }

        if (openCount === 0 || !cascadeAnchor) {
          cascadeAnchor = {
            x: b.left + Math.max(0, (b.right - b.left - width) / 2),
            y: b.top + Math.max(0, (b.bottom - b.top - height) / 2),
          };
          cascadeIndex = 0;
        } else {
          cascadeIndex++;
        }

        // Before a window would run past the edge of the canvas, restart the
        // staircase from the top-left rather than from slot 0 - slot 0 is
        // where the very first window is still sitting.
        const step = cascadeIndex * CASCADE_STEP;
        if (
          cascadeAnchor.x + step + width > b.right ||
          cascadeAnchor.y + step + height > b.bottom
        ) {
          cascadeAnchor = { x: b.left + 12, y: b.top + 12 };
          cascadeIndex = 0;
        }

        const offset = cascadeIndex * CASCADE_STEP;
        const spot = clampToCanvas(
          width,
          height,
          cascadeAnchor.x + offset,
          cascadeAnchor.y + offset
        );
        element.style.left = `${spot.x}px`;
        element.style.top = `${spot.y}px`;
        element.dataset.x = spot.x;
        element.dataset.y = spot.y;
        return spot;
      }

      // Sessions saved on a large monitor used to restore off-screen on a small
      // one, with no way to drag a window back into view.
      function clampWindowIntoView(element) {
        if (!element || element.style.display === "none") return;
        const spot = clampToCanvas(
          element.offsetWidth,
          element.offsetHeight,
          parseFloat(element.dataset.x) || 0,
          parseFloat(element.dataset.y) || 0
        );
        element.style.left = `${spot.x}px`;
        element.style.top = `${spot.y}px`;
        element.dataset.x = spot.x;
        element.dataset.y = spot.y;
      }

      // Raise + focus. Previously .active was set but never styled, so nothing
      // told the user which note Copy/Paste/Search would act on.
      function wireWindowFocus(element) {
        const raise = () => setActiveWindow(element.id);
        // mousedown, not click: raising on mouseup felt a beat behind the cursor.
        element.addEventListener("mousedown", raise);
        element.addEventListener("focusin", raise);
      }

      // The empty canvas and the minimised-window bar both derive purely from
      // the DOM, so one function keeps them honest after any change.
      function refreshChrome() {
        const all = Array.from(document.querySelectorAll(WINDOW_SELECTOR));
        const emptyState = document.getElementById("empty-state");
        if (emptyState) emptyState.hidden = all.length > 0;
        // Everything that adds, closes, minimises or restores a window already
        // funnels through here, so the minimap gets one hook instead of six.
        if (view.on) scheduleMapWindows();

        const bar = document.getElementById("minimized-bar");
        if (!bar) return;
        const minimized = all.filter((el) => el.style.display === "none");
        bar.innerHTML = "";
        minimized.forEach((el) => {
          const label =
            el.querySelector(
              ".window-title, .task-title, .sticky-note-title, .clock-title, .log-title, .calculator-title, .help-title"
            )?.textContent || el.id;
          const chip = document.createElement("button");
          chip.className = "minimized-chip";
          chip.textContent = label;
          chip.title = `Restore ${label}`;
          chip.addEventListener("click", () => restoreWindow(el.id));
          bar.appendChild(chip);
        });
      }

      function restoreWindow(windowId) {
        const el = document.getElementById(windowId);
        if (!el) return;
        el.style.display = "";
        setActiveWindow(windowId);
        clampWindowIntoView(el);
        refreshChrome();
        saveSession();
      }

      // --- Internal stability helpers (no UI or behavior change) ---
      let _saveTimer = null;
      function debouncedSave(delay = 180) {
        if (_saveTimer) clearTimeout(_saveTimer);
        _saveTimer = setTimeout(() => {
          _saveTimer = null;
          try { saveSession(); } catch (e) { /* swallow */ }
        }, delay);
      }

      // Map of windowId -> ResizeObserver for cleanup
      const _resizeObservers = Object.create(null);

      function registerResizeObserver(windowId, observer) {
        if (_resizeObservers[windowId]) {
          try { _resizeObservers[windowId].disconnect(); } catch (e) {}
        }
        _resizeObservers[windowId] = observer;
      }

      function disconnectResizeObserver(windowId) {
        const obs = _resizeObservers[windowId];
        if (obs) {
          try { obs.disconnect(); } catch (e) {}
          delete _resizeObservers[windowId];
        }
      }

      // How large a window is allowed to grow. The viewport is the right answer
      // only while the viewport *is* the canvas; once the world is three
      // screens across, capping a note at one screen is an arbitrary ceiling on
      // the whole point of the feature.
      function sizingBasis() {
        if (!view.on) {
          return { w: window.innerWidth, h: window.innerHeight };
        }
        const world = computeWorldSize();
        return { w: world.w, h: world.h };
      }

      function setMaxDimensions() {
        const basis = sizingBasis();
        const textareaContainers = document.querySelectorAll(
          ".textarea-container"
        );
        textareaContainers.forEach((container) => {
          const windowElement = container.closest(".window");
          if (windowElement) {
            const headerHeight =
              windowElement.querySelector(".window-header").offsetHeight || 30;
            const paddingAndBorders = 22;
            const buttonsHeight =
              windowElement.querySelector(".format-buttons")?.offsetHeight || 0;
            const countsHeight =
              windowElement.querySelector(".counts")?.offsetHeight || 0;
            const logInputHeight =
              windowElement.querySelector(".note-log-input-container")
                ?.offsetHeight || 0;
            const maxHeight =
              basis.h -
              headerHeight -
              paddingAndBorders -
              buttonsHeight -
              countsHeight -
              logInputHeight -
              20;
            const maxWidth = basis.w - 32 - 20;
            container.style.maxHeight = `${maxHeight}px`;
            container.style.maxWidth = `${Math.min(
              maxWidth,
              basis.w - 50
            )}px`;
            windowElement.style.maxWidth = `${Math.min(
              maxWidth + 32,
              basis.w - 30
            )}px`;
            windowElement.style.maxHeight = `${
              maxHeight +
              headerHeight +
              paddingAndBorders +
              buttonsHeight +
              countsHeight +
              logInputHeight
            }px`;
          }
        });
      }
      function addStickyNote() {

        // counted only sticky notes; the others ignored sticky notes and the
        // calculator entirely), so the "maximum" moved depending on which
        // button you pressed. One selector, one limit.
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }

        windowCount++;
        stickyCount++;
        const stickyLabel = stickyCount > 1 ? `Sticky Note ${stickyCount}` : "Sticky Note";
        const windowId = `sticky-note-${windowCount}`;

        newStickyNote.id = windowId;
        newStickyNote.style.zIndex = nextWindowZ();
        newStickyNote.dataset.width = 412;
        newStickyNote.dataset.height = 431;
        newStickyNote.style.width = "412px";
        newStickyNote.style.height = "431px";
        // These were "50" without a unit, so the declarations were invalid and
        // dropped; the note landed wherever static flow put it.
        placeWindow(newStickyNote, 412, 431);
        // Only seed the swatch inputs from the theme; do NOT write the colours
        // to element.style. Baking them in at creation time froze the note to
        // whichever theme was active when it was made, so switching to light
        // mode left dark text on a still-dark note (1.2:1). Left unset, the
        // CSS --sticky-bg / --sticky-text tokens follow the theme, and an
        // explicit user pick still overrides them via the change handlers.
        const computedStyles = getComputedStyle(document.body);
        const defaultBgColor =
          computedStyles.getPropertyValue("--sticky-bg").trim() || "#2b2718";
        const defaultTextColor =
          computedStyles.getPropertyValue("--sticky-text").trim() || "#f6ecd2";

        newStickyNote.innerHTML = `
    <div class="sticky-note-header">

    </div>

            <button class="sticky-reset-colors" onclick="resetStickyColors('${windowId}')" title="Reset colours to follow the theme" aria-label="Reset sticky note colours to follow the theme">Reset</button>

    </div>

        windowsContainer.appendChild(newStickyNote);

        wireWindowFocus(newStickyNote);
        setActiveWindow(windowId);
        refreshChrome();
        const resizeObserver = new ResizeObserver(() => {
          newStickyNote.dataset.width = newStickyNote.offsetWidth;
          newStickyNote.dataset.height = newStickyNote.offsetHeight;
          // style.left, not getBoundingClientRect().left: the rect is the
          // *transformed* box, so on a zoomed canvas every resize would write a
          // screen coordinate back into a world-coordinate field and walk the
          // note across the canvas. Resizing does not move a window anyway.
          newStickyNote.dataset.x = parseFloat(newStickyNote.style.left) || 0;
          newStickyNote.dataset.y = parseFloat(newStickyNote.style.top) || 0;
