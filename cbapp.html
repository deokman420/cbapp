    <!-- CB App v3.0.1 — 2026-07-28. See CHANGELOG.md for release history. -->
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
        overflow: hidden;
        transition: background 0.5s ease;
      }
      .light-mode {
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        color: #000;
      }
      .dark-mode {
        background: linear-gradient(135deg, #2c3e50, #1a252f);
        color: #ccc;
      }
      .whiteboard {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .window,
      .calculator,
      .task-window,
      .clock-window,
      .log-window,
      .help-window {
        position: absolute;
        min-width: 350px;
        min-height: 150px;
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        transition: opacity 0.3s ease;
        transform: translate(0, 0);
      }
      .window.dragging,
      .calculator.dragging,
      .task-window.dragging,
      .clock-window.dragging,
      .log-window.dragging {
        opacity: 0.8;
      }
      /* The `.dark-mode X` legacy rules that used to live here outranked the
         token-based system further down purely on specificity (0,0,2,0 beats
         0,0,1,0), so windows were still painting rgba(0,0,0,0.3) over a
         rgba(200,200,200,0.3) border instead of --bg-card / --border. The
         tokens already cover both themes; the overrides only defeated them. */
      /* Legacy controls flex rule removed - now in modern section near header styles */
      /* Legacy close button colors removed - now using modern muted/accent variables */
      .window-content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .textarea-container {
        position: relative;
        display: flex;
        border: 1px solid;
        border-radius: 5px;
        overflow: hidden;
        transition: border-color 0.5s ease;
        resize: both;
        min-width: 350px;
        min-height: 200px;
        width: 350px;
      }
      .line-numbers {
        width: 30px;
        background: rgba(200, 200, 200, 0.5);
        color: #333;
        text-align: right;
        padding: 5px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.5;
        user-select: none;
        border-right: 1px solid #ccc;
        transition: background 0.5s ease;
      }
      textarea {
        flex: 1;
        min-height: 100px;
        min-width: 150px;
        padding: 5px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.5;
        border: none;
        resize: none;
        outline: none;
        background: transparent;
        transition: color 0.5s ease;
        overflow: auto;
      }
      textarea[readonly] {
        background: rgba(0, 0, 0, 0.1);
      }
      .note-log-input-container {
        display: flex;
        gap: 5px;
      }
      .note-log-input {
        flex: 1;
        padding: 5px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
      }
      .note-log-button {
        padding: 5px 10px;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
        background: rgba(255, 165, 0, 0.5);
        transition: background 0.3s ease;
      }
      .note-log-button:hover {
        background: rgba(255, 165, 0, 0.7);
      }
      .format-buttons {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
      }
      /* Note/T2 only: a divider line separating the log-input row from the
         action buttons. Scoped to .window so the clock/task rows are untouched;
         using border-top (not a separate <hr>) keeps the height inside
         .format-buttons.offsetHeight so updateWindowSize stays accurate. */
      .window .format-buttons {
        border-top: 1px solid var(--border);
        padding-top: 8px;
        margin-top: 2px;
      }
      .counts {
        font-size: 12px;
      }
      .calculator-content,
      .clock-content,
      .log-content {
        padding: 10px;
      }
      .calculator-input,
      .calculator-display,
      .log-input {
        width: 100%;
        padding: 10px;
        font-size: 18px;
        text-align: left;
        border: none;
        background: rgba(255, 255, 255, 0.3);
        color: #000;
        border-radius: 5px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      .calculator-display {
        background: rgba(255, 255, 255, 0.4);
        text-align: right;
      }
      .calculator-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
      .calculator-buttons button,
      .log-input-container button {
        padding: 15px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      .calculator-buttons .number {
        background: rgba(200, 200, 200, 0.5);
      }
      .calculator-buttons .operation,
      .log-input-container button {
        background: rgba(255, 165, 0, 0.5);
      }
      .calculator-buttons .operation:hover,
      .log-input-container button:hover {
        background: rgba(255, 165, 0, 0.7);
      }
      .calculator-buttons .special {
        background: rgba(255, 0, 0, 0.5);
      }
      .calculator-buttons .special:hover {
        background: rgba(255, 0, 0, 0.7);
      }
      /* Legacy .calculator-history / .log-list background rules removed - unified in modern phbeks section */
      .nav-menu {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 8px 15px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        transition: all 0.3s ease;
        width: max-content;
        max-width: none;
        flex-wrap: nowrap;
      }

      .nav-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .nav-menu.collapsed {
        width: 40px;
        padding: 8px;
      }
      .nav-menu button,
      .nav-menu a {
        position: relative;
        padding: 0 14px;
        height: 36px;
        font-size: 12px;
        border-radius: 8px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 5px;
        text-decoration: none;
        color: #fff;
        white-space: nowrap;
      }

      .nav-menu .nav-sticky {
        min-width: 140px;
        padding: 0 18px;
      }
      /* Legacy #theme-toggle / #log-toggle colour overrides removed: they
         outranked the unified nav-button styling further down and left LOG
         rendering blue and THEME grey while every sibling was card-coloured. */
      .nav-menu button.active {
        background: #28a745;
      }
      .nav-menu button.active:hover {
        background: #218838;
      }
      .nav-menu button::after,
      .nav-menu a::after {
        display: none;
      }

      #nav-tooltip {
        position: fixed;
        background: rgba(12, 15, 22, 0.92);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.2;
        min-height: 24px;
        min-width: 120px;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 3000;
      }

      #nav-tooltip.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .nav-menu button:hover::after,
      .nav-menu a:hover::after {
        opacity: 1;
      }
      .nav-group {
        display: flex;
        gap: 5px;
        padding: 0 10px;
        border-right: 1px solid rgba(255, 255, 255, 0.2);
      }
      .nav-group:last-child {
        border-right: none;
      }
      .nav-toggle {
        display: none;
        font-size: 18px;
        padding: 5px 10px;
      }
      .nav-menu.collapsed .nav-group,
      .nav-menu.collapsed button:not(.nav-toggle),
      .nav-menu.collapsed a {
        display: none;
      }
      .nav-menu.collapsed .nav-toggle {
        display: block;
      }
      @media (max-width: 600px) {
        .nav-menu {
          top: 5px;
          bottom: auto;
          padding: 5px;
        }
        .nav-menu button,
        .nav-menu a {
          padding: 6px 10px;
          font-size: 11px;
        }
      }
      #status {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        padding: 5px 10px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border-radius: 5px;
        display: none;
        z-index: 2000;
      }
      #search-replace {
        margin-top: 5px;
        display: none;
      }
      #search-replace.active {
        display: block;
      }
      .task-content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .task-input-container {
        display: flex;
        gap: 5px;
      }
      .task-input {
        flex: 1;
        padding: 5px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
      }
      /* Legacy .task-list border/background removed - now handled by modern unified rule */
      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
        font-size: 14px;
      }
      .task-item.completed {
        text-decoration: line-through;
        color: #888;
      }
      .task-item input[type="checkbox"] {
        cursor: pointer;
      }
      .color-palette {
        display: flex;
        gap: 5px;
        margin-top: 5px;
      }
      .color-swatch {
        width: 20px;
        height: 20px;
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid #ccc;
      }
      .color-swatch:hover {
        transform: scale(1.1);
      }
      .clock-content {
        padding: 10px;
        text-align: center;
        font-family: monospace;
      }
      .clock-time {
        font-size: 24px;
        margin-bottom: 5px;
      }
      .clock-date {
        font-size: 14px;
      }
      .log-content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .log-input-container {
        display: flex;
        gap: 5px;
      }
      .log-item {
        padding: 5px;
        font-size: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .log-item:last-child {
        border-bottom: none;
      }
      .log-item span {
        font-family: monospace;
      }

      .help-content {
        padding: 12px;
        height: calc(100% - 34px);
        overflow: auto;
      }

      /* Help window now inherits the unified scrollbar styles above */

      .help-text {
        margin: 0;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      /* Legacy #log-toggle skin removed - it is a nav button like any other and
         is styled by the unified nav rules (and .active) further down. */

      /* The drawing window was removed: its nav button has been commented out
         for a long time, so the styles and ~120 lines of canvas code behind it
         were unreachable. */

      .sticky-note-window {
        position: absolute;
        background: #ffff88;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        resize: both;
        transition: background 0.3s ease, box-shadow 0.3s ease;
      }


      .sticky-note-header {
        background: rgba(200, 200, 200, 0.5);
        padding: 5px 10px;
        cursor: default;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }


      .sticky-note-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 10px;
        background: rgba(240, 240, 240, 0.9);
        border-bottom: 1px solid #ccc;
      }


      .sticky-note-content {
        width: 100%;
        height: calc(100% - 60px);
        padding: 10px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        border: none;
        outline: none;
        resize: none;
        background: transparent;
        color: #000;
      }

      .task-window {
        resize: both;
        overflow: hidden;
      }

      /* Duplicate legacy .task-list styles removed - modern unified rule at ~1217 handles consistency */
      .countdown-timer-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 15px;
        gap: 8px;
      }
      .countdown-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .countdown-display {
        font-family: monospace;
        font-size: 20px;
        margin-top: 5px;
      }
      .clear-note-container {
        position: absolute;
        left: 18px;
        bottom: 18px;
        z-index: 10;
      }
      .clear-note-button {
        padding: 2px 2px;
        font-size: 8px;
        border-radius: 2px;
        background: #f55;
        color: #fff;
        border: 1px solid #f55;
        cursor: pointer;
        box-shadow: none;
        transition: background 0.2s;
      }
      .clear-note-button--mini {
        height: 16px;
        padding: 0 6px;
        font-size: 8px;
        line-height: 1;
        align-self: center;
        background: #f55;
        color: #fff;
        border: 1px solid #f55;
        box-shadow: none;
      }
      .clear-note-button:hover {
        background: #d22;
        border-color: #d22;
      }
      .note-dropdown {
        display: none;
        position: absolute;
        left: 0;
        bottom: calc(100% + 28px);
        min-width: 180px;
        background: #fff;
        color: #222;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        z-index: 2000;
        padding: 5px 0;
      }
      .note-dropdown .note-dropdown-item {
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
      }
      .nav-tooltip-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.8;
      }
      .nav-tooltip-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
      }
      .nav-tooltip-link,
      .nav-tooltip-empty {
        background: transparent;
        border: 0;
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        text-align: left;
        padding: 0;
        cursor: pointer;
      }
      .nav-tooltip-link:hover {
        color: var(--accent);
      }
      .note-dropdown .note-dropdown-item:hover {
        background: #007bff;
        color: #fff;
      }
      .nav-group {
        position: relative; /* Needed for dropdown positioning */
      }
      /* Legacy minimize-window hard-coded colors removed - now controlled by modern .minimize-window rule using variables */
      .sticky-dropdown {
        display: none;
        position: absolute;
        left: 0;
        bottom: calc(100% + 28px);
        min-width: 180px;
        background: #fff;
        color: #222;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        z-index: 2000;
        padding: 5px 0;
      }
      .sticky-dropdown .note-dropdown-item {
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
      }
      .sticky-dropdown .note-dropdown-item:hover {
        background: #007bff;
        color: #fff;
      }
      .nav-btn-dropdown {
        position: relative;
        display: inline-block;
      }
      .lock-window,
      .sticky-lock-window {
        color: #fa0;
        font-size: 12px;
        cursor: pointer;
        transition: color 0.2s;
      }

      .lock-window:hover,
      .sticky-lock-window:hover {
        color: #c80;
      }

      .lock-window.locked,
      .sticky-lock-window.locked {
        color: #f50;
      }

      /* Phbeks.com visual system overrides */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #0c0f16;
        --bg-card: #141820;
        --bg-card-hover: #1a1f2b;
        --border: #1e2530;
        --accent: #00d4aa;
        --accent-dim: rgba(0, 212, 170, 0.12);
        --blue: #3b82f6;
        --purple: #a855f7;
        --orange: #f59e0b;
        /* #ef4444 measured 4.02:1 on the dark card - the destructive controls
           are the last place to be borderline. */
        --danger: #f87171;
        --danger-solid: #dc2626;
        --text: #e2e8f0;
        --text-dim: #8492a6;
        --text-muted: #4a5568;
        --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", "Consolas", monospace;
        /* A sticky note defaulted to --bg-card, making it pixel-identical to
           every other window - the one window type whose whole point is that
           you can pick it out at a glance. Warm, solid, high-contrast. */
        --sticky-bg: #2b2718;
        --sticky-text: #f6ecd2;
      }

      .light-mode {
        --bg: #f4f6fb;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --border: #d7dee8;
        /* #0ea5a3 measured ~2.9:1 as text on the light card - it is a fine
           border/glow colour but fails AA for the many places --accent is used
           as a foreground (active titles, links, operator keys). */
        --accent: #115e59;
        --accent-dim: rgba(17, 94, 89, 0.13);
        --danger: #a01818;
        --danger-solid: #b91c1c;
        --blue: #2563eb;
        --purple: #7c3aed;
        --orange: #f59e0b;
        --text: #0f172a;
        --text-dim: #475569;
        --text-muted: #64748b;
        --sticky-bg: #fff6c9;
        --sticky-text: #3b3210;
      }

      body,
      .light-mode,
      .dark-mode {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      .window,
      .calculator,
      .task-window,
      .clock-window,
      .log-window,
      .sticky-note-window {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        color: var(--text);
      }

      .window:hover,
      .calculator:hover,
      .task-window:hover,
      .clock-window:hover,
      .log-window:hover,
      .sticky-note-window:hover {
        border-color: var(--accent);
      }

      .window-header,
      .calculator-header,
      .task-header,
      .clock-header,
      .log-header,
      .help-header,
      .sticky-note-header {
        background: var(--bg-card-hover);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .window-controls,
      .calculator-controls,
      .task-controls,
      .clock-controls,
      .log-controls,
      .sticky-note-controls {
        display: flex;
        gap: 5px;
      }

      .window-title,
      .calculator-title,
      .task-title,
      .clock-title,
      .log-title,
      .help-title,
      .sticky-note-title {
        font-weight: 600;
        letter-spacing: 0.04em;
        font-size: 12px;
        text-transform: uppercase;
      }

      .textarea-container {
        border-color: var(--border);
        background: var(--bg-card);
        border-radius: 12px;
      }

      .line-numbers {
        background: var(--bg-card-hover);
        border-right-color: var(--border);
        /* --text-muted measured 2.19:1 dark / 3.46:1 light against the gutter;
           these are numbers people actually read. */
        color: var(--text-dim);
        font-family: var(--mono);
      }

      textarea,
      .sticky-note-content {
        color: var(--text);
        font-family: var(--mono);
      }

      textarea[readonly] {
        background: rgba(0, 0, 0, 0.2);
      }

      .note-log-input,
      .task-input,
      .calculator-input,
      .calculator-display,
      .log-input,
      #search-replace input {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
      }

      .calculator-display {
        background: var(--bg-card-hover);
      }

        text-transform: none;
        font-size: 0.7rem;

      /* White on #ef4444 is 3.3:1; --danger-solid clears AA in both themes. */
      .clear-note-button,

        color: #fff;
        border-color: var(--danger-solid);

      .clear-note-button:hover,
      .clear-note-button.clear-note-button--mini:hover {

        border-color: #991b1b;

      /* Was a hard-coded dark-theme teal wash, which read as a stray blue tint
         against the light palette. */
      .nav-menu button.active,
      #log-toggle.active {

        color: var(--accent);
        border-color: var(--accent);
      }

      .nav-menu button::after,
      .nav-menu a::after {

      #status {
        background: var(--bg-card);
        border: 1px solid var(--border);

        font-family: var(--mono);

      .note-dropdown,
      .sticky-dropdown {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 12px;
      }

      .note-dropdown .note-dropdown-item:hover,
      .sticky-dropdown .note-dropdown-item:hover {
        background: var(--accent-dim);
        color: var(--accent);
      }


      .sticky-note-window {
        background: var(--sticky-bg);
        border-color: var(--border);
      }

      /* The header and toolbar are translucent washes rather than fixed
         colours, so they stay legible against whatever background colour the
         user picks in the swatch, not just the default. */
      .sticky-note-header,
      .sticky-note-toolbar {
        background: rgba(0, 0, 0, 0.16);
        border-bottom-color: rgba(0, 0, 0, 0.18);
        color: inherit;
      }

      .dark-mode .sticky-note-header,
      .dark-mode .sticky-note-toolbar {
        background: rgba(255, 255, 255, 0.07);
        border-bottom-color: rgba(255, 255, 255, 0.12);
      }

      /* Only the note itself carries a colour; everything inside inherits it.
         Giving the label and textarea their own `color` declarations meant an
         inline colour set on the note could never reach them (inheritance
         loses to a matching rule), so a custom text colour left the toolbar
         and title on the theme token — unreadable on a custom background. */
      .sticky-note-window {
        color: var(--sticky-text);
      }

      .sticky-note-toolbar label,
      .sticky-note-window .sticky-note-content,
      .sticky-note-window .sticky-note-title {
        color: inherit;
      }

      /* The active-window accent is skipped on a recoloured note — teal on an
         arbitrary user background is a contrast gamble the ring already covers. */
      .sticky-note-window[data-custom-color="true"].active > * > .sticky-note-title {
        color: inherit;
      }

      .sticky-note-window .edit-window,
      .sticky-note-window .minimize-window,
      .sticky-note-window .close-sticky-note,
      .sticky-note-window .sticky-lock-window {
        color: inherit;
        opacity: 0.85;
      }

      .sticky-note-window .edit-window:hover,
      .sticky-note-window .minimize-window:hover,
      .sticky-note-window .close-sticky-note:hover,
      .sticky-note-window .sticky-lock-window:hover {
        opacity: 1;
      }

      /* Locked stays legible but unmistakable against the note's own colours. */
      .sticky-note-window .sticky-lock-window.locked {
        color: #b91c1c;
        opacity: 1;
      }

      .dark-mode .sticky-note-window .sticky-lock-window.locked {
        color: #fca5a5;
      }

      /* The two swatch labels rendered at default body size, so a colour
         picker nobody uses twice a session dominated the note. */
      .sticky-note-toolbar {
        gap: 8px;
        padding: 6px 12px;
        font-size: 11px;
      }

      .sticky-note-toolbar label {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.9;
      }

      .sticky-note-toolbar input[type="color"] {
        width: 28px;
        height: 20px;
        padding: 0 2px;
        cursor: pointer;
      }

      /* Copy is the common action, so it sits first. Reset is the escape hatch:
         a note recoloured dark then viewed in light mode (or vice versa) would
         otherwise be unreadable with no way back. Both inherit currentColor so
         they stay legible against a custom note background. */
      .sticky-toolbar-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .sticky-note-toolbar .sticky-copy,
      .sticky-note-toolbar .sticky-reset-colors {
        background: transparent;
        border: 1px solid currentColor;
        color: inherit;
        /* 0.7 measured 3.94:1 in light mode */
        opacity: 0.88;
        font-size: 9px;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 999px;
      }

      .sticky-note-toolbar .sticky-copy:hover,
      .sticky-note-toolbar .sticky-reset-colors:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.12);
        color: inherit;
        border-color: currentColor;
        transform: none;
        box-shadow: none;
      }

      .dark-mode .sticky-note-toolbar .sticky-copy:hover,
      .dark-mode .sticky-note-toolbar .sticky-reset-colors:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .sticky-note-toolbar input[type="color"],
      .clock-window input[type="number"],
      .clock-window select {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 4px 6px;
        font-family: var(--mono);
      }

      .dark-mode .sticky-note-toolbar input[type="color"] {
        background: #0f131a;
      }

      .light-mode .sticky-note-toolbar input[type="color"] {
        background: #ffffff;
      }

      .window-content {

        padding-bottom: 32px;
      }

      .clear-note-container {

        margin-top: 8px;
        align-self: flex-start;
      }

      .clock-window {

        flex-direction: column;
      }

      .clock-content {
        flex: 1;
        overflow: auto;

      .clock-content > * {

      }

      .clock-content > *:last-child {

      }

      .clock-content .timezone-times {

      .clock-content .format-buttons {

      .clock-content .countdown-controls {

      .clock-content .countdown-controls input[type="number"],

      }

      .countdown-timer-container {
        padding: 0 20px 16px;
      }

      /* Unified custom scrollbar styling - clock is the reference */
      .clock-content,
      .help-content,
      textarea,
      .t2-textarea,
      .sticky-note-content,
      .task-list,
      .log-list,
      .calculator-history,
      .t2-window .textarea-container,
      .nav-tooltip-list {
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 212, 170, 0.6) rgba(20, 24, 32, 0.7);
      }

      .clock-content::-webkit-scrollbar,
      .help-content::-webkit-scrollbar,
      textarea::-webkit-scrollbar,
      .t2-textarea::-webkit-scrollbar,
      .sticky-note-content::-webkit-scrollbar,
      .task-list::-webkit-scrollbar,
      .log-list::-webkit-scrollbar,
      .calculator-history::-webkit-scrollbar,
      .t2-window .textarea-container::-webkit-scrollbar,
      .nav-tooltip-list::-webkit-scrollbar {
        width: 10px;
      }

      .clock-content::-webkit-scrollbar-track,
      .help-content::-webkit-scrollbar-track,
      textarea::-webkit-scrollbar-track,
      .t2-textarea::-webkit-scrollbar-track,
      .sticky-note-content::-webkit-scrollbar-track,
      .task-list::-webkit-scrollbar-track,
      .log-list::-webkit-scrollbar-track,
      .calculator-history::-webkit-scrollbar-track,
      .t2-window .textarea-container::-webkit-scrollbar-track,
      .nav-tooltip-list::-webkit-scrollbar-track {
        background: rgba(20, 24, 32, 0.7);
        border-radius: 10px;
      }

      .clock-content::-webkit-scrollbar-thumb,
      .help-content::-webkit-scrollbar-thumb,
      textarea::-webkit-scrollbar-thumb,
      .t2-textarea::-webkit-scrollbar-thumb,
      .sticky-note-content::-webkit-scrollbar-thumb,
      .task-list::-webkit-scrollbar-thumb,
      .log-list::-webkit-scrollbar-thumb,
      .calculator-history::-webkit-scrollbar-thumb,
      .t2-window .textarea-container::-webkit-scrollbar-thumb,
      .nav-tooltip-list::-webkit-scrollbar-thumb {
        background: rgba(0, 212, 170, 0.6);
        border-radius: 10px;
        border: 2px solid rgba(20, 24, 32, 0.8);
      }

      .clock-content::-webkit-scrollbar-thumb:hover,
      .help-content::-webkit-scrollbar-thumb:hover,
      textarea::-webkit-scrollbar-thumb:hover,
      .t2-textarea::-webkit-scrollbar-thumb:hover,
      .sticky-note-content::-webkit-scrollbar-thumb:hover,
      .task-list::-webkit-scrollbar-thumb:hover,
      .log-list::-webkit-scrollbar-thumb:hover,
      .calculator-history::-webkit-scrollbar-thumb:hover,
      .t2-window .textarea-container::-webkit-scrollbar-thumb:hover,
      .nav-tooltip-list::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 212, 170, 0.8);
      }

      .light-mode .clock-content,
      .light-mode .help-content,
      .light-mode textarea,
      .light-mode .t2-textarea,
      .light-mode .sticky-note-content,
      .light-mode .task-list,
      .light-mode .log-list,
      .light-mode .calculator-history,

      .light-mode .nav-tooltip-list {
        scrollbar-color: rgba(14, 165, 163, 0.6) rgba(226, 232, 240, 0.9);
      }

      .light-mode .clock-content::-webkit-scrollbar-track,
      .light-mode .help-content::-webkit-scrollbar-track,
      .light-mode textarea::-webkit-scrollbar-track,
      .light-mode .t2-textarea::-webkit-scrollbar-track,
      .light-mode .sticky-note-content::-webkit-scrollbar-track,
      .light-mode .task-list::-webkit-scrollbar-track,
      .light-mode .log-list::-webkit-scrollbar-track,
      .light-mode .calculator-history::-webkit-scrollbar-track,
      .light-mode .t2-window .textarea-container::-webkit-scrollbar-track,
      .light-mode .nav-tooltip-list::-webkit-scrollbar-track {
        background: rgba(226, 232, 240, 0.9);
      }

      .light-mode .clock-content::-webkit-scrollbar-thumb,
      .light-mode .help-content::-webkit-scrollbar-thumb,
      .light-mode textarea::-webkit-scrollbar-thumb,
      .light-mode .t2-textarea::-webkit-scrollbar-thumb,
      .light-mode .sticky-note-content::-webkit-scrollbar-thumb,
      .light-mode .task-list::-webkit-scrollbar-thumb,
      .light-mode .log-list::-webkit-scrollbar-thumb,
      .light-mode .calculator-history::-webkit-scrollbar-thumb,
      .light-mode .t2-window .textarea-container::-webkit-scrollbar-thumb,
      .light-mode .nav-tooltip-list::-webkit-scrollbar-thumb {
        background: rgba(14, 165, 163, 0.6);
        border: 2px solid rgba(226, 232, 240, 0.9);
      }

      .light-mode .clock-content::-webkit-scrollbar-thumb:hover,
      .light-mode .help-content::-webkit-scrollbar-thumb:hover,
      .light-mode textarea::-webkit-scrollbar-thumb:hover,
      .light-mode .t2-textarea::-webkit-scrollbar-thumb:hover,
      .light-mode .sticky-note-content::-webkit-scrollbar-thumb:hover,
      .light-mode .task-list::-webkit-scrollbar-thumb:hover,
      .light-mode .log-list::-webkit-scrollbar-thumb:hover,
      .light-mode .calculator-history::-webkit-scrollbar-thumb:hover,
      .light-mode .t2-window .textarea-container::-webkit-scrollbar-thumb:hover,
      .light-mode .nav-tooltip-list::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 163, 0.85);
      }

      .task-list:empty {
        border-color: transparent;
        background: transparent;
        padding: 0;
      }

      .calculator-history:empty {
        border-color: transparent;
        background: transparent;
        padding: 0;
      }

      .minimize-window:hover,
      .edit-window:hover,
      .close-window:hover,
      .close-calculator:hover,
      .close-task:hover,
      .close-clock:hover,
      .close-log:hover {
        color: var(--accent);
      }

      .minimize-window,
      .edit-window,
      .close-window,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log {
        color: var(--text-muted);
      }

      /* The close glyph is a thin text "×" that reads smaller than its emoji
         siblings; nudge it up so it's an easier hit target without dominating. */
      .close-window,
      .close-sticky-note,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log {
        font-size: 19px;
        line-height: 1;
      }

      /* These header control glyphs are text nodes, so the default `cursor: auto`
         resolves to the text I-beam on hover. Force the normal arrow instead. */
      .edit-window,
      .minimize-window,
      .close-window,
      .close-sticky-note,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log {
        cursor: default;
      }

      .lock-window,
      .sticky-lock-window {
        color: var(--orange);
      }

      .lock-window.locked,
      .sticky-lock-window.locked {
        color: var(--danger);
      }

      .clock-content,
      .log-item span,
      .countdown-display {
        font-family: var(--mono);
      }

      .help-window {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        color: var(--text);
      }

      .help-header {
        background: var(--bg-card-hover);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        padding: 8px 12px;
      }

      .help-content {
        background: var(--bg-card);
        color: var(--text);
      }

      .help-text {
        color: var(--text-dim);
      }

      /* ==========================================================
         UX pass — everything below intentionally sits last so it
         wins on cascade order over the legacy rules above.
         ========================================================== */

      /* --- Focus: which window do Copy/Paste/Search act on? ---
         setActiveWindow() has always set .active, but nothing ever drew it.
         Hover is demoted to a neutral tint so it stops impersonating focus. */
      .window:hover,
      .calculator:hover,
      .task-window:hover,
      .clock-window:hover,
      .log-window:hover,
      .sticky-note-window:hover,
      .help-window:hover {
        border-color: var(--text-muted);
      }

      .window.active,
      .calculator.active,
      .task-window.active,
      .clock-window.active,
      .log-window.active,
      .sticky-note-window.active,
      .help-window.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent), 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .active > .window-header,
      .active > .calculator-header,
      .active > .task-header,
      .active > .clock-header,
      .active > .log-header,
      .active > .help-header,
      .active > .sticky-note-header {
        background: var(--accent-dim);
      }

      .active > * > .window-title,
      .active > * > .calculator-title,
      .active > * > .task-title,
      .active > * > .clock-title,
      .active > * > .log-title,
      .active > * > .help-title,
      .active > * > .sticky-note-title,
      .active > .window-header > .window-title {
        color: var(--accent);
      }

      /* --- Keyboard accessibility: nothing had a focus ring at all. --- */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* --- Header control glyphs ---
         --text-muted on --bg-card is ~2.4:1, well under WCAG AA, and the
         glyphs are buttons so they need a pointer, not the default arrow. */
      .minimize-window,
      .edit-window,
      .close-window,
      .close-sticky-note,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log,
      .lock-window,
      .sticky-lock-window {
        color: var(--text-dim);
        cursor: pointer;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        transition: color 0.15s ease, background 0.15s ease;
      }

      .minimize-window:hover,
      .edit-window:hover,
      .close-window:hover,
      .close-sticky-note:hover,
      .close-calculator:hover,
      .close-task:hover,
      .close-clock:hover,
      .close-log:hover {
        color: var(--accent);
        background: var(--accent-dim);
      }

      .close-window:hover,
      .close-sticky-note:hover,
      .close-calculator:hover,
      .close-task:hover,
      .close-clock:hover,
      .close-log:hover {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 16%, transparent);
      }

      /* --- Nav bar --- */
      /* The ☰ collapse control is a small-screen affordance. A later
         `display: inline-flex` on all buttons was un-hiding it on desktop,
         where clicking it collapsed the whole toolbar into a 40px pill. */
      .nav-menu .nav-toggle {
        display: none;
      }

      .nav-menu.collapsed .nav-toggle {
        display: inline-flex;
      }

      /* The tooltip hard-coded a near-black panel but took its text colour from
         --text, which in light mode is also near-black - unreadable. Both now
         come from the theme. */
      #nav-tooltip {
        max-width: min(320px, calc(100vw - 24px));
        white-space: normal;
        overflow-wrap: anywhere;
        background: var(--bg-card);
        color: var(--text);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      .light-mode #nav-tooltip {
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
      }

      /* A locked note's readonly wash was a flat rgba(0,0,0,0.2) regardless of
         theme, which turned light-mode notes muddy grey. */
      textarea[readonly],
      .sticky-note-content[readonly] {
        background: var(--bg-card-hover);
        cursor: not-allowed;
      }

      .nav-tooltip-list {
        max-height: 210px;
        overflow-y: auto;
      }

      /* --- Status toast ---
         Was `bottom: 50px`, i.e. directly behind the bottom-centre nav menu,
         so every status message was invisible. Anchored opposite the nav. */
      #status {
        top: 18px;
        bottom: auto;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        z-index: 2500;
        margin: 0;
        pointer-events: none;
      }

      #status.showing {
        animation: status-in 0.18s ease-out;
      }

      /* The search panel occupies the same top-centre slot; drop the toast
         below it rather than letting the two stack on top of each other. */
      #search-replace.active ~ #status {
        top: 76px;
      }

      @keyframes status-in {
        from {
          opacity: 0;
          transform: translate(-50%, -8px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #status.showing {
          animation: none;
        }
        * {
          transition-duration: 0.01ms !important;
        }
      }

      /* --- Notes ---
         .window-content reserved 32px for a .clear-note-container that no
         longer lives there (Clear moved into .format-buttons), leaving a dead
         gap under every note. */
      .window-content {
        padding-bottom: 10px;
      }

      /* --- Sticky notes ---
         Content was calc(100% - 60px) against a ~33px header plus a ~40px
         toolbar, so the textarea overflowed past the bottom of the note.
         Flex layout removes the hard-coded arithmetic entirely. */
      .sticky-note-window {
        display: flex;
        flex-direction: column;
      }

      .sticky-note-header,
      .sticky-note-toolbar {
        flex: 0 0 auto;
      }

      .sticky-note-content {
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
      }

      /* --- Task list --- */
      .task-window {
        display: flex;
        flex-direction: column;
      }

      .task-content {
        flex: 1 1 auto;
        min-height: 0;
      }

      .task-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
      }

      /* An empty task list read as a large unexplained void with a red
         destructive button floating in the middle of it. */
      .task-list:empty::before {
        content: "No tasks yet — add one above.";
        display: block;
        padding: 18px 6px;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }

      .task-list:empty {
        border-color: var(--border);
        background: var(--bg-card);
      }

      .task-item {
        border-radius: 6px;
        gap: 8px;
      }

      .task-item:hover {
        background: var(--bg-card-hover);
      }

      .task-item span {
        flex: 1;
        overflow-wrap: anywhere;
      }

      .task-item .task-delete {
        opacity: 0;
        color: var(--text-muted);
        background: transparent;
        border: 0;
        padding: 2px 6px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: opacity 0.15s ease, color 0.15s ease;
      }

      .task-item:hover .task-delete,
      .task-delete:focus-visible {
        opacity: 1;
      }

      .task-item .task-delete:hover {
        color: var(--danger);
      }

      .task-window .format-buttons {
        justify-content: flex-end;
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }

      /* --- Touch dragging ---
         Without touch-action:none the browser claims the gesture for panning
         and never delivers pointermove, so a title bar can be pressed but not
         dragged. Scoped to the title bars so content still scrolls normally. */
      .window-header,
      .task-header,
      .clock-header,
      .log-header,
      .calculator-header,
      .help-header,
      .sticky-note-header {
        touch-action: none;
        cursor: grab;
        user-select: none;
      }

      .dragging > .window-header,
      .dragging > .task-header,
      .dragging > .clock-header,
      .dragging > .log-header,
      .dragging > .calculator-header,
      .dragging > .help-header,
      .dragging > .sticky-note-header {
        cursor: grabbing;
      }

      [data-locked="true"] > .window-header,
      [data-locked="true"] > .task-header,
      [data-locked="true"] > .clock-header,
      [data-locked="true"] > .log-header,
      [data-locked="true"] > .calculator-header,
      [data-locked="true"] > .help-header,
      [data-locked="true"] > .sticky-note-header {
        cursor: default;
      }

      /* Native resize corners are effectively unusable with a finger. */
      @media (pointer: coarse) {
        .window,
        .task-window,
        .clock-window,
        .log-window,
        .calculator,
        .sticky-note-window,
        .help-window {
          resize: none;
        }
      }

      /* --- Locked windows ---
         Locking now disables the controls inside any window type, so they need
         to read as unavailable rather than merely unresponsive. */
      button:disabled,
      input:disabled,
      select:disabled,
      textarea:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button:disabled:hover,
      .format-buttons button:disabled:hover,
      .calculator-buttons button:disabled:hover,
      .note-log-button:disabled:hover,
      .clear-note-button:disabled:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--border);
        color: inherit;
        background: inherit;
      }

      [data-locked="true"] .task-item:hover {
        background: transparent;
      }

      [data-locked="true"] .task-delete {
        display: none;
      }

      /* --- Calculator ---
         .calculator-buttons .number (0,0,2,0) outranked the shared button
         styling, so the digit keys stayed a flat light grey in dark mode while
         every other control was themed. */
      .calculator-buttons .number {
        background: var(--bg-card-hover);
        color: var(--text);
        border-color: var(--border);
      }

      .calculator-buttons .number:hover {
        background: var(--bg-card);
        border-color: var(--accent);
        color: var(--accent);
      }

      /* --- Clock ---
         The countdown row was bare " m" / " s" text nodes next to fixed-width
         inputs, which sat at different baselines and read as noise. */
      .countdown-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .countdown-field input[type="number"] {
        width: 62px;
        text-align: center;
      }

      .countdown-field span {
        font-family: var(--mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }

      .countdown-controls {
        flex-wrap: wrap;
        justify-content: center;
      }

      /* The countdown block is fixed-height chrome at the foot of the clock;
         only the scrolling region above it should absorb spare space. */
      .countdown-timer-container {
        flex: 0 0 auto;
      }

      /* --- Log --- */
      .log-window {
        display: flex;
        flex-direction: column;
      }

      .log-content {
        flex: 1 1 auto;
        min-height: 0;
      }

      .log-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
      }

      .log-list:empty::before {
        content: "No entries yet — log something above.";
        display: block;
        padding: 18px 6px;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }

      .log-item {
        display: flex;
        align-items: baseline;
        gap: 6px;
        border-radius: 6px;
      }

      .log-item:hover {
        background: var(--bg-card-hover);
      }

      .log-item .description {
        flex: 1;
        overflow-wrap: anywhere;
      }

      .log-item .timestamp {
        color: var(--text-dim);
        white-space: nowrap;
      }

      .log-delete {
        opacity: 0;
        color: var(--text-muted);
        background: transparent;
        border: 0;
        padding: 2px 6px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: opacity 0.15s ease, color 0.15s ease;
      }

      .log-item:hover .log-delete,
      .log-delete:focus-visible {
        opacity: 1;
      }

      .log-delete:hover {
        color: var(--danger);
      }

      [data-locked="true"] .log-delete {
        display: none;
      }

      [data-locked="true"] .log-item:hover {
        background: transparent;
      }

      /* --- Search / replace ---
         Was an unstyled div dropped into the whiteboard's flex column, so it
         appeared mid-canvas with no chrome and shoved the layout around. */
      #search-replace {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        margin: 0;
        display: none;
        gap: 8px;
        align-items: center;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 10px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        z-index: 2400;
      }

      #search-replace.active {
        display: flex;
      }

      #search-replace input {
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 12px;
        width: 170px;
        outline: none;
      }

      /* --- Download link ---
         Was a full-width right-aligned block flush against the viewport edge.
         Made it a deliberate corner chip that clears the nav menu. */
      /* Pinned to the bottom-right corner of the viewport in every layout and
         always above the window layer (windows are capped below 900, this sits
         at 1001), so it can never be covered or pushed off-screen. */
      .download-html-link {
        position: fixed;
        right: 16px;
        bottom: 16px;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-dim);
        z-index: 1001;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }

      /* Deliberately the one control that highlights red rather than the accent
         teal: it writes a file to disk, so it reads as distinct from the
         in-app actions that all share the teal hover. */
      .download-html-link:hover,
      .download-html-link:focus-visible {
        color: var(--danger);
        border-color: var(--danger);
        background: var(--bg-card-hover);
      }

      .download-html-link:focus-visible {
        outline-color: var(--danger);
      }

      /* --- Empty canvas ---
         An app that opens to a featureless void gives the user nothing to
         act on. This hint is hidden by JS as soon as a window exists. */
      #empty-state {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        pointer-events: none;
        padding: 0 24px 160px;
        color: var(--text-muted);
      }

      #empty-state[hidden] {
        display: none;
      }

      #empty-state .empty-title {
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      #empty-state .empty-hint {
        font-size: 13px;
        max-width: 52ch;
        line-height: 1.7;
        color: var(--text-dim);
        margin: 0;
      }

      #empty-state strong {
        color: var(--text);
        font-weight: 600;
      }

      #empty-state kbd {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 6px;
        color: var(--text-dim);
      }

      /* --- Minimised windows need a way back ---
         minimizeWindow() sets display:none and the only route back was an
         undiscoverable hover tooltip. This is a real restore bar. */
      #minimized-bar {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: 40vw;
        z-index: 1001;
      }

      #minimized-bar:empty {
        display: none;
      }

      .minimized-chip {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .minimized-chip:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* --- Small screens ---
         The nav is width:max-content / flex-wrap:nowrap, so on a phone it ran
         far past the viewport with no way to reach the right-hand buttons. */
      @media (max-width: 720px) {
        .nav-menu {
          top: 8px;
          bottom: auto;
          left: 8px;
          right: 8px;
          transform: none;
          width: auto;
          max-width: none;
          flex-wrap: wrap;
        }

        .nav-row {
          justify-content: center;
          flex-wrap: wrap;
        }

        /* The vertical group dividers only read as separators on one line;
           once the toolbar wraps they become stray floating strokes. */
        .nav-group {
          flex-wrap: wrap;
          justify-content: center;
          border-right: none;
          padding: 0 4px;
        }

        #status,
        #search-replace {
          top: auto;
          bottom: 18px;
        }

        #search-replace.active ~ #status {
          top: auto;
          bottom: 92px;
        }

        #search-replace {
          flex-wrap: wrap;
          justify-content: center;
          border-radius: 16px;
          max-width: calc(100vw - 32px);
        }

        #search-replace input {
          width: 100%;
        }

        #empty-state {
          padding-bottom: 0;
        }

        /* Keep the minimized chips clear of the download chip in the corner
           instead of letting the two rows overlap on a narrow screen. */
        #minimized-bar {
          max-width: calc(100vw - 32px);
          bottom: 64px;
        }
      }
    </style>
  </head>

    <script type="text/javascript">
      // Normalise "rgb(43, 39, 24)" / "#2B2718" / "" to "#2b2718" so stored
      // colours can be compared against the theme defaults.
      function normalizeColor(value) {
        if (!value) return "";
        const v = String(value).trim().toLowerCase();
        const rgb = v.match(/^rgba?\(([^)]+)\)$/);
        if (rgb) {
          const [r, g, b] = rgb[1].split(",").map((n) => parseInt(n, 10));
          if ([r, g, b].some(Number.isNaN)) return v;
          return (
            "#" +
            [r, g, b].map((n) => n.toString(16).padStart(2, "0")).join("")
          );
        }
        if (/^#[0-9a-f]{3}$/.test(v)) {
          return "#" + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
        }
        return v;
      }

      // Every sticky-note colour this app has ever used as a *default*. A
      // stored colour matching one of these was never a deliberate choice - it
      // was just whatever the theme happened to be when the note was made -
      // so it must not be reapplied over the current theme.
      const DEFAULT_STICKY_COLORS = new Set([
        "#2b2718", "#fff6c9", // current --sticky-bg
        "#f6ecd2", "#3b3210", // current --sticky-text
        "#141820", "#ffffff", // --bg-card, used as the default before v3.0
        "#e2e8f0", "#0f172a", // --text, likewise
        "#444444", "#ffff88", // pre-v2 sticky background
        "#000000",            // pre-v2 fallback text colour
      ]);

      function isDefaultStickyColor(value) {
        return DEFAULT_STICKY_COLORS.has(normalizeColor(value));
      }

      // Mark the note as deliberately recoloured. Without this flag there is no
      // way to tell a user's choice from a baked-in theme default, which is why
      // notes created before v3.0 stayed dark forever after switching to light.
      function changeStickyNoteColor(windowId, color) {
        const stickyNote = document.getElementById(windowId);
        if (stickyNote) {
          stickyNote.style.backgroundColor = color;
          stickyNote.dataset.customColor = "true";
          saveSession();
          showStatus("Sticky note colour changed.");
        }
      }

      function changeStickyNoteTextColor(windowId, color) {
        const stickyNote = document.getElementById(windowId);
        const stickyNoteContent = stickyNote?.querySelector(
          ".sticky-note-content"
        );
        if (stickyNoteContent) {
          stickyNoteContent.style.color = color;
          // Also set it on the note itself so the title, the toolbar labels and
          // the Reset button inherit it. They otherwise stay on the theme token
          // and go unreadable against a custom background - dark brown text on
          // a purple note, for instance.
          stickyNote.style.color = color;
          stickyNote.dataset.customColor = "true";
          saveSession();
          showStatus("Sticky note text colour changed.");
        }
      }

      // Drop a note's inline colours so it inherits the theme tokens again.
      function resetStickyColors(windowId) {
        const stickyNote = document.getElementById(windowId);
        if (!stickyNote) return;
        stickyNote.style.removeProperty("background-color");
        stickyNote.style.removeProperty("color");
        stickyNote
          .querySelector(".sticky-note-content")
          ?.style.removeProperty("color");
        delete stickyNote.dataset.customColor;
        syncStickySwatches(stickyNote);
        saveSession();
        showStatus("Sticky note follows the theme again.");
      }

      // One-click copy of a sticky note's body text.
      function copyStickyNoteText(windowId) {
        const content = document
          .getElementById(windowId)
          ?.querySelector(".sticky-note-content");
        if (!content) {
          showStatus("Copy failed: sticky note not found.");
          return;
        }
        copyToClipboard(content.value, "This sticky note is empty.");
      }

      // Point the two swatch inputs at what the note will settle on.
      // Deliberately reads the inline style or the theme *token* rather than
      // the computed colour: .sticky-note-window transitions its background
      // over 0.3s, so sampling getComputedStyle mid-switch captures a garbage
      // intermediate value like #9a9475.
      function syncStickySwatches(stickyNote) {
        const contentEl = stickyNote.querySelector(".sticky-note-content");
        const bg = stickyNote.querySelector('input[type="color"][id^="sticky-note-color-"]');
        const fg = stickyNote.querySelector('input[type="color"][id^="sticky-note-text-color-"]');
        const tokens = getComputedStyle(document.body);
        if (bg) {
          bg.value =
            normalizeColor(stickyNote.style.backgroundColor) ||
            normalizeColor(tokens.getPropertyValue("--sticky-bg")) ||
            "#2b2718";
        }
        if (fg) {
          fg.value =
            normalizeColor(contentEl && contentEl.style.color) ||
            normalizeColor(tokens.getPropertyValue("--sticky-text")) ||
            "#f6ecd2";
        }
      }

      // Sticky notes that were never deliberately recoloured must follow the
      // theme; ones the user painted keep their colours.
      function refreshStickyThemeColors() {
        const notes = document.querySelectorAll(".sticky-note-window");
        notes.forEach((note) => {
          if (note.dataset.customColor !== "true") {
            note.style.removeProperty("background-color");
            note.style.removeProperty("color");
            note
              .querySelector(".sticky-note-content")
              ?.style.removeProperty("color");
          }
        });
        // Read the swatches back on the next frame. Custom properties changed
        // on <body> do not resolve synchronously - reading getComputedStyle in
        // the same pass (even after forcing layout) returns the *previous*
        // theme's colours, leaving the pickers one theme behind.
        requestAnimationFrame(() =>
          notes.forEach((note) => syncStickySwatches(note))
        );
      }

      let windowCount = 0;
      let noteCount = 0;
      let taskCount = 0;
      let stickyCount = 0;
      let t2Count = 0;
      let calculatorCount = 0;
      let clockCount = 0;
      let activeWindow = null;
      // lockedWindows removed along with the orphaned toggleLock(): lock state
      // lives on each element's dataset.locked, which is what toggleWindowLock()
      // and saveSession() actually read.
      let zIndexCounter = 1;
      let restoring = false; // true only while loadSessionFromStorage rebuilds the DOM
      let activeTool = null;
      let offsetX = 0;
      let offsetY = 0;
      let calculatorVisible = false;
      let clockVisible = false;
      let logVisible = false;
      let calculatorHistory = [];
      let logEntries = [];
      const MAX_WINDOWS = 25;

      // Every window type used to spawn at a fixed spot - notes, calculator,
      // clock and help all dead-centre, tasks at 50,50, log at 0,0 - so opening
      // three things buried them in one pile. Windows now cascade, stay clear of
      // the toolbar, and wrap back to the start when they run out of room.
      const WINDOW_SELECTOR =
        ".window, .task-window, .clock-window, .log-window, .calculator, .sticky-note-window, .help-window";
      const CASCADE_STEP = 32;
      let cascadeIndex = 0;

      // Windows live strictly below the fixed chrome (toolbar 1000, download
      // chip and minimized bar 1001, search 2400, toast 2500, tooltip 3000).
      // zIndexCounter used to climb to 2147483640, so after enough focus
      // switches a window would render on top of the toolbar and the download
      // link. When the ceiling is reached the stack is compacted instead.
      const WINDOW_Z_MAX = 900;

      function nextWindowZ() {
        if (zIndexCounter >= WINDOW_Z_MAX) compactWindowZ();
        return ++zIndexCounter;
      }

      // Re-number the open windows 1..n, preserving their current order, so the
      // counter can keep going without ever reaching the chrome layer.
      function compactWindowZ() {
        const ordered = Array.from(document.querySelectorAll(WINDOW_SELECTOR))
          .map((el) => ({ el, z: parseInt(el.style.zIndex) || 0 }))
          .sort((a, b) => a.z - b.z);
        ordered.forEach((item, i) => {
          item.el.style.zIndex = i + 1;
        });
        zIndexCounter = ordered.length;
      }

      function navMenuBounds() {
        const nav = document.querySelector(".nav-menu");
        return nav ? nav.getBoundingClientRect() : null;
      }

      // Usable canvas: the viewport minus whatever edge the toolbar occupies.
      function canvasBounds() {
        const pad = 12;
        const nav = navMenuBounds();
        let top = pad;
        let bottom = window.innerHeight - pad;
        if (nav && nav.height) {
          // Toolbar is bottom-anchored on desktop, top-anchored on narrow screens.
          if (nav.top > window.innerHeight / 2) bottom = nav.top - pad;
          else top = nav.bottom + pad;
        }
        return { left: pad, top, right: window.innerWidth - pad, bottom };
      }

      function clampToCanvas(width, height, x, y) {
        const b = canvasBounds();
        const maxX = Math.max(b.left, b.right - width);
        const maxY = Math.max(b.top, b.bottom - height);
        return {
          x: Math.min(Math.max(b.left, x), maxX),
          y: Math.min(Math.max(b.top, y), maxY),
        };
      }

      // Position a freshly created window. The first one on an empty canvas is
      // centred; every one after that steps down-right from that same anchor,
      // so the pile reads as a predictable staircase rather than scattering
      // (centring each window on its own size put them all back on top of each
      // other, just slightly offset).
      let cascadeAnchor = null;

      function placeWindow(element, width, height) {
        const b = canvasBounds();
        const openCount = document.querySelectorAll(WINDOW_SELECTOR).length;

        if (openCount === 0 || !cascadeAnchor) {
          cascadeAnchor = {
            x: b.left + Math.max(0, (b.right - b.left - width) / 2),
            y: b.top + Math.max(0, (b.bottom - b.top - height) / 2),
          };
          cascadeIndex = 0;
        } else {
          cascadeIndex++;
        }

        // Before a window would run past the edge of the canvas, restart the
        // staircase from the top-left rather than from slot 0 - slot 0 is
        // where the very first window is still sitting.
        const step = cascadeIndex * CASCADE_STEP;
        if (
          cascadeAnchor.x + step + width > b.right ||
          cascadeAnchor.y + step + height > b.bottom
        ) {
          cascadeAnchor = { x: b.left + 12, y: b.top + 12 };
          cascadeIndex = 0;
        }

        const offset = cascadeIndex * CASCADE_STEP;
        const spot = clampToCanvas(
          width,
          height,
          cascadeAnchor.x + offset,
          cascadeAnchor.y + offset
        );
        element.style.left = `${spot.x}px`;
        element.style.top = `${spot.y}px`;
        element.dataset.x = spot.x;
        element.dataset.y = spot.y;
        return spot;
      }

      // Sessions saved on a large monitor used to restore off-screen on a small
      // one, with no way to drag a window back into view.
      function clampWindowIntoView(element) {
        if (!element || element.style.display === "none") return;
        const spot = clampToCanvas(
          element.offsetWidth,
          element.offsetHeight,
          parseFloat(element.dataset.x) || 0,
          parseFloat(element.dataset.y) || 0
        );
        element.style.left = `${spot.x}px`;
        element.style.top = `${spot.y}px`;
        element.dataset.x = spot.x;
        element.dataset.y = spot.y;
      }

      // Raise + focus. Previously .active was set but never styled, so nothing
      // told the user which note Copy/Paste/Search would act on.
      function wireWindowFocus(element) {
        const raise = () => setActiveWindow(element.id);
        // mousedown, not click: raising on mouseup felt a beat behind the cursor.
        element.addEventListener("mousedown", raise);
        element.addEventListener("focusin", raise);
      }

      // The empty canvas and the minimised-window bar both derive purely from
      // the DOM, so one function keeps them honest after any change.
      function refreshChrome() {
        const all = Array.from(document.querySelectorAll(WINDOW_SELECTOR));
        const emptyState = document.getElementById("empty-state");
        if (emptyState) emptyState.hidden = all.length > 0;

        const bar = document.getElementById("minimized-bar");
        if (!bar) return;
        const minimized = all.filter((el) => el.style.display === "none");
        bar.innerHTML = "";
        minimized.forEach((el) => {
          const label =
            el.querySelector(
              ".window-title, .task-title, .sticky-note-title, .clock-title, .log-title, .calculator-title, .help-title"
            )?.textContent || el.id;
          const chip = document.createElement("button");
          chip.className = "minimized-chip";
          chip.textContent = label;
          chip.title = `Restore ${label}`;
          chip.addEventListener("click", () => restoreWindow(el.id));
          bar.appendChild(chip);
        });
      }

      function restoreWindow(windowId) {
        const el = document.getElementById(windowId);
        if (!el) return;
        el.style.display = "";
        setActiveWindow(windowId);
        clampWindowIntoView(el);
        refreshChrome();
        saveSession();
      }

      // --- Internal stability helpers (no UI or behavior change) ---
      let _saveTimer = null;
      function debouncedSave(delay = 180) {
        if (_saveTimer) clearTimeout(_saveTimer);
        _saveTimer = setTimeout(() => {
          _saveTimer = null;
          try { saveSession(); } catch (e) { /* swallow */ }
        }, delay);
      }

      // Map of windowId -> ResizeObserver for cleanup
      const _resizeObservers = Object.create(null);

      function registerResizeObserver(windowId, observer) {
        if (_resizeObservers[windowId]) {
          try { _resizeObservers[windowId].disconnect(); } catch (e) {}
        }
        _resizeObservers[windowId] = observer;
      }

      function disconnectResizeObserver(windowId) {
        const obs = _resizeObservers[windowId];
        if (obs) {
          try { obs.disconnect(); } catch (e) {}
          delete _resizeObservers[windowId];
        }
      }

      function setMaxDimensions() {
        const textareaContainers = document.querySelectorAll(
          ".textarea-container"
        );
        textareaContainers.forEach((container) => {
          const windowElement = container.closest(".window");
          if (windowElement) {
            const headerHeight =
              windowElement.querySelector(".window-header").offsetHeight || 30;
            const paddingAndBorders = 22;
            const buttonsHeight =
              windowElement.querySelector(".format-buttons")?.offsetHeight || 0;
            const countsHeight =
              windowElement.querySelector(".counts")?.offsetHeight || 0;
            const logInputHeight =
              windowElement.querySelector(".note-log-input-container")
                ?.offsetHeight || 0;
            const maxHeight =
              window.innerHeight -
              headerHeight -
              paddingAndBorders -
              buttonsHeight -
              countsHeight -
              logInputHeight -
              20;
            const maxWidth = window.innerWidth - 32 - 20;
            container.style.maxHeight = `${maxHeight}px`;
            container.style.maxWidth = `${Math.min(
              maxWidth,
              window.innerWidth - 50
            )}px`;
            windowElement.style.maxWidth = `${Math.min(
              maxWidth + 32,
              window.innerWidth - 30
            )}px`;
            windowElement.style.maxHeight = `${
              maxHeight +
              headerHeight +
              paddingAndBorders +
              buttonsHeight +
              countsHeight +
              logInputHeight
            }px`;
          }
        });
      }
      function addStickyNote() {
        // Each add* function used to count a different subset (sticky notes
        // counted only sticky notes; the others ignored sticky notes and the
        // calculator entirely), so the "maximum" moved depending on which
        // button you pressed. One selector, one limit.
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }

        windowCount++;
        stickyCount++;
        const stickyLabel = stickyCount > 1 ? `Sticky Note ${stickyCount}` : "Sticky Note";
        const windowId = `sticky-note-${windowCount}`;

        newStickyNote.className = "sticky-note-window";

        newStickyNote.style.zIndex = nextWindowZ();
        newStickyNote.dataset.width = 412;
        newStickyNote.dataset.height = 431;
        newStickyNote.style.width = "412px";
        newStickyNote.style.height = "431px";
        // These were "50" without a unit, so the declarations were invalid and
        // dropped; the note landed wherever static flow put it.
        placeWindow(newStickyNote, 412, 431);
        // Only seed the swatch inputs from the theme; do NOT write the colours
        // to element.style. Baking them in at creation time froze the note to
        // whichever theme was active when it was made, so switching to light
        // mode left dark text on a still-dark note (1.2:1). Left unset, the
        // CSS --sticky-bg / --sticky-text tokens follow the theme, and an
        // explicit user pick still overrides them via the change handlers.
        const computedStyles = getComputedStyle(document.body);
        const defaultBgColor =
          computedStyles.getPropertyValue("--sticky-bg").trim() || "#2b2718";
        const defaultTextColor =
          computedStyles.getPropertyValue("--sticky-text").trim() || "#f6ecd2";

        newStickyNote.innerHTML = `

        </div>
    </div>
    <div class="sticky-note-toolbar">
        <label for="sticky-note-color-${windowId}">Background:</label>
