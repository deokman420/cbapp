      // Every sticky-note colour this app has ever used as a *default*. A
      // stored colour matching one of these was never a deliberate choice - it
      // was just whatever the theme happened to be when the note was made -
      // so it must not be reapplied over the current theme.
      const DEFAULT_STICKY_COLORS = new Set([
        "#2b2718", "#fff6c9", // current --sticky-bg
        "#f6ecd2", "#3b3210", // current --sticky-text
        "#141820", "#ffffff", // --bg-card, used as the default before v3.0
        "#e2e8f0", "#0f172a", // --text, likewise
        "#444444", "#ffff88", // pre-v2 sticky background
        "#000000",            // pre-v2 fallback text colour
      ]);

      function isDefaultStickyColor(value) {
        return DEFAULT_STICKY_COLORS.has(normalizeColor(value));
      }

      // Mark the note as deliberately recoloured. Without this flag there is no
      // way to tell a user's choice from a baked-in theme default, which is why
      // notes created before v3.0 stayed dark forever after switching to light.
      function changeStickyNoteColor(windowId, color) {
        const stickyNote = document.getElementById(windowId);
        if (stickyNote) {
          stickyNote.style.backgroundColor = color;
          stickyNote.dataset.customColor = "true";
          saveSession();
          showStatus("Sticky note colour changed.");
        }
      }

      function changeStickyNoteTextColor(windowId, color) {
        const stickyNote = document.getElementById(windowId);
        const stickyNoteContent = stickyNote?.querySelector(
          ".sticky-note-content"
        );
        if (stickyNoteContent) {
          stickyNoteContent.style.color = color;
          // Also set it on the note itself so the title, the toolbar labels and
          // the Reset button inherit it. They otherwise stay on the theme token
          // and go unreadable against a custom background - dark brown text on
          // a purple note, for instance.
          stickyNote.style.color = color;
          stickyNote.dataset.customColor = "true";
          saveSession();
          showStatus("Sticky note text colour changed.");
        }
      }

      // Drop a note's inline colours so it inherits the theme tokens again.
      function resetStickyColors(windowId) {
        const stickyNote = document.getElementById(windowId);
        if (!stickyNote) return;
        stickyNote.style.removeProperty("background-color");
        stickyNote.style.removeProperty("color");
        stickyNote
          .querySelector(".sticky-note-content")
          ?.style.removeProperty("color");
        delete stickyNote.dataset.customColor;
        syncStickySwatches(stickyNote);
        saveSession();
        showStatus("Sticky note follows the theme again.");
      }

      // One-click copy of a sticky note's body text.
      function copyStickyNoteText(windowId) {
        const content = document
          .getElementById(windowId)
          ?.querySelector(".sticky-note-content");
        if (!content) {
          showStatus("Copy failed: sticky note not found.");
          return;
        }
        copyToClipboard(content.value, "This sticky note is empty.");
      }

      // Point the two swatch inputs at what the note will settle on.
      // Deliberately reads the inline style or the theme *token* rather than
      // the computed colour: .sticky-note-window transitions its background
      // over 0.3s, so sampling getComputedStyle mid-switch captures a garbage
      // intermediate value like #9a9475.
      function syncStickySwatches(stickyNote) {
        const contentEl = stickyNote.querySelector(".sticky-note-content");
        const bg = stickyNote.querySelector('input[type="color"][id^="sticky-note-color-"]');
        const fg = stickyNote.querySelector('input[type="color"][id^="sticky-note-text-color-"]');
        const tokens = getComputedStyle(document.body);
        if (bg) {
          bg.value =
            normalizeColor(stickyNote.style.backgroundColor) ||
            normalizeColor(tokens.getPropertyValue("--sticky-bg")) ||
            "#2b2718";
        }
        if (fg) {
          fg.value =
            normalizeColor(contentEl && contentEl.style.color) ||
            normalizeColor(tokens.getPropertyValue("--sticky-text")) ||
            "#f6ecd2";
        }
      }

      // Sticky notes that were never deliberately recoloured must follow the
      // theme; ones the user painted keep their colours.
      function refreshStickyThemeColors() {
        const notes = document.querySelectorAll(".sticky-note-window");
        notes.forEach((note) => {
          if (note.dataset.customColor !== "true") {
            note.style.removeProperty("background-color");
            note.style.removeProperty("color");
            note
              .querySelector(".sticky-note-content")
              ?.style.removeProperty("color");
          }
        });
        // Read the swatches back on the next frame. Custom properties changed
        // on <body> do not resolve synchronously - reading getComputedStyle in
        // the same pass (even after forcing layout) returns the *previous*
        // theme's colours, leaving the pickers one theme behind.
        requestAnimationFrame(() =>
          notes.forEach((note) => syncStickySwatches(note))
        );
      }

      let windowCount = 0;
      let noteCount = 0;
      let taskCount = 0;
      let stickyCount = 0;
      let t2Count = 0;
      let activeWindow = null;
      // lockedWindows removed along with the orphaned toggleLock(): lock state
      // lives on each element's dataset.locked, which is what toggleWindowLock()
      // and saveSession() actually read.
      let zIndexCounter = 1;
      let restoring = false; // true only while loadSessionFromStorage rebuilds the DOM
      // False until boot has finished deciding what this browser's session is.
      // Boot is async — it awaits the unlock prompt, which a user can sit in
      // front of for as long as they like. Reloading during that window used to
      // fire beforeunload -> saveSession() against a blank DOM, with no
      // passphrase yet in hand, replacing the ciphertext with an empty
      // plaintext session. Refuse every write until boot says otherwise;
      // storage already holds the truth, so there is nothing to lose by waiting.
      let booted = false;
      let activeTool = null;
      let offsetX = 0;
      let offsetY = 0;
      /* Counted across BOTH desks, deliberately, unlike every other "how many
         windows" question in here — this one guards how big a session can get
         before it stops fitting in localStorage, and a window costs the same
         whether or not it is the desk you are looking at. */
      const MAX_WINDOWS = 25;

      // Every window type used to spawn at a fixed spot - notes, calculator,
      // clock and help all dead-centre, tasks at 50,50, log at 0,0 - so opening
      // three things buried them in one pile. Windows now cascade, stay clear of
      // the toolbar, and wrap back to the start when they run out of room.
      const WINDOW_SELECTOR =
        ".window, .task-window, .clock-window, .log-window, .calendar-window, .calculator, .sticky-note-window, .help-window";
      const CASCADE_STEP = 32;
      let cascadeIndex = 0;

      // Windows live strictly below the fixed chrome (toolbar 1000, download
      // chip and minimized bar 1001, search 2400, toast 2500, tooltip 3000).
      // zIndexCounter used to climb to 2147483640, so after enough focus
      // switches a window would render on top of the toolbar and the download
      // link. When the ceiling is reached the stack is compacted instead.
      const WINDOW_Z_MAX = 900;

      function nextWindowZ() {
        if (zIndexCounter >= WINDOW_Z_MAX) compactWindowZ();
        return ++zIndexCounter;
      }

      // Re-number the open windows 1..n, preserving their current order, so the
      // counter can keep going without ever reaching the chrome layer.
      function compactWindowZ() {
        const ordered = Array.from(document.querySelectorAll(WINDOW_SELECTOR))
          .map((el) => ({ el, z: parseInt(el.style.zIndex) || 0 }))
          .sort((a, b) => a.z - b.z);
        ordered.forEach((item, i) => {
          item.el.style.zIndex = i + 1;
        });
        zIndexCounter = ordered.length;
      }

      function navMenuBounds() {
        const nav = document.querySelector(".nav-menu");
        return nav ? nav.getBoundingClientRect() : null;
      }

      /* ==========================================================
         BIG CANVAS — view state
         ----------------------------------------------------------
         Window left/top have always been screen pixels, because nothing could
         scroll or scale. They are now *world* pixels, and the view is what maps
         world to screen:

             screen = world * zoom + pan

         While the canvas is off the view is the identity transform (pan 0,
         zoom 1), so world and screen coordinates are the same number and every
         existing code path — including sessions saved by earlier versions —
         behaves exactly as it did before. That is the whole reason the maths is
         written as one path rather than branching on the mode everywhere.
         ========================================================== */
      const CANVAS_MULTIPLE = 3; // world is 3 viewports wide and tall
      const ZOOM_MIN = 0.25;
      const ZOOM_MAX = 2;
      const ZOOM_STEP = 1.15;
      const view = { on: false, x: 0, y: 0, zoom: 1 };

      /* ==========================================================
         Mode-scoped windows (v3.2.10)
         ----------------------------------------------------------
         The two modes are two different desks, not two views of one desk.
         Windowed is a single screen you arrange tightly; the canvas is three
         screens you spread out across. A window belongs to the desk it was
         created on and appears on that desk only.

         v3.2.9 got this half right — it gave each mode its own *positions*
         while every window stayed in both — so opening a T2 template on the
         canvas also put one in windowed mode, and closing it in one place
         left the other behind. Membership is the thing that has to be
         per-mode; once it is, positions follow for free, because a window
         that only ever exists on one desk never needs a second coordinate.

         Mode is a data attribute so it survives everything that already
         round-trips a window (save, restore, backup, import). Hiding is a
         class rather than style.display, which is the minimise flag — the two
         are independent, and a window minimised on the canvas must still come
         back minimised when you return to it.
         ========================================================== */
      const WINDOWED = "windowed";
      const CANVAS = "canvas";

      function currentMode() {
        return view.on ? CANVAS : WINDOWED;
      }

      // Sessions written before v3.2.10 have no mode on their windows. They
      // are adopted by whichever desk is active when they load, which is the
      // one the user was last looking at them on.
      function windowMode(el) {
        return el.dataset.mode === CANVAS ? CANVAS : WINDOWED;
      }

      function inCurrentMode(el) {
        return windowMode(el) === currentMode();
      }

      /* Every "what is open" question means the desk on screen: the empty-state
         hint, the minimised bar, the overview map, zoom-to-fit, the cascade
         staircase, the nav tooltips, and what gets focused when the active
         window closes. The DOM holds both desks, so asking it directly is the
         bug — that is what made a window created in one mode show up in the
         other. The window cap is the deliberate exception (see MAX_WINDOWS). */
      function modeWindows() {
        return Array.from(document.querySelectorAll(WINDOW_SELECTOR)).filter(
          inCurrentMode
        );
      }

      /* offsetWidth/offsetHeight are 0 for anything display:none. That was
         already quietly true of a minimised window — minimise it, and the very
         next save wrote width:0 and height:0 into its record, which restore
         faithfully rebuilt as a 0px window that came back from the chip bar
         invisible. Mode-hidden windows are display:none for a second reason,
         so the same hole would have swallowed the size of every window on the
         desk you were not looking at, on every save.

         So: whenever a window is measured while it is actually being rendered,
         remember the box; when it is not, answer with what it last was. */
      function measuredBox(el) {
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        if (w && h) {
          el.dataset.boxW = w;
          el.dataset.boxH = h;
          return { width: w, height: h };
        }
        return {
          width: parseFloat(el.dataset.boxW) || parseFloat(el.dataset.width) || 0,
          height: parseFloat(el.dataset.boxH) || parseFloat(el.dataset.height) || 0,
        };
      }

      function applyModeVisibility() {
        document.querySelectorAll(WINDOW_SELECTOR).forEach((el) => {
          const hide = !inCurrentMode(el);
          // Take the measurement while it is still rendered.
          if (hide && !el.classList.contains("mode-hidden")) measuredBox(el);
          el.classList.toggle("mode-hidden", hide);
        });
      }

      /* ==========================================================
         ONE PER DESK (v3.2.13)
         ----------------------------------------------------------
         Calc, Clock, Log and Help used to be one window each in total, with a
         fixed id, so pressing the button from the other desk could only drag
         the single window across. They are one per *desk* now — two at most,
         independent of each other: separate log entries, separate calculator
         history, separate stopwatch and countdown.

         The windowed instance keeps the historic id so every session ever
         written still restores into it untouched; the canvas one takes a
         suffix. Everything inside a window is likewise suffixed with its
         owner's id, because two of them in one document would otherwise be two
         elements answering to `calculator-input` — and getElementById returns
         the first, so the canvas keypad would have driven the plain view's
         calculator. That per-window-id suffix is the same convention notes
         (`clipboard-<id>`) and the clock (`clock-time-<id>`) already used.
         ========================================================== */
      const CANVAS_ID_SUFFIX = "-canvas";

      /* The four, and the session key each one's record lives under. The key
         is not always the element id: help's window has always been
         `help-window` in the DOM and `help` in the session, and changing
         either would strand every session already written. The canvas
         instance takes the same suffix on both. */
      const SINGLETON_KINDS = [
        { base: "calculator", key: "calculator" },
        { base: "clock", key: "clock" },
        { base: "log", key: "log" },
        { base: "calendar", key: "calendar" },
        { base: "help-window", key: "help" },
      ];

      function singletonKey(kindKey, mode) {
        return (mode || currentMode()) === CANVAS
          ? kindKey + CANVAS_ID_SUFFIX
          : kindKey;
      }

      /* Session key -> which kind it is, for both desks. Built once so the
         validator and the restore path cannot drift from the writer. */
      const SINGLETON_KEY_KIND = {};
      SINGLETON_KINDS.forEach((kind) => {
        SINGLETON_KEY_KIND[kind.key] = kind;
        SINGLETON_KEY_KIND[kind.key + CANVAS_ID_SUFFIX] = kind;
      });

      function deskInstanceId(baseId, mode) {
        return (mode || currentMode()) === CANVAS
          ? baseId + CANVAS_ID_SUFFIX
          : baseId;
      }

      /* The mutable state that used to be module-level globals — one calculator
         history, one array of log entries, one stopwatch, one countdown, one
         clock tick. All of it belongs to a window now. Keyed by window id
         rather than by element so the save path can read it without holding a
         node, and torn down explicitly: an interval outliving its window would
         tick forever against elements that are no longer in the document. */
      const instanceState = {};

      function stateFor(windowId) {
        let s = instanceState[windowId];
        if (!s) {
          s = {
            history: [],
            entries: [],
            stopwatch: { interval: null, start: null, elapsed: 0 },
            countdown: { interval: null, endTime: null, active: false },
            tick: null,
          };
          instanceState[windowId] = s;
        }
        return s;
      }

      /* Closing a window stops its timers but keeps its data, which is how
         the Log has always behaved: close it, reopen it, the entries are still
         there. An interval, by contrast, would tick for the life of the tab
         against elements that left the document. */
      function stopInstanceTimers(windowId) {
        const s = instanceState[windowId];
        if (!s) return;
        clearInterval(s.stopwatch.interval);
        clearInterval(s.countdown.interval);
        clearInterval(s.tick);
        s.stopwatch.interval = null;
        s.countdown.interval = null;
        s.tick = null;
        // A timer alert pointing at a clock that is going away would leave a
        // Show button with nothing to show.
        if (_timerAlertWindow === windowId) dismissAppAlert();
      }

      // Reset and Import, where the data itself is meant to go.
      function dropInstanceState(windowId) {
        stopInstanceTimers(windowId);
        delete instanceState[windowId];
      }

      function dropAllInstanceState() {
        Object.keys(instanceState).forEach(dropInstanceState);
      }

      function instancePart(windowId, part) {
        return document.getElementById(`${part}-${windowId}`);
      }

      /* The canvas viewpoint, kept while you are away from it. It cannot live
         in `view` because that is reset to the identity transform whenever the
         canvas is off, and it is what makes returning to the canvas put you
         back where you were rather than at the default centre. */
      let canvasViewMemory = null;

      // Grow-only: shrinking the world after windows have been parked out
      // there would strand them past the clamp, with no way to reach them.
      let worldSize = { w: 0, h: 0 };

      /* The world must still cover the screen at maximum zoom-out, so the
         multiple is whichever is larger: the 3 viewports we want at 1:1, or
         the 1/ZOOM_MIN viewports the screen spans once fully zoomed out.

         At 3 viewports with ZOOM_MIN 0.25 the world was 3834px wide but the
         screen spanned 4 viewports of it, so below 1/3 zoom the scaled world
         was *smaller* than the viewport. clampPan() then took its centring
         branch and parked it in the middle, leaving a dead margin all round —
         160px each side at 25% on a 1278px screen. The grid is a fixed
         backdrop so it kept painting across that margin, which made it read as
         reachable canvas, but clampBounds() works in world coordinates: a
         dragged window stopped dead at the world edge, well inboard of the
         screen edge, looking like it was being forced back toward the centre. */
      const WORLD_MULTIPLE = Math.max(CANVAS_MULTIPLE, 1 / ZOOM_MIN);

      function computeWorldSize() {
        const w = Math.max(
          worldSize.w,
          Math.round(window.innerWidth * WORLD_MULTIPLE)
        );
        const h = Math.max(
          worldSize.h,
          Math.round(window.innerHeight * WORLD_MULTIPLE)
        );
        worldSize = { w, h };
        return worldSize;
      }

      function screenToWorld(clientX, clientY) {
        return {
          x: (clientX - view.x) / view.zoom,
          y: (clientY - view.y) / view.zoom,
        };
      }

      // Hard limits for dragging: the world while the canvas is on, the visible
      // viewport while it is off. Distinct from canvasBounds(), which answers a
      // different question — where a *new* window should be dropped so the user
      // can see it. The two were the same rect until the canvas existed.
      function clampBounds() {
        if (!view.on) return canvasBounds();
        const world = computeWorldSize();
        const pad = 12;
        return {
          left: pad,
          top: pad,
          right: world.w - pad,
          bottom: world.h - pad,
        };
      }

      // Keep the world covering the viewport: pan can never open a gap at an
      // edge, and once the whole world fits on screen it is centred instead.
      function clampPan() {
        const world = computeWorldSize();
        const scaledW = world.w * view.zoom;
        const scaledH = world.h * view.zoom;
        view.x =
          scaledW <= window.innerWidth
            ? (window.innerWidth - scaledW) / 2
            : Math.min(0, Math.max(window.innerWidth - scaledW, view.x));
        view.y =
          scaledH <= window.innerHeight
            ? (window.innerHeight - scaledH) / 2
            : Math.min(0, Math.max(window.innerHeight - scaledH, view.y));
      }

      /* The first version of this ran synchronously from every pointermove and
         wheel event, and rewrote the layer's width, height, transform and the
         zoom label on each one. Pointer events fire faster than the screen
         refreshes, so that was several full style-and-layout passes per frame,
         and setting width/height on a 3700px layer holding every open window
         invalidated layout for that whole subtree each time. That is what made
         panning and zooming feel like they were skipping.

         Now: coalesce to one write per animation frame, and inside that write
         only touch what actually changed. The transform is the only thing that
         changes on a normal pan, and on its own it is compositor work rather
         than layout work. */
      let viewFrame = null;
      let lastGeometry = "";
      let lastLabel = "";

      function scheduleView() {
        if (viewFrame !== null) return;
        viewFrame = requestAnimationFrame(() => {
          viewFrame = null;
          applyView();
        });
      }

      function applyView() {
        const layer = document.getElementById("windows");
        if (!layer) return;
        document.body.classList.toggle("canvas-on", view.on);
        const toggle = document.getElementById("canvas-toggle");
        if (toggle) {
          toggle.classList.toggle("active", view.on);
          toggle.setAttribute("aria-pressed", String(view.on));
        }
        const grid = document.getElementById("canvas-grid");
        if (!view.on) {
          // Back to the plain full-screen layer, with no transform at all
          // rather than a scale(1) — an identity transform still creates a
          // containing block and a stacking context, and the point of the off
          // state is that it is indistinguishable from the old build.
          layer.style.transform = "";
          layer.style.width = "";
          layer.style.height = "";
          lastGeometry = "";
          return;
        }
        const world = computeWorldSize();
        clampPan();

        // Layout-invalidating writes, skipped unless the world actually grew.
        const geometry = `${world.w}x${world.h}`;
        if (geometry !== lastGeometry) {
          layer.style.width = `${world.w}px`;
          layer.style.height = `${world.h}px`;
          lastGeometry = geometry;
        }

        // translate3d rather than translate: the z-component is what gets this
        // onto its own compositor layer on most engines.
        layer.style.transform = `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

        // The grid is a fixed backdrop, so the view moves it by shifting the
        // pattern rather than by transforming a giant painted surface.
        if (grid) {
          const cell = 48 * view.zoom;
          grid.style.backgroundSize = `${cell}px ${cell}px`;
          grid.style.backgroundPosition = `${view.x}px ${view.y}px`;
        }

        const label = document.getElementById("zoom-level");
        const text = `${Math.round(view.zoom * 100)}%`;
        if (label && text !== lastLabel) {
          label.textContent = text;
          lastLabel = text;
        }
        drawMapViewport();
      }

      /* ==========================================================
         Minimap
         ----------------------------------------------------------
         Two update paths on purpose. The viewport frame moves on every pan and
         zoom, so it is one style write per frame. The window blocks only change
         when a window is added, closed, moved or resized, so they are rebuilt
         on a debounce — rebuilding 25 nodes inside the pan loop would put back
         exactly the per-frame DOM churn the render loop above removes.
         ========================================================== */
      const MAP_WIDTH = 168;

      function mapScale() {
        const world = computeWorldSize();
        return MAP_WIDTH / world.w;
      }

      function sizeMap() {
        const map = document.getElementById("canvas-map");
        if (!map) return null;
        const world = computeWorldSize();
        const s = mapScale();
        map.style.width = `${MAP_WIDTH}px`;
        map.style.height = `${Math.round(world.h * s)}px`;
        return s;
      }

      function drawMapViewport() {
        const frame = document.getElementById("map-viewport");
        if (!frame || !view.on) return;
        const s = sizeMap();
        if (!s) return;
        // The world rectangle currently on screen, in map pixels.
        const tl = screenToWorld(0, 0);
        const br = screenToWorld(window.innerWidth, window.innerHeight);
        frame.style.left = `${tl.x * s}px`;
        frame.style.top = `${tl.y * s}px`;
        frame.style.width = `${Math.max(4, (br.x - tl.x) * s)}px`;
        frame.style.height = `${Math.max(4, (br.y - tl.y) * s)}px`;
      }

      let mapTimer = null;
      function scheduleMapWindows() {
        if (mapTimer) clearTimeout(mapTimer);
        mapTimer = setTimeout(() => {
          mapTimer = null;
          drawMapWindows();
        }, 120);
      }

      function drawMapWindows() {
        const inner = document.getElementById("canvas-map-inner");
        if (!inner || !view.on) return;
        const s = sizeMap();
        if (!s) return;
        inner.querySelectorAll(".map-window").forEach((n) => n.remove());
        const frame = document.getElementById("map-viewport");
        modeWindows().forEach((el) => {
          if (el.style.display === "none") return; // minimised
          const block = document.createElement("div");
          block.className = "map-window";
          if (el.classList.contains("active")) block.classList.add("map-active");
          block.style.left = `${(parseFloat(el.dataset.x) || 0) * s}px`;
          block.style.top = `${(parseFloat(el.dataset.y) || 0) * s}px`;
          block.style.width = `${Math.max(2, el.offsetWidth * s)}px`;
          block.style.height = `${Math.max(2, el.offsetHeight * s)}px`;
          inner.insertBefore(block, frame);
        });
        drawMapViewport();
      }

      // Click or drag the map to jump — the fastest way back to a window you
      // have panned away from, and the reason the map is a control and not
      // just a readout.
      (function wireMap() {
        const map = document.getElementById("canvas-map");
        if (!map) return;
        let dragging = false;
        const jumpTo = (e) => {
          const s = mapScale();
          const r = map.getBoundingClientRect();
          // Centre the viewport on the clicked world point.
          const worldX = (e.clientX - r.left) / s;
          const worldY = (e.clientY - r.top) / s;
          view.x = window.innerWidth / 2 - worldX * view.zoom;
          view.y = window.innerHeight / 2 - worldY * view.zoom;
          scheduleView();
        };
        map.addEventListener("pointerdown", (e) => {
          if (!view.on) return;
          dragging = true;
          try {
            map.setPointerCapture(e.pointerId);
          } catch (err) {
            /* not fatal */
          }
          jumpTo(e);
        });
        map.addEventListener("pointermove", (e) => {
          if (dragging && view.on) jumpTo(e);
        });
        const stop = () => {
          if (!dragging) return;
          dragging = false;
          saveSession();
        };
        map.addEventListener("pointerup", stop);
        map.addEventListener("pointercancel", stop);

        // The map advertises role="button" and sits in the tab order, but only
        // pointer events were bound — so it was reachable by keyboard and did
        // nothing at all, which is worse than not being focusable. Arrows pan;
        // Enter/Space recentres on the windows.
        map.addEventListener("keydown", (e) => {
          if (!view.on) return;
          const PAN = 80;
          const nudge = { ArrowLeft: [PAN, 0], ArrowRight: [-PAN, 0], ArrowUp: [0, PAN], ArrowDown: [0, -PAN] }[e.key];
          if (nudge) {
            e.preventDefault();
            view.x += nudge[0];
            view.y += nudge[1];
            scheduleView();
            debouncedSave(300);
            return;
          }
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            zoomToFit();
          }
        });
      })();

      // Gestures mark themselves as in-flight so the compositor hint goes on
      // for the duration and comes off shortly after the last event.
      let interactionTimer = null;
      function markInteracting() {
        document.body.classList.add("canvas-interacting");
        if (interactionTimer) clearTimeout(interactionTimer);
        interactionTimer = setTimeout(() => {
          document.body.classList.remove("canvas-interacting");
          interactionTimer = null;
        }, 220);
      }

      // Zoom about a fixed screen point, so the thing under the cursor (or the
      // centre of the screen, for the buttons) stays under it.
      function setZoom(nextZoom, anchorX, anchorY) {
        if (!view.on) return;
        const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, nextZoom));
        if (z === view.zoom) return;
        const ax = anchorX === undefined ? window.innerWidth / 2 : anchorX;
        const ay = anchorY === undefined ? window.innerHeight / 2 : anchorY;
        const before = screenToWorld(ax, ay);
        view.zoom = z;
        view.x = ax - before.x * z;
        view.y = ay - before.y * z;
        scheduleView();
        // Neither setZoom nor zoomToFit persisted anything, and the wheel
        // handler's debouncedSave sits AFTER its `if (e.ctrlKey) … return`, so
        // Ctrl+wheel, the +/− buttons and Fit all reverted to 100% on reload —
        // at a pan that HAD been saved, so you came back somewhere you never
        // were. Debounced: zooming is a stream of small steps.
        debouncedSave(400);
      }

      function zoomBy(direction, anchorX, anchorY) {
        setZoom(
          direction > 0 ? view.zoom * ZOOM_STEP : view.zoom / ZOOM_STEP,
          anchorX,
          anchorY
        );
      }

      // The answer to "where did my window go" on a canvas three times the
      // size of the screen.
      function zoomToFit() {
        if (!view.on) return;
        const windows = modeWindows().filter(
          (el) => el.style.display !== "none"
        );
        if (!windows.length) {
          resetView();
          return;
        }
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        windows.forEach((el) => {
          const x = parseFloat(el.dataset.x) || 0;
          const y = parseFloat(el.dataset.y) || 0;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x + el.offsetWidth);
          maxY = Math.max(maxY, y + el.offsetHeight);
        });
        const margin = 40;
        const vw = window.innerWidth;
        const nav = navMenuBounds();
        const vh = nav && nav.height ? window.innerHeight - nav.height - 24 : window.innerHeight;
        const zoom = Math.min(
          ZOOM_MAX,
          Math.max(
            ZOOM_MIN,
            Math.min(
              (vw - margin * 2) / Math.max(1, maxX - minX),
              (vh - margin * 2) / Math.max(1, maxY - minY)
            )
          )
        );
        view.zoom = zoom;
        view.x = (vw - (maxX - minX) * zoom) / 2 - minX * zoom;
        view.y = (vh - (maxY - minY) * zoom) / 2 - minY * zoom;
        applyView();
        saveSession();
        showStatus(`Fitted ${windows.length} window${windows.length === 1 ? "" : "s"}.`);
      }

      /* The default viewpoint, and the one 1:1 goes back to: the middle of the
         world, never its top-left CORNER. The corner is empty, windows are
         placed into whatever is on screen, and clampPan() caps pan at 0 — so
         opening there leaves no world above or to the left and half the drag
         directions are dead on arrival. */
      function centerCanvasView() {
        const world = computeWorldSize();
        view.zoom = 1;
        view.x = Math.round((window.innerWidth - world.w) / 2);
        view.y = Math.round((window.innerHeight - world.h) / 2);
      }

      function resetView() {
        if (!view.on) return;
        centerCanvasView();
        applyView();
        saveSession();
      }

      function toggleCanvasMode(force) {
        const next = force === undefined ? !view.on : !!force;
        if (next === view.on) return;

        /* Windows do not move across the toggle any more — each desk keeps its
           own, and they simply stop being shown. What still has to be carried
           is the canvas viewpoint, because `view` is reset to the identity
           transform while the canvas is off. */
        if (view.on) {
          canvasViewMemory = { x: view.x, y: view.y, zoom: view.zoom };
        }
        view.on = next;

        if (next) {
          if (canvasViewMemory) {
            computeWorldSize();
            view.zoom = Math.min(
              ZOOM_MAX,
              Math.max(ZOOM_MIN, parseFloat(canvasViewMemory.zoom) || 1)
            );
            view.x = parseFloat(canvasViewMemory.x) || 0;
            view.y = parseFloat(canvasViewMemory.y) || 0;
          } else {
            centerCanvasView(); // first visit
          }
          clampPan();
        } else {
          view.zoom = 1;
          view.x = 0;
          view.y = 0;
        }

        applyModeVisibility();
        /* The staircase anchor is a coordinate on the desk we just left, and
           the two desks do not share a coordinate space. Left set, it would
           drop the next window somewhere off-screen. */
        cascadeAnchor = null;
        applyView();
        // The active window may belong to the desk that just went away.
        const active = activeWindow && document.getElementById(activeWindow);
        if (active && !inCurrentMode(active)) {
          activeWindow = null;
          active.classList.remove("active");
        }
        refreshChrome();
        if (next) drawMapWindows();

        /* Say what happened to the windows. An empty canvas after a toggle is
           the correct result of a separate desk, but it looks exactly like
           having lost everything, so it is worth a sentence. */
        const here = modeWindows().length;
        if (next) {
          showStatus(
            here
              ? "Big canvas on — drag the background to pan, Ctrl+wheel to zoom."
              : "Big canvas on — a separate workspace, so it starts empty. Your windows are safe in the plain view."
          );
        } else {
          showStatus(
            here
              ? "Big canvas off."
              : "Big canvas off — the plain view is empty; your canvas windows are still on the canvas."
          );
        }
        saveSession();
      }

      // Usable canvas: where a new window should be dropped so it lands in
      // sight. Off, that is the viewport minus whatever edge the toolbar
      // occupies; on, it is the slice of the world currently on screen.
      function canvasBounds() {
        const pad = 12;
        const nav = navMenuBounds();
        const openTop = pad;
        const openBottom = window.innerHeight - pad;
        let top = openTop;
        let bottom = openBottom;
        if (nav && nav.height) {
          // Toolbar is bottom-anchored on desktop, top-anchored on narrow screens.
          if (nav.top > window.innerHeight / 2) bottom = nav.top - pad;
          else top = nav.bottom + pad;
        }
        if (view.on) {
          const tl = screenToWorld(pad, top);
          const br = screenToWorld(window.innerWidth - pad, bottom);
          return { left: tl.x, top: tl.y, right: br.x, bottom: br.y };
        }
        return {
          left: pad,
          top,
          right: window.innerWidth - pad,
          bottom,
          // The toolbar's column, plus the limits that apply outside it, so
          // clampSpot() can give back the strip down each side. Only meaningful
          // off-canvas: on the big canvas the toolbar floats over world space
          // rather than bounding it, and the world clamp has no nav at all.
          openTop,
          openBottom,
          nav:
            nav && nav.height
              ? { left: nav.left - pad, right: nav.right + pad }
              : null,
        };
      }

      /* Clamp a window into bounds, keeping it clear of the toolbar — but only
         where the toolbar actually is.

         The toolbar is a centred island: on a 1900px screen it spans about 560
         to 1340, roughly 41% of the width. The clamp treated its top edge as a
         floor across the *whole* width, so a window parked at the far left —
         its right edge 400px clear of the toolbar — still stopped dead level
         with the toolbar's top, with ~120px of completely empty canvas beneath
         it. Two dead strips, one down each side, for an obstacle that isn't
         there. (Pre-existing since v3.0; the big canvas just made the wasted
         space easier to see.)

         So the horizontal clamp is resolved first, and the vertical limits are
         then chosen based on whether the window overlaps the toolbar's column
         at that x. Anything clear of it gets the full viewport. */
      function clampSpot(width, height, x, y, b) {
        const maxX = Math.max(b.left, b.right - width);
        const cx = Math.min(Math.max(b.left, x), maxX);

        let top = b.top;
        let bottom = b.bottom;
        if (b.nav) {
          const clearsToolbar = cx + width <= b.nav.left || cx >= b.nav.right;
          if (clearsToolbar) {
            top = b.openTop;
            bottom = b.openBottom;
          }
        }
        const maxY = Math.max(top, bottom - height);
        return { x: cx, y: Math.min(Math.max(top, y), maxY) };
      }

      function clampToCanvas(width, height, x, y) {
        return clampSpot(width, height, x, y, clampBounds());
      }

      // Position a freshly created window. The first one on an empty canvas is
      // centred; every one after that steps down-right from that same anchor,
      // so the pile reads as a predictable staircase rather than scattering
      // (centring each window on its own size put them all back on top of each
      // other, just slightly offset).
      let cascadeAnchor = null;

      function placeWindow(element, width, height) {
        const b = canvasBounds();
        // The staircase cascades off what is on this desk, not off windows the
        // user cannot see.
        const openCount = modeWindows().length;

        // The anchor is a world coordinate, and on the big canvas the visible
        // slice of the world moves. An anchor left over from before a pan would
        // put the new window somewhere off-screen — you press Note and nothing
        // appears. If it is no longer in view, start the staircase again here.
        if (
          view.on &&
          cascadeAnchor &&
          (cascadeAnchor.x < b.left ||
            cascadeAnchor.y < b.top ||
            cascadeAnchor.x > b.right ||
            cascadeAnchor.y > b.bottom)
        ) {
          cascadeAnchor = null;
        }

        if (openCount === 0 || !cascadeAnchor) {
          cascadeAnchor = {
            x: b.left + Math.max(0, (b.right - b.left - width) / 2),
            y: b.top + Math.max(0, (b.bottom - b.top - height) / 2),
          };
          cascadeIndex = 0;
        } else {
          cascadeIndex++;
        }

        // Before a window would run past the edge of the canvas, restart the
        // staircase from the top-left rather than from slot 0 - slot 0 is
        // where the very first window is still sitting.
        const step = cascadeIndex * CASCADE_STEP;
        if (
          cascadeAnchor.x + step + width > b.right ||
          cascadeAnchor.y + step + height > b.bottom
        ) {
          cascadeAnchor = { x: b.left + 12, y: b.top + 12 };
          cascadeIndex = 0;
        }

        const offset = cascadeIndex * CASCADE_STEP;
        const spot = clampToCanvas(
          width,
          height,
          cascadeAnchor.x + offset,
          cascadeAnchor.y + offset
        );
        element.style.left = `${spot.x}px`;
        element.style.top = `${spot.y}px`;
        element.dataset.x = spot.x;
        element.dataset.y = spot.y;
        return spot;
      }

      // Sessions saved on a large monitor used to restore off-screen on a small
      // one, with no way to drag a window back into view.
      function clampWindowIntoView(element) {
        if (!element || element.style.display === "none") return;
        /* A window on the other desk is measured in that desk's coordinates —
           world pixels while we are showing screen pixels, or the reverse — so
           clamping it here would silently rewrite a position that was correct
           where it lives. It is also display:none, so offsetWidth/Height read
           0 and the clamp would compute against a zero-sized box. */
        if (!inCurrentMode(element)) return;
        const spot = clampToCanvas(
          element.offsetWidth,
          element.offsetHeight,
          parseFloat(element.dataset.x) || 0,
          parseFloat(element.dataset.y) || 0
        );
        element.style.left = `${spot.x}px`;
        element.style.top = `${spot.y}px`;
        element.dataset.x = spot.x;
        element.dataset.y = spot.y;
      }

      // Raise + focus. Previously .active was set but never styled, so nothing
      // told the user which note Copy/Paste/Search would act on.
      function wireWindowFocus(element) {
        /* The one call every window type makes on the way in, which makes it
           the place to stamp the desk it was born on — a per-creator stamp
           would be seven chances to forget one, and forgetting one is exactly
           the bug this fixes. Restore overwrites it from the saved record. */
        if (!element.dataset.mode) element.dataset.mode = currentMode();
        const raise = () => setActiveWindow(element.id);
        // mousedown, not click: raising on mouseup felt a beat behind the cursor.
        element.addEventListener("mousedown", raise);
        element.addEventListener("focusin", raise);
        // The one call every window type makes, so it is also the one place a
        // frozen window can be taught to explain itself.
        wireFrozenFeedback(element);
      }

      // The empty canvas and the minimised-window bar both derive purely from
      // the DOM, so one function keeps them honest after any change.
      /* Which toolbar button lights up for which singleton window. */
      const SINGLETON_TOGGLES = [
        ["calculator-toggle", "calculator"],
        ["clock-toggle", "clock"],
        ["log-toggle", "log"],
        ["calendar-toggle", "calendar"],
      ];

      function refreshChrome() {
        // This desk only: the other one's windows are in the DOM but are not
        // open as far as the user is concerned, so they must not suppress the
        // empty-state hint or put chips in the minimised bar.
        const all = modeWindows();
        const emptyState = document.getElementById("empty-state");
        if (emptyState) emptyState.hidden = all.length > 0;

        /* Derived, never bookkept. "Is the Log open?" is a question about
           *this desk*, and the answer changes without anyone touching the Log
           — switching desks is enough. The lit state used to be written at
           open and cleared at close, so after a mode switch all three buttons
           still advertised windows that were sitting on the desk you had just
           left, and clicking one moved it here rather than doing what the lit
           state implied. */
        SINGLETON_TOGGLES.forEach(([buttonId, base]) => {
          const btn = document.getElementById(buttonId);
          if (btn) {
            btn.classList.toggle(
              "active",
              !!document.getElementById(deskInstanceId(base))
            );
          }
        });
        // Everything that adds, closes, minimises or restores a window already
        // funnels through here, so the minimap gets one hook instead of six.
        if (view.on) scheduleMapWindows();

        const bar = document.getElementById("minimized-bar");
        if (!bar) return;
        const minimized = all.filter((el) => el.style.display === "none");
        bar.innerHTML = "";
        minimized.forEach((el) => {
          const label =
            el.querySelector(
              ".window-title, .task-title, .sticky-note-title, .clock-title, .log-title, .calendar-title, .calculator-title, .help-title"
            )?.textContent || el.id;
          const chip = document.createElement("button");
          chip.className = "minimized-chip";
          chip.textContent = label;
          chip.title = `Restore ${label}`;
          chip.addEventListener("click", () => restoreWindow(el.id));
          bar.appendChild(chip);
        });
      }

      function restoreWindow(windowId) {
        const el = document.getElementById(windowId);
        if (!el) return;
        el.style.display = "";
        setActiveWindow(windowId);
        clampWindowIntoView(el);
        refreshChrome();
        saveSession();
      }

      // --- Internal stability helpers (no UI or behavior change) ---
      let _saveTimer = null;
      function debouncedSave(delay = 180) {
        if (_saveTimer) clearTimeout(_saveTimer);
        _saveTimer = setTimeout(() => {
          _saveTimer = null;
          try { saveSession(); } catch (e) { /* swallow */ }
        }, delay);
      }

      // Map of windowId -> ResizeObserver for cleanup
      const _resizeObservers = Object.create(null);

      function registerResizeObserver(windowId, observer) {
        if (_resizeObservers[windowId]) {
          try { _resizeObservers[windowId].disconnect(); } catch (e) {}
        }
        _resizeObservers[windowId] = observer;
      }

      function disconnectResizeObserver(windowId) {
        const obs = _resizeObservers[windowId];
        if (obs) {
          try { obs.disconnect(); } catch (e) {}
          delete _resizeObservers[windowId];
        }
      }

      // How large a window is allowed to grow. The viewport is the right answer
      // only while the viewport *is* the canvas; once the world is three
      // screens across, capping a note at one screen is an arbitrary ceiling on
      // the whole point of the feature.
      function sizingBasis() {
        if (!view.on) {
          return { w: window.innerWidth, h: window.innerHeight };
        }
        const world = computeWorldSize();
        return { w: world.w, h: world.h };
      }

      function setMaxDimensions() {
        const basis = sizingBasis();
        const textareaContainers = document.querySelectorAll(
          ".textarea-container"
        );
        textareaContainers.forEach((container) => {
          const windowElement = container.closest(".window");
          if (windowElement) {
            const headerHeight =
              windowElement.querySelector(".window-header").offsetHeight || 30;
            const paddingAndBorders = 22;
            const buttonsHeight =
              windowElement.querySelector(".format-buttons")?.offsetHeight || 0;
            const countsHeight =
              windowElement.querySelector(".counts")?.offsetHeight || 0;
            const logInputHeight =
              windowElement.querySelector(".note-log-input-container")
                ?.offsetHeight || 0;
            const maxHeight =
              basis.h -
              headerHeight -
              paddingAndBorders -
              buttonsHeight -
              countsHeight -
              logInputHeight -
              20;
            const maxWidth = basis.w - 32 - 20;
            container.style.maxHeight = `${maxHeight}px`;
            container.style.maxWidth = `${Math.min(
              maxWidth,
              basis.w - 50
            )}px`;
            windowElement.style.maxWidth = `${Math.min(
              maxWidth + 32,
              basis.w - 30
            )}px`;
            windowElement.style.maxHeight = `${
              maxHeight +
              headerHeight +
              paddingAndBorders +
              buttonsHeight +
              countsHeight +
              logInputHeight
            }px`;
          }
        });
      }
      function addStickyNote() {
        // Each add* function used to count a different subset (sticky notes
        // counted only sticky notes; the others ignored sticky notes and the
        // calculator entirely), so the "maximum" moved depending on which
        // button you pressed. One selector, one limit.
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }

        windowCount++;
        stickyCount++;
        const stickyLabel = stickyCount > 1 ? `Sticky Note ${stickyCount}` : "Sticky Note";
        const windowId = `sticky-note-${windowCount}`;
        const windowsContainer = document.getElementById("windows");
        const newStickyNote = document.createElement("div");
        newStickyNote.className = "sticky-note-window";
        newStickyNote.id = windowId;
        newStickyNote.style.zIndex = nextWindowZ();
        newStickyNote.dataset.width = 412;
        newStickyNote.dataset.height = 431;
        newStickyNote.style.width = "412px";
        newStickyNote.style.height = "431px";
        // These were "50" without a unit, so the declarations were invalid and
        // dropped; the note landed wherever static flow put it.
        placeWindow(newStickyNote, 412, 431);
        // Only seed the swatch inputs from the theme; do NOT write the colours
        // to element.style. Baking them in at creation time froze the note to
        // whichever theme was active when it was made, so switching to light
        // mode left dark text on a still-dark note (1.2:1). Left unset, the
        // CSS --sticky-bg / --sticky-text tokens follow the theme, and an
        // explicit user pick still overrides them via the change handlers.
        const computedStyles = getComputedStyle(document.body);
        const defaultBgColor =
          computedStyles.getPropertyValue("--sticky-bg").trim() || "#2b2718";
        const defaultTextColor =
          computedStyles.getPropertyValue("--sticky-text").trim() || "#f6ecd2";

        newStickyNote.innerHTML = `
    <div class="sticky-note-header">
        <span class="sticky-note-title">${stickyLabel}</span>
        <div class="sticky-note-controls">
            <span class="edit-window" onclick="startRename('${windowId}')" title="Rename" role="button" tabindex="0">✏️</span>
            <span class="minimize-window" onclick="minimizeStickyNote('${windowId}')" title="Minimize" role="button" tabindex="0">🗕</span>
            <span class="sticky-lock-window" onclick="toggleWindowLock('${windowId}')" title="Freeze editing, dragging and resizing (not encryption)" role="button" tabindex="0">🔓</span>
            <span class="close-sticky-note" onclick="closeWindow('${windowId}')" title="Close" role="button" tabindex="0">×</span>
        </div>
    </div>
    <div class="sticky-note-toolbar">
        <label for="sticky-note-color-${windowId}">Background:</label>
        <input type="color" id="sticky-note-color-${windowId}" value="${defaultBgColor}" onchange="changeStickyNoteColor('${windowId}', this.value)">
        <label for="sticky-note-text-color-${windowId}">Text:</label>
        <input type="color" id="sticky-note-text-color-${windowId}" value="${defaultTextColor}" onchange="changeStickyNoteTextColor('${windowId}', this.value)">
        <div class="sticky-toolbar-actions">
            <button class="sticky-copy" onclick="copyStickyNoteText('${windowId}')" title="Copy this note's text" aria-label="Copy sticky note text">Copy</button>
            <button class="sticky-reset-colors" onclick="resetStickyColors('${windowId}')" title="Reset colours to follow the theme" aria-label="Reset sticky note colours to follow the theme">Reset</button>
        </div>
    </div>
    <textarea class="sticky-note-content" placeholder="Write something..."></textarea>
`;

        windowsContainer.appendChild(newStickyNote);
        makeDraggable(newStickyNote);
        wireWindowFocus(newStickyNote);
        setActiveWindow(windowId);
        refreshChrome();
        const resizeObserver = new ResizeObserver(() => {
          newStickyNote.dataset.width = newStickyNote.offsetWidth;
          newStickyNote.dataset.height = newStickyNote.offsetHeight;
          // style.left, not getBoundingClientRect().left: the rect is the
          // *transformed* box, so on a zoomed canvas every resize would write a
          // screen coordinate back into a world-coordinate field and walk the
          // note across the canvas. Resizing does not move a window anyway.
          newStickyNote.dataset.x = parseFloat(newStickyNote.style.left) || 0;
          newStickyNote.dataset.y = parseFloat(newStickyNote.style.top) || 0;
          debouncedSave(220);
        });
        registerResizeObserver(windowId, resizeObserver);
        resizeObserver.observe(newStickyNote);
        return newStickyNote;
      }

      // A failed save is silent by nature — nothing on screen changes — so it
      // gets a sticky badge rather than a toast that scrolls away. The toast
      // fires only on the transition into failure, because saveSession() runs
      // on almost every keystroke and would otherwise shout continuously.
      let saveFailed = false;

      function reportSaveFailure(message) {
        if (saveFailed) return;
        saveFailed = true;
        const badge = document.getElementById("save-warning");
        if (badge) {
          badge.textContent = "⚠ Not saving";
          badge.title = message;
          badge.style.display = "block";
        }
        showStatus(message);
      }

      function clearSaveFailure() {
        if (!saveFailed) return;
        saveFailed = false;
        const badge = document.getElementById("save-warning");
        if (badge) badge.style.display = "none";
        showStatus("Saving again — the session was written successfully.");
      }

      function buildSessionSnapshot() {
        const session = {};
        document
          .querySelectorAll(".window, .task-window")
          .forEach((windowElement) => {
            const windowId = windowElement.id;
            const textarea = document.getElementById(`clipboard-${windowId}`);
            const title = windowElement.querySelector(
              ".window-title, .task-title, .sticky-note-title"
            ).textContent;
            // A note's size lives on its .textarea-container — the window box
            // is DERIVED from it by updateWindowSize(). Saving only the derived
            // box meant restore rebuilt the container at its hardcoded default,
            // the ResizeObserver's first callback recomputed the window from
            // that default, and the debounced save then wrote the shrunken size
            // back over the real one. One reload destroyed the resize for good.
            const sizeTarget = resizeTargetFor(windowElement);
            // Through measuredBox for the same reason as the window box: the
            // container is inside a display:none window and measures 0 too.
            const targetBox =
              sizeTarget && sizeTarget !== windowElement
                ? measuredBox(sizeTarget)
                : null;
            const ownSize = targetBox
              ? {
                  containerWidth: targetBox.width,
                  containerHeight: targetBox.height,
                }
              : null;
            const box = measuredBox(windowElement);
            session[windowId] = {
              ...(ownSize || {}),
              mode: windowMode(windowElement),
              position: {
                left: windowElement.dataset.x || "50",
                top: windowElement.dataset.y || "50",
              },
              width: box.width,
              height: box.height,
              zIndex: parseInt(windowElement.style.zIndex) || 0,
              minimized: windowElement.style.display === "none",
              content: textarea ? textarea.value : "",
              name: title,
              isTaskWindow: windowElement.classList.contains("task-window"),
              locked: windowElement.dataset.locked === "true",
              tasks: windowElement.classList.contains("task-window")
                ? Array.from(windowElement.querySelectorAll(".task-item")).map(
                    (item) => ({
                      text: item.querySelector("span").textContent,
                      completed: item.classList.contains("completed"),
                    })
                  )
                : [],
            };
          });
        /* Up to two of each — one per desk — each under its own key. The
           old code wrote a phantom `log` record when no log window existed,
           carrying the entries; nothing ever read it back (restore only acts
           on a record with visible:true), so it is gone rather than
           reproduced twice. Entries still survive close-and-reopen within a
           tab, which is where that behaviour was actually visible. */
        SINGLETON_KINDS.forEach((kind) => {
          [WINDOWED, CANVAS].forEach((mode) => {
            const el = document.getElementById(deskInstanceId(kind.base, mode));
            if (!el) return;
            session[singletonKey(kind.key, mode)] = buildSingletonRecord(
              kind.base,
              el
            );
          });
        });
        // The theme token only. <body> now also carries the transient canvas
        // classes, and persisting the whole className would save "canvas-panning"
        // if the tab closed mid-drag and restore a stuck grabbing cursor.
        session.theme = document.body.classList.contains("dark-mode")
          ? "dark-mode"
          : "light-mode";
        /* `on` is which desk is showing; x/y/zoom always mean the canvas
           viewpoint. While the canvas is off, `view` holds the identity
           transform — persisting that would forget where the user was on the
           canvas and drop them at the default centre next time, so persist the
           remembered viewpoint instead of the live one.

           `seen` says whether there is a viewpoint to remember at all. Without
           it the placeholder written for a session that has never opened the
           canvas — {0, 0, zoom 1} — is indistinguishable from a real viewpoint
           parked at the top-left corner, and restore believed it. That is what
           made the canvas open in the corner on every machine where it had
           been saved once with the canvas off. */
        const seenCanvas = view.on || !!canvasViewMemory;
        const canvasView = view.on
          ? { x: view.x, y: view.y, zoom: view.zoom }
          : canvasViewMemory || { x: 0, y: 0, zoom: 1 };
        session.canvas = {
          on: view.on,
          seen: seenCanvas,
          x: canvasView.x,
          y: canvasView.y,
          zoom: canvasView.zoom,
        };
        document
          .querySelectorAll(".sticky-note-window")
          .forEach((stickyNote) => {
            const windowId = stickyNote.id;
            const content = stickyNote.querySelector(
              ".sticky-note-content"
            ).value;
            // Empty means "no explicit pick, follow the theme" - persist that
            // rather than snapshotting whatever the theme happened to be.
            const bgColor = stickyNote.style.backgroundColor || "";
            const textColor =
              stickyNote.querySelector(".sticky-note-content").style.color || "";
            const title =
              stickyNote.querySelector(".sticky-note-title").textContent;
            const stickyBox = measuredBox(stickyNote);
            session[windowId] = {
              locked: stickyNote.dataset.locked === "true",
              mode: windowMode(stickyNote),
              position: {
                left: stickyNote.dataset.x || "50",
                top: stickyNote.dataset.y || "50",
              },
              width: stickyBox.width,
              height: stickyBox.height,
              zIndex: parseInt(stickyNote.style.zIndex) || 0,
              minimized: stickyNote.style.display === "none",
              content,
              color: bgColor,
              textColor,
              // Distinguishes a deliberate colour choice from a theme default
              // that merely happened to be inline. Absent in pre-v3.0 sessions,
              // which is what the restore heuristic is for.
              customColor: stickyNote.dataset.customColor === "true",
              name: title,
            };
          });
        session.zIndexCounter = zIndexCounter;
        // Mute is a preference, not window state — one flag for the whole app.
        session.timerSound = alertSoundOn;
        /* Events are content, and shared by every calendar window rather than
           owned by one, so they are written from the store and not read back off
           the DOM the way log rows are. The store IS the truth here. */
        session.events = calendarEvents.slice(0, MAX_EVENTS);
        return session;
      }

      // Serial writes when unprotected; AES-GCM envelope when Protect is on.
      // Callers stay sync — encryption is fire-and-forget with failure badge.
      let _persistSeq = 0;
      function saveSession() {
        // While restoring we rebuild the DOM by replaying add*() helpers, each of
        // which calls saveSession(); skip those so we never persist a partial
        // mid-restore snapshot. loadSessionFromStorage() does one final save itself.
        if (restoring) return;
        // Boot has not settled yet — the DOM on screen is not the session.
        if (!booted) return;
        // A locked session is unreadable to us but intact on disk. Writing
        // anything here destroys it, so do nothing at all until it is unlocked.
        if (sessionLocked) return;
        try {
          const session = buildSessionSnapshot();
          if (!sessionPassphrase) {
            const serialized = JSON.stringify(session);
            if (serialized.length > MAX_SESSION_CHARS) {
              console.warn("Session too large to save safely, skipping write.");
              reportSaveFailure(
                "Session too large to save — save a Backup, then close or trim a window."
              );
              return;
            }
            localStorage.setItem(SESSION_KEY, serialized);
            clearSaveFailure();
            return;
          }
          const seq = ++_persistSeq;
          persistSessionPayload(session)
            .then((ok) => {
              if (seq !== _persistSeq) return; // a newer save superseded this one
              if (!ok) return;
            })
            .catch((e) => {
              if (seq !== _persistSeq) return;
              console.error("Failed to save encrypted session:", e);
              reportSaveFailure(
                "Failed to save encrypted session — save a Backup before closing this tab."
              );
            });
        } catch (e) {
          console.error("Failed to save session to localStorage:", e);
          reportSaveFailure(
            "Failed to save session — save a Backup before closing this tab."
          );
        }
      }

      function addWindow() {
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }
        windowCount++;
        noteCount++;
        const noteLabel = noteCount > 1 ? `Note ${noteCount}` : "Note";
        const windowId = `window${windowCount}`;
        const windowsContainer = document.getElementById("windows");
        const newWindow = document.createElement("div");
        newWindow.className = "window";
        newWindow.id = windowId;

        // Center the window. The note's true source-of-truth for size is the
        // resizable .textarea-container (see updateWindowSize); the window then
        // sizes to fit it. These defaults match the container 525x287 below,
        // which yields a 493x285 textarea.
        const defaultWidth = 557;
        const defaultHeight = 429;
        newWindow.style.zIndex = nextWindowZ();
        newWindow.dataset.width = defaultWidth;
        newWindow.dataset.height = defaultHeight;
        newWindow.style.width = `${defaultWidth}px`;
        newWindow.style.height = `${defaultHeight}px`;
        placeWindow(newWindow, defaultWidth, defaultHeight);
        newWindow.innerHTML = `
        <div class="window-header">
            <span class="window-title">${noteLabel}</span>
                <div class="window-controls">
        <span class="edit-window" onclick="startRename('${windowId}')" title="Rename" role="button" tabindex="0">✏️</span>
        <span class="minimize-window" onclick="minimizeWindow('${windowId}')" title="Minimize" role="button" tabindex="0">🗕</span>
        <span class="lock-window" onclick="toggleWindowLock('${windowId}')" title="Freeze editing, dragging and resizing (not encryption)" role="button" tabindex="0">🔓</span>
        <span class="close-window" onclick="closeWindow('${windowId}')" title="Close" role="button" tabindex="0">×</span>
    </div>
        </div>
        <div class="window-content">
            <div class="textarea-container" style="width: 525px; height: 287px;">
                <div class="line-numbers" id="line-numbers-${windowId}">1</div>
                <textarea id="clipboard-${windowId}" placeholder="Paste or type your text here..." oninput="updateLineNumbers('${windowId}'); updateCounts('${windowId}');"></textarea>
            </div>
            <div class="note-log-input-container">
                <input type="text" class="note-log-input" id="note-log-input-${windowId}" placeholder="Enter log description...">
                <button class="note-log-button" onclick="addNoteLogEntry('${windowId}')">Add Log</button>
            </div>
            <div class="format-buttons">
              <button class="clear-note-button clear-note-button--mini" onclick="clearNoteText('${windowId}')">Clear</button>
                <button onclick="toUpperCase('${windowId}')">Uppercase</button>
                <button onclick="toLowerCase('${windowId}')">Lowercase</button>
                <button onclick="copyNoteText('${windowId}')">Copy</button>
            </div>
            <div class="counts" id="counts-${windowId}">Words: 0, Characters: 0</div>
        </div>
    `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow(windowId);
        refreshChrome();
        const textarea = document.getElementById(`clipboard-${windowId}`);
        textarea.addEventListener("scroll", () => syncScroll(windowId));
        // Debounced persistence for stability (no behavior change)
        textarea.addEventListener("input", () => debouncedSave(160), { passive: true });
        const logInput = document.getElementById(`note-log-input-${windowId}`);
        logInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addNoteLogEntry(windowId);
          }
        });
        updateLineNumbers(windowId);
        updateCounts(windowId);
        setMaxDimensions();
        saveSession();
        const textareaContainer = newWindow.querySelector(
          ".textarea-container"
        );
        const resizeObserver = new ResizeObserver(() => {
          updateWindowSize(windowId);
          debouncedSave(220);
        });
        registerResizeObserver(windowId, resizeObserver);
        resizeObserver.observe(textareaContainer);
        return newWindow;
      }

      function addTaskWindow() {
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }
        windowCount++;
        taskCount++;
        const taskLabel = taskCount > 1 ? `Task List ${taskCount}` : "Task List";
        const windowId = `window${windowCount}`;
        const windowsContainer = document.getElementById("windows");
        const newWindow = document.createElement("div");
        const resizeObserver = new ResizeObserver(() => {
          newWindow.dataset.width = newWindow.offsetWidth;
          newWindow.dataset.height = newWindow.offsetHeight;
          debouncedSave(220);
        });
        registerResizeObserver(windowId, resizeObserver);
        resizeObserver.observe(newWindow);
        newWindow.className = "task-window";
        newWindow.id = windowId;
        newWindow.style.zIndex = nextWindowZ();
        newWindow.dataset.width = 400;
        newWindow.dataset.height = 500;
        newWindow.style.width = "400px";
        newWindow.style.height = "500px";
        placeWindow(newWindow, 400, 500);
        newWindow.innerHTML = `

            <span class="task-title">${taskLabel}</span>
            <div class="task-controls">

                <span class="minimize-window" onclick="minimizeWindow('${windowId}')" title="Minimize" role="button" tabindex="0">🗕</span>
                <span class="lock-window" onclick="toggleWindowLock('${windowId}')" title="Freeze editing, dragging and resizing (not encryption)" role="button" tabindex="0" aria-pressed="false">🔓</span>
                <span class="close-task" onclick="closeWindow('${windowId}')" title="Close" role="button" tabindex="0">×</span>
            </div>
        </div>
      <div class="task-content">
    <div class="task-input-container">
        <input type="text" class="task-input" id="task-input-${windowId}" placeholder="Enter task...">
        <button class="note-log-button" onclick="addTask('${windowId}')">Add</button>
    </div>

    </div>
</div>
    `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow(windowId);
        refreshChrome();
        const taskInput = document.getElementById(`task-input-${windowId}`);
        taskInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addTask(windowId);
          }
        });
        saveSession();
        showStatus("Task window created!");
        return newWindow;
      }
      function clearTaskWindow(windowId) {
        const taskList = document.getElementById(`task-list-${windowId}`);
        const taskInput = document.getElementById(`task-input-${windowId}`);
        // Clearing is destructive and there is no undo, so don't do it silently.
        if (taskList && taskList.children.length > 0) {
          const count = taskList.children.length;
          if (
            !confirm(
              `Delete all ${count} task${count === 1 ? "" : "s"} in this list? This cannot be undone.`
            )
          ) {
            return;
          }
        }
        if (taskList) {
          taskList.innerHTML = "";
        }
        if (taskInput) {
          taskInput.value = "";
        }
        saveSession();
        showStatus("Task list cleared.");
      }

      // Single builder for both new tasks and restored ones, so the two paths
      // can't drift (the restore path previously produced items with no
      // delete button and a differently-wired checkbox).
      function createTaskItem(windowId, text, completed) {
        const taskItem = document.createElement("div");

      function updateWindowSize(windowId) {
        const textareaContainer = document.querySelector(
          `#${windowId} .textarea-container`
        );
        const windowElement = document.getElementById(windowId);
        /* Every measurement below reads 0 on a window that is not being
           rendered — minimised, or belonging to the other desk — and the
           results are written straight back as style.width/height. Hiding a
           window fires the ResizeObserver (its box really did change, to
           nothing), so without this guard switching desks permanently resized
           every note on the desk being left to 32x52. */
        if (
          windowElement &&
          !windowElement.offsetWidth &&
          !windowElement.offsetHeight
        ) {
          return;
        }
        if (textareaContainer && windowElement) {
          // sizingBasis(), not window.innerWidth: on the big canvas the note
          // can legitimately be wider than the screen, and clamping to the
          // viewport here silently undid any resize past it — the one place
          // that still disagreed with setMaxDimensions().
          const containerWidth = Math.min(
            textareaContainer.offsetWidth,
            sizingBasis().w - 50
          );
          const containerHeight = textareaContainer.offsetHeight;
          const newWidth = containerWidth + 32;
          const headerHeight =
            windowElement.querySelector(".window-header").offsetHeight || 30;
          const paddingAndBorders = 22;
          const buttonsHeight =
            windowElement.querySelector(".format-buttons")?.offsetHeight || 0;
          // Was document.querySelector(".counts") - the first .counts in the
          // whole document, i.e. some other window's, once more than one note
          // was open.
          const countsHeight =
            windowElement.querySelector(".counts")?.offsetHeight || 0;
          const logInputHeight =
            windowElement.querySelector(".note-log-input-container")
              ?.offsetHeight || 0;
          const newHeight =
            containerHeight +
            headerHeight +
            paddingAndBorders +
            buttonsHeight +
            countsHeight +
            logInputHeight;
          windowElement.style.width = `${Math.min(
            newWidth,
            sizingBasis().w - 30
          )}px`;
          windowElement.style.height = `${newHeight}px`;
          windowElement.dataset.width = newWidth;
          windowElement.dataset.height = newHeight;
          setMaxDimensions();
        }

      function updateCalculatorHistory(windowId) {
        const historyDiv = instancePart(windowId, "calculator-history");
        if (!historyDiv) return;
        // textContent, not innerHTML: the expression is whatever was typed into
        // the calculator, it is stored verbatim on the error path too, and it is
        // replayed on every restore. Interpolated into markup it was a script
        // sink that survived a reload and rode along inside Backup — i.e.
        // it executed in the recipient's origin.
        historyDiv.textContent = "";
        stateFor(windowId).history.forEach((entry) => {
          const row = document.createElement("p");
          row.textContent = `${entry.expression} = ${entry.result}`;
          historyDiv.appendChild(row);

      function calculate(windowId) {
        const input = instancePart(windowId, "calculator-input");
        const display = instancePart(windowId, "calculator-display");
        if (input && display) {
          let expression = input.value;
          if (!expression) {
            display.value = "0";
            return;
          }
          const history = stateFor(windowId).history;
          try {
            let result = evaluateExpression(expression);
            display.value = isFinite(result) ? result : "Error";
            history.push({ expression, result: display.value });
          } catch {
            display.value = "Error";
            history.push({ expression, result: "Error" });
          }
          updateCalculatorHistory(windowId);
          saveSession();
        }
      }

      function evaluateExpression(expression) {
        expression = expression.replace(/×/g, "*").replace(/%/g, "/100");
        while (expression.includes("√")) {
          const sqrtIndex = expression.indexOf("√");
          let number = "";
          let i = sqrtIndex + 1;
          while (i < expression.length && /\d|\./.test(expression[i])) {
            number += expression[i];
            i++;
          }
          const sqrtValue = Math.sqrt(parseFloat(number));
          expression =
            expression.substring(0, sqrtIndex) +
            sqrtValue +
            expression.substring(i);
        }
        const tokens = expression.match(/(\d*\.?\d+|[+\-*/])/g);
        if (!tokens) throw new Error("Invalid expression");

        // This used to fold strictly left-to-right, so 2+3*4 gave 20 instead of
        // 14. Resolve × and ÷ in a first pass, then + and - in a second.
        const terms = [parseFloat(tokens[0])];
        const ops = [];
        if (isNaN(terms[0])) throw new Error("Invalid number");
        for (let i = 1; i < tokens.length; i += 2) {
          const operator = tokens[i];
          const nextNumber = parseFloat(tokens[i + 1]);
          if (isNaN(nextNumber)) throw new Error("Invalid number");
          if (operator === "*" || operator === "/") {
            const left = terms.pop();
            if (operator === "/" && nextNumber === 0) {
              throw new Error("Division by zero");
            }
            terms.push(operator === "*" ? left * nextNumber : left / nextNumber);
          } else {
            ops.push(operator);
            terms.push(nextNumber);
          }
        }

        let result = terms[0];
        for (let i = 0; i < ops.length; i++) {
          result = ops[i] === "+" ? result + terms[i + 1] : result - terms[i + 1];
        }
        return result;
      }
