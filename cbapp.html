        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      #empty-state .empty-hint {
        font-size: 13px;
        max-width: 52ch;
        line-height: 1.7;
        color: var(--text-dim);
        margin: 0;
      }

      #empty-state strong {
        color: var(--text);
        font-weight: 600;
      }

      #empty-state kbd {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 6px;
        color: var(--text-dim);
      }

      /* --- Minimised windows need a way back ---
         minimizeWindow() sets display:none and the only route back was an
         undiscoverable hover tooltip. This is a real restore bar. */
      #minimized-bar {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: 40vw;
        z-index: 1001;
      }

      #minimized-bar:empty {
        display: none;
      }

      .minimized-chip {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .minimized-chip:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* --- Small screens ---
         The nav is width:max-content / flex-wrap:nowrap, so on a phone it ran
         far past the viewport with no way to reach the right-hand buttons. */
      @media (max-width: 720px) {
        .nav-menu {
          top: 8px;
          bottom: auto;
          left: 8px;
          right: 8px;
          transform: none;
          width: auto;
          max-width: none;
          flex-wrap: wrap;
        }

        .nav-row {
          justify-content: center;
          flex-wrap: wrap;
        }

        /* The vertical group dividers only read as separators on one line;
           once the toolbar wraps they become stray floating strokes. */
        .nav-group {
          flex-wrap: wrap;
          justify-content: center;
          border-right: none;
          padding: 0 4px;
        }

        #status,
        #search-replace {
          top: auto;
          bottom: 18px;
        }

        #search-replace.active ~ #status {
          top: auto;
          bottom: 92px;
        }

        #search-replace {
          flex-wrap: wrap;
          justify-content: center;
          border-radius: 16px;
          max-width: calc(100vw - 32px);
        }

        #search-replace input {
          width: 100%;
        }

        #empty-state {
          padding-bottom: 0;
        }

        /* Keep the minimized chips clear of the download chip in the corner
           instead of letting the two rows overlap on a narrow screen. */
        #minimized-bar {
          max-width: calc(100vw - 32px);
          bottom: 64px;
        }
      }

      /* ==========================================================
         BIG CANVAS
         ----------------------------------------------------------
         #windows already wrapped every window, so it becomes the pan/zoom
         layer as-is: one transform on it moves notes, sticky notes, the
         calculator, clock, log and help window together, while the toolbar,
         search bar, minimised chips and status line stay outside it and
         therefore stay screen-fixed at a constant size.

         It has to be `position: absolute` rather than the static div it was:
         a transformed element becomes the containing block for its
         absolutely-positioned descendants, so without this every window's
         left/top would silently re-anchor from .whiteboard to #windows the
         moment the canvas switched on. Sized to the viewport and untransformed
         while the canvas is off, which is byte-for-byte today's geometry.
         ========================================================== */
      #windows {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
        /* Below the chrome layer (nav and friends start at 1000) but above the
           whiteboard background. Windows themselves run 1..900 inside here. */
        z-index: 1;
      }

      /* Panning has to feel like grabbing the surface, so the layer itself
         takes the pointer while the canvas is on. Windows re-enable it. */
      body.canvas-on #windows {
        cursor: grab;
        outline: 1px solid var(--border);
      }

      body.canvas-on.canvas-panning #windows {
        cursor: grabbing;
      }

      /* Hint the compositor only while a gesture is actually in flight. Left on
         permanently it costs a promoted layer the size of the whole world for
         nothing; switched on at gesture start it keeps pan and zoom off the
         main thread's paint path, which is most of what made them stutter. */
      body.canvas-interacting #windows {
        will-change: transform;
      }

      /* --- Dot grid ---
         A viewport-sized *fixed* backdrop, with the view driven through
         background-position and background-size, rather than a background on
         #windows itself. Painted on #windows it was a ~13 Mpx surface that had
         to repaint on every single transform change — the single biggest cause
         of the stutter — and it also stopped dead at the world edge. One
         screenful repaints instead of nine, and the grid now runs forever. */
      #canvas-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: none;
        pointer-events: none;
        background-image: radial-gradient(
          circle at center,
          var(--canvas-dot) 1.5px,
          transparent 1.6px
        );
      }

      body.canvas-on #canvas-grid {
        display: block;
      }

      :root {
        /* Started at 0.07/0.09, which measured under one step of 8-bit contrast
           against the canvas — invisible in both themes. The light value then
           needed a second pass: a dark dot at 0.24 over the near-white canvas
           lands around #c0c2c7, which is legible on a dim panel and gone on a
           bright one. Both are now pitched to hold up at any brightness while
           staying calm enough to sit behind text. */
        --canvas-dot: rgba(255, 255, 255, 0.28);
      }

      .light-mode {
        --canvas-dot: rgba(15, 23, 42, 0.42);
      }

      /* --- Resize grip ---
         Native CSS `resize` takes its delta in screen pixels and applies it to
         layout pixels. Those are the same thing until a scale exists, after
         which resizing runs at 1/zoom speed — half speed at 50%, double at
         200%. The delta has to go through the same screen->world conversion as
         dragging, and there is no hook into the native behaviour, so the corner
         becomes ours whenever the native one can't be trusted.

         That also covers touch, which has never been able to resize at all:
         the (pointer: coarse) rule below turns the native corner off because it
         is unusable with a finger, and nothing replaced it until now. */
      .resize-grip {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 18px;
        height: 18px;
        display: block;
        cursor: nwse-resize;
        touch-action: none;
        z-index: 2;
      }

      .resize-grip::before {
        content: "";
        position: absolute;
        right: 3px;
        bottom: 3px;
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--text-muted);
        border-bottom: 2px solid var(--text-muted);
        opacity: 0.75;
      }

      .resize-grip:hover::before,
      .resize-grip:focus-visible::before {
        border-color: var(--accent);
        opacity: 1;
      }

      /* Two corners, one of them broken, is worse than one — and one mechanism
         everywhere beats a corner that changes behaviour with the mode. The
         grip is the only resize handle now, in both states. */
      .textarea-container,
      .sticky-note-window,
      .task-window {
        resize: none;
      }

      @media (pointer: coarse) {
        .resize-grip {
          display: block;
          width: 28px;
          height: 28px;
        }
        .resize-grip::before {
          right: 7px;
          bottom: 7px;
          width: 11px;
          height: 11px;
        }
      }

      /* --- Minimap ---
         Sits under the zoom widget. Shows every open window as a block and the
         current viewport as a frame, and is click/drag targetable so it doubles
         as the way to jump across the canvas. */
      #canvas-map {
        position: fixed;
        top: 52px;
        right: 12px;
        z-index: 1002;
        display: none;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        cursor: pointer;
      }

      body.canvas-on #canvas-map {
        display: block;
      }

      #canvas-map-inner {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Sticky, deliberately unmissable: it means work is no longer being
         persisted. Sits clear of the toolbar island and the status toast. */
      #save-warning {
        display: none;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1200;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--danger);
        background: var(--bg-card);
        color: var(--danger);
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        cursor: default;
      }

      /* Sits where #save-warning does — both mean "your work is not being
         written" — but it is a button, because the way out is to unlock. */
      #locked-banner {
        display: none;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1200;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--orange);
        background: var(--bg-card);
        color: var(--orange);
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      #locked-banner:hover {
        background: var(--bg-card-hover);
      }

      #locked-banner:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 2px;
      }

      /* Below 720px the toolbar is top-anchored and full-width, so a badge at
         top:12px sits on top of it and eats the clicks — the lock banner is a
         button, which made the toolbar unusable outright. Both badges move
         above the minimized chips instead, matching #canvas-controls. */
      @media (max-width: 720px) {
        #locked-banner,
        #save-warning {
          top: auto;
          bottom: 108px;
          left: 12px;
        }
      }

      .map-window {
        position: absolute;
        /* --text-muted at 0.55 blended to 1.54:1 against the map panel — the
           blocks ARE the minimap's payload, and at that ratio the map read as
           "one window exists". Full-opacity --text-dim measures ~4.6:1, with a
           hairline border so adjacent blocks still separate. */
        background: var(--text-dim);
        border: 1px solid var(--bg-card);
        border-radius: 1px;
      }

      .map-window.map-active {
        background: var(--accent);
        opacity: 1;
      }

      #map-viewport {
        position: absolute;
        border: 1.5px solid var(--accent);
        border-radius: 2px;
        background: var(--accent-dim);
        pointer-events: none;
      }

      /* 720, matching the toolbar's own breakpoint. At 760 the map vanished
         while the toolbar was still bottom-anchored, so between 721 and 760px
         you lost the overview for no reason. */
      @media (max-width: 720px) {
        /* The widget moves to the bottom on narrow screens; the map would
           cover the canvas, so it goes away entirely. */
        #canvas-map {
          display: none !important;
        }
      }

      /* --- Zoom widget ---
         Top-right: the toolbar owns the bottom centre, the minimised chips own
         the bottom left and the Download CB App chip owns the bottom right. */
      #canvas-controls {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1002;
        display: none;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        font-family: var(--mono);
      }

      body.canvas-on #canvas-controls {
        display: flex;
      }

      #canvas-controls button {
        min-width: 30px;
        height: 28px;
        padding: 0 7px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-dim);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease,
          border-color 0.15s ease;
      }

      #canvas-controls button:hover {
        color: var(--accent);
        background: var(--accent-dim);
        border-color: var(--accent);
      }

      #zoom-level {
        min-width: 52px;
        text-align: center;
        font-size: 12px;
        color: var(--text);
        letter-spacing: 0.02em;
      }

      /* On a narrow screen the toolbar is top-anchored, so drop the widget
         below it rather than letting the two stack on top of each other. */
      @media (max-width: 720px) {
        #canvas-controls {
          top: auto;
          bottom: 108px;
          right: 12px;
        }
      }

      /* In-app dialogs, shared by the passphrase prompt and the confirm box.
         window.prompt() renders the passphrase as plain text on screen — fine
         for a URL, wrong for the one string that guards the whole session — so
         this replaces it with a masked field plus a Show toggle. window.confirm()
         is no better for a destructive answer: it is chrome-styled, says
         "phbeks.com says", and cannot carry the app's own emphasis. Both live
         outside .whiteboard so canvas pan/zoom transforms never move them. */
      .app-modal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(4, 6, 10, 0.6);
      }

      .app-modal.open {
        display: flex;
      }

      .app-modal .pass-card {
        width: 100%;
        max-width: 420px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .app-modal h2 {
        margin: 0;
        font-size: 16px;
        color: var(--text);
      }

      .app-modal .pass-message {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-dim);
        white-space: pre-line;
      }

      .app-modal label {
        font-size: 12px;
        color: var(--text-dim);
      }

      .app-modal .pass-field {
        display: flex;
        gap: 6px;
      }

      .app-modal input {
        flex: 1;
        min-width: 0;
        padding: 9px 10px;
        font-family: var(--mono);
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .app-modal input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-dim);
      }

      .app-modal button {
        padding: 9px 14px;
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        background: var(--bg-card-hover);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }

      .app-modal button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .app-modal button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .app-modal .pass-reveal {
        min-width: 62px;
        font-family: var(--font);
      }

      .app-modal .pass-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }

      .app-modal .pass-actions .primary {
        color: #04120f;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }

      .app-modal .pass-actions .primary:hover {
        color: #04120f;
        filter: brightness(1.08);
      }

      .light-mode .app-modal .pass-actions .primary,
      .light-mode .app-modal .pass-actions .primary:hover {
        color: #ffffff;
      }

      .app-modal .pass-error {
        margin: 0;
        min-height: 16px;
        font-size: 12px;
        color: var(--danger);
      }

      /* The confirm box's OK button when the answer destroys something. It is
         the one control in the app that should never be clicked by muscle
         memory, so it does not borrow the accent every other primary uses.
         --danger-solid, not --danger: white on the lighter red is 3.3:1, and
         this is the button that most needs to be read before it is pressed. */
      .app-modal .pass-actions .danger {
        color: #fff;
        background: var(--danger-solid);
        border-color: var(--danger-solid);
        font-weight: 600;
      }

      .app-modal .pass-actions .danger:hover {
        color: #fff;
        background: #991b1b;
        border-color: #991b1b;
      }
    </style>
  </head>
  <body class="dark-mode">
    <div class="whiteboard">
      <div id="windows"></div>
      <nav class="nav-menu" aria-label="CB App toolbar">
        <div class="nav-row">
          <button
            class="nav-toggle"
            type="button"
            onclick="toggleNavMenu()"
            aria-label="Expand toolbar"
            aria-expanded="false"
          >
            ☰
          </button>
          <div class="nav-group">
            <div class="nav-btn-dropdown">
              <button onclick="addWindow()" data-tooltip="New Note" data-tooltip-type="note">
                Note
              </button>

      id="confirm-modal"
      class="app-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
      aria-describedby="confirm-modal-message"
    >
      <div class="pass-card">
        <h2 id="confirm-modal-title">Are you sure?</h2>
        <p id="confirm-modal-message" class="pass-message"></p>
        <div class="pass-actions">

    <script type="text/javascript">
      /* The build this file is. Shown in small print on the Download chip so a
         copy saved to disk months ago can be told apart from the current one —
         the file is always called cbapp.html, and until now nothing inside it
         said which build it was without reading the source comment.

         Stamped into the chip at boot rather than written straight into the
         markup, so the constant is the only place a release has to change. */
      const CB_APP_VERSION = "4.1.0";

      // --- Session security (v3.2.0) -----------------------------------------
      // Storage keys, optional AES-GCM passphrase wrap, and strict import
      // validation. Passphrase stays in memory only for this tab session.
      const SESSION_KEY = "notepadSession";
      // Written only by the embedded-export restore retired in v3.2.7. Nothing
      // creates them any more; they are listed so Reset and the boot-time
      // purge still clear them out of browsers that used an older build.
      const RETIRED_EXPORT_KEYS = ["notepadSession.prev", "cbappConsumedExport"];
      const ALL_SESSION_KEYS = [SESSION_KEY, ...RETIRED_EXPORT_KEYS];
      const SESSION_FORMAT_VERSION = 1;
      const MAX_SESSION_CHARS = 4500000;
      const MAX_NOTE_CHARS = 800000;
      const MAX_NAME_CHARS = 200;
      const MAX_TASKS = 500;
      const MAX_LOGS = 500;
      const MAX_HISTORY = 200;
      const MAX_EVENTS = 500;
      // Set by validateSessionObject, read by the import and restore messages.
      let eventsDroppedOnValidate = 0;
      const MAX_EVENT_NOTE_CHARS = 2000;
      const PBKDF2_ITERATIONS = 210000;

      // In-memory only — never written to localStorage or to any file.
      // sessionCryptoKey is derived once per unlock/protect so saves do not
      // re-run PBKDF2 on every keystroke.
      let sessionPassphrase = null;
      let sessionCryptoKey = null;
      let sessionKeySalt = null; // Uint8Array, paired with sessionCryptoKey

      // Set when boot found an encrypted session it could not open (wrong
      // passphrase, or the prompt was cancelled). The stored ciphertext is
      // still the user's only copy, so EVERY write is refused while this is
      // true — otherwise the first autosave of the empty screen overwrites it
      // with a plaintext snapshot of nothing and the data is gone for good.
      // Cleared only by a successful unlock, or by an explicit Reset.
      let sessionLocked = false;
      // The envelope we could not open, kept so Unlock can retry without a
      // reload. In memory only; the ciphertext also stays in localStorage.
      let lockedEnvelope = null;

      function clearSessionSecrets() {
        sessionPassphrase = null;
        sessionCryptoKey = null;
        sessionKeySalt = null;
      }

      function clearAllSessionStorage() {
        ALL_SESSION_KEYS.forEach((k) => {
          try {
            localStorage.removeItem(k);
          } catch (e) {
            /* ignore */
          }
        });
      }

      function purgeRetiredExportKeys() {
        RETIRED_EXPORT_KEYS.forEach((k) => {
          try {
            localStorage.removeItem(k);
          } catch (e) {
            /* ignore */
          }
        });
      }

      function isEncryptedEnvelope(obj) {
        return (
          !!obj &&
          typeof obj === "object" &&
          !Array.isArray(obj) &&
          obj.enc === true &&
          obj._cbapp === SESSION_FORMAT_VERSION &&
          typeof obj.salt === "string" &&
          typeof obj.iv === "string" &&
          typeof obj.ct === "string" &&
          obj.alg === "AES-GCM-256" &&
          obj.kdf === "PBKDF2-SHA256-210000"
        );
      }

      function bufToB64(buf) {
        const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
        let s = "";
        for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s);
      }

      function b64ToBytes(b64) {
        if (typeof b64 !== "string" || b64.length > 8000000) {
          throw new Error("Invalid base64 payload");
        }
        const s = atob(b64);
        const bytes = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
        return bytes;
      }

      async function deriveAesKey(passphrase, saltBytes) {
        const enc = new TextEncoder();
        const material = await crypto.subtle.importKey(
          "raw",
          enc.encode(passphrase),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: saltBytes,
            iterations: PBKDF2_ITERATIONS,
            hash: "SHA-256",
          },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function ensureSessionKey(passphrase, saltBytes) {
        if (
          sessionCryptoKey &&
          sessionPassphrase === passphrase &&
          sessionKeySalt &&
          saltBytes &&
          sessionKeySalt.length === saltBytes.length &&
          sessionKeySalt.every((b, i) => b === saltBytes[i])
        ) {
          return sessionCryptoKey;
        }
        const key = await deriveAesKey(passphrase, saltBytes);
        sessionPassphrase = passphrase;
        sessionCryptoKey = key;
        sessionKeySalt = new Uint8Array(saltBytes);
        return key;
      }

      async function sealEnvelope(session, key, salt, iv) {
        const plain = new TextEncoder().encode(JSON.stringify(session));
        const ct = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          key,
          plain
        );
        return {
          _cbapp: SESSION_FORMAT_VERSION,
          enc: true,
          alg: "AES-GCM-256",
          kdf: "PBKDF2-SHA256-210000",
          salt: bufToB64(salt),
          iv: bufToB64(iv),
          ct: bufToB64(ct),
        };
      }

      async function encryptSessionObject(session, passphrase) {
        // Reuse salt+key across saves in this tab; new IV every encrypt.
        const salt =
          sessionKeySalt && sessionPassphrase === passphrase
            ? sessionKeySalt
            : crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await ensureSessionKey(passphrase, salt);
        return sealEnvelope(session, key, salt, iv);
      }

      // Deliberately does NOT go through ensureSessionKey(): that caches into
      // sessionPassphrase, so a one-off Backup passphrase would go on to
      // re-key — or newly encrypt — the saved session in localStorage. Fresh
      // salt and IV every time, so two backups never share key material.
      async function encryptForExport(session, passphrase) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveAesKey(passphrase, salt);
        return sealEnvelope(session, key, salt, iv);
      }

      /**
       * Is this the passphrase the envelope was sealed with? AES-GCM's auth tag
       * answers that on its own, so nothing is parsed and nothing is returned
       * but the verdict.
       *
       * Deliberately does NOT go through ensureSessionKey(), for the reason
       * encryptForExport() doesn't: this runs while a session is locked, and
       * caching would quietly adopt the passphrase for a session the tab has
       * not actually opened. Asking "is this right?" must not change anything.
       */
      async function verifyEnvelopePassphrase(envelope, passphrase) {
        try {
          const salt = b64ToBytes(envelope.salt);
          const iv = b64ToBytes(envelope.iv);
          if (salt.length !== 16 || iv.length !== 12) return false;
          const key = await deriveAesKey(passphrase, salt);
          await crypto.subtle.decrypt(
            { name: "AES-GCM", iv },
            key,
            b64ToBytes(envelope.ct)
          );
          return true;
        } catch (e) {
          return false;
        }
      }

      async function decryptSessionEnvelope(envelope, passphrase) {
        const salt = b64ToBytes(envelope.salt);
        const iv = b64ToBytes(envelope.iv);
        if (salt.length !== 16 || iv.length !== 12) {
          throw new Error("Invalid envelope parameters");
        }
        const key = await ensureSessionKey(passphrase, salt);
        const plainBuf = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          key,
          b64ToBytes(envelope.ct)
        );
        const session = JSON.parse(new TextDecoder().decode(plainBuf));
        return validateSessionObject(session);
      }

      /* One shape per kind, whichever desk the record came from. Same fields,
         same caps and same coercions the four hand-written branches used to
         carry — they are here once now so the two desks cannot drift. */
      function validateSingletonRecord(base, raw, label) {
        const common = {
          mode: sanitizeMode(raw.mode),
          visible: !!raw.visible,
          position: sanitizePosition(
            raw.position || { left: 50, top: 50 },
            label
          ),
          locked: !!raw.locked,
          minimized: !!raw.minimized,
        };
        if (base === "clock") {
          return {
            ...common,
            width: String(raw.width ?? "200").slice(0, 20),
            height: String(raw.height ?? "150").slice(0, 20),
            name: String(raw.name || "Clock").slice(0, MAX_NAME_CHARS),
            clockFormat: raw.clockFormat === "24" ? "24" : "12",
          };
        }
        if (base === "calculator") {
          let history = Array.isArray(raw.history)
            ? raw.history.slice(0, MAX_HISTORY)
            : [];
          history = history.map((h, i) => {
            assertPlainObject(h, `${label}.history[${i}]`);
            return {
              expression: String(h.expression ?? "").slice(0, 500),
              result: String(h.result ?? "").slice(0, 100),
            };
          });
          return {
            ...common,
            history,
            width: String(raw.width ?? "250").slice(0, 20),
          };
        }
        if (base === "calendar") {
          /* Which month is showing and which day is selected are per-window view
             state, not content — the events themselves live in session.events.
             A bad date here is not worth failing an import over: fall back to
             "no opinion" and let the window open on today. */
          const selected = String(raw.selected ?? "");
          return {
            ...common,
            width: String(raw.width ?? "480").slice(0, 20),
            height: String(raw.height ?? "640").slice(0, 20),
            name: String(raw.name || "Calendar").slice(0, MAX_NAME_CHARS),
            selected: DATE_RE.test(selected) && isRealDate(selected) ? selected : null,
            /* Integers, not "whatever Number() will coerce": Number(["2027"]) is
               2027 and Number(null) is 0, so an array passed the old year test and
               a null month validated to January rather than "no opinion". The floor
               is 100 because new Date(5, 0, 1) is 1905, not year 5 — a two-digit
               year silently renders a century away. */
            viewYear:
              Number.isInteger(raw.viewYear) &&
              raw.viewYear >= 100 &&
              raw.viewYear <= 9999
                ? raw.viewYear
                : null,
            viewMonth:
              Number.isInteger(raw.viewMonth) &&
              raw.viewMonth >= 0 &&
              raw.viewMonth <= 11
                ? raw.viewMonth
                : null,
          };
        }
        if (base === "log") {
          let logs = Array.isArray(raw.logs) ? raw.logs.slice(0, MAX_LOGS) : [];
          logs = logs.map((l, i) => {
            assertPlainObject(l, `${label}.logs[${i}]`);
            return {
              timestamp: String(l.timestamp ?? "").slice(0, 80),
              description: String(l.description ?? "").slice(0, 4000),
            };
          });
          return {
            ...common,
            width: String(raw.width ?? "300").slice(0, 20),
            height: String(raw.height ?? "300").slice(0, 20),
            name: String(raw.name || "Log").slice(0, MAX_NAME_CHARS),
            logs,
          };
        }
        return common; // help — position, lock and minimised state only
      }

      /* ==========================================================
         CALENDAR EVENTS (v4.0.0)
         ----------------------------------------------------------
         Events are the first piece of content that is NOT window state. Clock,
         Log and Calculator keep their own data per desk on purpose — a stopwatch
         belongs to its window. A calendar does not: two desks showing two
         different sets of appointments would be nonsense. So there is one array,
         `session.events`, and every open calendar renders from it.

         Named `events` rather than `calendarEvents` to stay clear of the retired
         v2 calendar's **localStorage** key of that name, which boot still purges.

         Every field is a flat primitive, and dates are local wall-clock strings
         rather than timestamps: "2026-08-14" and "09:30" mean the same thing on
         any machine in any zone, and no UTC round-trip means no DST drift.
         ========================================================== */
      const EVENT_REPEATS = ["none", "daily", "weekly", "monthly", "yearly"];
      /* An all-day event has no time of its own, so its occurrence starts here
         and the lead time counts back from it: 0 = 9am on the day, 540 =
         midnight, 1440 = 9am the day before. */
      const ALL_DAY_HOUR = 9;
      const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
      const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
      // 100000 minutes is ~69 days of lead time. Past that it is a typo, not a
      // reminder, and an unbounded number here would push fireAt outside any
      // range the scheduler can reason about.
      const MAX_ALERT_MINUTES = 100000;

      /* Rejects what is structurally wrong (the house style for record
         sanitizers — see sanitizeWindowRecord) and clamps what is merely out of
         range. Returns a fresh plain object; nothing from the file survives by
         reference. */
      function sanitizeCalendarEvent(raw, label) {
        assertPlainObject(raw, label);
        for (const k of Object.keys(raw)) {
          if (isDangerousKey(k)) {
            throw new Error(`Invalid session: dangerous key in ${label}`);
          }
        }
        const date = String(raw.date ?? "");
        if (!DATE_RE.test(date) || !isRealDate(date)) {
          throw new Error(`Invalid session: ${label}.date`);
        }
        const allDay = !!raw.allDay;
        let time = null;
        if (!allDay) {
          time = String(raw.time ?? "");
          if (!TIME_RE.test(time)) {
            throw new Error(`Invalid session: ${label}.time`);
          }
        }
        let alertMinutes = null;
        if (raw.alertMinutes !== null && raw.alertMinutes !== undefined) {
          const n = Number(raw.alertMinutes);
          // A junk lead time means "no alert", not a rejected import: the event
          // itself is still worth keeping on the calendar.
          alertMinutes = Number.isFinite(n)
            ? Math.min(Math.max(0, Math.round(n)), MAX_ALERT_MINUTES)
            : null;
        }
        const lastFired = String(raw.lastFired ?? "");
        return {
          id: String(raw.id ?? "").slice(0, 64) || newEventId(),
          title: String(raw.title ?? "").slice(0, MAX_NAME_CHARS),
          date,
          time,
          allDay,
          note: String(raw.note ?? "").slice(0, MAX_EVENT_NOTE_CHARS),
          repeat: EVENT_REPEATS.includes(raw.repeat) ? raw.repeat : "none",
          alertMinutes,
          // Free-form would let a bad value silence an event forever, so only a
          // well-formed stamp is kept; anything else means "never fired".
          lastFired: /^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d$/.test(lastFired)
            ? lastFired
            : null,
        };
      }

      /* "2026-02-30" passes the regex. Round-tripping through a Date is what
         catches it, and it has to be built as local midnight — new Date("...")
         on a bare date string is parsed as UTC, which shifts the day for anyone
         west of Greenwich. */
      function isRealDate(date) {
        const [y, m, d] = date.split("-").map(Number);
        if (!y || !m || !d) return false;
        const probe = new Date(y, m - 1, d);
        return (
          probe.getFullYear() === y &&
          probe.getMonth() === m - 1 &&
          probe.getDate() === d
        );
      }

      let _eventSeq = 0;
      // Unique within a session without needing crypto or a clock: the counter
      // is what keeps two events added in the same millisecond apart.
      function newEventId() {
        _eventSeq += 1;
        return `ev${Date.now().toString(36)}${_eventSeq.toString(36)}`;
      }

      function isDangerousKey(key) {
        return (
          key === "__proto__" ||
          key === "constructor" ||
          key === "prototype"
        );
      }

      function assertPlainObject(value, label) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new Error(`Invalid session: ${label} must be an object`);
        }
        if (Object.getPrototypeOf(value) !== Object.prototype) {
          // JSON.parse always yields plain objects; reject exotic prototypes.
          throw new Error(`Invalid session: ${label} has unexpected prototype`);
        }
      }

      function assertString(value, label, maxLen) {
        if (typeof value !== "string") {
          throw new Error(`Invalid session: ${label} must be a string`);
        }
        if (value.length > maxLen) {
          throw new Error(`Invalid session: ${label} is too long`);
        }
      }

      function assertFiniteNumber(value, label) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          throw new Error(`Invalid session: ${label} must be a finite number`);
        }
      }

      function sanitizeColorString(value, label) {
        if (value === undefined || value === null || value === "") return "";
        assertString(value, label, 64);
        const v = value.trim().toLowerCase();
        // Only allow hex / rgb(a) that normalizeColor already understands.
        if (
          /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/.test(v) ||
          /^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(\s*,\s*(0|1|0?\.\d+))?\s*\)$/.test(
            v
          )
        ) {
          return v;
        }
        throw new Error(`Invalid session: ${label} is not a safe colour`);
      }

      function sanitizePosition(pos, label) {
        assertPlainObject(pos, label);
        const left = pos.left;
        const top = pos.top;
        // Positions may be numbers or numeric strings from older sessions.
        const lx =
          typeof left === "number" ? left : parseFloat(String(left));
        const ty = typeof top === "number" ? top : parseFloat(String(top));
        if (!Number.isFinite(lx) || !Number.isFinite(ty)) {
          throw new Error(`Invalid session: ${label} position`);
        }
        if (Math.abs(lx) > 1e7 || Math.abs(ty) > 1e7) {
          throw new Error(`Invalid session: ${label} position out of range`);
        }
        return { left: String(lx), top: String(ty) };
      }

      /* Which desk a window belongs to. Anything else — including a session
         written before v3.2.10, which says nothing at all — is adopted by the
         plain view, and the restore path re-homes those to whichever desk was
         active when the session was saved. */
      function sanitizeMode(value) {
        /* Absent has to stay absent rather than defaulting to "windowed" here.
           A session written before v3.2.10 says nothing about modes, and if
           that silence were read as "the plain view", one saved with the
           canvas on would restore every window onto the desk the user was not
           looking at — an empty canvas that reads as having lost the lot. The
           restore path re-homes an absent mode to whichever desk was active.
           A malformed one is a different case: it is coerced, not dropped. */
        if (value === undefined || value === null) return undefined;
        return value === "canvas" ? "canvas" : "windowed";
      }

      function sanitizeWindowRecord(data, label, { isSticky = false } = {}) {
        assertPlainObject(data, label);
        for (const k of Object.keys(data)) {
          if (isDangerousKey(k)) {
            throw new Error(`Invalid session: dangerous key in ${label}`);
          }
        }
        const out = {
          mode: sanitizeMode(data.mode),
          position: sanitizePosition(data.position || { left: 50, top: 50 }, label),
          width:
            data.width === undefined
              ? undefined
              : (assertFiniteNumber(Number(data.width), `${label}.width`),
                Number(data.width)),
          height:
            data.height === undefined
              ? undefined
              : (assertFiniteNumber(Number(data.height), `${label}.height`),
                Number(data.height)),
          zIndex:
            data.zIndex === undefined
              ? 0
              : (assertFiniteNumber(Number(data.zIndex), `${label}.zIndex`),
                Number(data.zIndex)),
          minimized: !!data.minimized,
          locked: !!data.locked,
          name:
            data.name === undefined
              ? undefined
              : (assertString(String(data.name), `${label}.name`, MAX_NAME_CHARS),
                String(data.name).slice(0, MAX_NAME_CHARS)),
          content:
            data.content === undefined
              ? ""
              : (assertString(String(data.content), `${label}.content`, MAX_NOTE_CHARS),
                String(data.content)),
          isTaskWindow: !!data.isTaskWindow,
        };
        if (data.containerWidth !== undefined) {
          assertFiniteNumber(Number(data.containerWidth), `${label}.containerWidth`);
          out.containerWidth = Number(data.containerWidth);
        }
        if (data.containerHeight !== undefined) {
          assertFiniteNumber(Number(data.containerHeight), `${label}.containerHeight`);
          out.containerHeight = Number(data.containerHeight);
        }
        if (Array.isArray(data.tasks)) {
          if (data.tasks.length > MAX_TASKS) {
            throw new Error(`Invalid session: too many tasks in ${label}`);
          }
          out.tasks = data.tasks.map((t, i) => {
            assertPlainObject(t, `${label}.tasks[${i}]`);
            assertString(String(t.text ?? ""), `${label}.tasks[${i}].text`, 2000);
            return { text: String(t.text ?? "").slice(0, 2000), completed: !!t.completed };
          });
        } else {
          out.tasks = [];
        }
        if (isSticky) {
          out.color = sanitizeColorString(data.color || "", `${label}.color`);
          out.textColor = sanitizeColorString(
            data.textColor || "",
            `${label}.textColor`
          );
          out.customColor = !!data.customColor;
        }
        return out;
      }

      /**
       * Strict allowlist validation for imported / embedded / decrypted sessions.
       * Throws on anything unexpected. Returns a cleaned plain object.
       */
      function validateSessionObject(raw) {
        eventsDroppedOnValidate = 0; // per-payload, so a later import is honest
        assertPlainObject(raw, "session");
        for (const k of Object.keys(raw)) {
          if (isDangerousKey(k)) {
            throw new Error("Invalid session: dangerous key");
          }
        }
        const out = {};
        /* The singleton keys come from the registry rather than a hand-written
           list: unknown top-level keys are dropped here on purpose (forward
           compatibility), so a key missing from this set is not a validation
           error you would see — it is a window that silently fails to come
           back. That is exactly what happened to `log-canvas` the first time. */
        const known = new Set([
          "theme",
          "canvas",
          "zIndexCounter",
          "timerSound",
          "events",
          ...Object.keys(SINGLETON_KEY_KIND),
        ]);
        for (const key of Object.keys(raw)) {
          if (key.startsWith("window")) {
            out[key] = sanitizeWindowRecord(raw[key], key, { isSticky: false });
            continue;
          }
          if (key.startsWith("sticky-note")) {
            out[key] = sanitizeWindowRecord(raw[key], key, { isSticky: true });
            continue;
          }
          if (!known.has(key)) {
            // Drop unknown top-level keys rather than fail — forward compatible.
            continue;
          }
          if (key === "theme") {
            out.theme =
              raw.theme === "light-mode" ? "light-mode" : "dark-mode";
          } else if (key === "events") {
            if (!Array.isArray(raw.events)) continue;
            /* An id is an identity here: both edit and delete resolve by it, so
               a file that repeats one makes deleting a single visible row remove
               every event sharing it, and editing replace them all with the same
               object. A crafted .json can say anything, so uniqueness is
               enforced on the way in rather than trusted. */
            const sanitized = raw.events
              .slice(0, MAX_EVENTS)
              .map((e, i) => sanitizeCalendarEvent(e, `events[${i}]`));
            /* Seeded with every id in the payload, and `while` rather than `if`:
               newEventId() is `ev<base36 now><counter>`, so a file that guessed the
               import millisecond could otherwise be handed back the very duplicate
               this exists to prevent. */
            const claimedIds = new Set(sanitized.map((e) => e.id));
            const usedIds = new Set();
            out.events = sanitized.map((e) => {
              while (usedIds.has(e.id)) {
                const minted = newEventId();
                if (!claimedIds.has(minted)) e.id = minted;
              }
              usedIds.add(e.id);
              return e;
            });
            // Never truncate in silence — the window path counts what it skips
            // and says so, and a dropped appointment is worth the same courtesy.
            eventsDroppedOnValidate = Math.max(
              0,
              raw.events.length - out.events.length
            );
          } else if (key === "timerSound") {
            // Absent stays absent: a session written before this key existed
            // must not read as "muted". The restore path only applies a real
            // boolean, so dropping a junk value here means "keep the default".
            if (typeof raw.timerSound !== "boolean") continue;
            out.timerSound = raw.timerSound;
          } else if (key === "zIndexCounter") {
            const z = Number(raw.zIndexCounter) || 0;
            assertFiniteNumber(z, "zIndexCounter");
            out.zIndexCounter = Math.min(Math.max(0, Math.floor(z)), 10000);
          } else if (key === "canvas") {
            if (raw.canvas == null) continue;
            assertPlainObject(raw.canvas, "canvas");
            out.canvas = {
              on: !!raw.canvas.on,
              // Tri-state on purpose: true/false when the writer said, null
              // for a session written before v3.2.12, which said nothing at
              // all. The restore path is what resolves null.
              seen: raw.canvas.seen == null ? null : !!raw.canvas.seen,
              x: Number.isFinite(Number(raw.canvas.x))
                ? Number(raw.canvas.x)
                : 0,
              y: Number.isFinite(Number(raw.canvas.y))
                ? Number(raw.canvas.y)
                : 0,
              zoom: Number.isFinite(Number(raw.canvas.zoom))
                ? Number(raw.canvas.zoom)
                : 1,
            };
          } else if (SINGLETON_KEY_KIND[key] && raw[key]) {
            assertPlainObject(raw[key], key);
            out[key] = validateSingletonRecord(
              SINGLETON_KEY_KIND[key].base,
              raw[key],
              key
            );
          }
        }
        return out;
      }

      /* The write side of validateSingletonRecord(). Mirrors it field for
         field, keyed off the element rather than the record. */
      function buildSingletonRecord(base, el) {
        const record = {
          visible: true,
          mode: windowMode(el),
          position: { left: el.dataset.x || "50", top: el.dataset.y || "50" },
          locked: el.dataset.locked === "true",
          minimized: el.style.display === "none",
        };
        if (base === "clock") {
          record.width = el.dataset.width || "200";
          record.height = el.dataset.height || "150";
          record.name = el.querySelector(".clock-title").textContent;
          record.clockFormat =
            instancePart(el.id, "clock-format")?.value || "12";
        } else if (base === "calculator") {
          record.width = el.dataset.width || "250";
          record.history = stateFor(el.id).history;
        } else if (base === "calendar") {
          record.width = el.dataset.width || "480";
          record.height = el.dataset.height || "640";
          record.name = el.querySelector(".calendar-title").textContent;
          record.selected = el.dataset.selected || null;
          /* The month was NOT saved before v4.0.3 — restore re-derived it from
             `selected`, so paging to November and reloading came back to whatever
             month held the selected day. Which also made calShiftMonth's
             saveSession() a full serialise-and-encrypt per arrow click that
             changed nothing on disk. */
          // Numbers, because the validator demands integers — dataset values are
          // strings and would validate to null, silently losing the month again.
          const viewY = parseInt(el.dataset.viewYear, 10);
          const viewM = parseInt(el.dataset.viewMonth, 10);
          record.viewYear = Number.isFinite(viewY) ? viewY : null;
          record.viewMonth = Number.isFinite(viewM) ? viewM : null;
        } else if (base === "log") {
          record.width = el.dataset.width || "300";
          record.height = el.dataset.height || "300";
          record.name = el.querySelector(".log-title").textContent;
          // Read back off the DOM, so a rename or a deleted row is captured
          // even if something wrote the array without re-rendering.
          record.logs = Array.from(el.querySelectorAll(".log-item")).map(
            (item) => ({
              timestamp: item.querySelector(".timestamp").textContent,
              description: item.querySelector(".description").textContent,
            })
          );
        }
        return record;
      }

      async function persistSessionPayload(session) {
        // Second gate behind saveSession(): nothing may overwrite a locked
        // session's ciphertext, whatever the caller.
        if (sessionLocked) return false;
        let payload;
        if (sessionPassphrase) {
          payload = await encryptSessionObject(session, sessionPassphrase);
        } else {
          payload = session;
        }
        const serialized = JSON.stringify(payload);
        if (serialized.length > MAX_SESSION_CHARS) {
          reportSaveFailure(
            "Session too large to save — save a Backup, then close or trim a window."
          );
          return false;
        }
        // Re-check after the await: encryption is not instant, and Lock can
        // land in the middle of one. The gate at the top of this function was
        // passed by a caller from before the lock, whose snapshot is now stale
        // — writing it here would overwrite the ciphertext Lock just sealed.
        if (sessionLocked) return false;
        localStorage.setItem(SESSION_KEY, serialized);
        clearSaveFailure();
        return true;
      }

      /**
       * Masked replacement for window.prompt() when the answer is a secret.
       * Resolves to the entered string, or null if the user cancels.
       * The field starts obscured; "Show" reveals it for the sighted-typo case
       * and flips back on every open so a passphrase is never left on screen.
       *
       * `masked: false` asks for a string that is not a secret — the one caller
       * is the ERASE confirmation, where hiding what you type would be actively
       * unhelpful. The Show toggle disappears with it.
       */
      function promptPassphrase({
        title,
        message,
        label,
        okLabel,
        masked = true,
      } = {}) {
        const modal = document.getElementById("pass-modal");
        const input = document.getElementById("pass-modal-input");
        const reveal = document.getElementById("pass-modal-reveal");
        const form = document.getElementById("pass-modal-form");
        const okBtn = document.getElementById("pass-modal-ok");
        const cancelBtn = document.getElementById("pass-modal-cancel");
        const errorEl = document.getElementById("pass-modal-error");
        const labelEl = document.getElementById("pass-modal-label");
        // No modal in the DOM (e.g. a stripped copy of the page) — fall back
        // rather than leaving the caller hanging on a promise that never settles.
        if (!modal || !input || !form) {
          return Promise.resolve(window.prompt(message || title || "Passphrase"));
        }

        document.getElementById("pass-modal-title").textContent =
          title || "Passphrase";
        document.getElementById("pass-modal-message").textContent = message || "";
        labelEl.textContent = label || "Passphrase";
        okBtn.textContent = okLabel || "OK";
        errorEl.textContent = "";
        input.value = "";
        setRevealed(false);
        const returnFocus =
          document.activeElement instanceof HTMLElement
            ? document.activeElement
            : null;
        modal.classList.add("open");
        input.focus();

        function setRevealed(on) {
          reveal.style.display = masked ? "" : "none";
          input.type = on || !masked ? "text" : "password";
          reveal.textContent = on ? "Hide" : "Show";
          reveal.setAttribute("aria-pressed", on ? "true" : "false");
          reveal.setAttribute(
            "aria-label",
            on ? "Hide passphrase" : "Show passphrase"
          );
        }

        return new Promise((resolve) => {
          function close(value) {
            modal.classList.remove("open");
            // Never leave the secret sitting in the DOM or visible next time.
            input.value = "";
            setRevealed(false);
            reveal.removeEventListener("click", onReveal);
            form.removeEventListener("submit", onSubmit);
            cancelBtn.removeEventListener("click", onCancel);
            modal.removeEventListener("keydown", onKey);
            modal.removeEventListener("mousedown", onBackdrop);
            if (returnFocus && document.contains(returnFocus)) {
              returnFocus.focus();
            }
            resolve(value);
          }
          function onReveal() {
            setRevealed(input.type === "password");
            input.focus();
          }
          function onSubmit(e) {
            e.preventDefault();
            close(input.value);
          }
          function onCancel() {
            close(null);
          }
          function onKey(e) {
            if (e.key === "Escape") {
              e.stopPropagation();
              onCancel();
            } else if (e.key === "Tab") {
              // Keep focus inside the dialog: it is the only thing on screen.
              const focusables = masked
                ? [input, reveal, cancelBtn, okBtn]
                : [input, cancelBtn, okBtn];
              const i = focusables.indexOf(document.activeElement);
              if (i === -1) return;
              e.preventDefault();
              const next = e.shiftKey ? i - 1 : i + 1;
              focusables[(next + focusables.length) % focusables.length].focus();
            }
          }
          function onBackdrop(e) {
            if (e.target === modal) onCancel();
          }
          reveal.addEventListener("click", onReveal);
          form.addEventListener("submit", onSubmit);
          cancelBtn.addEventListener("click", onCancel);
          modal.addEventListener("keydown", onKey);
          modal.addEventListener("mousedown", onBackdrop);
        });
      }

      /**
       * In-app replacement for window.confirm(). Resolves true only if the user
       * picks the affirmative button — Escape, Cancel and a backdrop click all
       * resolve false, which is the safe answer for every caller so far.
       *
       * `danger: true` colours the affirmative button with --danger and starts
       * focus on Cancel, so Enter on a dialog nobody read does nothing.
       * Falls back to window.confirm() if the markup is missing, for the same
       * reason promptPassphrase() falls back to window.prompt().
       */
      function confirmDialog({ title, message, okLabel, danger } = {}) {
        const modal = document.getElementById("confirm-modal");
        const okBtn = document.getElementById("confirm-modal-ok");
        const cancelBtn = document.getElementById("confirm-modal-cancel");
        if (!modal || !okBtn || !cancelBtn) {
          return Promise.resolve(
            window.confirm(
              [title, message].filter(Boolean).join("\n\n") || "Are you sure?"
            )
          );
        }

        document.getElementById("confirm-modal-title").textContent =
          title || "Are you sure?";
        document.getElementById("confirm-modal-message").textContent =
          message || "";
        okBtn.textContent = okLabel || "OK";
        okBtn.classList.toggle("danger", !!danger);
        okBtn.classList.toggle("primary", !danger);
        const returnFocus =
          document.activeElement instanceof HTMLElement
            ? document.activeElement
            : null;
        modal.classList.add("open");
        (danger ? cancelBtn : okBtn).focus();

        return new Promise((resolve) => {
          function close(value) {
            modal.classList.remove("open");
            okBtn.removeEventListener("click", onOk);
            cancelBtn.removeEventListener("click", onCancel);
            modal.removeEventListener("keydown", onKey);
            modal.removeEventListener("mousedown", onBackdrop);
            if (returnFocus && document.contains(returnFocus)) {
              returnFocus.focus();
            }
            resolve(value);
          }
          function onOk() {
            close(true);
          }
          function onCancel() {
            close(false);
          }
          function onKey(e) {
            if (e.key === "Escape") {
              e.stopPropagation();
              onCancel();
            } else if (e.key === "Enter") {
              // No <form> here, so Enter is ours to define: it activates
              // whichever button is focused and nothing otherwise.
              if (document.activeElement === okBtn) {
                e.preventDefault();
                onOk();
              } else if (document.activeElement === cancelBtn) {
                e.preventDefault();
                onCancel();
              }
            } else if (e.key === "Tab") {
              const focusables = [cancelBtn, okBtn];
              const i = focusables.indexOf(document.activeElement);
              if (i === -1) return;
              e.preventDefault();
              const next = e.shiftKey ? i - 1 : i + 1;
              focusables[(next + focusables.length) % focusables.length].focus();
            }
          }
          function onBackdrop(e) {
            if (e.target === modal) onCancel();
          }
          okBtn.addEventListener("click", onOk);
          cancelBtn.addEventListener("click", onCancel);
          modal.addEventListener("keydown", onKey);
          modal.addEventListener("mousedown", onBackdrop);
        });
      }

      /**
       * Choose-and-confirm for a brand-new passphrase, shared by Protect and
       * Backup so the two can't drift on rules or wording. Resolves to null on
       * cancel *and* on any failed check — it has already told the user why,
       * so callers just abort.
       */
      async function promptNewPassphrase({ title, message, okLabel } = {}) {
        const pass = await promptPassphrase({
          title,
          message,
          label: "New passphrase (6+ characters)",
          okLabel: "Continue",
        });
        if (pass === null) return null;
        if (!pass || pass.length < 6) {
          window.alert("Use a passphrase of at least 6 characters.");
          return null;
        }
        const again = await promptPassphrase({
          title: "Confirm passphrase",
          message: "Type the same passphrase again to confirm.",
          label: "Confirm passphrase",
          okLabel: okLabel || "OK",
        });
        if (again === null) return null;
        if (pass !== again) {
          window.alert("Passphrases did not match.");
          return null;
        }
        return pass;
      }

      /**
       * Demand the passphrase of the session that is currently open, for an
       * action that would undo the protection it gives (v3.2.14: Reset,
       * v3.2.15: Unprotect). Resolves true only on a match.
       *
       * `sessionPassphrase` is the passphrase this session is encrypted with,
       * so comparing against it is the same check a decrypt would make without
       * the round trip. Callers must only reach here with it set — an open
       * protected session — since there is nothing to compare against
       * otherwise; see confirmResetLocked() for the locked equivalent.
       *
       * Three tries, then it gives up rather than sitting there as an oracle.
       */
      async function requireSessionPassphrase({
        title,
        message,
        okLabel,
        cancelStatus,
      } = {}) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const pass = await promptPassphrase({
            title,
            message,
            label: "Passphrase",
            okLabel,
          });
          if (pass === null) {
            if (cancelStatus) showStatus(cancelStatus);
            return false;
          }
          if (pass === sessionPassphrase) return true;
          window.alert(
            attempt < 2
              ? "Wrong passphrase. Try again."
              : "Wrong passphrase. Nothing was changed."
          );
        }
        if (cancelStatus) showStatus(cancelStatus);
        return false;
      }

      async function unlockEnvelopeWithPrompt(envelope, reason) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const pass = await promptPassphrase({
            title: "Unlock session",
            message:
              reason ||
              "This CB App session is passphrase-protected. Enter the passphrase:",
            okLabel: "Unlock",
          });
          if (pass === null) return null; // cancelled
          if (!pass) {
            window.alert("Passphrase cannot be empty.");
            continue;
          }
          try {
            const session = await decryptSessionEnvelope(envelope, pass);
            // sessionPassphrase / key cached inside decryptSessionEnvelope
            return session;
          } catch (e) {
            window.alert(
              attempt < 2
                ? "Wrong passphrase (or corrupted data). Try again."
                : "Wrong passphrase. Session was not loaded."
            );
          }
        }
        return null;
      }

      /**
       * The encrypted session sitting in storage right now, or null if what is
       * there is plaintext, absent or unparseable. `lockedEnvelope` is only set
       * in the tab that failed to open it, so anything that has to reason about
       * the ciphertext — unlocking, and Reset's passphrase gate — reads through
       * here rather than trusting that variable.
       */
      function readStoredEnvelope() {
        if (lockedEnvelope) return lockedEnvelope;
        try {
          const parsed = JSON.parse(localStorage.getItem(SESSION_KEY) || "");
          return isEncryptedEnvelope(parsed) ? parsed : null;
        } catch (e) {
          return null;
        }
      }

      /**
       * Enter the locked state: the stored session is encrypted and is not
       * open in this tab. Saving is suspended (see saveSession) so the
       * ciphertext survives, and the user gets an unlimited number of further
       * tries via the banner — three per round, as many rounds as they want.
       *
       * Two ways in, and the empty state has to say which: boot could not open
       * what was there, or the user pressed Lock and this is exactly what they
       * asked for. Same machinery, opposite tone — "was not opened" reads as a
       * failure report, which is alarming when nothing failed.
       */
      function enterLockedState(envelope, { manual = false } = {}) {
        sessionLocked = true;
        lockedEnvelope = envelope || lockedEnvelope;
        clearSessionSecrets();
        const banner = document.getElementById("locked-banner");
        if (banner) banner.style.display = "block";
        // The empty state promises "everything you type is saved
        // automatically", which is exactly false right now.
        const hint = document.querySelector("#empty-state .empty-hint");
        if (hint) {
          hint.dataset.unlockedText = hint.dataset.unlockedText || hint.innerHTML;
          hint.textContent = manual
            ? "Session locked. Your notes are encrypted in this browser and nothing is being saved until you unlock — click the 🔒 banner and enter your passphrase."
            : "Your saved session is encrypted and was not opened. Nothing is being saved until you unlock it — click the 🔒 banner to try the passphrase again.";
        }
        updateProtectButton();
      }

      function exitLockedState() {
        sessionLocked = false;
        lockedEnvelope = null;
        const banner = document.getElementById("locked-banner");
        if (banner) banner.style.display = "none";
        const hint = document.querySelector("#empty-state .empty-hint");
        if (hint && hint.dataset.unlockedText) {
          hint.innerHTML = hint.dataset.unlockedText;
          delete hint.dataset.unlockedText;
        }
        updateProtectButton();
      }

      /**
       * Bound to the locked banner. Re-prompts for the passphrase and, on
       * success, restores the session and resumes saving. On failure nothing
       * is written and the banner stays — the ciphertext is never at risk.
       */
      async function retryUnlockSession() {
        if (!sessionLocked) return;
        // Re-reads storage when this tab was reloaded into the state.
        const envelope = readStoredEnvelope();
        if (!envelope) {
          // Nothing encrypted is actually stored — release the brake.
          exitLockedState();
          showStatus("No encrypted session found — saving resumed.");
          return;
        }
        const session = await unlockEnvelopeWithPrompt(
          envelope,
          "Your CB App session is passphrase-protected. Enter the passphrase:"
        );
        if (!session) {
          showStatus(
            "Still locked — nothing was saved or lost. Click the banner to try again."
          );
          return;
        }
        // Anything on screen was typed while locked, so by definition it was
        // never saved. Restoring appends, so without this the two would merge
        // into a session that is neither. Ask before discarding it.
        if (document.querySelectorAll(WINDOW_SELECTOR).length > 0) {
          if (
            !window.confirm(
              "Unlock and restore your saved session?\n\nAnything on screen now was typed while the session was locked, so it was never saved. It will be replaced by the restored session. Use Backup first if you want to keep it."
            )
          ) {
            showStatus("Still locked — nothing was changed.");
            return;
          }
          clearScreenForRestore();
        }
        exitLockedState();
        loadSessionFromStorage(session);
        saveSession();
        updateProtectButton();
        showStatus("Session unlocked and restored.");
      }

      /**
       * Empty the screen without touching storage, so a restore replays into a
       * clean slate. Reset() does this too, but it also destroys the saved
       * session — which is the opposite of what unlocking wants.
       */
      function clearScreenForRestore() {
        document.getElementById("windows").innerHTML = "";
        ["calculator", "clock", "log", "help-window"].forEach((id) => {
          document.getElementById(id)?.remove();
        });
        windowCount = 0;
        noteCount = 0;
        taskCount = 0;
        stickyCount = 0;
        t2Count = 0;
        activeWindow = null;
        zIndexCounter = 1;
        dropAllInstanceState();
        cascadeIndex = 0;
        cascadeAnchor = null;
        refreshChrome();
      }

      /**
       * Parse a raw localStorage / file string into a validated session object.
       * Handles plaintext JSON sessions and encrypted envelopes.
       */
      async function parseAndUnlockSession(raw, { promptReason } = {}) {
        if (typeof raw !== "string" || !raw || raw.length > MAX_SESSION_CHARS + 1000) {
          throw new Error("Session payload missing or too large");
        }
        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch (e) {
          throw new Error("Session is not valid JSON");
        }
        if (isEncryptedEnvelope(parsed)) {
          const unlocked = await unlockEnvelopeWithPrompt(
            parsed,
            promptReason
          );
          if (!unlocked) return null;
          return unlocked;
        }
        // Legacy / plaintext
        return validateSessionObject(parsed);
      }

      /* This is the one toolbar button whose label changes at runtime, so the
         boot-time pass that folds the visible word into the accessible name
         cannot help it — it runs before there is any text to read. Each branch
         leads with its own visible word for the same reason: "click Protect" has
         to find the button called Protect (WCAG 2.5.3). */
      function updateProtectButton() {
        updateLockButton();
        const btn = document.getElementById("protect-toggle");
        if (!btn) return;
        const label = (text, tip, aria) => {
          btn.textContent = text;
          btn.setAttribute("data-tooltip", tip);
          btn.setAttribute("aria-label", `${text} — ${aria || tip}`);
        };
        if (sessionLocked) {
          // Protecting on top of a locked session makes no sense — the way
          // forward is to open the one that is already there.
          label(
            "Unlock",
            "Your saved session is encrypted and was not opened — unlock it to resume saving",
            "unlock the encrypted session to resume saving"
          );
          btn.classList.add("active");
          return;
        }
        if (sessionPassphrase) {
          label(
            "Unprotect",
            "Remove passphrase protection (saves notes in plaintext again)",
            "remove passphrase protection (saves notes in plaintext again)"
          );
          btn.classList.add("active");
        } else {
          label(
            "Protect",
            "Encrypt this browser's session with a passphrase",
            "encrypt this browser's session with a passphrase"
          );
          btn.classList.remove("active");
        }
      }

      /* Lock has nothing to say while the session is already locked — the
         banner and Protect ("Unlock") both point at the way out, and a red
         button that means "do the thing that is already done" is just another
         thing to reason about. Hidden rather than disabled: a disabled control
         still asks to be understood. */
      function updateLockButton() {
        const btn = document.getElementById("lock-now");
        if (!btn) return;
        btn.style.display = sessionLocked ? "none" : "";
        // Locking an unprotected session has to invent a passphrase first, and
        // the button should say so before it is pressed, not after.
        const tip = sessionPassphrase
          ? "Lock the session now — hides everything until the passphrase is entered (Ctrl+Shift+L)"
          : "Lock the session now — asks for a passphrase first, then hides everything (Ctrl+Shift+L)";
        btn.setAttribute("data-tooltip", tip);
        // "Lock" leads, so speech control can still reach the button by the
        // word on it (WCAG 2.5.3) — same reason updateProtectButton does this.
        btn.setAttribute("aria-label", `Lock — ${tip}`);
      }

      /**
       * Lock the session on demand: encrypt what is on screen, drop the key
       * from memory, and clear the desk. The reverse of retryUnlockSession().
       *
       * Order is the whole safety argument. The encrypted snapshot is written
       * FIRST and read back as an envelope before anything is cleared, because
       * clearSessionSecrets() destroys the only copy of the key — a failure
       * after that point would leave the notes on screen with no way to save
       * them. Every early return below happens with the session still open and
       * nothing lost.
       *
       * enterLockedState() then suspends saving, so the pending debouncedSave
       * from the user's last keystroke is a no-op rather than a plaintext
       * write over the ciphertext.
       */
      async function lockSessionNow() {
        if (sessionLocked) {
          showStatus("Already locked — click the 🔒 banner to unlock.");
          return;
        }
        // Before boot settles, what is on screen is not the session yet;
        // snapshotting it would persist a half-restored desk.
        if (!booted) {
          showStatus("Still loading — try again in a moment.");
          return;
        }
        // No passphrase means there is nothing to lock with. Sending the user
        // to Protect and back would be two dialogs for one intention, so ask
        // here and protect as part of locking.
        const wasProtected = !!sessionPassphrase;
        if (!wasProtected) {
          const pass = await promptNewPassphrase({
            title: "Lock this session",
            message:
              "Locking encrypts this session in the browser and hides it until the passphrase is entered again — the same protection the Protect button gives, applied right now.\n\nYou will need this passphrase every time you open CB App here. It is never stored, so there is no way to recover it.",
            okLabel: "Lock",
          });
          if (pass === null) {
            showStatus("Not locked — nothing was changed.");
            return;
          }
          // Fresh salt, exactly as toggleSessionProtection does.
          sessionCryptoKey = null;
          sessionKeySalt = null;
          sessionPassphrase = pass;
        }
        let envelope = null;
        try {
          const ok = await persistSessionPayload(buildSessionSnapshot());
          if (ok) envelope = readStoredEnvelope();
        } catch (e) {
          console.error("Failed to encrypt session for lock:", e);
        }
        if (!envelope) {
          // Roll back a passphrase this call invented, so a failed lock does
          // not leave the tab believing it is protected when storage is not.
          if (!wasProtected) clearSessionSecrets();
          updateProtectButton();
          showStatus(
            "Could not encrypt the session — nothing was locked and nothing was lost."
          );
          return;
        }
        // Lock first, clear second: enterLockedState() is what closes saving,
        // and emptying the desk while writes are still permitted is the one
        // ordering where an autosave could overwrite the ciphertext with a
        // snapshot of nothing.
        enterLockedState(envelope, { manual: true });
        clearScreenForRestore();
        showStatus("Session locked — click the 🔒 banner to unlock.");
      }

      async function toggleSessionProtection() {
        if (sessionLocked) {
          // The button reads "Unlock" in this state.
          await retryUnlockSession();
          return;
        }
        if (sessionPassphrase) {
          // v3.2.15: the passphrase, not just a click. Unprotect rewrites the
          // session as plaintext, so a click alone would let anyone at the
          // keyboard strip the protection off and read everything on the next
          // load — the same hole Reset had before v3.2.14, with the notes left
          // behind rather than deleted.
          if (
            !(await requireSessionPassphrase({
              title: "Remove passphrase protection?",
              message:
                "Your session will be saved in plaintext in this browser again, " +
                "readable by anyone who opens CB App here.\n\nBackups stay " +
                "encrypted either way — Backup will ask for a passphrase each " +
                "time instead of reusing this one.",
              okLabel: "Remove protection",
              cancelStatus: "Protection left on — nothing was changed.",
            }))
          ) {
            return;
          }
          clearSessionSecrets();
          try {
            const snap = buildSessionSnapshot();
            await persistSessionPayload(snap);
            updateProtectButton();
            showStatus("Passphrase protection removed — session is plaintext.");
          } catch (e) {
            showStatus("Failed to remove protection.");
          }
          return;
        }
        const pass = await promptNewPassphrase({
          title: "Protect this session",
          message:
            "Choose a passphrase to encrypt this session in the browser.\n\nYou will need it every time you open CB App on this origin. It is never stored — only you know it.",
          okLabel: "Protect",
        });
        if (pass === null) return;
        try {
          // Fresh salt for a newly protected session.
          sessionCryptoKey = null;
          sessionKeySalt = null;
          sessionPassphrase = pass;
          const snap = buildSessionSnapshot();
          const ok = await persistSessionPayload(snap);
          if (!ok) {
            clearSessionSecrets();
            showStatus("Could not save encrypted session.");
            return;
          }
          updateProtectButton();
          showStatus("Session encrypted with your passphrase.");
        } catch (e) {
          clearSessionSecrets();
          console.error(e);
          showStatus("Encryption failed — is Web Crypto available?");
        }
      }

      // Normalise "rgb(43, 39, 24)" / "#2B2718" / "" to "#2b2718" so stored
      // colours can be compared against the theme defaults.
      function normalizeColor(value) {
        if (!value) return "";
        const v = String(value).trim().toLowerCase();
        const rgb = v.match(/^rgba?\(([^)]+)\)$/);
        if (rgb) {
          const [r, g, b] = rgb[1].split(",").map((n) => parseInt(n, 10));
          if ([r, g, b].some(Number.isNaN)) return v;
          return (
            "#" +
            [r, g, b].map((n) => n.toString(16).padStart(2, "0")).join("")
          );
        }
        if (/^#[0-9a-f]{3}$/.test(v)) {
          return "#" + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
        }
        return v;
      }
