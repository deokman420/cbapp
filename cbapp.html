                // Leave the boot gate shut so autosave cannot overwrite it.
                showStatus(
                  "Session not loaded — passphrase cancelled or incorrect."
                );
                reportSaveFailure(
                  "Session not loaded — saving is off so the stored copy is not overwritten. Reset to start fresh."
                );
              }
            } else {
              const skipped = loadSessionFromStorage(session);
              booted = true;
              // Re-persist so Protect state (if any) is reflected in storage.
              saveSession();
              updateProtectButton();
              if (skipped) {
                showStatus(
                  `Session restored — ${skipped} window${
                    skipped === 1 ? "" : "s"
                  } skipped (${MAX_WINDOWS}-window limit).`
                );
              } else {
                showStatus("Session restored.");
              }
            }
          } catch (e) {
            console.error("Failed to load session:", e);
            // booted stays false: the stored copy is unreadable to us but it is
            // still the user's only copy. Refuse to write over it.
            showStatus(
              "Failed to load session" +
                (e && e.message ? `: ${e.message}` : ".")
            );
            reportSaveFailure(
              "Session failed to load — saving is off so the stored copy is not overwritten. Save a Backup elsewhere, then Reset."
            );
          }
        } else {
          // Ensure fresh state on load
          document.body.className = "dark-mode";
          document.querySelector(".nav-menu").classList.remove("collapsed");
          document.getElementById("search-replace").classList.remove("active");
          // Nothing in storage to protect — writes are safe from here.
          booted = true;
        }
        refreshChrome();
        updateProtectButton();
        /* Last, and outside every branch above: reminders have to run whether a
           session was restored, was refused, or never existed. The first sweep is
           the catch-up pass for everything that came due while the app was shut —
           see sweepDueEvents. */
        startAlertScheduler();
        sweepDueEvents();
      };

      // Save session automatically when the tab or browser closes
      window.addEventListener("beforeunload", (event) => {
        saveSession();
        // Optionally, show a confirmation dialog (not recommended for modern browsers)
        // event.preventDefault();
        // event.returnValue = '';
      });

      const resizeObserver = new ResizeObserver(() => {
        const taskWindows = document.querySelectorAll(".task-window");
        taskWindows.forEach((window) => {
          const taskList = window.querySelector(".task-list");
          if (taskList) {
            const headerHeight =
              window.querySelector(".task-header").offsetHeight || 30;
            const inputHeight =
              window.querySelector(".task-input-container").offsetHeight || 40;
            taskList.style.maxHeight = `${
              window.offsetHeight - headerHeight - inputHeight - 20
            }px`;
          }
        });
      });
      resizeObserver.observe(document.getElementById("windows"));

      function clearNoteText(windowId) {
        const windowElement = document.getElementById(windowId);
        const textarea = document.getElementById(`clipboard-${windowId}`);

        // Check if window is locked
        if (windowElement && windowElement.dataset.locked === "true") {
          showStatus("Cannot clear note: window is frozen.");
          return;
        }

        if (textarea) {
          textarea.value = "";
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Note cleared!");
        }
      }

      // Backup: the one artefact that leaves this machine, so since v3.2.11 it
      // is always AES-GCM encrypted. Protect on reuses that passphrase; Protect
      // off is asked for one covering this file only. Cancel and no file is
      // written — there is no plaintext path.
      async function downloadSessionJSON() {
        // buildSessionSnapshot() would capture the empty screen rather than the
        // ciphertext the user actually wants backed up.
        if (sessionLocked) {
          showStatus("Unlock the session before backing it up.");
          return;
        }
        if (!window.crypto?.subtle) {
          // No fallback by design: a browser that cannot encrypt does not get
          // to write a backup at all. Checked up front so it fails with a
          // reason instead of as a thrown error four lines into the seal.
          showStatus("Backup needs Web Crypto, which this browser did not provide.");
          return;
        }
        try {
          const snap = buildSessionSnapshot();
          let pass = sessionPassphrase;
          if (!pass) {
            pass = await promptNewPassphrase({
              title: "Encrypt this backup",
              message:
                "Backups are always encrypted. Choose a passphrase for this file.\n\nYou will need it to import the backup. It is never stored — only you know it — and it does not change how this browser saves your session.",
              okLabel: "Encrypt & download",
            });
            if (pass === null) {
              showStatus("Backup cancelled — no file was written.");
              return;
            }
          }
          const payload = sessionPassphrase
            ? await encryptSessionObject(snap, sessionPassphrase)
            : await encryptForExport(snap, pass);
          const serialized = JSON.stringify(payload);
          if (serialized.length > MAX_SESSION_CHARS) {
            showStatus("Session too large to download.");
            return;
          }
          // Sync storage with the snapshot we just backed up — via
          // persistSessionPayload, never a raw setItem of `serialized`. With
          // Protect off that string is sealed under a throwaway backup
          // passphrase, and storing it would lock the user out of their own
          // browser session.
          await persistSessionPayload(snap);
          const blob = new Blob([serialized], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "cbapp-session.encrypted.json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showStatus("Encrypted backup downloaded.");
        } catch (e) {
          console.error(e);
          showStatus("Failed to download session.");
        }
      }

      // This ships the *program*, never the contents. It used to carry the
      // session as embedded JSON so a copy booted exactly like the original,
      // and that turned out to be a hole: opening any export displaced the
      // session already in the browser and, because a plaintext payload never
      // sets sessionPassphrase, silently dropped Protect and wrote the next
      // autosave in the clear. Backup (encrypted .json) is the only path that
      // carries content now — see the Saving & security section of Help.
      //
      // The clone is scrubbed rather than serialised verbatim: an outerHTML
      // dump baked every open window in as static markup, with no event
      // listeners (undraggable, unclosable), empty bodies (textarea .value
      // doesn't serialise), a duplicate #nav-tooltip id, and windowCount reset
      // to 0 so new windows collided with the baked-in ids.
      async function downloadCbApp() {
        try {
          const clone = document.documentElement.cloneNode(true);

          const clear = (sel) => {
            const el = clone.querySelector(sel);
            if (el) el.innerHTML = "";
          };
          clear("#windows");
          clear("#minimized-bar");
          clear("#status");
          // Emptying #status left its inline display:block behind, so exporting
          // within the 3s a toast is up shipped a file that opens with a blank
          // bordered pill pinned top-centre and no timer to clear it.
          clone.querySelector("#status")?.removeAttribute("style");
          clone.querySelector("#save-warning")?.removeAttribute("style");
          // A timer alert that is up right now belongs to this tab's clock, not
          // to the export — .showing would otherwise ship a card the copy has
          // no timer for, with a Show button pointing at a window id that
          // never existed there.
          clone.querySelector("#app-alert")?.classList.remove("showing");
          ["#app-alert-title", "#app-alert-detail", "#app-alert-extra"].forEach(
            (sel) => {
              const el = clone.querySelector(sel);
              // textContent, so the per-alert buttons in #app-alert-extra go
              // with it — they are built from this tab's live events.
              if (el) el.textContent = "";
            }
          );
          // The mute button's label is live state; the copy starts unmuted.
          const cloneMute = clone.querySelector("#app-alert-mute");
          if (cloneMute) cloneMute.textContent = "Mute";
          // Same reasoning for the lock banner: this tab's state, not the
          // export's — the copy has its own session and its own lock, if any.
          clone.querySelector("#locked-banner")?.removeAttribute("style");
          clone.querySelector("#lock-now")?.removeAttribute("style");
          /* enterLockedState() rewrites the empty-state hint in place, so a
             copy taken while locked shipped a blank app whose first sentence
             was "your saved session is encrypted and was not opened" — about a
             session the copy has never had. The original text is parked on the
             element for exactly this reason. */
          const cloneHint = clone.querySelector("#empty-state .empty-hint");
          if (cloneHint && cloneHint.dataset.unlockedText) {
            cloneHint.innerHTML = cloneHint.dataset.unlockedText;
            delete cloneHint.dataset.unlockedText;
          }
          // The canvas view is state, not markup. Leaving the pan/zoom
          // transform and the mode class baked into the file would make the
          // copy open on a stale viewport that nothing later corrects.
          clone.querySelector("#windows")?.removeAttribute("style");
          clone.querySelector("#canvas-grid")?.removeAttribute("style");
          clone.querySelector("#canvas-map")?.removeAttribute("style");
          clone.querySelector("#map-viewport")?.removeAttribute("style");
          // Minimap blocks are generated from the live windows, exactly like
          // the windows themselves, so they must not travel with the file.
          clone.querySelectorAll(".map-window").forEach((n) => n.remove());
          clone
            .querySelector("body")
            ?.classList.remove(
              "canvas-on",
              "canvas-panning",
              "canvas-interacting"
            );
          // Created by script at load; leaving it in yields two same-id nodes.
          clone.querySelector("#nav-tooltip")?.remove();
          clone.querySelector("#empty-state")?.removeAttribute("hidden");
          clone.querySelector("#search-replace")?.classList.remove("active");
          clone
            .querySelectorAll(".nav-menu button.active")
            .forEach((b) => b.classList.remove("active"));
          clone.querySelector(".nav-menu")?.classList.remove("collapsed");
          // Belt and braces: a copy taken from a pre-3.2.7 export would
          // otherwise pass that file's baked-in session on to the new one.
          clone.querySelector("#cbapp-embedded-session")?.remove();

          const html = "<!DOCTYPE html>\n" + clone.outerHTML;
          const blob = new Blob([html], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "cbapp.html";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showStatus(
            "Downloaded a blank cbapp.html — use Backup to save your notes."
          );
        } catch (e) {
          console.error("Download failed:", e);
          showStatus("Failed to download CB App.");
        }
      }

      function importData() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json,application/json";
        input.style.display = "none";

        input.onchange = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async (e) => {
            try {
              const text = e.target.result;
              if (typeof text !== "string" || text.length > MAX_SESSION_CHARS) {
                showStatus("Import failed: file too large or invalid.");
                return;
              }
              // Ask permission to destroy what is here before touching the
              // file: parseAndUnlockSession() caches the *backup's* passphrase
              // into sessionPassphrase, which is the very thing the protected
              // case has to compare against.
              if (!(await confirmImportOverCurrent())) return;
              const session = await parseAndUnlockSession(text, {
                promptReason:
                  "This backup is passphrase-protected. Enter the passphrase:",
              });
              if (!session) {
                showStatus("Import cancelled or passphrase incorrect.");
                return;
              }
              // Clear UI without wiping the passphrase we just unlocked for this import.
              const keepPass = sessionPassphrase;
              performReset();
              sessionPassphrase = keepPass;
              loadSessionFromStorage(session);
              // Persist validated (and re-encrypted if Protect is active) form.
              const ok = await persistSessionPayload(buildSessionSnapshot());
              updateProtectButton();
              // An encrypted import adopts its passphrase for this browser. Say
              // so, or the next reload asks for a passphrase the user thought
              // belonged only to a file.
              const dropped = eventsDroppedOnValidate
                ? ` ${eventsDroppedOnValidate} event${
                    eventsDroppedOnValidate === 1 ? " was" : "s were"
                  } past the ${MAX_EVENTS} limit and not imported.`
                : "";
              showStatus(
                ok
                  ? keepPass
                    ? `Session imported — this browser is now protected with that passphrase.${dropped}`
                    : `Session imported (validated).${dropped}`
                  : "Session imported but failed to re-save."
              );
            } catch (err) {
              console.error(err);
              showStatus(
                "Failed to import session" +
                  (err && err.message ? `: ${err.message}` : ".")
              );
            }
          };
          reader.readAsText(file);
        };

        document.body.appendChild(input);
        input.click();
        document.body.removeChild(input);
      }
      let originalFavicon = null;

      function startCountdown(windowId) {
        const minInput = instancePart(windowId, "countdown-minutes");
        const secInput = instancePart(windowId, "countdown-seconds");
        if (!minInput || !secInput) return;
        let minutes = parseInt(minInput.value, 10) || 0;
        let seconds = parseInt(secInput.value, 10) || 0;
        let totalMs = (minutes * 60 + seconds) * 1000;
        if (totalMs <= 0) {
          showStatus("Please enter a time greater than 0.");
          return;
        }
        const cd = stateFor(windowId).countdown;
        // Starting a fresh run answers the last one; leaving the old card up
        // would have it announce a timer that is already running again.
        if (_timerAlertWindow === windowId) dismissAppAlert();
        // This click is the gesture the chime needs — see primeAlertAudio.
        if (alertSoundOn) primeAlertAudio();
        cd.endTime = Date.now() + totalMs;
        cd.active = true;
        updateCountdownDisplay(windowId);
        if (cd.interval) clearInterval(cd.interval);
        cd.interval = setInterval(() => updateCountdownDisplay(windowId), 500);
        showStatus(`Countdown started for ${minutes} min ${seconds} sec!`);
      }

      function resetCountdown(windowId) {
        const cd = stateFor(windowId).countdown;
        if (_timerAlertWindow === windowId) dismissAppAlert();
        cd.active = false;
        cd.endTime = null;
        clearInterval(cd.interval);
        cd.interval = null;
        const minInput = instancePart(windowId, "countdown-minutes");
        const secInput = instancePart(windowId, "countdown-seconds");
        const display = instancePart(windowId, "countdown-display");
        if (!minInput || !secInput || !display) return;
        let minutes = parseInt(minInput.value, 10) || 0;
        let seconds = parseInt(secInput.value, 10) || 0;
        display.textContent = `${Math.floor(minutes / 60)
          .toString()
          .padStart(2, "0")}:${(minutes % 60)
          .toString()
          .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        restoreFavicon();
      }

      function updateCountdownDisplay(windowId) {
        const display = instancePart(windowId, "countdown-display");
        const cd = stateFor(windowId).countdown;
        if (!display || !cd.active || !cd.endTime) return;
        let msLeft = cd.endTime - Date.now();
        if (msLeft <= 0) {
          display.textContent = "00:00:00";
          cd.active = false;
          clearInterval(cd.interval);
          cd.interval = null;
          upliftingNotification(windowId);
          setCountdownFavicon();
          return;
        }
        let totalSeconds = Math.floor(msLeft / 1000);
        let h = Math.floor(totalSeconds / 3600);
        let m = Math.floor((totalSeconds % 3600) / 60);
        let s = totalSeconds % 60;
        display.textContent = `${h.toString().padStart(2, "0")}:${m
          .toString()
          .padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }

      let _titleFlash = null;
      function upliftingNotification(windowId) {
        // The in-app card, not the 3s toast: a timer you set is worth an
        // announcement that survives being away from the tab, and #status
        // erases itself after three seconds.
        showTimerAlert(windowId);
        // Flash the tab title, because the most likely reason you set a timer
        // is that you're looking at something else.
        if (_titleFlash) clearInterval(_titleFlash);
        const originalTitle = "CB App";
        // The CSS reduced-motion block can't reach document.title, so this
        // 14-second flash was the one piece of motion that ignored the
        // preference outright. The alert card already carries the message; a
        // settled title is enough.
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.title = "⏰ Timer finished";
          const restore = () => {
            document.title = originalTitle;
            window.removeEventListener("focus", restore);
          };
          window.addEventListener("focus", restore);
        } else {
        let on = false;
        let ticks = 0;
        _titleFlash = setInterval(() => {
          on = !on;
          document.title = on ? "⏰ Timer finished" : originalTitle;
          if (++ticks >= 20) {
            clearInterval(_titleFlash);
            _titleFlash = null;
            document.title = originalTitle;
          }
        }, 700);
        const stopFlash = () => {
          if (_titleFlash) {
            clearInterval(_titleFlash);
            _titleFlash = null;
          }
          document.title = originalTitle;
          window.removeEventListener("focus", stopFlash);
        };
        window.addEventListener("focus", stopFlash);
        }

        // No OS notification. It needed a permission this app never asks for,
        // browsers drop it under file:// without a service worker, and on a
        // managed machine it puts "CB App" on the desktop. #app-alert is the
        // announcement now — see showTimerAlert.
      }

      /* --- Alert chime ---
         Synthesised with the Web Audio API, deliberately not a base64 audio
         file. A base64 <audio> would cost three things this app does not want
         to pay: ~40KB of data: URI in a single file people download, a
         `media-src data:` hole in a CSP that is otherwise `media-src 'none'`,
         and a binary blob nobody can review in a diff. Three sine tones with a
         bell partial and a long decay cost about forty lines and no bytes, and
         `media-src` stays shut — an AudioContext is not a media fetch.

         D5 - A5 - D6: an open fifth and octave, ~1.3s, one pass. It reads as a
         soft chime rather than a ringtone, and it does not repeat. To swap in a
         recorded chime later: base64 an .mp3 into an <audio src="data:audio/
         mpeg;base64,..."> and add `media-src data:` to BOTH the meta CSP at the
         top of this file and the cbapp headers in vercel.json. */
      const ALERT_CHIME = [
        { hz: 587.33, at: 0 }, // D5
        { hz: 880.0, at: 0.16 }, // A5
        { hz: 1174.66, at: 0.32 }, // D6
      ];

      /* One flag for every alert sound in the app. It is persisted under the
         session key `timerSound`, which is what v3.2.17 wrote and what sessions
         on disk already carry — the name stayed put when the meaning widened
         from "the countdown" to "any alert". */
      let alertSoundOn = true;
      let _audioCtx = null;

      /* Autoplay policy: a context created outside a gesture starts suspended
         and stays silent. Start is a click, so the context is built and
         unlocked there — by the time the timer ends there is no gesture left to
         borrow. Calendar reminders have no gesture at all near the firing, which
         is why every save of an event primes it too. */
      function primeAlertAudio() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        try {
          if (!_audioCtx) _audioCtx = new Ctx();
          if (_audioCtx.state === "suspended") _audioCtx.resume();
          return _audioCtx;
        } catch (e) {
          return null; // no audio is not a reason to lose the alert card
        }
      }

      function playAlertChime() {
        if (!alertSoundOn) return;
        const ctx = primeAlertAudio();
        if (!ctx) return;
        try {
          const out = ctx.createGain();
          out.gain.value = 0.9;
          // Takes the glassy edge off the partials; this is meant to be soft.
          const soften = ctx.createBiquadFilter();
          soften.type = "lowpass";
          soften.frequency.value = 3200;
          out.connect(soften);
          soften.connect(ctx.destination);
          const t0 = ctx.currentTime + 0.02;
          ALERT_CHIME.forEach(({ hz, at }) => {
            // Fundamental plus a quiet octave — what makes it read as a chime
            // and not a test tone.
            [
              [hz, 0.16],
              [hz * 2, 0.04],
            ].forEach(([freq, peak]) => {
              const osc = ctx.createOscillator();
              const env = ctx.createGain();
              osc.type = "sine";
              osc.frequency.value = freq;
              /* Exponential ramps, and never to or from a true zero: 0 is
                 illegal for exponentialRampToValueAtTime and a linear fade
                 clicks at the tail. */
              env.gain.setValueAtTime(0.0001, t0 + at);
              env.gain.exponentialRampToValueAtTime(peak, t0 + at + 0.02);
              env.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 1.1);
              osc.connect(env);
              env.connect(out);
              osc.start(t0 + at);
              osc.stop(t0 + at + 1.2);
            });
          });
        } catch (e) {
          /* the card carries the message on its own */
        }
      }

      /* The mute button lives on the alert card because the moment you hear a
         sound you did not want is the moment you want the switch. The choice is
         saved with the session. */
      function toggleAlertSound() {
        alertSoundOn = !alertSoundOn;
        syncAlertSoundButton();
        showStatus(alertSoundOn ? "Alert sound on." : "Alert sound muted.");
        saveSession();
      }

      function syncAlertSoundButton() {
        const btn = document.getElementById("app-alert-mute");
        if (!btn) return;
        btn.textContent = alertSoundOn ? "Mute" : "Unmute";
        btn.setAttribute(
          "aria-label",
          alertSoundOn ? "Mute the alert sound" : "Unmute the alert sound"
        );
      }

      /* --- The app alert card ---
         One card, two producers: the countdown (v3.2.17) and calendar reminders
         (v4.0.0). It stays up until it is dismissed, which is the whole point —
         an alert you asked for must survive being in another tab.

         Every caller goes through here. `detail` and every button label are set
         with textContent, never innerHTML: an event title is user text, and the
         catch-up card renders several of them at once. */
      function showAppAlert({ icon, title, detail, actions }) {
        const alertEl = document.getElementById("app-alert");
        if (!alertEl) return;
        const iconEl = document.getElementById("app-alert-icon");
        const titleEl = document.getElementById("app-alert-title");
        const detailEl = document.getElementById("app-alert-detail");
        const extra = document.getElementById("app-alert-extra");
        if (iconEl) iconEl.textContent = icon || "⏰";
        if (titleEl) titleEl.textContent = title || "";
        if (detailEl) detailEl.textContent = detail || "";
        if (extra) {
          extra.textContent = ""; // clears the previous alert's own buttons
          (actions || []).forEach((action) => {
            if (!action || !action.label) return;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = action.label;
            // addEventListener, not an onclick string: the handler closes over
            // the event this card is about, and nothing is serialised into HTML.
            btn.addEventListener("click", () => {
              dismissAppAlert();
              try {
                action.onClick();
              } catch (e) {
                console.warn("Alert action failed:", e);
              }
            });
            extra.appendChild(btn);
          });
        }
        playAlertChime();
        syncAlertSoundButton();
        alertEl.classList.add("showing");
      }

      function dismissAppAlert() {
        const alertEl = document.getElementById("app-alert");
        if (alertEl) alertEl.classList.remove("showing");
        _timerAlertWindow = null;
        // Dismissing is the acknowledgement, so the other two attention-getters
        // stand down with it instead of outliving the card.
        if (_titleFlash) {
          clearInterval(_titleFlash);
          _titleFlash = null;
        }
        document.title = "CB App";
        restoreFavicon();
      }

      /* --- The countdown's use of it --- */
      let _timerAlertWindow = null;

      function showTimerAlert(windowId) {
        _timerAlertWindow = windowId || null;
        const target = windowId && document.getElementById(windowId);
        showAppAlert({
          icon: "⏰",
          title: "Timer finished",
          detail: timerAlertDetail(windowId),
          // Nothing to go back to if the clock was closed while the timer ran.
          actions: target
            ? [{ label: "Show", onClick: () => revealWindow(windowId) }]
            : [],
        });
      }

      // "Clock 2 reached zero." — which clock matters once more than one is
      // open, and each desk can hold its own.
      function timerAlertDetail(windowId) {
        const el = windowId && document.getElementById(windowId);
        if (!el) return "The countdown reached zero.";
        const label = el.querySelector(".clock-title")?.textContent?.trim();
        const elsewhere = !inCurrentMode(el)
          ? ` (on the ${
              windowMode(el) === CANVAS ? "canvas" : "windowed"
            } desk)`
          : "";
        return `${label || "Countdown"} reached zero.${elsewhere}`;
      }

      /* Go back to a window an alert is about: swap desks if it lives on the
         other one, un-minimize it, raise it, and centre the canvas on it. Shared
         by the timer's Show and the calendar's. */
      function revealWindow(windowId) {
        const el = windowId && document.getElementById(windowId);
        if (!el) return;
        if (!inCurrentMode(el)) toggleCanvasMode(windowMode(el) === CANVAS);
        if (el.style.display === "none") restoreWindow(windowId);
        else setActiveWindow(windowId);
        if (view.on) {
          const w = el.offsetWidth || parseFloat(el.dataset.width) || 0;
          const h = el.offsetHeight || parseFloat(el.dataset.height) || 0;
          const cx = (parseFloat(el.dataset.x) || 0) + w / 2;
          const cy = (parseFloat(el.dataset.y) || 0) + h / 2;
          view.x = window.innerWidth / 2 - cx * view.zoom;
          view.y = window.innerHeight / 2 - cy * view.zoom;
          scheduleView();
        }
      }

      function setCountdownFavicon() {
        if (!originalFavicon) {
          const link = document.querySelector("link[rel~='icon']");
          if (link) originalFavicon = link.href;
        }
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          document.head.appendChild(link);
        }
        // Emoji favicon (works in most browsers)
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.font = "48px serif";
        ctx.fillText("🍽️", 8, 48);
        link.href = canvas.toDataURL();
      }

      function restoreFavicon() {
        if (originalFavicon) {
          let link = document.querySelector("link[rel~='icon']");
          if (link) link.href = originalFavicon;
        }
      }

      /* ==========================================================
         CALENDAR ENGINE (v4.0.0)
         ----------------------------------------------------------
         The store, the occurrence maths and the scheduler. No DOM below this
         comment until the window itself — the alerts deliberately do not depend
         on a calendar window being open. You set a reminder; you should not have
         to keep a window open to be told.
         ========================================================== */
      let calendarEvents = [];

      function eventById(id) {
        return calendarEvents.find((e) => e.id === id) || null;
      }

      /* A copy of the store, for anything outside this script scope. `let` at the
         top level of a classic script does not become a window property the way a
         function declaration does, so the tests can call every helper here but
         cannot see the array they operate on without this. A copy, not the array:
         commitEvents is the only way in. */
      function calendarEventsSnapshot() {
        return calendarEvents.slice();
      }

      /* Every mutation goes through here: it keeps the cap honest, keeps both
         desks' calendars in step, and saves. Sorting on the way in means every
         reader — grid, day list, agenda, scheduler — gets chronological order
         without sorting again. */
      function commitEvents(nextEvents, { save = true } = {}) {
        /* Sort THEN slice. The other way round dropped whichever entries the
           caller happened to put last rather than the latest events — order in,
           order out, with no relation to the calendar. */
        calendarEvents = nextEvents
          .slice()
          .sort((a, b) =>
            `${a.date}T${a.time || "00:00"}`.localeCompare(
              `${b.date}T${b.time || "00:00"}`
            )
          )
          .slice(0, MAX_EVENTS);
        renderAllCalendars();
        if (save) saveSession();
      }

      // --- Local wall-clock helpers ------------------------------------------
      // Everything here builds Dates with the (y, m, d) constructor, never by
      // parsing a string: new Date("2026-08-14") is UTC midnight, which is the
      // previous day for anyone west of Greenwich.

      function dateKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(
          d.getDate()
        ).padStart(2, "0")}`;
      }

      function timeKey(d) {
        return `${String(d.getHours()).padStart(2, "0")}:${String(
          d.getMinutes()
        ).padStart(2, "0")}`;
      }

      function parseDateKey(key) {
        const [y, m, d] = String(key).split("-").map(Number);
        return new Date(y, (m || 1) - 1, d || 1);
      }

      /* When an occurrence on `dateStr` actually begins. An all-day event has no
         time of its own, so it begins at ALL_DAY_HOUR — that is what gives its
         lead time something to count back from. */
      function occurrenceStart(event, dateStr) {
        const base = parseDateKey(dateStr);
        if (event.allDay || !event.time) {
          base.setHours(ALL_DAY_HOUR, 0, 0, 0);
          return base;
        }
        const [h, m] = event.time.split(":").map(Number);
        base.setHours(h, m, 0, 0);
        return base;
      }

      /* The moment the alert should fire for a given occurrence — the one number
         the whole scheduler runs on. Null means this event never fires. */
      function eventFireAt(event, dateStr) {
        if (!hasAlert(event)) return null;
        const start = occurrenceStart(event, dateStr);
        return new Date(start.getTime() - event.alertMinutes * 60000);
      }

      /* Clamping, so a monthly event on the 31st does not silently skip
         February. JS rolls an overflowing day into the next month (Feb 31 ->
         Mar 3), which would move the appointment; the last day of the shorter
         month is the answer that keeps it in the month the user picked. Yearly
         Feb 29 lands on Feb 28 in a common year for the same reason. */
      function daysInMonth(year, monthIndex) {
        return new Date(year, monthIndex + 1, 0).getDate();
      }

      function clampedDate(year, monthIndex, day) {
        return new Date(
          year,
          monthIndex,
          Math.min(day, daysInMonth(year, monthIndex))
        );
      }

      /* Whole local days between two local midnights, and days added the only
         way that is safe.

         v4.0.3: `daily` and `weekly` used to do millisecond arithmetic —
         `Math.ceil((fromDay - first) / (7 * DAY))` and
         `first.getTime() + steps * 7 * DAY`. Elapsed ms between two local
         midnights is NOT a whole number of days across a DST boundary: it is off
         by an hour. So the division stopped being exact, `Math.ceil` rounded a
         partial week up to a whole extra one, and the timestamp landed on the
         wrong local weekday. A weekly event dated Wednesday 2026-07-01 reported
         TUESDAYS from November onwards — 4,592 wrong answers in a year-long
         sweep, in the grid dots, the day list and the scheduler alike, because
         everything asks this one function. `daily` failed too, once a year, on
         the spring-forward day: the event vanished from the grid and skipped its
         reminder.

         Math.round, not ceil, because after rounding to whole days the gap is
         exact by construction. Adding through the (y, m, d) constructor lets the
         platform handle the offset instead of pretending there isn't one. */
      function dayDiff(fromMidnight, toMidnight) {
        /* Differenced as UTC calendar dates, not as elapsed local time. Rounding
           the elapsed ms recovers a plus-or-minus 1h DST shift, which was the
           v4.0.3 fix, but it cannot recover a whole missing day: Samoa deleted 30
           December 2011 outright, so in Pacific/Apia the elapsed 24h periods
           between two local midnights are one fewer than the calendar dates
           between them. Measured there, a daily event anchored before the jump
           disappeared from the grid for every day of the month. Date.UTC counts
           dates, so this is exact for any zone and any gap. */
        return Math.round(
          (Date.UTC(
            toMidnight.getFullYear(),
            toMidnight.getMonth(),
            toMidnight.getDate()
          ) -
            Date.UTC(
              fromMidnight.getFullYear(),
              fromMidnight.getMonth(),
              fromMidnight.getDate()
            )) /
            86400000
        );
      }

      function addDays(midnight, n) {
        return new Date(
          midnight.getFullYear(),
          midnight.getMonth(),
          midnight.getDate() + n
        );
      }

      function midnightOf(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      /* The first occurrence of `event` on or after `from` (a Date). Returns a
         "YYYY-MM-DD" string, or null for a one-off that is already past.
         Deliberately arithmetic rather than iterative: a daily event first set
         two years ago must not cost 700 loop turns to answer. */
      function nextOccurrence(event, from) {
        const fromDay = midnightOf(from);
        const first = parseDateKey(event.date);
        if (first >= fromDay) return event.date;
        if (event.repeat === "none") return null;

        const gap = dayDiff(first, fromDay); // > 0 here
        if (event.repeat === "daily") {
          return dateKey(addDays(first, gap));
        }
        if (event.repeat === "weekly") {
          return dateKey(addDays(first, Math.ceil(gap / 7) * 7));
        }
        if (event.repeat === "monthly") {
          const months =
            (fromDay.getFullYear() - first.getFullYear()) * 12 +
            (fromDay.getMonth() - first.getMonth());
          for (let i = 0; i < 3; i++) {
            // At most three tries: this month, then the next two. Clamping can
            // pull a date backwards (the 31st becoming the 28th), so the first
            // candidate is not always on or after `from`.
            const candidate = clampedDate(
              first.getFullYear(),
              first.getMonth() + months + i,
              first.getDate()
            );
            if (candidate >= fromDay) return dateKey(candidate);
          }
          return null;
        }
        if (event.repeat === "yearly") {
          const years = fromDay.getFullYear() - first.getFullYear();
          for (let i = 0; i < 3; i++) {
            const candidate = clampedDate(
              first.getFullYear() + years + i,
              first.getMonth(),
              first.getDate()
            );
            if (candidate >= fromDay) return dateKey(candidate);
          }
          return null;
        }
        return null;
      }

      /* The LAST occurrence that has already started at `limit` (a Date), or null
         if the event has not begun. The mirror of nextOccurrence, and the reason
         the scheduler needs it: "which reminder is due?" is a question about the
         most recent occurrence, and asking nextOccurrence gave the oldest one in
         the window instead — see dueOccurrence. */
      function previousOccurrence(event, limit) {
        const limitDay = midnightOf(limit);
        const first = parseDateKey(event.date);
        if (limitDay < first) return null;

        let candidate;
        if (event.repeat === "daily") {
          candidate = dateKey(addDays(first, dayDiff(first, limitDay)));
        } else if (event.repeat === "weekly") {
          candidate = dateKey(
            addDays(first, Math.floor(dayDiff(first, limitDay) / 7) * 7)
          );
        } else if (event.repeat === "monthly") {
          const months =
            (limitDay.getFullYear() - first.getFullYear()) * 12 +
            (limitDay.getMonth() - first.getMonth());
          // Down from this month rather than up: clamping can push a candidate
          // past the limit (the 31st landing on the 28th cannot, but the reverse
          // walk still needs the guard for the month it overshoots).
          candidate = null;
          for (let i = 0; i <= months; i++) {
            const probe = clampedDate(
              first.getFullYear(),
              first.getMonth() + months - i,
              first.getDate()
            );
            if (probe <= limitDay) {
              candidate = dateKey(probe);
              break;
            }
          }
          if (!candidate) return null;
        } else if (event.repeat === "yearly") {
          const years = limitDay.getFullYear() - first.getFullYear();
          candidate = null;
          for (let i = 0; i <= years; i++) {
            const probe = clampedDate(
              first.getFullYear() + years - i,
              first.getMonth(),
              first.getDate()
            );
            if (probe <= limitDay) {
              candidate = dateKey(probe);
              break;
            }
          }
          if (!candidate) return null;
        } else {
          // "none", and anything unrecognised, behaves as a single occurrence.
          candidate = event.date;
        }

        /* Everything above answers in whole days, but an occurrence starts at a
           time of day: the 09:00 one on the limit's own date has not started at
           00:30. Step back one period when that happens. */
        if (occurrenceStart(event, candidate) > limit) {
          const day = parseDateKey(candidate);
          let back = null;
          if (event.repeat === "daily") back = addDays(day, -1);
          else if (event.repeat === "weekly") back = addDays(day, -7);
          else if (event.repeat === "monthly") {
            back = clampedDate(
              first.getFullYear(),
              day.getMonth() - 1 + (day.getFullYear() - first.getFullYear()) * 12,
              first.getDate()
            );
          } else if (event.repeat === "yearly") {
            back = clampedDate(
              day.getFullYear() - 1,
              first.getMonth(),
              first.getDate()
            );
          }
          if (!back || back < first) return null;
          candidate = dateKey(back);
        }
        return candidate;
      }

      /* Does `event` land on `dateStr`? Used by the month grid and the day list.
         Asking nextOccurrence from that day and comparing is exact and cheap —
         no separate recurrence walk to keep in step with the one above. */
      function eventOccursOn(event, dateStr) {
        if (event.date === dateStr) return true;
        if (event.repeat === "none") return false;
        if (dateStr < event.date) return false;
        return nextOccurrence(event, parseDateKey(dateStr)) === dateStr;
      }

      function eventsOn(dateStr) {
        return calendarEvents.filter((e) => eventOccursOn(e, dateStr));
      }

      // --- The scheduler -----------------------------------------------------
      /* 20s, because a reminder that lands 20 seconds late is still a reminder
         and a tighter loop buys nothing. Background tabs are throttled to about
         one tick a minute by every current browser, so an alert can be up to a
         minute late while the tab is hidden — hence the immediate sweep when the
         tab is looked at again, and the catch-up pass for time spent closed. */
      const ALERT_TICK_MS = 20000;
      /* How far back the catch-up pass looks. A daily event untouched for a year
         has 365 missed occurrences and none of them is news; a week is the
         window where "you missed this" is still worth saying. */
      const CATCHUP_DAYS = 7;
      let _alertTick = null;

      /* The interval guard used to sit above two unconditional addEventListener
         calls, so the function advertised a re-entrancy the listeners did not
         honour — a second call would have double-swept forever. Registered once,
         outside, so calling this twice is genuinely harmless. A hidden tab's
         timers are throttled, so anything that came due in the background is
         delivered the moment the tab is looked at again. */
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) sweepDueEvents();
      });
      window.addEventListener("focus", () => sweepDueEvents());

      function startAlertScheduler() {
        if (_alertTick) clearInterval(_alertTick);
        _alertTick = setInterval(sweepDueEvents, ALERT_TICK_MS);
      }

      /* Does this event ask to be reminded at all? Four sites tested this and one
         of them tested only half of it, which is how an `alertMinutes: undefined`
         record came to render "⏰ -undefinedm" in a row while the scheduler
         correctly treated it as silent. */
      function hasAlert(event) {
        return event.alertMinutes !== null && event.alertMinutes !== undefined;
      }

      /* The occurrence of `event` whose alert time has passed but which has not
         been announced yet, or null. This is the one place `lastFired` is
         interpreted: it holds the occurrence stamp that was announced, so a
         one-off never repeats and a recurring event is free to fire again next
         time round.

         v4.0.3 rewrote the search. It used to ask nextOccurrence from
         `now - leadTime`, which returns the FIRST occurrence in that window —
         the oldest pending one, the exact opposite of what a reminder means.
         With a one-day lead a daily event announced YESTERDAY's occurrence and
         stamped it, so today's genuine reminder never fired and the event stayed
         permanently one lead behind. With a lead over CATCHUP_DAYS (the form
         allows up to 69 days) the occurrence it picked was always older than the
         catch-up cutoff, so sweepDueEvents counted it stale and said nothing at
         all: a two-week reminder was silent forever. It could also skip a genuine
         missed occurrence outright, because looking forward from `now - lead`
         steps straight over anything earlier.

         fireAt rises monotonically with the occurrence, so "the latest one whose
         alert has passed" is simply the last occurrence to have started by
         `now + leadTime` — one previousOccurrence call, no walking. */
      function dueOccurrence(event, now) {
        if (!hasAlert(event)) return null;
        const limit = new Date(
          now.getTime() + Math.max(event.alertMinutes, 0) * 60000
        );
        const candidate = previousOccurrence(event, limit);
        if (!candidate) return null;
        const fireAt = eventFireAt(event, candidate);
        // previousOccurrence guarantees this, but the guard costs nothing and the
        // arithmetic above is the kind that gets edited.
        if (!fireAt || fireAt > now) return null;
        const stamp = occurrenceStamp(event, candidate);
        if (event.lastFired && event.lastFired >= stamp) return null;
        return candidate;
      }

      // The identity of one occurrence: its date plus the time it starts. Two
      // occurrences of a repeating event never share it, which is exactly what
      // lastFired needs to compare against.
      function occurrenceStamp(event, dateStr) {
        const start = occurrenceStart(event, dateStr);
        return `${dateKey(start)}T${timeKey(start)}`;
      }

      /* The tick. Anything due is announced now; anything due but older than the
         catch-up window is counted rather than announced, so a calendar left alone
         for a month does not open into a wall of alerts.

         "Counted" is the honest word. Only the LATEST due occurrence per event is
         ever examined, because that is what a reminder means — the four days a
         daily event went unseen are not enumerated, and nothing pretends they
         were. */
      function sweepDueEvents() {
        if (sessionLocked) return; // no events are loaded; nothing to announce
        const now = new Date();
        const cutoff = new Date(now.getTime() - CATCHUP_DAYS * 86400000);
        const fresh = [];
        let stale = 0;
        let changed = false;
        calendarEvents.forEach((event) => {
          if (!hasAlert(event)) return;
          const occurrence = dueOccurrence(event, now);
          if (!occurrence) return;
          event.lastFired = occurrenceStamp(event, occurrence);
          changed = true;
          if (eventFireAt(event, occurrence) >= cutoff) {
            fresh.push({ event, occurrence });
          } else {
            stale += 1;
          }
        });
        if (!changed) return;
        if (fresh.length) announceEvents(fresh, stale);
        else if (stale) {
          /* Everything due was older than the catch-up window. A card with a chime
             would be noise for something nobody can act on, but stamping them and
             saying nothing at all is the silent truncation the comment above claims
             not to do — so it goes to the status line instead. */
          showStatus(
            `${stale} reminder${stale === 1 ? "" : "s"} passed while CB App was closed (more than ${CATCHUP_DAYS} days ago).`
          );
        }
        // The stamps are part of the session: without this, the same reminder
        // fires again on the next reload.
        saveSession();
      }

      /* One card however many fired. Firing five chimes for five reminders is
         how a notification system teaches people to mute it. */
      function announceEvents(fired, staleCount) {
        const lines = fired.map(({ event, occurrence }) => {
          const when = event.allDay
            ? "all day"
            : occurrenceStart(event, occurrence).toLocaleTimeString(undefined, {
                hour: "numeric",
                minute: "2-digit",
              });
          const dayLabel =
            occurrence === dateKey(new Date())
              ? ""
              : ` · ${parseDateKey(occurrence).toLocaleDateString(undefined, {
                  weekday: "short",
                  month: "short",
                  day: "numeric",
                })}`;
          return `${when}${dayLabel} — ${event.title || "(untitled)"}`;
        });
        if (staleCount) {
          // Never truncate in silence: say that older ones were passed over.
          lines.push(
            `(${staleCount} older reminder${staleCount === 1 ? "" : "s"} passed over — more than ${CATCHUP_DAYS} days ago)`
          );
        }
        const first = fired[0];
        showAppAlert({
          icon: "📅",
          title:
            fired.length === 1
              ? "Reminder"
              : `${fired.length} reminders`,
          detail: lines.join("\n"),
          actions: [
            {
              label: "Open calendar",
              onClick: () => openCalendarOn(first.occurrence),
            },
          ],
        });
      }

      /* Show the day an alert was about: reuse this desk's calendar if it is
         open, otherwise open one. */
      function openCalendarOn(dateStr) {
        let id = deskInstanceId("calendar");
        if (!document.getElementById(id)) {
          addCalendar();
          id = deskInstanceId("calendar");
        }
        const el = document.getElementById(id);
        if (!el) return;
        const day = parseDateKey(dateStr);
        el.dataset.viewYear = day.getFullYear();
        el.dataset.viewMonth = day.getMonth();
        /* calSelectDay rather than three dataset writes and a render: it also
           retargets an open form's date field, which this used to skip — leaving
           a form for one day above a grid showing another. */
        calSelectDay(id, dateStr);
        revealWindow(id);
      }

      /* ==========================================================
         THE CALENDAR WINDOW (v4.0.0)
         ----------------------------------------------------------
         One per desk, like Calc/Clock/Log/Help, with every inner id suffixed by
         its owner's — see the ONE PER DESK comment. What it does NOT own is the
         events: those live in `calendarEvents` and both windows render the same
         store, so an event added on the canvas desk is on the plain desk too.

         View state (which month is showing, which day is selected) IS per
         window: it rides in dataset and is written into the window record, so
         both survive a reload. Before v4.0.3 only the selected day was saved and
         the month was re-derived from it, which this comment claimed otherwise.

         Every row is built with createElement and textContent. Event titles and
         notes are user text and never go near innerHTML.
         ========================================================== */
      const CAL_DAY_NAMES = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

      function toggleCalendar(targetMode) {
        const id = deskInstanceId("calendar", targetMode);
        const existing = document.getElementById(id);
        if (existing && existing.style.display === "none") {
          restoreWindow(id);
          return;
        }
        if (existing) {
          closeWindow(id);
          return;
        }
        addCalendar(targetMode);
      }

      function addCalendar(targetMode) {
        if (document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS) {
          showStatus(
            `Maximum of ${MAX_WINDOWS} windows reached — close one first.`
          );
          return;
        }
        const calid = deskInstanceId("calendar", targetMode);
        if (document.getElementById(calid)) {
          setActiveWindow(calid);
          return document.getElementById(calid);
        }
        const windowsContainer = document.getElementById("windows");
        const newWindow = document.createElement("div");
        newWindow.className = "calendar-window";
        newWindow.id = calid;
        if (targetMode) newWindow.dataset.mode = targetMode;
        newWindow.style.zIndex = nextWindowZ();
        const defaultWidth = 480;
        const defaultHeight = 640;
        newWindow.dataset.width = defaultWidth;
        newWindow.dataset.height = defaultHeight;
        newWindow.style.width = `${defaultWidth}px`;
        newWindow.style.height = `${defaultHeight}px`;
        placeWindow(newWindow, defaultWidth, defaultHeight);

        const today = new Date();
        newWindow.dataset.viewYear = today.getFullYear();
        newWindow.dataset.viewMonth = today.getMonth();
        newWindow.dataset.selected = dateKey(today);

        newWindow.innerHTML = `
        <div class="calendar-header">
          <span class="calendar-title">Calendar</span>
          <div class="calendar-controls">
            <span class="edit-window" onclick="startRename('${calid}')" title="Rename" role="button" tabindex="0">✏️</span>
            <span class="minimize-window" onclick="minimizeWindow('${calid}')" title="Minimize" role="button" tabindex="0">🗕</span>
            <span class="lock-window" onclick="toggleWindowLock('${calid}')" title="Freeze editing, dragging and resizing (not encryption)" role="button" tabindex="0" aria-pressed="false">🔓</span>
            <span class="close-calendar" onclick="closeWindow('${calid}')" title="Close" role="button" tabindex="0">×</span>
          </div>
        </div>
        <div class="cal-content">
          <!-- data-lock-exempt: paging the month and searching are reading, not
               editing, so they survive a freeze. Add event does not. -->
          <div class="cal-monthbar">
            <button type="button" data-lock-exempt="true" onclick="calShiftMonth('${calid}', -1)" title="Previous month" aria-label="Previous month">‹</button>
            <span class="cal-month-label" id="cal-month-${calid}" aria-live="polite"></span>
            <button type="button" data-lock-exempt="true" onclick="calGoToday('${calid}')">Today</button>
            <button type="button" data-lock-exempt="true" onclick="calShiftMonth('${calid}', 1)" title="Next month" aria-label="Next month">›</button>
          </div>
          <!-- role="group", not "grid": an ARIA grid requires row/gridcell
               descendants and this is a flat CSS grid of buttons, so the role was
               a promise the markup does not keep (Lighthouse: aria-required-
               children). Each day button carries its own full date label. -->
          <div class="cal-grid" id="cal-grid-${calid}" role="group" aria-label="Days of the month"></div>
          <div class="cal-section-head">
            <input type="text" class="cal-filter" data-lock-exempt="true" id="cal-filter-${calid}" placeholder="Search events..." aria-label="Search events by title or note">
            <button type="button" id="cal-add-${calid}" onclick="calOpenForm('${calid}')">Add event</button>
          </div>
          <div class="cal-lower" id="cal-lower-${calid}"></div>
        </div>
      `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow(calid);
        refreshChrome();
        const filter = instancePart(calid, "cal-filter");
        // input, not change: the agenda should follow the typing.
        if (filter) filter.addEventListener("input", () => renderCalendar(calid));
        renderCalendar(calid);
        saveSession();
        return newWindow;
      }

      function calendarWindows() {
        return Array.from(document.querySelectorAll(".calendar-window"));
      }

      // One store, so every open calendar redraws together.
      function renderAllCalendars() {
        calendarWindows().forEach((el) => renderCalendar(el.id));
      }

      function renderCalendar(windowId) {
        const el = document.getElementById(windowId);
        if (!el) return;
        renderCalendarGrid(windowId, el);
        // The form owns the lower pane while it is open; redrawing over it would
        // throw away half-typed input on every autosave-triggered render.
        if (el.dataset.formOpen !== "true") renderCalendarLower(windowId, el);
        /* A freeze is applied to nodes, and this function just replaced every
           one of them — including each row's ✏️ and 🗑. Re-arming them is how a
           frozen calendar came to delete an event on one click: freeze it, let
           anything re-render (a reminder firing, or an edit on the other desk's
           calendar, since both share one store), and the buttons were live again.
           Re-applying is safe repeatedly: applyWindowLock only stamps
           prevLockState when it is undefined, and these nodes are new. */
        if (el.dataset.locked === "true") applyWindowLock(el, true);
      }

      function renderCalendarGrid(windowId, el) {
        const grid = instancePart(windowId, "cal-grid");
        const monthLabel = instancePart(windowId, "cal-month");
        if (!grid) return;
        /* Every cell is rebuilt below, which throws the focused one away — so a
           keyboard user pressing Enter on a day landed on <body> and had to tab
           from the top of the document to reach the next one. Remember which day
           had focus and give it back afterwards. */
        const refocusKey =
          grid.contains(document.activeElement) &&
          document.activeElement instanceof HTMLElement
            ? document.activeElement.dataset.dayKey || null
            : null;
        const year = parseInt(el.dataset.viewYear, 10);
        const month = parseInt(el.dataset.viewMonth, 10);
        const selected = el.dataset.selected;
        const todayKey = dateKey(new Date());
        if (monthLabel) {
          /* Written only on a real change: the label is aria-live, and every render
             wrote it unconditionally — so typing seven characters into the search
             box, each of which re-renders, had a screen reader say "August 2026"
             seven times. */
          const label = new Date(year, month, 1).toLocaleDateString(undefined, {
            month: "long",
            year: "numeric",
          });
          if (monthLabel.textContent !== label) monthLabel.textContent = label;
        }
        grid.textContent = "";
        CAL_DAY_NAMES.forEach((name) => {
          const cell = document.createElement("div");
          cell.className = "cal-dayname";
          cell.textContent = name;
          grid.appendChild(cell);
        });
        const firstWeekday = new Date(year, month, 1).getDay();
        for (let i = 0; i < firstWeekday; i++) {
          const blank = document.createElement("div");
          blank.className = "cal-day cal-empty";
          grid.appendChild(blank);
        }
        const total = daysInMonth(year, month);
        for (let day = 1; day <= total; day++) {
          const key = dateKey(new Date(year, month, day));
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cal-day";
          cell.dataset.lockExempt = "true"; // picking a day to look at is reading
          cell.dataset.dayKey = key; // so focus can be restored to this same day
          cell.textContent = String(day);
          if (key === todayKey) cell.classList.add("cal-today");
          if (key === selected) cell.classList.add("cal-selected");
          /* Once, not twice. eventsOn filters the whole store and eventOccursOn
             runs the recurrence maths per event, so asking again for the label was
             31 extra whole-store scans per render — doubled with a calendar open
             on both desks, and every save re-renders both. */
          const hasEvents = eventsOn(key).length > 0;
          if (hasEvents) cell.classList.add("cal-has-events");
          cell.setAttribute(
            "aria-label",
            `${parseDateKey(key).toLocaleDateString(undefined, {
              weekday: "long",
              month: "long",
              day: "numeric",
            })}${hasEvents ? " — has events" : ""}`
          );
          cell.addEventListener("click", () => calSelectDay(windowId, key));
          grid.appendChild(cell);
        }
        if (refocusKey) {
          /* The same day if it is still on screen, then the selected one, then
             simply the first day of the month. Every month change in the UI is
             driven from a button that keeps focus itself, so in practice the first
             selector always hits — but a fallback chain that can end in null would
             drop focus to <body>, which is the exact failure this block exists to
             prevent. */
          const back =
            grid.querySelector(`.cal-day[data-day-key="${refocusKey}"]`) ||
            grid.querySelector(".cal-day.cal-selected") ||
            grid.querySelector(".cal-day:not(.cal-empty)");
          if (back) back.focus();
        }
      }

      /* The lower pane is either the selected day's events or, when the filter
         box has text, every match across the whole store — which is what makes
         titles and notes searchable without touching the textarea-based
         Search/Replace panel. */
      function renderCalendarLower(windowId, el) {
        const lower = instancePart(windowId, "cal-lower");
        if (!lower) return;
        const filterEl = instancePart(windowId, "cal-filter");
        const query = (filterEl?.value || "").trim().toLowerCase();
        lower.textContent = "";

        if (query) {
          const matches = calendarEvents.filter(
            (e) =>
              e.title.toLowerCase().includes(query) ||
              e.note.toLowerCase().includes(query)
          );
          lower.appendChild(
            calSectionHeading(
              matches.length
                ? `${matches.length} match${matches.length === 1 ? "" : "es"}`
                : "No matches"
            )
          );
          matches.forEach((event) =>
            lower.appendChild(calEventRow(windowId, event, event.date, true))
          );
          return;
        }

        const selected = el.dataset.selected;
        lower.appendChild(
          calSectionHeading(
            parseDateKey(selected).toLocaleDateString(undefined, {
              weekday: "long",
              month: "long",
              day: "numeric",
            })
          )
        );
        const onDay = eventsOn(selected);
        if (!onDay.length) {
          const empty = document.createElement("div");
          empty.className = "cal-empty-note";
          empty.textContent = "Nothing on this day.";
          lower.appendChild(empty);
        }
        onDay.forEach((event) =>
          lower.appendChild(calEventRow(windowId, event, selected, false))
        );
      }

      function calSectionHeading(text) {
        const head = document.createElement("div");
        head.className = "cal-section-head";
        const span = document.createElement("span");
        span.textContent = text;
        head.appendChild(span);
        return head;
      }

      function calEventRow(windowId, event, dateStr, showDate) {
        const row = document.createElement("div");
        row.className = "cal-event";

        const when = document.createElement("span");
        when.className = "cal-event-when";
        when.textContent = event.allDay
          ? "All day"
          : occurrenceStart(event, dateStr).toLocaleTimeString(undefined, {
              hour: "numeric",
              minute: "2-digit",
            });
        row.appendChild(when);

        const main = document.createElement("span");
        main.className = "cal-event-main";
        const title = document.createElement("span");
        title.className = "cal-event-title";
        title.textContent = event.title || "(untitled)";
        main.appendChild(title);
        if (showDate) {
          const on = document.createElement("span");
          on.className = "cal-event-note";
          on.textContent = parseDateKey(event.date).toLocaleDateString(
            undefined,
            { weekday: "short", month: "short", day: "numeric", year: "numeric" }
          );
          main.appendChild(document.createElement("br"));
          main.appendChild(on);
        }
        if (event.note) {
          const note = document.createElement("span");
          note.className = "cal-event-note";
          note.textContent = event.note;
          main.appendChild(document.createElement("br"));
          main.appendChild(note);
        }
        row.appendChild(main);

        const meta = document.createElement("span");
        meta.className = "cal-event-meta";
        const bits = [];
        if (event.repeat !== "none") bits.push(`⟳ ${event.repeat}`);
        if (hasAlert(event)) {
          bits.push(event.alertMinutes === 0 ? "⏰" : `⏰ -${event.alertMinutes}m`);
        }
        meta.textContent = bits.join("  ");
        row.appendChild(meta);

        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "✏️";
        edit.title = "Edit this event";
        edit.setAttribute("aria-label", `Edit ${event.title || "event"}`);
        edit.addEventListener("click", () => calOpenForm(windowId, event.id));
        row.appendChild(edit);

        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "🗑";
        del.title = "Delete this event";
        del.setAttribute("aria-label", `Delete ${event.title || "event"}`);
        del.addEventListener("click", () => calDeleteEvent(windowId, event.id));
        row.appendChild(del);

        return row;
      }

      function calSelectDay(windowId, dateStr) {
        const el = document.getElementById(windowId);
        if (!el) return;
        el.dataset.selected = dateStr;
        // Selecting a day while the form is open retargets the form's date
        // rather than throwing the form away mid-edit.
        const dateInput = instancePart(windowId, "cal-f-date");
        if (el.dataset.formOpen === "true" && dateInput) {
          dateInput.value = dateStr;
          renderCalendarGrid(windowId, el);
          return;
        }
        calClearFilter(windowId);
        renderCalendar(windowId);
        saveSession();
      }

      function calShiftMonth(windowId, delta) {
        const el = document.getElementById(windowId);
        if (!el) return;
        const year = parseInt(el.dataset.viewYear, 10);
        const month = parseInt(el.dataset.viewMonth, 10);
        const shifted = new Date(year, month + delta, 1);
        el.dataset.viewYear = shifted.getFullYear();
        el.dataset.viewMonth = shifted.getMonth();
        renderCalendar(windowId);
        saveSession();
      }

      /* The lower pane shows search results whenever the box has text, so any
         action whose result belongs to a DAY has to clear it first — otherwise
         clicking a day moved the highlight and changed nothing below it, and
         saving an event said "Event added." while the pane kept showing the old
         matches. calGoToday had this one line inline; all three callers need it. */
      function calClearFilter(windowId) {
        const filterEl = instancePart(windowId, "cal-filter");
        if (filterEl && filterEl.value) filterEl.value = "";
      }

      function calGoToday(windowId) {
        const el = document.getElementById(windowId);
        if (!el) return;
        const today = new Date();
        el.dataset.viewYear = today.getFullYear();
        el.dataset.viewMonth = today.getMonth();
        el.dataset.selected = dateKey(today);
        calClearFilter(windowId); // a filtered pane hides "today"
        renderCalendar(windowId);
        saveSession();
      }

      /* The add/edit form replaces the lower pane rather than opening a modal:
         a modal would cover the month grid, and picking a different day mid-edit
         is a normal thing to want. */
      function calOpenForm(windowId, eventId) {
        const el = document.getElementById(windowId);
        const lower = instancePart(windowId, "cal-lower");
        if (!el || !lower) return;
        if (el.dataset.locked === "true") return; // frozen; wireFrozenFeedback explains
        const editing = eventId ? eventById(eventId) : null;
        el.dataset.formOpen = "true";
        el.dataset.editingId = editing ? editing.id : "";
        lower.textContent = "";

        const form = document.createElement("div");
        form.className = "cal-form";
        form.innerHTML = `
          <div class="cal-section-head"><span>${editing ? "Edit event" : "New event"}</span></div>
          <div class="cal-form-row">
            <input type="text" id="cal-f-title-${windowId}" placeholder="What is it?" maxlength="${MAX_NAME_CHARS}" aria-label="Event title">
          </div>
          <div class="cal-form-row">
            <label>Date <input type="date" id="cal-f-date-${windowId}" aria-label="Event date"></label>
            <label>Time <input type="time" id="cal-f-time-${windowId}" aria-label="Event time"></label>
            <label><input type="checkbox" id="cal-f-allday-${windowId}"> All day</label>
          </div>
          <div class="cal-form-row">
            <label>Repeats
              <select id="cal-f-repeat-${windowId}" aria-label="Repeat">
                <option value="none">Never</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </label>
            <label><input type="checkbox" id="cal-f-alert-on-${windowId}"> Remind me</label>
            <label><input type="number" class="cal-lead-input" id="cal-f-alert-${windowId}" min="0" max="${MAX_ALERT_MINUTES}" step="1" value="0" aria-label="Minutes before the event"> min before</label>
          </div>
          <div class="cal-form-row">
            <textarea id="cal-f-note-${windowId}" placeholder="Notes (optional)" maxlength="${MAX_EVENT_NOTE_CHARS}" aria-label="Event note"></textarea>
          </div>
          <div class="cal-form-row">
            <button type="button" id="cal-f-save-${windowId}">${editing ? "Save" : "Add"}</button>
            <button type="button" id="cal-f-cancel-${windowId}">Cancel</button>
          </div>
        `;
        lower.appendChild(form);

        const part = (name) => instancePart(windowId, name);
        // Values are assigned, never interpolated into the markup above.
        part("cal-f-title").value = editing ? editing.title : "";
        part("cal-f-date").value = editing ? editing.date : el.dataset.selected;
        part("cal-f-time").value = editing && editing.time ? editing.time : "09:00";
        part("cal-f-allday").checked = editing ? editing.allDay : false;
        part("cal-f-repeat").value = editing ? editing.repeat : "none";
        const hasAlert = editing ? editing.alertMinutes !== null : true;
        part("cal-f-alert-on").checked = hasAlert;
        part("cal-f-alert").value =
          editing && editing.alertMinutes !== null ? editing.alertMinutes : 0;
        part("cal-f-note").value = editing ? editing.note : "";

        const syncEnabled = () => {
          part("cal-f-time").disabled = part("cal-f-allday").checked;
          part("cal-f-alert").disabled = !part("cal-f-alert-on").checked;
        };
        part("cal-f-allday").addEventListener("change", syncEnabled);
        part("cal-f-alert-on").addEventListener("change", syncEnabled);
        syncEnabled();
        part("cal-f-save").addEventListener("click", () => calSaveForm(windowId));
        part("cal-f-cancel").addEventListener("click", () =>
          calCloseForm(windowId)
        );
        part("cal-f-title").focus();
      }

      function calCloseForm(windowId) {
        const el = document.getElementById(windowId);
        if (!el) return;
        el.dataset.formOpen = "false";
        el.dataset.editingId = "";
        renderCalendar(windowId);
      }

      function calSaveForm(windowId) {
        const el = document.getElementById(windowId);
        if (!el) return;
        // Freezing while the form is open must not leave a live Save behind.
        if (el.dataset.locked === "true") return;
        const part = (name) => instancePart(windowId, name);
        const title = part("cal-f-title").value.trim();
        const date = part("cal-f-date").value;
        const allDay = part("cal-f-allday").checked;
        const time = allDay ? null : part("cal-f-time").value;
        if (!title) {
          showStatus("Give the event a title.");
          part("cal-f-title").focus();
          return;
        }
        if (!DATE_RE.test(date) || !isRealDate(date)) {
          showStatus("Pick a date for the event.");
          return;
        }
        if (!allDay && !TIME_RE.test(time || "")) {
          showStatus("Pick a time, or mark it all day.");
          return;
        }
        /* The <select> can only emit legal values today, so this is
           defence-in-depth — but the failure it prevents is silent and total: an
           unrecognised repeat makes nextOccurrence return null, so the event shows
           on its start date only and never fires an alert, with no error anywhere.
           EVENT_REPEATS is the same allowlist the import path uses. */
        const repeatValue = EVENT_REPEATS.includes(part("cal-f-repeat").value)
          ? part("cal-f-repeat").value
          : "none";
        const alertOn = part("cal-f-alert-on").checked;
        const raw = parseInt(part("cal-f-alert").value, 10);
        const alertMinutes = alertOn
          ? Math.min(Math.max(0, Number.isFinite(raw) ? raw : 0), MAX_ALERT_MINUTES)
          : null;

        const editingId = el.dataset.editingId;
        const existing = editingId ? eventById(editingId) : null;
        if (editingId && !existing) {
          /* Saving would mint a new id and quietly resurrect it. Reachable with a
             calendar open on both desks: one deletes while the other has the form
             up on that event. */
          showStatus("That event was deleted — nothing to save.");
          calCloseForm(windowId);
          return;
        }
        const record = {
          id: existing ? existing.id : newEventId(),
          title: title.slice(0, MAX_NAME_CHARS),
          date,
          time,
          allDay,
          note: part("cal-f-note").value.slice(0, MAX_EVENT_NOTE_CHARS),
          repeat: repeatValue,
          alertMinutes,
          /* A fresh alert must be allowed to fire, so editing clears the stamp
             unless nothing about the timing changed — otherwise moving an event
             an hour later would find it "already announced" and stay silent. */
          lastFired:
            existing &&
            existing.date === date &&
            existing.time === time &&
            existing.allDay === allDay &&
            existing.repeat === repeatValue &&
            existing.alertMinutes === alertMinutes
              ? existing.lastFired
              : null,
        };
        if (!existing && calendarEvents.length >= MAX_EVENTS) {
          showStatus(`Maximum of ${MAX_EVENTS} events reached — delete one first.`);
          return;
        }
        const next = existing
          ? calendarEvents.map((e) => (e.id === existing.id ? record : e))
          : calendarEvents.concat([record]);

        /* Saving is a click, and a click is the gesture the chime needs: an
           AudioContext built without one starts suspended, and a reminder due in
           five minutes has no gesture of its own to borrow. */
        if (alertMinutes !== null && alertSoundOn) primeAlertAudio();

        /* You cannot be reminded of something you are typing in right now.
           Adding "dentist at 2:30" at nine in the evening used to fire the alert
           the instant it was saved, because the occurrence was genuinely overdue
           and the catch-up pass is meant to notice exactly that. Stamp it as
           announced instead; a repeating event still fires next time round.

           The test is the EVENT's start, not the alert's. An event twenty
           seconds away with a one-minute lead has a fire time in the past and is
           still worth announcing the moment it is saved — you asked to be told
           before it, and "before" is now. Only an event whose own time has been
           and gone is history. */
        const now = new Date();
        const alreadyPast = dueOccurrence(record, now);
        if (alreadyPast && occurrenceStart(record, alreadyPast) <= now) {
