      // A failed save is silent by nature — nothing on screen changes — so it
      // gets a sticky badge rather than a toast that scrolls away. The toast
      // fires only on the transition into failure, because saveSession() runs
      // on almost every keystroke and would otherwise shout continuously.
      let saveFailed = false;

      function reportSaveFailure(message) {
        if (saveFailed) return;
        saveFailed = true;
        const badge = document.getElementById("save-warning");
        if (badge) {
          badge.textContent = "⚠ Not saving";
          badge.title = message;
          badge.style.display = "block";
        }
        showStatus(message);
      }

      function clearSaveFailure() {
        if (!saveFailed) return;
        saveFailed = false;
        const badge = document.getElementById("save-warning");
        if (badge) badge.style.display = "none";
        showStatus("Saving again — the session was written successfully.");
      }

      function buildSessionSnapshot() {
        const session = {};
        document
          .querySelectorAll(".window, .task-window")
          .forEach((windowElement) => {
            const windowId = windowElement.id;
            const textarea = document.getElementById(`clipboard-${windowId}`);
            const title = windowElement.querySelector(
              ".window-title, .task-title, .sticky-note-title"
            ).textContent;
            // A note's size lives on its .textarea-container — the window box
            // is DERIVED from it by updateWindowSize(). Saving only the derived
            // box meant restore rebuilt the container at its hardcoded default,
            // the ResizeObserver's first callback recomputed the window from
            // that default, and the debounced save then wrote the shrunken size
            // back over the real one. One reload destroyed the resize for good.
            const sizeTarget = resizeTargetFor(windowElement);
            const ownSize =
              sizeTarget && sizeTarget !== windowElement
                ? {
                    containerWidth: sizeTarget.offsetWidth,
                    containerHeight: sizeTarget.offsetHeight,
                  }
                : null;
            session[windowId] = {
              ...(ownSize || {}),
              position: {
                left: windowElement.dataset.x || "50",
                top: windowElement.dataset.y || "50",
              },
              width: windowElement.offsetWidth,
              height: windowElement.offsetHeight,
              zIndex: parseInt(windowElement.style.zIndex) || 0,
              minimized: windowElement.style.display === "none",
              content: textarea ? textarea.value : "",
              name: title,
              isTaskWindow: windowElement.classList.contains("task-window"),
              locked: windowElement.dataset.locked === "true",
              tasks: windowElement.classList.contains("task-window")
                ? Array.from(windowElement.querySelectorAll(".task-item")).map(
                    (item) => ({
                      text: item.querySelector("span").textContent,
                      completed: item.classList.contains("completed"),
                    })
                  )
                : [],
            };
          });
        const clock = document.getElementById("clock");
        if (clock) {
          session.clock = {
            visible: clockVisible,
            position: {
              left: clock.dataset.x || "50",
              top: clock.dataset.y || "50",
            },
            width: clock.dataset.width || "200",
            height: clock.dataset.height || "150",
            name: clock.querySelector(".clock-title").textContent,
            clockFormat:
              document.getElementById("clock-format-clock")?.value || "12",
            locked: clock.dataset.locked === "true",
            minimized: clock.style.display === "none",
          };
        }
        if (document.getElementById("calculator")) {
          session.calculator = {
            visible: calculatorVisible,
            history: calculatorHistory,
            position: {
              left: document.getElementById("calculator").dataset.x || "50",
              top: document.getElementById("calculator").dataset.y || "50",
            },
            width: document.getElementById("calculator").dataset.width || "250",
            locked:
              document.getElementById("calculator").dataset.locked === "true",
            minimized:
              document.getElementById("calculator").style.display === "none",
          };
        }
        const log = document.getElementById("log");
        if (log) {
          session.log = {
            visible: logVisible,
            position: {
              left: log.dataset.x || "50",
              top: log.dataset.y || "50",
            },
            width: log.dataset.width || "300",
            height: log.dataset.height || "300",
            name: log.querySelector(".log-title").textContent,
            locked: log.dataset.locked === "true",
            minimized: log.style.display === "none",
            logs: Array.from(document.querySelectorAll(".log-item")).map(
              (item) => ({
                timestamp: item.querySelector(".timestamp").textContent,
                description: item.querySelector(".description").textContent,
              })
            ),
          };
        } else {
          session.log = {
            visible: logVisible,
            position: { left: "50", top: "50" },
            width: "300",
            height: "300",
            name: "Log",
            logs: logEntries,
          };
        }
        // The help window was the one window type that silently vanished on
        // refresh while every other one came back.
        const help = document.getElementById("help-window");
        session.help = help
          ? {
              visible: true,
              position: {
                left: help.dataset.x || "50",
                top: help.dataset.y || "50",
              },
              minimized: help.style.display === "none",
              locked: help.dataset.locked === "true",
            }
          : { visible: false };
        // The theme token only. <body> now also carries the transient canvas
        // classes, and persisting the whole className would save "canvas-panning"
        // if the tab closed mid-drag and restore a stuck grabbing cursor.
        session.theme = document.body.classList.contains("dark-mode")
          ? "dark-mode"
          : "light-mode";
        session.canvas = { on: view.on, x: view.x, y: view.y, zoom: view.zoom };
        document
          .querySelectorAll(".sticky-note-window")
          .forEach((stickyNote) => {
            const windowId = stickyNote.id;
            const content = stickyNote.querySelector(
              ".sticky-note-content"
            ).value;
            // Empty means "no explicit pick, follow the theme" - persist that
            // rather than snapshotting whatever the theme happened to be.
            const bgColor = stickyNote.style.backgroundColor || "";
            const textColor =
              stickyNote.querySelector(".sticky-note-content").style.color || "";
            const title =
              stickyNote.querySelector(".sticky-note-title").textContent;
            session[windowId] = {
              locked: stickyNote.dataset.locked === "true",
              position: {
                left: stickyNote.dataset.x || "50",
                top: stickyNote.dataset.y || "50",
              },
              width: stickyNote.offsetWidth,
              height: stickyNote.offsetHeight,
              zIndex: parseInt(stickyNote.style.zIndex) || 0,
              minimized: stickyNote.style.display === "none",
              content,
              color: bgColor,
              textColor,
              // Distinguishes a deliberate colour choice from a theme default
              // that merely happened to be inline. Absent in pre-v3.0 sessions,
              // which is what the restore heuristic is for.
              customColor: stickyNote.dataset.customColor === "true",
              name: title,
            };
          });
        session.zIndexCounter = zIndexCounter;
        return session;
      }

      // Serial writes when unprotected; AES-GCM envelope when Protect is on.
      // Callers stay sync — encryption is fire-and-forget with failure badge.
      let _persistSeq = 0;
      function saveSession() {
        // While restoring we rebuild the DOM by replaying add*() helpers, each of
        // which calls saveSession(); skip those so we never persist a partial
        // mid-restore snapshot. loadSessionFromStorage() does one final save itself.
        if (restoring) return;
        // Boot has not settled yet — the DOM on screen is not the session.
        if (!booted) return;
        // A locked session is unreadable to us but intact on disk. Writing
        // anything here destroys it, so do nothing at all until it is unlocked.
        if (sessionLocked) return;
        try {
          const session = buildSessionSnapshot();
          if (!sessionPassphrase) {
            const serialized = JSON.stringify(session);
            if (serialized.length > MAX_SESSION_CHARS) {
              console.warn("Session too large to save safely, skipping write.");
              reportSaveFailure(
                "Session too large to save — save a Backup, then close or trim a window."
              );
              return;
            }
            localStorage.setItem(SESSION_KEY, serialized);
            clearSaveFailure();
            return;
          }
          const seq = ++_persistSeq;
          persistSessionPayload(session)
            .then((ok) => {
              if (seq !== _persistSeq) return; // a newer save superseded this one
              if (!ok) return;
            })
            .catch((e) => {
              if (seq !== _persistSeq) return;
              console.error("Failed to save encrypted session:", e);
              reportSaveFailure(
                "Failed to save encrypted session — save a Backup before closing this tab."
              );
            });
        } catch (e) {
          console.error("Failed to save session to localStorage:", e);
          reportSaveFailure(
            "Failed to save session — save a Backup before closing this tab."
          );
        }
      }

      function addWindow() {
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS

        // Center the window. The note's true source-of-truth for size is the

        // which yields a 493x285 textarea.
        const defaultWidth = 557;
        const defaultHeight = 429;
        newWindow.style.zIndex = nextWindowZ();

        newWindow.dataset.height = defaultHeight;

        <span class="lock-window" onclick="toggleWindowLock('${windowId}')" title="Freeze editing, dragging and resizing (not encryption)" role="button" tabindex="0">🔓</span>
        <span class="close-window" onclick="closeWindow('${windowId}')" title="Close" role="button" tabindex="0">×</span>
    </div>
        </div>
        <div class="window-content">
            <div class="textarea-container" style="width: 525px; height: 287px;">
                <div class="line-numbers" id="line-numbers-${windowId}">1</div>

                <button onclick="toLowerCase('${windowId}')">Lowercase</button>
                <button onclick="copyNoteText('${windowId}')">Copy</button>

        </div>
    `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow(windowId);
        refreshChrome();
        const textarea = document.getElementById(`clipboard-${windowId}`);

        // Debounced persistence for stability (no behavior change)
        textarea.addEventListener("input", () => debouncedSave(160), { passive: true });
        const logInput = document.getElementById(`note-log-input-${windowId}`);
        logInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();

        updateCounts(windowId);
        setMaxDimensions();
        saveSession();
        const textareaContainer = newWindow.querySelector(
          ".textarea-container"
        );
        const resizeObserver = new ResizeObserver(() => {
          updateWindowSize(windowId);
          debouncedSave(220);
        });
        registerResizeObserver(windowId, resizeObserver);
        resizeObserver.observe(textareaContainer);
        return newWindow;
      }

      function addTaskWindow() {
        if (
          document.querySelectorAll(WINDOW_SELECTOR).length >= MAX_WINDOWS
        ) {
          showStatus(`Maximum of ${MAX_WINDOWS} windows reached — close one first.`);
          return;
        }
        windowCount++;
        taskCount++;
        const taskLabel = taskCount > 1 ? `Task List ${taskCount}` : "Task List";
        const windowId = `window${windowCount}`;
        const windowsContainer = document.getElementById("windows");
        const newWindow = document.createElement("div");
        const resizeObserver = new ResizeObserver(() => {
          newWindow.dataset.width = newWindow.offsetWidth;
          newWindow.dataset.height = newWindow.offsetHeight;
          debouncedSave(220);
        });
        registerResizeObserver(windowId, resizeObserver);
        resizeObserver.observe(newWindow);
        newWindow.className = "task-window";
        newWindow.id = windowId;
        newWindow.style.zIndex = nextWindowZ();
        newWindow.dataset.width = 400;
        newWindow.dataset.height = 500;
        newWindow.style.width = "400px";
        newWindow.style.height = "500px";
        placeWindow(newWindow, 400, 500);
        newWindow.innerHTML = `
        <div class="task-header">
            <span class="task-title">${taskLabel}</span>

                <span class="lock-window" onclick="toggleWindowLock('${windowId}')" title="Freeze editing, dragging and resizing (not encryption)" role="button" tabindex="0" aria-pressed="false">🔓</span>

        </div>
      <div class="task-content">
    <div class="task-input-container">
        <input type="text" class="task-input" id="task-input-${windowId}" placeholder="Enter task...">

      <button class="clear-note-button clear-note-button--mini" onclick="clearTaskWindow('${windowId}')">Clear</button>
    </div>
</div>
    `;
        windowsContainer.appendChild(newWindow);
        makeDraggable(newWindow);
        wireWindowFocus(newWindow);
        setActiveWindow(windowId);
        refreshChrome();
        const taskInput = document.getElementById(`task-input-${windowId}`);
        taskInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addTask(windowId);
          }
        });
        saveSession();
        showStatus("Task window created!");
        return newWindow;
      }
      function clearTaskWindow(windowId) {
        const taskList = document.getElementById(`task-list-${windowId}`);
        const taskInput = document.getElementById(`task-input-${windowId}`);
        // Clearing is destructive and there is no undo, so don't do it silently.
        if (taskList && taskList.children.length > 0) {
          const count = taskList.children.length;
          if (
            !confirm(
              `Delete all ${count} task${count === 1 ? "" : "s"} in this list? This cannot be undone.`
            )
          ) {
            return;
          }
        }
        if (taskList) {
          taskList.innerHTML = "";
        }
        if (taskInput) {
          taskInput.value = "";
        }
        saveSession();
        showStatus("Task list cleared.");
      }

      // Single builder for both new tasks and restored ones, so the two paths
      // can't drift (the restore path previously produced items with no
      // delete button and a differently-wired checkbox).
      function createTaskItem(windowId, text, completed) {
        const taskItem = document.createElement("div");
        taskItem.className = "task-item" + (completed ? " completed" : "");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !!completed;
        checkbox.setAttribute("aria-label", `Mark "${text}" complete`);
        checkbox.onchange = () => toggleTaskCompletion(windowId, checkbox);
        const span = document.createElement("span");
        span.textContent = text;
        // A list you can only empty wholesale isn't a task list.
        const del = document.createElement("button");
        del.className = "task-delete";
        del.textContent = "×";
        del.title = "Delete this task";
        del.setAttribute("aria-label", `Delete task "${text}"`);
        del.onclick = (e) => {
          e.stopPropagation();
          taskItem.remove();
          saveSession();
          showStatus("Task deleted.");
        };
        taskItem.appendChild(checkbox);
        taskItem.appendChild(span);
        taskItem.appendChild(del);
        return taskItem;
      }

      function addTask(windowId) {
        const taskInput = document.getElementById(`task-input-${windowId}`);
        const taskList = document.getElementById(`task-list-${windowId}`);
        if (!taskInput || !taskList) {
          showStatus("Error: Task input or list not found.");
          return;
        }
        const taskText = taskInput.value.trim();
        if (!taskText) {
          showStatus("Task cannot be empty.");
          taskInput.focus();
          return;
        }
        taskList.appendChild(createTaskItem(windowId, taskText, false));
        taskInput.value = "";
        taskInput.focus(); // keep the user in flow for a second task
        taskList.scrollTop = taskList.scrollHeight;
        saveSession();
        showStatus("Task added.");
      }

      function toggleTaskCompletion(windowId, checkbox) {
        const taskItem = checkbox.parentElement;
        taskItem.classList.toggle("completed", checkbox.checked);
        saveSession();
      }

      function addNoteLogEntry(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const logInput = document.getElementById(`note-log-input-${windowId}`);
        if (!textarea || !logInput) {
          showStatus("Error: Textarea or input not found.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot add log: window is frozen.");
          return;

      function updateCalculatorHistory() {
        const historyDiv = document.getElementById("calculator-history");
        if (!historyDiv) return;
        // textContent, not innerHTML: the expression is whatever was typed into
        // the calculator, it is stored verbatim on the error path too, and it is
        // replayed on every restore. Interpolated into markup it was a script
        // sink that survived a reload and rode along inside Backup — i.e.
        // it executed in the recipient's origin.
        historyDiv.textContent = "";
        calculatorHistory.forEach((entry) => {

      function calculate() {
        const input = document.getElementById("calculator-input");
        const display = document.getElementById("calculator-display");
        if (input && display) {
          let expression = input.value;
          if (!expression) {
            display.value = "0";
            return;
          }
          try {
            let result = evaluateExpression(expression);
            display.value = isFinite(result) ? result : "Error";
            calculatorHistory.push({ expression, result: display.value });
            updateCalculatorHistory();
            saveSession();
          } catch {
            display.value = "Error";
            calculatorHistory.push({ expression, result: "Error" });
            updateCalculatorHistory();
            saveSession();
          }
        }
      }

      function evaluateExpression(expression) {
        expression = expression.replace(/×/g, "*").replace(/%/g, "/100");
        while (expression.includes("√")) {
          const sqrtIndex = expression.indexOf("√");
          let number = "";
          let i = sqrtIndex + 1;
          while (i < expression.length && /\d|\./.test(expression[i])) {
            number += expression[i];
            i++;
          }
          const sqrtValue = Math.sqrt(parseFloat(number));
          expression =
            expression.substring(0, sqrtIndex) +
            sqrtValue +
            expression.substring(i);
        }
        const tokens = expression.match(/(\d*\.?\d+|[+\-*/])/g);
        if (!tokens) throw new Error("Invalid expression");

        // This used to fold strictly left-to-right, so 2+3*4 gave 20 instead of
        // 14. Resolve × and ÷ in a first pass, then + and - in a second.
        const terms = [parseFloat(tokens[0])];
        const ops = [];
        if (isNaN(terms[0])) throw new Error("Invalid number");
        for (let i = 1; i < tokens.length; i += 2) {
          const operator = tokens[i];
          const nextNumber = parseFloat(tokens[i + 1]);
          if (isNaN(nextNumber)) throw new Error("Invalid number");
          if (operator === "*" || operator === "/") {
            const left = terms.pop();
            if (operator === "/" && nextNumber === 0) {
              throw new Error("Division by zero");
            }
            terms.push(operator === "*" ? left * nextNumber : left / nextNumber);
          } else {
            ops.push(operator);
            terms.push(nextNumber);
          }
        }

        let result = terms[0];
        for (let i = 0; i < ops.length; i++) {
          result = ops[i] === "+" ? result + terms[i + 1] : result - terms[i + 1];
        }
        return result;
      }

          `${s.toString().padStart(2, "0")}.` +
          `${ms.toString().padStart(3, "0")}`;

        wireWindowFocus(newWindow);
        setActiveWindow("log");
        refreshChrome();
        const logInput = document.getElementById("log-input");
        logInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addLogEntry();
          }
        });
        restoreLogEntries();
        logVisible = true;
        document.getElementById("log-toggle").textContent = "Log";
        document.getElementById("log-toggle").classList.add("active");
        saveSession();
        showStatus("Log window opened!");
        return newWindow;
      }

      function toggleLog() {
        const log = document.getElementById("log");
        const logButton = document.getElementById("log-toggle");
        if (log && log.style.display === "none") {
          restoreWindow("log");
          return;
        }
        if (log) {
          log.remove();
          logVisible = false;
          logButton.textContent = "Log";
          logButton.classList.remove("active");
          showStatus("Log window hidden.");
        } else {
          addLog();
        }
        saveSession();
      }

      // Single builder for new and restored entries so the two can't drift, and
      // so both get the delete control the log previously lacked entirely - it
      // was append-only with no way to remove a mistyped line.
      function createLogItem(entry) {
        const logItem = document.createElement("div");
        logItem.className = "log-item";
        const ts = document.createElement("span");
        ts.className = "timestamp";
        ts.textContent = entry.timestamp;
        const sep = document.createTextNode(": ");
        const desc = document.createElement("span");
        desc.className = "description";
        desc.textContent = entry.description;
        const del = document.createElement("button");
        del.className = "log-delete";
        del.textContent = "×";
        del.title = "Delete this entry";
        del.setAttribute("aria-label", `Delete log entry: ${entry.description}`);
        del.onclick = (e) => {
          e.stopPropagation();
          const i = logEntries.indexOf(entry);
          if (i > -1) logEntries.splice(i, 1);
          logItem.remove();
          saveSession();
          showStatus("Log entry deleted.");
        };
        logItem.appendChild(ts);
        logItem.appendChild(sep);
        logItem.appendChild(desc);
        logItem.appendChild(del);
        return logItem;
      }

      function addLogEntry() {
        const logInput = document.getElementById("log-input");
        const logList = document.getElementById("log-list");
        if (!logInput || !logList) return;
        const description = logInput.value.trim();
        if (!description) {
          showStatus("Log entry cannot be empty.");
          logInput.focus();
          return;
        }
        const timestamp = new Date().toLocaleString("en-US", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        const entry = { timestamp, description };
        logEntries.push(entry);
        logList.appendChild(createLogItem(entry));
        logInput.value = "";
        logInput.focus();
        logList.scrollTop = logList.scrollHeight;
        saveSession();
        showStatus("Log entry added.");
      }

      function restoreLogEntries() {
        const logList = document.getElementById("log-list");
        if (!logList) return;
        logList.innerHTML = "";
        logEntries.forEach((entry) => logList.appendChild(createLogItem(entry)));
        logList.scrollTop = logList.scrollHeight;
      }

      // Pointer Events rather than mouse events: the old handler was
      // mousedown/mousemove/mouseup only, so on a touch screen a window could
      // not be moved at all. Pointer events cover mouse, touch and pen through
      // one path, and setPointerCapture keeps the drag alive if the finger
      // outruns the header.
      /* Which element actually carries a window's size. For a note it is the
         .textarea-container — the window sizes itself to fit via
         updateWindowSize(), so resizing the window directly would be undone on
         the next sync. Sticky notes and task lists size themselves. Everything
         else (calculator, clock, log, help) has never been resizable. */
      function resizeTargetFor(element) {
        if (
          element.classList.contains("sticky-note-window") ||
          element.classList.contains("task-window")
        ) {
          return element;
        }
        return element.querySelector(".textarea-container");
      }

      /* Floor for anything that declares no min-* of its own. .sticky-note-window
         is the one resizable type missing from the min-width/min-height rule the
         other six share, so without this a note could be dragged down to a
         sliver with its own header clipped out of sight. Applied in the grip
         rather than in CSS deliberately: a min-* on the element would also
         change native resize in the off state, and could inflate a sticky note
         restored from an older session. */
      const GRIP_MIN_W = 240;
      const GRIP_MIN_H = 140;

      function attachResizeGrip(element) {
        const target = resizeTargetFor(element);
        if (!target) return;
        if (element.querySelector(":scope > .resize-grip")) return;

        const grip = document.createElement("div");
        grip.className = "resize-grip";
        grip.setAttribute("aria-hidden", "true");
        element.appendChild(grip);

        let gripPointerId = null;
        let start = null;

        let gripFrame = null;
        let pending = null;

        const paint = () => {
          gripFrame = null;
          if (!pending) return;
          target.style.width = `${pending.w}px`;
          target.style.height = `${pending.h}px`;
        };

        const onMove = (e) => {
          if (e.pointerId !== gripPointerId) return;
          // Same screen->world conversion as dragging. This is the whole fix:
          // the pointer delta is divided by the zoom, so the corner tracks the
          // cursor instead of running at 1/zoom speed.
          const p = screenToWorld(e.clientX, e.clientY);
          pending = {
            w: Math.max(start.minW, start.w + (p.x - start.px)),
            h: Math.max(start.minH, start.h + (p.y - start.py)),
          };
          // Deferred to the frame like the drag: a resize writes width and
          // height, which relayouts the window and everything inside it, so
          // doing it per pointer event rather than per frame is the most
          // expensive thing either gesture could do.
          if (gripFrame === null) gripFrame = requestAnimationFrame(paint);
        };

        const end = (e) => {
          if (gripPointerId === null || (e && e.pointerId !== gripPointerId))
            return;
          try {
            grip.releasePointerCapture(gripPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          gripPointerId = null;
          document.body.style.userSelect = "";
          if (gripFrame !== null) {
            cancelAnimationFrame(gripFrame);
            gripFrame = null;
          }
          paint(); // land the final size, never a frame behind the pointer
          pending = null;
          grip.removeEventListener("pointermove", onMove);
          grip.removeEventListener("pointerup", end);
          grip.removeEventListener("pointercancel", end);
          // The size itself is persisted by each window type's existing
          // ResizeObserver; this is for the map, which has no observer.
          if (view.on) scheduleMapWindows();
          saveSession();
        };

        grip.addEventListener("pointerdown", (e) => {
          if (element.dataset.locked === "true") return;
          if (gripPointerId !== null) return;
          if (e.button !== undefined && e.button !== 0) return;
          // Never let this reach the header drag or the canvas pan.
          e.preventDefault();
          e.stopPropagation();
          gripPointerId = e.pointerId;
          const cs = getComputedStyle(target);
          const p = screenToWorld(e.clientX, e.clientY);
          start = {
            px: p.x,
            py: p.y,
            w: target.offsetWidth,
            h: target.offsetHeight,
            // The min-* the element already declares, so the grip can't shrink
            // a window past what CSS would have stopped at anyway, falling back
            // to the floor above for the types that declare none. max-* needs
            // no handling: it still clamps the width we set.
            minW: parseFloat(cs.minWidth) || GRIP_MIN_W,
            minH: parseFloat(cs.minHeight) || GRIP_MIN_H,
          };
          element.style.zIndex = nextWindowZ();
          document.body.style.userSelect = "none";
          try {
            grip.setPointerCapture(e.pointerId);
          } catch (err) {
            /* the listeners below still track it */
          }
          grip.addEventListener("pointermove", onMove);
          grip.addEventListener("pointerup", end);
          grip.addEventListener("pointercancel", end);
        });
      }

      function makeDraggable(element) {
        const header = element.querySelector(HEADER_SELECTOR);
        if (!header) return;
        // Every window type already funnels through here, so the grip needs no
        // separate wiring in each of the seven add* functions.
        attachResizeGrip(element);

        let dragPointerId = null;
        let offsetX = 0;
        let offsetY = 0;
        // Measured once per drag. Reading offsetWidth/offsetHeight inside the
        // move handler was a layout read immediately after a style write, which
        // forces a synchronous re-layout on every single pointer event — the
        // classic thrash, and the reason dragging felt heavier than panning
        // did. Neither the window's size nor the clamp can change mid-drag, so
        // neither needs re-reading. In the off state clampBounds() also calls
        // getBoundingClientRect() on the toolbar, so this removes a second
        // forced layout per event.
        let dragW = 0;
        let dragH = 0;
        let dragBounds = null;
        let dragFrame = null;

        const onPointerMove = (e) => {
          if (e.pointerId !== dragPointerId) return;
          // The grab offset and the pointer are both converted to world
          // coordinates, so a drag tracks the cursor exactly at any zoom.
          // offsetWidth/offsetHeight are layout pixels, which are already world
          // units — the scale lives on the parent, not on the window.
          const p = screenToWorld(e.clientX, e.clientY);
          // clampSpot() rather than an inlined clamp: the vertical limit now
          // depends on the window's x (it opens up either side of the toolbar),
          // so it has to be resolved per move, not frozen at pointerdown. The
          // bounds object it reads is still measured once — no layout here.
          const { x, y } = clampSpot(
            dragW,
            dragH,
            p.x - offsetX,
            p.y - offsetY,
            dragBounds
          );
          // dataset stays synchronous — it is the source of truth and costs no
          // layout. Only the paint is deferred to the frame.
          element.dataset.x = x;
          element.dataset.y = y;
          if (dragFrame === null) {
            dragFrame = requestAnimationFrame(() => {
              dragFrame = null;
              element.style.left = `${element.dataset.x}px`;
              element.style.top = `${element.dataset.y}px`;
            });
          }
        };

        const endDrag = (e) => {
          if (dragPointerId === null || (e && e.pointerId !== dragPointerId)) return;
          try {
            header.releasePointerCapture(dragPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          dragPointerId = null;
          document.body.style.userSelect = "";
          element.classList.remove("dragging");
          // A frame may still be queued holding the last position; land it now
          // so the window can never settle a pixel behind where it was dropped.
          if (dragFrame !== null) {
            cancelAnimationFrame(dragFrame);
            dragFrame = null;
          }
          element.style.left = `${element.dataset.x}px`;
          element.style.top = `${element.dataset.y}px`;
          if (view.on) scheduleMapWindows();
          header.removeEventListener("pointermove", onPointerMove);
          header.removeEventListener("pointerup", endDrag);
          header.removeEventListener("pointercancel", endDrag);
          saveSession();
        };

        header.addEventListener("pointerdown", (e) => {
          // A locked window simply refuses the drag here. This used to be done
          // by nulling the handler and setting pointer-events:none on the
          // header, which also killed the lock and close buttons inside it and
          // forced toggleWindowLock to re-implement this whole handler.
          if (element.dataset.locked === "true") return;
          // Don't start a drag from a control in the title bar.
          if (e.target.closest("[role='button'], button, input, select")) return;
          if (e.button !== undefined && e.button !== 0) return; // left/primary only
          if (dragPointerId !== null) return; // ignore a second finger
          if (spacePanHeld) return; // space is held: the gesture is a pan

          dragPointerId = e.pointerId;
          // Where inside the window the grab happened, in world units. Read
          // from dataset rather than getBoundingClientRect(), which reports the
          // *transformed* box once the canvas is zoomed and would make the
          // window jump to the cursor by the scale factor on the first move.
          const p = screenToWorld(e.clientX, e.clientY);
          offsetX = p.x - (parseFloat(element.dataset.x) || 0);
          offsetY = p.y - (parseFloat(element.dataset.y) || 0);
          // Every layout read the drag needs, taken once, before any writes.
          dragW = element.offsetWidth;
          dragH = element.offsetHeight;
          dragBounds = clampBounds();
          element.style.zIndex = nextWindowZ();
          document.body.style.userSelect = "none";
          element.classList.add("dragging");
          try {
            header.setPointerCapture(e.pointerId);
          } catch (err) {
            /* not fatal - the listeners below still track the drag */
          }
          header.addEventListener("pointermove", onPointerMove);
          header.addEventListener("pointerup", endDrag);
          header.addEventListener("pointercancel", endDrag);
        });
      }

      const HEADER_SELECTOR =
        ".window-header, .task-header, .clock-header, .log-header, .calculator-header, .help-header, .sticky-note-header";

      // What "frozen" freezes inside a window. This is NOT encryption or access
      // control — anyone can unfreeze with one click. Text fields go readOnly
      // rather than disabled so a frozen note can still be read, scrolled and
      // copied; everything else (buttons, checkboxes, selects, colour swatches)
      // is disabled. Title-bar controls are excluded — you must always be able
      // to unfreeze, minimize or close.
      function lockableControls(windowElement) {
        return Array.from(
          windowElement.querySelectorAll("textarea, input, select, button")
        ).filter((el) => !el.closest(HEADER_SELECTOR));
      }

      function applyWindowLock(windowElement, isLocked) {
        windowElement.dataset.locked = isLocked;
        // Unlocking must hand resize back to the stylesheet, not force "both"
        // onto every type: a note frame has no resize handle (it grows from its
        // inner .textarea-container), and the clock/calculator/log/help windows
        // are fixed-size by design.
        const resizables = [
          windowElement,
          ...windowElement.querySelectorAll(".textarea-container"),
        ];
        resizables.forEach((el) => {
          if (isLocked) el.style.resize = "none";
          else el.style.removeProperty("resize");
        });

        lockableControls(windowElement).forEach((el) => {
          const isTextField =
            el.tagName === "TEXTAREA" ||
            (el.tagName === "INPUT" &&
              ["text", "number", "search", ""].includes(el.type));
          const prop = isTextField ? "readOnly" : "disabled";
          if (isLocked) {
            // Remember the pre-lock state so unlocking doesn't, say, make the
            // calculator's always-readonly display editable.
            if (el.dataset.prevLockState === undefined) {
              el.dataset.prevLockState = el[prop] ? "1" : "0";
            }
            el[prop] = true;
          } else if (el.dataset.prevLockState !== undefined) {
            el[prop] = el.dataset.prevLockState === "1";
            delete el.dataset.prevLockState;
          }
        });

        const lockBtn = windowElement.querySelector(
          ".lock-window, .sticky-lock-window"
        );
        if (lockBtn) {
          lockBtn.textContent = isLocked ? "🔒" : "🔓";
          lockBtn.classList.toggle("locked", isLocked);
          lockBtn.title = isLocked
            ? "Unfreeze this window (not a security unlock)"
            : "Freeze editing, dragging and resizing (not encryption)";
          lockBtn.setAttribute("aria-pressed", String(isLocked));
        }
      }

      // Freeze = content frozen, no dragging, no resizing. Not secrecy.
      // Everything hangs off dataset.locked, which makeDraggable() reads.
      function toggleWindowLock(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        const isLocked = windowElement.dataset.locked !== "true";
        applyWindowLock(windowElement, isLocked);
        const label =
          windowElement.querySelector(
            ".window-title, .task-title, .sticky-note-title, .clock-title, .log-title, .calculator-title, .help-title"
          )?.textContent || "Window";
        showStatus(
          `${label} ${isLocked ? "frozen" : "unfrozen"} (layout only — use Protect to encrypt).`
        );
        saveSession();
      }

      function setActiveWindow(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        // Already on top and already marked - don't churn the z-index counter
        // on every mousedown, which used to inflate it without bound.
        const alreadyActive = windowElement.classList.contains("active");
        activeWindow = windowId;
        // The old selector omitted sticky notes, the calculator and help, so
        // those could keep a stale .active while another window was focused.
        document
          .querySelectorAll(WINDOW_SELECTOR)
          .forEach((win) => win.classList.remove("active"));
        windowElement.classList.add("active");
        if (view.on) scheduleMapWindows(); // repaint the highlighted block
        if (!alreadyActive) {
          windowElement.style.zIndex = nextWindowZ();
        }
      }

      function updateLineNumbers(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          const lines = textarea.value.split("\n").length;
          lineNumbers.innerHTML =
            Array.from({ length: lines }, (_, i) => i + 1).join("<br>") || "1";
        }
      }

      function syncScroll(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          lineNumbers.scrollTop = textarea.scrollTop;
        }
      }

      // Clock, Calculator and Log are singletons whose bookkeeping — the
      // toolbar button's lit state, the *Visible flag, and the clock's 1s
      // interval — lives in their toggle*() functions. closeWindow() only
      // removed the element, so Ctrl+Shift+W on one of them left a stuck
      // toolbar button and, for the clock, an interval ticking for the life of
      // the tab. Route the singletons through the toggle that owns their state.
      const SINGLETON_CLOSERS = {
        clock: () => toggleClock(),
        calculator: () => toggleCalculator(),
        log: () => toggleLog(),
      };

      function closeWindow(windowId) {
        const singletonClose = SINGLETON_CLOSERS[windowId];
        const singletonEl = singletonClose && document.getElementById(windowId);
        if (singletonEl) {
          disconnectResizeObserver(windowId);
          if (activeWindow === windowId) activeWindow = null;
          // Each toggle treats display:none as "minimized — bring it back", so
          // clear that first or closing a minimized singleton would reopen it.
          singletonEl.style.display = "";
          singletonClose();
          refreshChrome();
          return;
        }
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          disconnectResizeObserver(windowId);
          windowElement.remove();
          if (activeWindow === windowId) {
            activeWindow = null;
            // Fall back to whatever is visually on top, not to whichever
            // happens to be first in document order.
            const remaining = Array.from(
              document.querySelectorAll(WINDOW_SELECTOR)
            ).filter((el) => el.style.display !== "none");
            if (remaining.length) {
              const topMost = remaining.reduce((a, b) =>
                (parseInt(b.style.zIndex) || 0) > (parseInt(a.style.zIndex) || 0)
                  ? b
                  : a
              );
              setActiveWindow(topMost.id);
            }
          }
          refreshChrome();
          debouncedSave(80);
        }
      }

      let currentEditable = null;

      // The Log window carries a ✏️ like any other and endRename() has a
      // dedicated "log" default-name branch, but .log-title was missing from
      // this list — so clicking it threw on a null titleSpan and did nothing.
      const RENAME_TITLE_SELECTOR =
        ".window-title, .task-title, .sticky-note-title, .log-title";

      function startRename(windowId) {
        if (currentEditable) endRename();
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          const titleSpan = windowElement.querySelector(RENAME_TITLE_SELECTOR);
          if (!titleSpan) return;
          titleSpan.contentEditable = true;
          titleSpan.focus();
          document.execCommand("selectAll", false, null); // Select all text for easy editing
          currentEditable = { windowId, element: titleSpan };

          // Listen for Enter, Escape, or blur
          titleSpan.addEventListener("keydown", handleRenameKeydown);
          titleSpan.addEventListener("blur", endRename);
          document.addEventListener("mousedown", handleOutsideClick);
        }
      }

      function handleRenameKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          endRename();
        } else if (e.key === "Escape") {
          e.preventDefault();
          cancelRename();
        }
      }

      function handleOutsideClick(e) {
        if (currentEditable && !e.target.closest(RENAME_TITLE_SELECTOR)) {
          endRename();
        }
      }

      function endRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if empty, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = element.textContent.trim() || defaultName;

          currentEditable = null;
          saveSession();
        }
      }

      function cancelRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if cancelled, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = defaultName;

          currentEditable = null;
          saveSession();
        }
      }
      // One copy path for both buttons. Prefers the async Clipboard API and
      // falls back to execCommand, which is what actually works under file://.
      // The old code selected the textarea and left it selected, so a copy
      // could be followed by a keystroke that wiped the note.
      async function copyToClipboard(text, emptyMessage) {
        if (!text) {
          showStatus(emptyMessage || "Nothing to copy.");
          return false;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            showStatus("Copied to clipboard.");
            return true;
          } catch {
            /* fall through to execCommand */
          }
        }
        // Copy via an offscreen field so the user's own selection and caret in
        // the note are left untouched.
        const scratch = document.createElement("textarea");
        scratch.value = text;
        scratch.setAttribute("readonly", "");
        scratch.style.cssText = "position:fixed;top:-1000px;opacity:0;";
        document.body.appendChild(scratch);
        scratch.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch {
          ok = false;
        }
        document.body.removeChild(scratch);
        showStatus(ok ? "Copied to clipboard." : "Copy failed — select and press Ctrl+C.");
        return ok;
      }

      function copyText() {
        if (!activeWindow) {
          showStatus("Select a note first, then copy.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Copy only works on a note.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Per-window one-click copy (the Copy button in each note/T2 format row).
      // Targets its own window rather than relying on activeWindow.
      function copyNoteText(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) {
          showStatus("Copy failed: note not found.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Paste had three problems: navigator.clipboard.readText() does not exist
      // under file:// (which is how this app is meant to be run), it silently
      // REPLACED the note instead of inserting at the cursor, and every failure
      // collapsed into one unhelpful "Failed to paste text."
      async function pasteText() {
        if (!activeWindow) {
          showStatus("Select a note first, then paste.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Paste only works into a note.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot paste: window is frozen.");
          return;
        }

        let text = null;
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            text = await navigator.clipboard.readText();
          } catch {
            text = null; // blocked by permission, or unavailable on file://
          }
        }

        if (text === null) {
          // execCommand("paste") is disallowed from script in every current
          // browser, so the honest fallback is to focus the field and let the
          // user's own Ctrl+V through - the browser will then paste natively.
          textarea.focus();
          showStatus("Press Ctrl+V to paste into this note.");
          return;
        }

        insertIntoNote(activeWindow, text);
        showStatus("Pasted from clipboard.");
      }

      // Insert at the caret, replacing any selection, rather than overwriting
      // the whole note - and keep undo history intact where the browser
      // supports it.
      function insertIntoNote(windowId, text) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) return;
        textarea.focus();
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        let inserted = false;
        try {
          inserted = document.execCommand("insertText", false, text);
        } catch {
          inserted = false;
        }
        if (!inserted) {
          textarea.value =
            textarea.value.slice(0, start) + text + textarea.value.slice(end);
          textarea.selectionStart = textarea.selectionEnd = start + text.length;
        }
        updateLineNumbers(windowId);
        updateCounts(windowId);
        updateWindowSize(windowId);
        saveSession();
      }

      function toUpperCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toUpperCase();
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Converted to uppercase.");
        } else {
          showStatus("Cannot convert: window is frozen.");
        }
      }

      function toLowerCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toLowerCase();
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Converted to lowercase.");
        } else {
          showStatus("Cannot convert: window is frozen.");
        }
      }

      function updateCounts(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const countDiv = document.getElementById(`counts-${windowId}`);
        if (textarea && countDiv) {
          const text = textarea.value;
          const words = text
            .trim()
            .split(/\s+/)
            .filter((word) => word.length > 0).length;
          countDiv.textContent = `Words: ${words}, Characters: ${text.length}`;
        }
      }

      function searchReplace() {
        if (!activeWindow) {
          showStatus("No active window selected.");
          return;
        }
        const searchInput = document.getElementById("search-input").value;
        const replaceInput = document.getElementById("replace-input").value;
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Search only works on a note. Select one first.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot replace: window is frozen.");
          return;
        }
        if (!searchInput) {
          showStatus("Enter something to search for.");
          document.getElementById("search-input").focus();
          return;
        }
        // Users type literal text here, not regular expressions. Passing it
        // straight to RegExp made "(" throw and characters like "." match
        // anything. Escape it and count the hits so there's real feedback.
        const escaped = searchInput.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp(escaped, "g");
        const matches = textarea.value.match(pattern);
        if (!matches) {
          showStatus(`No matches for "${searchInput}".`);
          return;
        }
        textarea.value = textarea.value.replace(pattern, replaceInput);
        updateLineNumbers(activeWindow);
        updateCounts(activeWindow);
        updateWindowSize(activeWindow);
        saveSession();
        showStatus(
          `Replaced ${matches.length} match${matches.length === 1 ? "" : "es"}.`
        );
      }

      let _statusTimer = null;

        const status = document.getElementById("status");

        // messages left earlier timers to hide the newest one early.
        if (_statusTimer) clearTimeout(_statusTimer);
        status.textContent = message;
        status.style.display = "block";
        status.classList.remove("showing");
        void status.offsetWidth; // restart the entry animation
        status.classList.add("showing");
        _statusTimer = setTimeout(() => {
          status.style.display = "none";
          status.classList.remove("showing");
          _statusTimer = null;
        }, 3000);

      // Bound to the Reset button. Destroys the saved session, so confirm
      // first when there is actually something to lose.
      function loadSession(skipConfirm = false) {
        try {
          const hasWork =
            document.querySelectorAll(WINDOW_SELECTOR).length > 0 ||
            ALL_SESSION_KEYS.some((k) => !!localStorage.getItem(k));
          if (hasWork && skipConfirm !== true) {
            if (
              !confirm(
                "Reset CB App?\n\nThis closes every window and deletes all CB App data saved in this browser (session, any leftover keys from older versions, and any passphrase protection for this tab). Use Backup first if you want to keep it."
              )
            ) {
              return;
            }
          }
          // Clear every key this app owns (not the entire origin).
          clearAllSessionStorage();
          clearSessionSecrets();
          // Reset is the deliberate way out of a session nobody can open: the
          // ciphertext is gone now, so there is nothing left to protect and
          // saving must resume — including after a boot that failed to read
          // the old copy and left the boot gate shut.
          exitLockedState();
          booted = true;
          clearSaveFailure();
          updateProtectButton();

          // Reset UI state
          document.getElementById("windows").innerHTML = ""; // Remove all windows
          document.body.className = "dark-mode"; // Set default theme
          // "Fresh UI" includes the view: a reset that left you panned into an
          // empty corner of a three-screen canvas would look like a blank page.
          view.on = false;
          view.x = 0;
          view.y = 0;
          view.zoom = 1;
          worldSize = { w: 0, h: 0 };
          applyView();
          document.querySelector(".nav-menu").classList.remove("collapsed"); // Expand nav menu
          document.getElementById("search-replace").classList.remove("active"); // Hide search/replace

          // Reset global variables
          windowCount = 0;
          noteCount = 0;
          taskCount = 0;
          stickyCount = 0;
          t2Count = 0;
          calculatorCount = 0;
          clockCount = 0;
          activeWindow = null;
          zIndexCounter = 1;
          calculatorVisible = false;
          clockVisible = false;
          logVisible = false;
          calculatorHistory = [];
          logEntries = [];

          // Reset toggle buttons
          const calcToggle = document.getElementById("calculator-toggle");
          const clockToggle = document.getElementById("clock-toggle");
          const logToggle = document.getElementById("log-toggle");
          if (calcToggle) {
            calcToggle.textContent = "Calc";
            calcToggle.classList.remove("active");
          }
          if (clockToggle) {
            clockToggle.textContent = "Clock";
            clockToggle.classList.remove("active");
          }
          if (logToggle) {
            logToggle.textContent = "Log";
            logToggle.classList.remove("active");
          }

          cascadeIndex = 0;
          cascadeAnchor = null;
          refreshChrome();
          showStatus("UI reset to fresh state — all CB App browser data cleared.");
        } catch (e) {
          console.error("Failed to reset UI:", e);
          showStatus("Failed to reset UI.");
        }
      }

      function loadSessionFromStorage(session) {
        // Rebuild quietly: suppress the add*() helpers' internal saveSession() calls
        // so we never persist a half-built DOM, then write one complete snapshot below.
        restoring = true;
        let skippedOnRestore = 0;
        try {
        // Restore theme — the token only, for the same reason toggleTheme()
        // does: the canvas classes on <body> are not the theme's to clear.
        document.body.classList.remove("light-mode", "dark-mode");
        document.body.classList.add(
          session.theme === "dark-mode" ? "dark-mode" : "light-mode"
        );

        // Restore windows
        Object.keys(session).forEach((key) => {
          if (key.startsWith("window")) {
            const windowData = session[key];
            let newWindow;
            if (windowData.isTaskWindow) {
              newWindow = addTaskWindow();
            } else {
              newWindow = addWindow();
            }
            // add*() returns null once MAX_WINDOWS is hit. A saved session can
            // legitimately hold more windows than the current cap, and this
            // used to dereference the null and abort the entire restore -
            // losing every window after it, not just the extra one.
            if (!newWindow) {
              skippedOnRestore++;
              return;
            }
            const windowElement = document.getElementById(newWindow.id);

            // Restore position, size, and content
            windowElement.style.left = `${windowData.position.left}px`;
            windowElement.style.top = `${windowData.position.top}px`;
            windowElement.style.width = `${windowData.width}px`;
            windowElement.style.height = `${windowData.height}px`;
            windowElement.dataset.x = windowData.position.left;
            windowElement.dataset.y = windowData.position.top;
            windowElement.dataset.width = windowData.width;
            windowElement.dataset.height = windowData.height;
            // Reapply the resize target's OWN box before the ResizeObserver's
            // first callback runs, so updateWindowSize() derives the window
            // from the size the user actually chose rather than the default the
            // markup ships with. Absent in pre-3.1.3 sessions — those keep the
            // old behaviour rather than being resized to something arbitrary.
            const restoreTarget = resizeTargetFor(windowElement);
            if (
              restoreTarget &&
              restoreTarget !== windowElement &&
              windowData.containerWidth &&
              windowData.containerHeight
            ) {
              restoreTarget.style.width = `${windowData.containerWidth}px`;
              restoreTarget.style.height = `${windowData.containerHeight}px`;
            }
            if (windowData.zIndex) windowElement.style.zIndex = windowData.zIndex;
            if (windowData.minimized) windowElement.style.display = "none";

            if (windowData.isTaskWindow) {
              // Restore tasks
              const taskList = windowElement.querySelector(".task-list");
              if (taskList && windowData.tasks) {
                taskList.innerHTML = "";
                windowData.tasks.forEach((task) => {
                  taskList.appendChild(
                    createTaskItem(newWindow.id, task.text, task.completed)
                  );
                });
              }
              const title = windowElement.querySelector(".task-title");
              if (title) title.textContent = windowData.name;
            } else {
              const textarea = document.getElementById(
                `clipboard-${newWindow.id}`
              );
              if (textarea) textarea.value = windowData.content;
              const title = windowElement.querySelector(".window-title");
              if (title) title.textContent = windowData.name;
              updateLineNumbers(newWindow.id);
              updateCounts(newWindow.id);
            }
            // Lock LAST. Applied before the content was rebuilt, it missed the
            // task checkboxes and delete buttons created just above, leaving a
            // "locked" task list whose items were still fully interactive.
            // applyWindowLock, not toggleWindowLock: restoring sets the state
            // directly rather than flipping it, and fires no status toast.
            if (windowData.locked) {
              applyWindowLock(windowElement, true);
            }
          } else if (key === "clock" && session.clock.visible) {
            addClock();
            const clock = document.getElementById("clock");
            if (clock) {
              clock.style.left = `${session.clock.position.left}px`;
              clock.style.top = `${session.clock.position.top}px`;
              clock.dataset.x = session.clock.position.left;
              clock.dataset.y = session.clock.position.top;
              document.getElementById("clock-format-clock").value =
                session.clock.clockFormat;
              updateClock("clock");
              if (session.clock.minimized) clock.style.display = "none";
              if (session.clock.locked) applyWindowLock(clock, true);
            }
          } else if (key === "calculator" && session.calculator.visible) {
            addCalculator();
            const calculator = document.getElementById("calculator");
            if (calculator) {
              calculator.style.left = `${session.calculator.position.left}px`;
              calculator.style.top = `${session.calculator.position.top}px`;
              calculator.dataset.x = session.calculator.position.left;
              calculator.dataset.y = session.calculator.position.top;
              calculatorHistory = session.calculator.history || [];
              updateCalculatorHistory();
              if (session.calculator.minimized)
                calculator.style.display = "none";
              if (session.calculator.locked) applyWindowLock(calculator, true);
            }
          } else if (key === "log" && session.log.visible) {
            addLog();
            const log = document.getElementById("log");
            if (log) {
              log.style.left = `${session.log.position.left}px`;
              log.style.top = `${session.log.position.top}px`;
              log.dataset.x = session.log.position.left;
              log.dataset.y = session.log.position.top;
              logEntries = session.log.logs || [];
              restoreLogEntries();
              if (session.log.minimized) log.style.display = "none";
              if (session.log.locked) applyWindowLock(log, true);
            }
          } else if (key === "help" && session.help.visible) {
            toggleHelpWindow();
            const help = document.getElementById("help-window");
            if (help) {
              help.style.left = `${session.help.position.left}px`;
              help.style.top = `${session.help.position.top}px`;
              help.dataset.x = session.help.position.left;
              help.dataset.y = session.help.position.top;
              if (session.help.minimized) help.style.display = "none";
              if (session.help.locked) applyWindowLock(help, true);
            }
          } else if (key.startsWith("sticky-note")) {
            const stickyNoteData = session[key];
            const newStickyNote = addStickyNote();
            if (!newStickyNote) {
              skippedOnRestore++;
              return;
            }
            const stickyNoteElement = document.getElementById(newStickyNote.id);
            stickyNoteElement.style.left = `${stickyNoteData.position.left}px`;
            stickyNoteElement.style.top = `${stickyNoteData.position.top}px`;
            stickyNoteElement.style.width = `${stickyNoteData.width}px`;
            stickyNoteElement.style.height = `${stickyNoteData.height}px`;
            stickyNoteElement.dataset.x = stickyNoteData.position.left;
            stickyNoteElement.dataset.y = stickyNoteData.position.top;
            if (stickyNoteData.zIndex)
              stickyNoteElement.style.zIndex = stickyNoteData.zIndex;
            if (stickyNoteData.minimized)
              stickyNoteElement.style.display = "none";

            const content = stickyNoteElement.querySelector(
              ".sticky-note-content"
            );
            if (content) content.value = stickyNoteData.content;

            // Reapply colours only when they were a deliberate choice.
            // Sessions written before v3.0 have no customColor flag and stored
            // whatever the theme default was at creation time; reapplying those
            // is what left old notes stuck dark on a light canvas. Treat a
            // stored colour matching any known default as "not a choice".
            const bgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.color
              : !!stickyNoteData.color && !isDefaultStickyColor(stickyNoteData.color);
            const fgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.textColor
              : !!stickyNoteData.textColor &&
                !isDefaultStickyColor(stickyNoteData.textColor);

            if (bgIsChoice) {
              stickyNoteElement.style.backgroundColor = stickyNoteData.color;
            }
            if (fgIsChoice && content) {
              content.style.color = stickyNoteData.textColor;
              // Keep the title/toolbar legible against a custom background.
              stickyNoteElement.style.color = stickyNoteData.textColor;
            }
            if (bgIsChoice || fgIsChoice) {
              stickyNoteElement.dataset.customColor = "true";
            }
            syncStickySwatches(stickyNoteElement);
            const title = stickyNoteElement.querySelector(".sticky-note-title");
            if (title && stickyNoteData.name) {
              title.textContent = stickyNoteData.name;
            }
            // Lock last, after the content exists. This used to be applied
            // twice - once here and again by a hand-rolled copy below - which
            // toggled it straight back off. One call, one source of truth.
            if (stickyNoteData.locked) {
              applyWindowLock(stickyNoteElement, true);
            }
          }
        });
        // Keep new windows above everything restored (clear the highest restored z).
        const maxRestoredZ = Math.max(
          0,
          ...[...document.querySelectorAll(".window, .task-window, .sticky-note-window")]
            .map((el) => parseInt(el.style.zIndex) || 0)
        );
        zIndexCounter = Math.max(
          session.zIndexCounter || 0,
          maxRestoredZ + 1,
          zIndexCounter
        );
        // A session saved before the cap existed can carry huge z-indices that
        // would sit above the toolbar; renumber everything into 1..n.
        if (zIndexCounter >= WINDOW_Z_MAX) compactWindowZ();
        } finally {
          restoring = false;
        }
        // Restore the canvas view *before* the clamp below. That clamp pulls
        // every window into bounds, and which bounds apply depends entirely on
        // whether the big canvas is on — restoring the view afterwards would
        // drag every far-flung window back into a single screen on each reload
        // and silently collapse the canvas.
        const savedView = session.canvas;
        view.on = !!(savedView && savedView.on);
        if (view.on) {
          computeWorldSize();
          view.zoom = Math.min(
            ZOOM_MAX,
            Math.max(ZOOM_MIN, parseFloat(savedView.zoom) || 1)
          );
          view.x = parseFloat(savedView.x) || 0;
          view.y = parseFloat(savedView.y) || 0;
        } else {
          view.zoom = 1;
          view.x = 0;
          view.y = 0;
        }
        applyView();
        // A session saved on a large display used to restore partly or wholly
        // off-screen on a smaller one, with no way to drag anything back.
        document
          .querySelectorAll(WINDOW_SELECTOR)
          .forEach((el) => clampWindowIntoView(el));
        refreshChrome();
        // One complete, consistent write now that the whole DOM is rebuilt.
        saveSession();
        // Reported by the caller so its own "Session restored!" doesn't
        // immediately overwrite the warning.
        return skippedOnRestore;
      }

      // Boot: restore this browser's session. Nothing else can write to it.
      window.onload = async () => {
        // One-time purge of the retired calendar feature's stale storage key.
        localStorage.removeItem("calendarEvents");
        // Same, for the retired embedded-export mechanism (<= v3.2.6). Left in
        // place these are inert, but they are also the wreckage of the bug —
        // a displaced session under .prev that nothing will ever offer back.
        purgeRetiredExportKeys();
        updateProtectButton();

        // The file on disk is just the program now; an exported copy carries
        // no session, and a pre-3.2.7 export's payload is ignored outright.
        // The only thing that decides what opens is this browser's storage.
        const rawToLoad = localStorage.getItem(SESSION_KEY);

        if (rawToLoad) {
          try {
            const session = await parseAndUnlockSession(rawToLoad, {
              promptReason:
                "Your CB App session is passphrase-protected. Enter the passphrase:",
            });
            if (!session) {
              // Wrong passphrase or cancelled. The ciphertext in localStorage
              // is still the only copy of their work, and the very next
              // autosave would overwrite it with an empty plaintext session —
              // which is how this used to destroy the data outright. Lock
              // instead: refuse every write, and offer unlimited retries.
              const stored = localStorage.getItem(SESSION_KEY);
              let storedEnvelope = null;
              try {
                const parsed = JSON.parse(stored || "");
                if (isEncryptedEnvelope(parsed)) storedEnvelope = parsed;
              } catch (e) {
                /* not an envelope — nothing to protect */
              }
              if (storedEnvelope) {
                enterLockedState(storedEnvelope);
                // Safe to release the boot gate: sessionLocked now refuses
                // every write on its own, and Unlock needs saves to work again.
                booted = true;
                showStatus(
                  "Session locked — wrong passphrase or cancelled. Nothing was lost; click 🔒 to try again."
                );
              } else {
                // Something is in storage that we could not turn into a
                // session, and it is not an envelope we can offer to unlock.
                // Leave the boot gate shut so autosave cannot overwrite it.
                showStatus(
                  "Session not loaded — passphrase cancelled or incorrect."
                );
                reportSaveFailure(
                  "Session not loaded — saving is off so the stored copy is not overwritten. Reset to start fresh."
                );
              }
            } else {
              const skipped = loadSessionFromStorage(session);
              booted = true;
              // Re-persist so Protect state (if any) is reflected in storage.
              saveSession();
              updateProtectButton();
              if (skipped) {
                showStatus(
                  `Session restored — ${skipped} window${
                    skipped === 1 ? "" : "s"
                  } skipped (${MAX_WINDOWS}-window limit).`
                );
              } else {
                showStatus("Session restored.");
              }
            }
          } catch (e) {
            console.error("Failed to load session:", e);
            // booted stays false: the stored copy is unreadable to us but it is
            // still the user's only copy. Refuse to write over it.
            showStatus(
              "Failed to load session" +
                (e && e.message ? `: ${e.message}` : ".")
            );
            reportSaveFailure(
              "Session failed to load — saving is off so the stored copy is not overwritten. Save a Backup elsewhere, then Reset."
            );
          }
        } else {
          // Ensure fresh state on load
          document.body.className = "dark-mode";
          document.querySelector(".nav-menu").classList.remove("collapsed");
          document.getElementById("search-replace").classList.remove("active");
          // Nothing in storage to protect — writes are safe from here.
          booted = true;
        }
        refreshChrome();
        updateProtectButton();
      };

      // Save session automatically when the tab or browser closes
      window.addEventListener("beforeunload", (event) => {
        saveSession();
        // Optionally, show a confirmation dialog (not recommended for modern browsers)
        // event.preventDefault();
        // event.returnValue = '';
      });

      const resizeObserver = new ResizeObserver(() => {
        const taskWindows = document.querySelectorAll(".task-window");
        taskWindows.forEach((window) => {
          const taskList = window.querySelector(".task-list");
          if (taskList) {
            const headerHeight =
              window.querySelector(".task-header").offsetHeight || 30;
            const inputHeight =
              window.querySelector(".task-input-container").offsetHeight || 40;
            taskList.style.maxHeight = `${
              window.offsetHeight - headerHeight - inputHeight - 20
            }px`;
          }
        });
      });
      resizeObserver.observe(document.getElementById("windows"));

      function clearNoteText(windowId) {
        const windowElement = document.getElementById(windowId);
        const textarea = document.getElementById(`clipboard-${windowId}`);

        // Check if window is locked
        if (windowElement && windowElement.dataset.locked === "true") {
          showStatus("Cannot clear note: window is frozen.");
          return;
        }

        if (textarea) {
          textarea.value = "";
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Note cleared!");
        }
