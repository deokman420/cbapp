      // Bound to the Reset button. Destroys the saved session, so confirm
      // first when there is actually something to lose.
      function loadSession(skipConfirm = false) {
        try {
          const hasWork =
            document.querySelectorAll(WINDOW_SELECTOR).length > 0 ||
            !!localStorage.getItem("notepadSession");
          if (hasWork && skipConfirm !== true) {
            if (
              !confirm(
                "Reset CB App?\n\nThis closes every window and deletes the session saved in this browser. Use Backup first if you want to keep it."
              )
            ) {
              return;
            }
          }
          // Clear only this app's keys (safer than wiping the entire origin)
          localStorage.removeItem("notepadSession");

          // Reset UI state
          document.getElementById("windows").innerHTML = ""; // Remove all windows
          document.body.className = "dark-mode"; // Set default theme
          // "Fresh UI" includes the view: a reset that left you panned into an
          // empty corner of a three-screen canvas would look like a blank page.
          view.on = false;
          view.x = 0;
          view.y = 0;
          view.zoom = 1;
          worldSize = { w: 0, h: 0 };
          applyView();
          document.querySelector(".nav-menu").classList.remove("collapsed"); // Expand nav menu
          document.getElementById("search-replace").classList.remove("active"); // Hide search/replace

          // Reset global variables
          windowCount = 0;
          noteCount = 0;
          taskCount = 0;
          stickyCount = 0;
          t2Count = 0;
          calculatorCount = 0;
          clockCount = 0;
          activeWindow = null;
          zIndexCounter = 1;
          calculatorVisible = false;
          clockVisible = false;
          logVisible = false;
          calculatorHistory = [];
          logEntries = [];

          // Reset toggle buttons
          const calcToggle = document.getElementById("calculator-toggle");
          const clockToggle = document.getElementById("clock-toggle");
          const logToggle = document.getElementById("log-toggle");
          if (calcToggle) {
            calcToggle.textContent = "Calc";
            calcToggle.classList.remove("active");
          }
          if (clockToggle) {
            clockToggle.textContent = "Clock";
            clockToggle.classList.remove("active");
          }
          if (logToggle) {
            logToggle.textContent = "Log";
            logToggle.classList.remove("active");
          }

          cascadeIndex = 0;
          cascadeAnchor = null;
          refreshChrome();
          showStatus("UI reset to fresh state!");
        } catch (e) {
          console.error("Failed to reset UI:", e);
          showStatus("Failed to reset UI.");
        }
      }

      function loadSessionFromStorage(session) {
        // Rebuild quietly: suppress the add*() helpers' internal saveSession() calls
        // so we never persist a half-built DOM, then write one complete snapshot below.
        restoring = true;
        let skippedOnRestore = 0;
        try {
        // Restore theme — the token only, for the same reason toggleTheme()
        // does: the canvas classes on <body> are not the theme's to clear.
        document.body.classList.remove("light-mode", "dark-mode");
        document.body.classList.add(
          session.theme === "dark-mode" ? "dark-mode" : "light-mode"
        );

        // Restore windows
        Object.keys(session).forEach((key) => {
          if (key.startsWith("window")) {
            const windowData = session[key];
            let newWindow;
            if (windowData.isTaskWindow) {
              newWindow = addTaskWindow();
            } else {
              newWindow = addWindow();
            }
            // add*() returns null once MAX_WINDOWS is hit. A saved session can
            // legitimately hold more windows than the current cap, and this
            // used to dereference the null and abort the entire restore -
            // losing every window after it, not just the extra one.
            if (!newWindow) {
              skippedOnRestore++;
              return;
            }
            const windowElement = document.getElementById(newWindow.id);

            // Restore position, size, and content
            windowElement.style.left = `${windowData.position.left}px`;
            windowElement.style.top = `${windowData.position.top}px`;
            windowElement.style.width = `${windowData.width}px`;
            windowElement.style.height = `${windowData.height}px`;
            windowElement.dataset.x = windowData.position.left;
            windowElement.dataset.y = windowData.position.top;
            windowElement.dataset.width = windowData.width;
            windowElement.dataset.height = windowData.height;
            if (windowData.zIndex) windowElement.style.zIndex = windowData.zIndex;
            if (windowData.minimized) windowElement.style.display = "none";

            if (windowData.isTaskWindow) {
              // Restore tasks
              const taskList = windowElement.querySelector(".task-list");
              if (taskList && windowData.tasks) {
                taskList.innerHTML = "";
                windowData.tasks.forEach((task) => {
                  taskList.appendChild(
                    createTaskItem(newWindow.id, task.text, task.completed)
                  );
                });
              }
              const title = windowElement.querySelector(".task-title");
              if (title) title.textContent = windowData.name;
            } else {
              const textarea = document.getElementById(
                `clipboard-${newWindow.id}`
              );
              if (textarea) textarea.value = windowData.content;
              const title = windowElement.querySelector(".window-title");
              if (title) title.textContent = windowData.name;
              updateLineNumbers(newWindow.id);
              updateCounts(newWindow.id);
            }
            // Lock LAST. Applied before the content was rebuilt, it missed the
            // task checkboxes and delete buttons created just above, leaving a
            // "locked" task list whose items were still fully interactive.
            // applyWindowLock, not toggleWindowLock: restoring sets the state
            // directly rather than flipping it, and fires no status toast.
            if (windowData.locked) {
              applyWindowLock(windowElement, true);
            }
          } else if (key === "clock" && session.clock.visible) {
            addClock();
            const clock = document.getElementById("clock");
            if (clock) {
              clock.style.left = `${session.clock.position.left}px`;
              clock.style.top = `${session.clock.position.top}px`;
              clock.dataset.x = session.clock.position.left;
              clock.dataset.y = session.clock.position.top;
              document.getElementById("clock-format-clock").value =
                session.clock.clockFormat;
              updateClock("clock");
              if (session.clock.minimized) clock.style.display = "none";
              if (session.clock.locked) applyWindowLock(clock, true);
            }
          } else if (key === "calculator" && session.calculator.visible) {
            addCalculator();
            const calculator = document.getElementById("calculator");
            if (calculator) {
              calculator.style.left = `${session.calculator.position.left}px`;
              calculator.style.top = `${session.calculator.position.top}px`;
              calculator.dataset.x = session.calculator.position.left;
              calculator.dataset.y = session.calculator.position.top;
              calculatorHistory = session.calculator.history || [];
              updateCalculatorHistory();
              if (session.calculator.minimized)
                calculator.style.display = "none";
              if (session.calculator.locked) applyWindowLock(calculator, true);
            }
          } else if (key === "log" && session.log.visible) {
            addLog();
            const log = document.getElementById("log");
            if (log) {
              log.style.left = `${session.log.position.left}px`;
              log.style.top = `${session.log.position.top}px`;
              log.dataset.x = session.log.position.left;
              log.dataset.y = session.log.position.top;
              logEntries = session.log.logs || [];
              restoreLogEntries();
              if (session.log.minimized) log.style.display = "none";
              if (session.log.locked) applyWindowLock(log, true);
            }
          } else if (key === "help" && session.help.visible) {
            toggleHelpWindow();
            const help = document.getElementById("help-window");
            if (help) {
              help.style.left = `${session.help.position.left}px`;
              help.style.top = `${session.help.position.top}px`;
              help.dataset.x = session.help.position.left;
              help.dataset.y = session.help.position.top;
              if (session.help.minimized) help.style.display = "none";
              if (session.help.locked) applyWindowLock(help, true);
            }
          } else if (key.startsWith("sticky-note")) {
            const stickyNoteData = session[key];
            const newStickyNote = addStickyNote();
            if (!newStickyNote) {
              skippedOnRestore++;
              return;
            }
            const stickyNoteElement = document.getElementById(newStickyNote.id);
            stickyNoteElement.style.left = `${stickyNoteData.position.left}px`;
            stickyNoteElement.style.top = `${stickyNoteData.position.top}px`;
            stickyNoteElement.style.width = `${stickyNoteData.width}px`;
            stickyNoteElement.style.height = `${stickyNoteData.height}px`;
            stickyNoteElement.dataset.x = stickyNoteData.position.left;
            stickyNoteElement.dataset.y = stickyNoteData.position.top;
            if (stickyNoteData.zIndex)
              stickyNoteElement.style.zIndex = stickyNoteData.zIndex;
            if (stickyNoteData.minimized)
              stickyNoteElement.style.display = "none";

            const content = stickyNoteElement.querySelector(
              ".sticky-note-content"
            );
            if (content) content.value = stickyNoteData.content;

            // Reapply colours only when they were a deliberate choice.
            // Sessions written before v3.0 have no customColor flag and stored
            // whatever the theme default was at creation time; reapplying those
            // is what left old notes stuck dark on a light canvas. Treat a
            // stored colour matching any known default as "not a choice".
            const bgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.color
              : !!stickyNoteData.color && !isDefaultStickyColor(stickyNoteData.color);
            const fgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.textColor
              : !!stickyNoteData.textColor &&
                !isDefaultStickyColor(stickyNoteData.textColor);

            if (bgIsChoice) {
              stickyNoteElement.style.backgroundColor = stickyNoteData.color;
            }
            if (fgIsChoice && content) {
              content.style.color = stickyNoteData.textColor;
              // Keep the title/toolbar legible against a custom background.
              stickyNoteElement.style.color = stickyNoteData.textColor;
            }
            if (bgIsChoice || fgIsChoice) {
              stickyNoteElement.dataset.customColor = "true";
            }
            syncStickySwatches(stickyNoteElement);
            const title = stickyNoteElement.querySelector(".sticky-note-title");
            if (title && stickyNoteData.name) {
              title.textContent = stickyNoteData.name;
            }
            // Lock last, after the content exists. This used to be applied
            // twice - once here and again by a hand-rolled copy below - which
            // toggled it straight back off. One call, one source of truth.
            if (stickyNoteData.locked) {
              applyWindowLock(stickyNoteElement, true);
            }
          }
        });
        // Keep new windows above everything restored (clear the highest restored z).
        const maxRestoredZ = Math.max(
          0,
          ...[...document.querySelectorAll(".window, .task-window, .sticky-note-window")]
            .map((el) => parseInt(el.style.zIndex) || 0)
        );
        zIndexCounter = Math.max(
          session.zIndexCounter || 0,
          maxRestoredZ + 1,
          zIndexCounter
        );
        // A session saved before the cap existed can carry huge z-indices that
        // would sit above the toolbar; renumber everything into 1..n.
        if (zIndexCounter >= WINDOW_Z_MAX) compactWindowZ();
        } finally {
          restoring = false;
        }
        // Restore the canvas view *before* the clamp below. That clamp pulls
        // every window into bounds, and which bounds apply depends entirely on
        // whether the big canvas is on — restoring the view afterwards would
        // drag every far-flung window back into a single screen on each reload
        // and silently collapse the canvas.
        const savedView = session.canvas;
        view.on = !!(savedView && savedView.on);
        if (view.on) {
          computeWorldSize();
          view.zoom = Math.min(
            ZOOM_MAX,
            Math.max(ZOOM_MIN, parseFloat(savedView.zoom) || 1)
          );
          view.x = parseFloat(savedView.x) || 0;
          view.y = parseFloat(savedView.y) || 0;
        } else {
          view.zoom = 1;
          view.x = 0;
          view.y = 0;
        }
        applyView();
        // A session saved on a large display used to restore partly or wholly
        // off-screen on a smaller one, with no way to drag anything back.
        document
          .querySelectorAll(WINDOW_SELECTOR)
          .forEach((el) => clampWindowIntoView(el));
        refreshChrome();
        // One complete, consistent write now that the whole DOM is rebuilt.
        saveSession();
        // Reported by the caller so its own "Session restored!" doesn't
        // immediately overwrite the warning.
        return skippedOnRestore;
      }

      // No automatic session loading on page load
      window.onload = () => {
        // One-time purge of the retired calendar feature's stale storage key.
        localStorage.removeItem("calendarEvents");
        // An exported copy carries its session inside the file; on first open
        // that wins, so the download actually contains what it promised.
        const embedded = readEmbeddedSession();
        const savedSession = embedded
          ? JSON.stringify(embedded)
          : localStorage.getItem("notepadSession");
        if (savedSession) {
          try {
            const session = JSON.parse(savedSession);
            const skipped = loadSessionFromStorage(session);
            showStatus(
              skipped
                ? `Session restored — ${skipped} window${
                    skipped === 1 ? "" : "s"
                  } skipped (${MAX_WINDOWS}-window limit).`
                : "Session restored."
            );
          } catch (e) {
            console.error("Failed to load session:", e);
            showStatus("Failed to load session.");
          }
        } else {
          // Ensure fresh state on load
          document.body.className = "dark-mode";
          document.querySelector(".nav-menu").classList.remove("collapsed");
          document.getElementById("search-replace").classList.remove("active");
        }
        refreshChrome();
      };

      // Save session automatically when the tab or browser closes
      window.addEventListener("beforeunload", (event) => {
        saveSession();
        // Optionally, show a confirmation dialog (not recommended for modern browsers)
        // event.preventDefault();
        // event.returnValue = '';
      });

      const resizeObserver = new ResizeObserver(() => {
        const taskWindows = document.querySelectorAll(".task-window");
        taskWindows.forEach((window) => {
          const taskList = window.querySelector(".task-list");
          if (taskList) {
            const headerHeight =
              window.querySelector(".task-header").offsetHeight || 30;
            const inputHeight =
              window.querySelector(".task-input-container").offsetHeight || 40;
            taskList.style.maxHeight = `${
              window.offsetHeight - headerHeight - inputHeight - 20
            }px`;
          }
        });
      });
      resizeObserver.observe(document.getElementById("windows"));

      function clearNoteText(windowId) {
        const windowElement = document.getElementById(windowId);
        const textarea = document.getElementById(`clipboard-${windowId}`);

        // Check if window is locked
        if (windowElement && windowElement.dataset.locked === "true") {
          showStatus("Cannot clear note: Window is locked.");
          return;
        }

        if (textarea) {
          textarea.value = "";
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Note cleared!");
        }
      }

      function downloadSessionJSON() {
        try {
          saveSession(); // Ensure latest state is saved
          const session = localStorage.getItem("notepadSession");
          if (!session) {
            showStatus("No session data to download.");
            return;
          }
          const blob = new Blob([session], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "cbapp-session.json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showStatus("Session JSON downloaded!");
        } catch (e) {
          showStatus("Failed to download session.");
        }
      }

      const EMBEDDED_SESSION_ID = "cbapp-embedded-session";
      const CONSUMED_EXPORT_KEY = "cbappConsumedExport";

      // This used to serialise document.documentElement.outerHTML verbatim,
      // which baked every open window into the file as static markup. Those
      // copies had no event listeners (undraggable, unclosable), textarea
      // .value doesn't serialise so they came back EMPTY, they duplicated the
      // windows restored from localStorage, they carried a second #nav-tooltip
      // with a duplicate id, and windowCount reset to 0 so new windows collided
      // with the baked-in ids. Export a pristine document instead and carry the
      // session as embedded JSON, so the copy boots exactly like the original.
      function downloadCurrentHtml() {
        try {
          saveSession();
          const clone = document.documentElement.cloneNode(true);

          const clear = (sel) => {
            const el = clone.querySelector(sel);
            if (el) el.innerHTML = "";
          };
          clear("#windows");
          clear("#minimized-bar");
          clear("#status");
          // The canvas view is state, not markup. Leaving the pan/zoom
          // transform and the mode class baked into the file would make the
          // export open on a stale viewport for the moment before its embedded
          // session boots and sets the real one.
          clone.querySelector("#windows")?.removeAttribute("style");
          clone.querySelector("#canvas-grid")?.removeAttribute("style");
          clone.querySelector("#canvas-map")?.removeAttribute("style");
          clone.querySelector("#map-viewport")?.removeAttribute("style");
          // Minimap blocks are generated from the live windows, exactly like
          // the windows themselves, so they must not travel with the file.
          clone.querySelectorAll(".map-window").forEach((n) => n.remove());
          clone
            .querySelector("body")
            ?.classList.remove(
              "canvas-on",
              "canvas-panning",
              "canvas-interacting"
            );
          // Created by script at load; leaving it in yields two same-id nodes.
          clone.querySelector("#nav-tooltip")?.remove();
          clone.querySelector("#empty-state")?.removeAttribute("hidden");
          clone.querySelector("#search-replace")?.classList.remove("active");
          clone
            .querySelectorAll(".nav-menu button.active")
            .forEach((b) => b.classList.remove("active"));
          clone.querySelector(".nav-menu")?.classList.remove("collapsed");
          clone.querySelector(`#${EMBEDDED_SESSION_ID}`)?.remove();

          const payload = {
            // Lets a re-opened export tell "this is a new file to load" from
            // "I already loaded this one, use my edits since".
            exportId: `${Date.now()}-${windowCount}-${noteCount}`,
            session: JSON.parse(localStorage.getItem("notepadSession") || "{}"),
          };
          const script = document.createElement("script");
          script.type = "application/json";
          script.id = EMBEDDED_SESSION_ID;
          // Escape < so a note containing a closing script tag can't break out.
          script.textContent = JSON.stringify(payload).replace(/</g, "\\u003c");
          clone.querySelector("body")?.appendChild(script);

          const html = "<!DOCTYPE html>\n" + clone.outerHTML;
          const blob = new Blob([html], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "cbapp.html";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showStatus("Downloaded cbapp.html with your session.");
        } catch (e) {
          console.error("Export failed:", e);
          showStatus("Failed to download HTML.");
        }
      }

      // Returns the session carried inside an exported copy, but only the first
      // time that particular export is opened - after that the user's own edits
      // in localStorage take precedence.
      function readEmbeddedSession() {
        const node = document.getElementById(EMBEDDED_SESSION_ID);
        if (!node) return null;
        try {
          const payload = JSON.parse(node.textContent);
          if (!payload || typeof payload.session !== "object") return null;
          if (localStorage.getItem(CONSUMED_EXPORT_KEY) === payload.exportId) {
            return null;
          }
          localStorage.setItem(CONSUMED_EXPORT_KEY, payload.exportId);
          return payload.session;
        } catch (e) {
          console.error("Embedded session unreadable:", e);
          return null;
        }
      }

      function importData() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json,application/json";
        input.style.display = "none";

        input.onchange = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const text = e.target.result;
              if (typeof text !== "string" || text.length > 4500000) {
                showStatus("Import failed: file too large or invalid.");
                return;
              }
              const session = JSON.parse(text);
              // Basic structural sanity check before trusting the import
              if (!session || typeof session !== "object") {
                showStatus("Import failed: not a valid session file.");
                return;
              }
              localStorage.setItem("notepadSession", JSON.stringify(session));
              loadSession(true); // clear current UI; the file dialog was the confirmation
              loadSessionFromStorage(session); // Load imported session
              showStatus("Session imported!");
            } catch (err) {
              showStatus("Failed to import session.");
            }
          };
          reader.readAsText(file);
        };

        document.body.appendChild(input);
        input.click();
        document.body.removeChild(input);
      }
      let countdownInterval = null;
      let countdownEndTime = null;
      let countdownActive = false;
      let originalFavicon = null;

      function startCountdown() {
        const minInput = document.getElementById("countdown-minutes");
        const secInput = document.getElementById("countdown-seconds");
        const display = document.getElementById("countdown-display");
        let minutes = parseInt(minInput.value, 10) || 0;
        let seconds = parseInt(secInput.value, 10) || 0;
        let totalMs = (minutes * 60 + seconds) * 1000;
        if (totalMs <= 0) {
          showStatus("Please enter a time greater than 0.");
          return;
        }
        countdownEndTime = Date.now() + totalMs;
        countdownActive = true;
        updateCountdownDisplay();
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateCountdownDisplay, 500);
        showStatus(`Countdown started for ${minutes} min ${seconds} sec!`);
      }

      function resetCountdown() {
        countdownActive = false;
        countdownEndTime = null;
        clearInterval(countdownInterval);
        const minInput = document.getElementById("countdown-minutes");
        const secInput = document.getElementById("countdown-seconds");
        const display = document.getElementById("countdown-display");
        let minutes = parseInt(minInput.value, 10) || 0;
        let seconds = parseInt(secInput.value, 10) || 0;
        display.textContent = `${Math.floor(minutes / 60)
          .toString()
          .padStart(2, "0")}:${(minutes % 60)
          .toString()
          .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        restoreFavicon();
      }

      function updateCountdownDisplay() {
        const display = document.getElementById("countdown-display");
        if (!countdownActive || !countdownEndTime) return;
        let msLeft = countdownEndTime - Date.now();
        if (msLeft <= 0) {
          display.textContent = "00:00:00";
          countdownActive = false;
          clearInterval(countdownInterval);
          upliftingNotification();
          setCountdownFavicon();
          return;
        }
        let totalSeconds = Math.floor(msLeft / 1000);
        let h = Math.floor(totalSeconds / 3600);
        let m = Math.floor((totalSeconds % 3600) / 60);
        let s = totalSeconds % 60;
        display.textContent = `${h.toString().padStart(2, "0")}:${m
          .toString()
          .padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }

      let _titleFlash = null;
      function upliftingNotification() {
        showStatus("🎉 Timer finished 🎉");
        // Flash the tab title, because the most likely reason you set a timer
        // is that you're looking at something else.
        if (_titleFlash) clearInterval(_titleFlash);
        const originalTitle = "CB App";
        let on = false;
        let ticks = 0;
        _titleFlash = setInterval(() => {
          on = !on;
          document.title = on ? "⏰ Timer finished" : originalTitle;
          if (++ticks >= 20) {
            clearInterval(_titleFlash);
            _titleFlash = null;
            document.title = originalTitle;
          }
        }, 700);
        const stopFlash = () => {
          if (_titleFlash) {
            clearInterval(_titleFlash);
            _titleFlash = null;
          }
          document.title = originalTitle;
          window.removeEventListener("focus", stopFlash);
        };
        window.addEventListener("focus", stopFlash);

        // Only use the OS notification if permission was already granted.
        // Firing requestPermission() here threw a browser permission dialog at
        // the user at a moment they never asked for one.
        if (window.Notification && Notification.permission === "granted") {
          try {
            new Notification("CB App", { body: "Timer finished." });
          } catch (e) {
            /* some browsers require a service worker; the toast already fired */
          }
        }
      }

      function setCountdownFavicon() {
        if (!originalFavicon) {
          const link = document.querySelector("link[rel~='icon']");
          if (link) originalFavicon = link.href;
        }
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          document.head.appendChild(link);
        }
        // Emoji favicon (works in most browsers)
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.font = "48px serif";
        ctx.fillText("🍽️", 8, 48);
        link.href = canvas.toDataURL();
      }

      function restoreFavicon() {
        if (originalFavicon) {
          let link = document.querySelector("link[rel~='icon']");
          if (link) link.href = originalFavicon;
        }
      }

      // --- Nav Tooltips ---
      const navTooltip = document.createElement("div");
      navTooltip.id = "nav-tooltip";
      document.body.appendChild(navTooltip);
      let tooltipHideTimer = null;

      function showNavTooltip(target) {
        const text = target.getAttribute("data-tooltip");
        if (!text) return;
        const type = target.getAttribute("data-tooltip-type");
        let html = `<div class="nav-tooltip-title">${text}</div>`;
        // Calc, Clock and Help can only ever have one window, so their list was
        // always a single entry restating the title above it ("Toggle Clock" /
        // "- Clock") - it read as two stacked tooltips. Only list a singleton
        // when it is minimized, where the entry does something the button
        // can't: bring it back rather than toggle it.
        const SINGLETON_TYPES = ["calculator", "clock", "help"];
        const singletonHidden = (sel) => {
          const el = document.querySelector(sel);
          return !!el && el.style.display === "none";
        };
        if (type) {
          let selector = "";
          let titleSelector = "";
          let filter = null;
          if (type === "note") {
            selector = ".window";
            titleSelector = ".window-title";
            filter = (name) => !/^T2 Template(\s|$)/.test(name);
          } else if (type === "t2") {
            selector = ".window";
            titleSelector = ".window-title";
            filter = (name) => /^T2 Template(\s|$)/.test(name);
          } else if (type === "task") {
            selector = ".task-window";
            titleSelector = ".task-title";
          } else if (type === "sticky") {
            selector = ".sticky-note-window";
            titleSelector = ".sticky-note-title";
          } else if (type === "calculator") {
            selector = "#calculator";
            titleSelector = ".calculator-title";
          } else if (type === "clock") {
            selector = "#clock";
            titleSelector = ".clock-title";
          } else if (type === "help") {
            selector = ".help-window";
            titleSelector = ".help-title";
            filter = () => true;
          }
          const listWorthShowing =
            selector &&
            (!SINGLETON_TYPES.includes(type) || singletonHidden(selector));
          const items = listWorthShowing
            ? Array.from(document.querySelectorAll(selector))
            : [];
          const entries = items
            .map((win) => ({
              id: win.id,
              name: win.querySelector(titleSelector)?.textContent || win.id,
              hidden: win.style.display === "none",
            }))
            .filter((e) => !filter || filter(e.name));
          if (entries.length > 0) {
            html += '<div class="nav-tooltip-list">';
            entries.forEach((e) => {
              html += `<button class="nav-tooltip-link" data-target-id="${e.id}">- ${e.name}${
                e.hidden ? " (minimized)" : ""
              }</button>`;
            });
            html += "</div>";
          }
        }
        navTooltip.innerHTML = html;
        navTooltip
          .querySelectorAll(".nav-tooltip-link")
          .forEach((link) => {
            link.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              restoreWindow(link.getAttribute("data-target-id"));
              hideNavTooltip();
            });
          });
        // Anchoring to the button's own top edge meant a bottom-row tooltip
        // rendered straight over the top row's buttons. Clear the whole
        // toolbar instead, and flip below it when the toolbar is top-anchored.
        const rect = target.getBoundingClientRect();
        const nav = navMenuBounds();
        const gap = 10;
        const navIsTopAnchored = nav && nav.top < window.innerHeight / 2;

        navTooltip.classList.add("visible");
        navTooltip.style.transform = "none";
        navTooltip.style.left = "0px";
        navTooltip.style.top = "0px";
        const tip = navTooltip.getBoundingClientRect();

        let left = rect.left + rect.width / 2 - tip.width / 2;
        left = Math.min(
          Math.max(8, left),
          Math.max(8, window.innerWidth - tip.width - 8)
        );

        const anchor = nav || rect;
        let top = navIsTopAnchored
          ? anchor.bottom + gap
          : anchor.top - tip.height - gap;
        top = Math.min(
          Math.max(8, top),
          Math.max(8, window.innerHeight - tip.height - 8)
        );

        navTooltip.style.left = `${left}px`;
        navTooltip.style.top = `${top}px`;
      }

      function hideNavTooltip() {
        navTooltip.classList.remove("visible");
      }

      // Every toolbar button already carries a full description in
      // data-tooltip, but that is a custom div a screen reader never sees, and
      // the visible labels ("T2", "Calc") don't stand on their own. Derive the
      // accessible name from the tooltip instead of hand-writing 16 of them.
      document.querySelectorAll(".nav-menu [data-tooltip]").forEach((el) => {
        el.setAttribute("aria-label", el.getAttribute("data-tooltip"));
        if (el.tagName === "BUTTON") el.setAttribute("type", "button");
      });

      document.querySelectorAll(".nav-menu [data-tooltip]").forEach((el) => {
        el.addEventListener("focus", () => showNavTooltip(el));
        el.addEventListener("blur", hideNavTooltip);
        el.addEventListener("mouseenter", () => {
          if (tooltipHideTimer) clearTimeout(tooltipHideTimer);
          showNavTooltip(el);
        });
        el.addEventListener("mouseleave", () => {
          tooltipHideTimer = setTimeout(() => {
            if (!navTooltip.matches(":hover")) hideNavTooltip();
          }, 120);
        });
      });

      navTooltip.addEventListener("mouseenter", () => {
        if (tooltipHideTimer) clearTimeout(tooltipHideTimer);
      });
      navTooltip.addEventListener("mouseleave", hideNavTooltip);

      // Minimizing used to hide a window with the only route back being an
      // undiscoverable hover tooltip. refreshChrome() puts a restore chip in
      // the bottom-left bar so a minimized window is never lost.
      function minimizeWindow(windowId) {
        const win = document.getElementById(windowId);
        if (!win) return;
        win.style.display = "none";
        win.classList.remove("active");
        if (activeWindow === windowId) activeWindow = null;
        refreshChrome();
        showStatus("Minimized — click the chip below-left to restore.");
        saveSession();
      }

      function minimizeStickyNote(windowId) {
        minimizeWindow(windowId);
      }

      // --- Keyboard ---
      // The app was mouse-only: no shortcuts, and no way to dismiss the search
      // panel or an in-progress rename from the keyboard.
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (currentEditable) {
            cancelRename();
            return;
          }
          const panel = document.getElementById("search-replace");
          if (panel && panel.classList.contains("active")) {
            toggleSearchReplace();
            return;
          }
          hideNavTooltip();
          return;
        }

        if (!e.ctrlKey || !e.shiftKey || e.altKey) return;
        switch (e.key.toLowerCase()) {
          case "n":
            e.preventDefault();
            addWindow();
            break;
          case "t":
            e.preventDefault();
            addTaskWindow();
            break;
          case "f":
            e.preventDefault();
            toggleSearchReplace();
            break;
          case "w":
            e.preventDefault();
            if (activeWindow) closeWindow(activeWindow);
            break;
        }
      });

      /* ==========================================================
         BIG CANVAS (experimental) — input
         ----------------------------------------------------------
         Four ways in, because no single one is safe on every machine this app
         runs on: drag the empty background, middle-drag anywhere, wheel, and
         the on-screen widget. Ctrl+wheel zooms (which is also what a trackpad
         pinch reports), plain wheel pans.
         ========================================================== */
      let spacePanHeld = false;
      let panPointerId = null;
      let panStart = null;

      function isTextEntry(el) {
        if (!el) return false;
        return (
          el.tagName === "TEXTAREA" ||
          el.tagName === "INPUT" ||
          el.isContentEditable
        );
      }

      (function wireCanvasInput() {
        const layer = document.getElementById("windows");
        if (!layer) return;

        const startPan = (e) => {
          panPointerId = e.pointerId;
          panStart = { x: e.clientX, y: e.clientY, viewX: view.x, viewY: view.y };
          document.body.classList.add("canvas-panning");
          try {
            layer.setPointerCapture(e.pointerId);
          } catch (err) {
            /* the listeners below still track it */
          }
        };

        layer.addEventListener("pointerdown", (e) => {
          if (!view.on) return;
          const middle = e.button === 1;
          // Left-drag pans only on the bare surface. Starting one on a window
          // would fight that window's own drag handler.
          const onBackground = e.target === layer && e.button === 0;
          if (!middle && !onBackground && !(spacePanHeld && e.button === 0)) return;
          e.preventDefault();
          startPan(e);
        });

        layer.addEventListener("pointermove", (e) => {
          if (panPointerId === null || e.pointerId !== panPointerId) return;
          view.x = panStart.viewX + (e.clientX - panStart.x);
          view.y = panStart.viewY + (e.clientY - panStart.y);
          // scheduleView(), not applyView(): pointermove outruns the display,
          // and doing the work per event instead of per frame is what made
          // panning stutter.
          markInteracting();
          scheduleView();
        });

        const endPan = (e) => {
          if (panPointerId === null || (e && e.pointerId !== panPointerId)) return;
          try {
            layer.releasePointerCapture(panPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          panPointerId = null;
          document.body.classList.remove("canvas-panning");
          saveSession();
        };
        layer.addEventListener("pointerup", endPan);
        layer.addEventListener("pointercancel", endPan);

        // Passive:false because both branches preventDefault — otherwise the
        // browser zooms the whole page on Ctrl+wheel and we fight it.
        layer.addEventListener(
          "wheel",
          (e) => {
            if (!view.on) return;
            // deltaMode 1 is lines and 2 is pages; a mouse wheel and a trackpad
            // report wildly different magnitudes in different units, and taking
            // deltaY raw made the same gesture jump on one device and crawl on
            // another.
            const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 100 : 1;
            const dx = e.deltaX * unit;
            const dy = e.deltaY * unit;

            /* A note's textarea, a task list and the log all scroll, so the
               wheel belongs to them — but only while they can actually use it.
               The first version handed the event over whenever the pointer was
               over one of them, so wheeling across a note that had nothing to
               scroll, or was already at its end, did nothing at all: the
               scroller ignored it and the canvas never saw it. A dead patch
               over every note reads as the canvas randomly not responding.
               Now the handover is conditional on there being somewhere to go,
               and the canvas takes over at the end of the scroll. Ctrl always
               means zoom and never hands over. */
            if (!e.ctrlKey) {
              const scroller = e.target.closest(
                "textarea, .task-list, .log-list, .help-content"
              );
              if (scroller) {
                const room = scroller.scrollHeight - scroller.clientHeight;
                const atTop = scroller.scrollTop <= 0;
                const atEnd = scroller.scrollTop >= room - 1;
                const canTakeIt =
                  room > 1 && !((dy < 0 && atTop) || (dy > 0 && atEnd));
                if (canTakeIt) return; // let it scroll natively
              }
            }
            e.preventDefault();
            markInteracting();
            if (e.ctrlKey) {
              // Continuous rather than a fixed 1.15 step per notch: stepping
              // quantised the zoom so a smooth trackpad pinch arrived as a
              // stack of jumps. Exponential so each unit of scroll is the same
              // proportional change at any zoom.
              setZoom(view.zoom * Math.exp(-dy * 0.0015), e.clientX, e.clientY);
              return;
            }
            if (e.shiftKey) view.x -= dy;
            else {
              view.x -= dx;
              view.y -= dy;
            }
            scheduleView();
            debouncedSave(400);
          },
          { passive: false }
        );
      })();

      // Space-to-pan, but only when the caret is not in a text field — this is
      // a notes app, so a textarea is focused most of the time and swallowing
      // the space bar there would be unforgivable.
      document.addEventListener("keydown", (e) => {
        if (e.code !== "Space" || !view.on || spacePanHeld) return;
        // Both the event target and the focused element: the target is the
        // right answer for a real keypress, but checking activeElement too
        // means the caret's location decides this, not how the event was
        // routed. Swallowing a space inside a note would be unforgivable in a
        // notes app, so this errs firmly toward not arming.
        if (isTextEntry(e.target) || isTextEntry(document.activeElement)) return;
        if (e.target.matches && e.target.matches('[role="button"][tabindex]')) return;
        spacePanHeld = true;
        document.body.classList.add("canvas-panning");
      });

      document.addEventListener("keyup", (e) => {
        if (e.code !== "Space") return;
        spacePanHeld = false;
        if (panPointerId === null) document.body.classList.remove("canvas-panning");
      });

      // Ctrl+Shift to match every other shortcut in the app, and to stay clear
      // of the browser's own Ctrl+= / Ctrl+- page zoom.
      document.addEventListener("keydown", (e) => {
        if (!e.ctrlKey || !e.shiftKey || e.altKey || !view.on) return;
        switch (e.key) {
          case "+":
          case "=":
            e.preventDefault();
            zoomBy(1);
            break;
          case "_":
          case "-":
            e.preventDefault();
            zoomBy(-1);
            break;
          case "0":
            e.preventDefault();
            resetView();
            break;
          case "9":
            e.preventDefault();
            zoomToFit();
            break;
        }
      });

      // Header control glyphs are spans acting as buttons; give them Enter and
      // Space so they aren't mouse-only for keyboard users.
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const target = e.target;
        if (!target.matches || !target.matches('[role="button"][tabindex]')) return;
        e.preventDefault();
        target.click();
      });

      // A window parked near an edge could end up unreachable after the
      // viewport shrank; pull everything back into the usable canvas.
      let _resizeTimer = null;
      window.addEventListener("resize", () => {
        if (_resizeTimer) clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(() => {
          // The world is sized from the viewport, so a resize can grow it (it
          // never shrinks) and always invalidates the pan clamp.
          if (view.on) applyView();
          document
            .querySelectorAll(WINDOW_SELECTOR)
            .forEach((el) => clampWindowIntoView(el));
          setMaxDimensions();
          debouncedSave(200);
        }, 150);
      });

      (function logConsoleEasterEgg() {
        try {
          const titleStyle =
            "color:#00d4aa;font-weight:700;font-size:14px;font-family:JetBrains Mono,Consolas,monospace;";
          const hintStyle =
            "color:#8492a6;font-size:12px;font-family:JetBrains Mono,Consolas,monospace;";
          console.log("%cphbeks // cbapp", titleStyle);
          console.log("%cType cbappEgg() to reveal a secret.", hintStyle);
          window.cbappEgg = function () {
            console.log("%cYou found it. Keep building.", titleStyle);
          };
        } catch (e) {
          // Swallow console errors to avoid breaking app flow.
        }
      })();
    </script>
  </body>
</html>
