<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CB App - A browser-based notepad and productivity tool">
    <meta name="theme-color" content="#007bff">
    <!--
      CSP (meta): split by directive so data: cannot load scripts; unused CDN
      allowlists removed; fonts are system-only (no third-party network).
      'unsafe-inline' remains because this single-file app uses inline script
      and onclick handlers. frame-ancestors is not enforced by meta CSP —
      set it via HTTP headers when hosting (see vercel.json).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'self';"
    />
    <title>CB App</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucyA9ICJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgdmlld0JveCA9ICIwIDAgMjQgMjQiPjxwYXRoIGZpbGw9IiMwMDAwMDAiIGQ9Ik0yMC43MSw3LjA0QzIxLjEsNi42NSAyMS4xLDYgMjAuNzEsNS42M0wxOC4zNywzLjI5QzE4LDIuOSAxNy4zNSwyLjkgMTYuOTYsMy4yOUwxNS4xMiw1LjEyTDE4Ljg3LDguODdNMywxNy4yNVYyMUg2Ljc1TDE3LjgxLDkuOTNMMTQuMDYsNi4xOEwzLDE3LjI1WiIvPjwvc3ZnPg=="
    />
    <!-- CB App v4.1.0 — 2026-08-08. See CBAPP-CHANGELOG.md for release history. -->
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
        overflow: hidden;
        transition: background 0.5s ease;
      }
      .light-mode {
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        color: #000;
      }
      .dark-mode {
        background: linear-gradient(135deg, #2c3e50, #1a252f);
        color: #ccc;
      }
      .whiteboard {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .window,
      .calculator,
      .task-window,
      .clock-window,
      .log-window,
      .calendar-window,
      .help-window {
        position: absolute;
        min-width: 350px;
        min-height: 150px;
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        transition: opacity 0.3s ease;
        transform: translate(0, 0);
      }
      /* Drag feedback lives in the UX pass near the end of this stylesheet.
         The old rule here was `opacity: 0.8` on five of the seven window
         types. */
      /* The `.dark-mode X` legacy rules that used to live here outranked the
         token-based system further down purely on specificity (0,0,2,0 beats
         0,0,1,0), so windows were still painting rgba(0,0,0,0.3) over a
         rgba(200,200,200,0.3) border instead of --bg-card / --border. The
         tokens already cover both themes; the overrides only defeated them. */
      /* Legacy controls flex rule removed - now in modern section near header styles */
      /* Legacy close button colors removed - now using modern muted/accent variables */
      .window-content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .textarea-container {
        position: relative;
        display: flex;
        border: 1px solid;
        border-radius: 5px;
        overflow: hidden;
        transition: border-color 0.5s ease;
        resize: both;
        min-width: 350px;
        min-height: 200px;
        width: 350px;
      }
      .line-numbers {
        width: 30px;
        background: rgba(200, 200, 200, 0.5);
        color: #333;
        text-align: right;
        padding: 5px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.5;
        user-select: none;
        border-right: 1px solid #ccc;
        transition: background 0.5s ease;
      }
      textarea {
        flex: 1;
        min-height: 100px;
        min-width: 150px;
        padding: 5px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.5;
        border: none;
        resize: none;
        outline: none;
        background: transparent;
        transition: color 0.5s ease;
        overflow: auto;
      }
      .note-log-input-container {
        display: flex;
        gap: 5px;
      }
      .note-log-input {
        flex: 1;
        padding: 5px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
      }
      .note-log-button {
        padding: 5px 10px;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
        background: rgba(255, 165, 0, 0.5);
        transition: background 0.3s ease;
      }
      .note-log-button:hover {
        background: rgba(255, 165, 0, 0.7);
      }
      .format-buttons {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
      }
      /* Note/T2 only: a divider line separating the log-input row from the
         action buttons. Scoped to .window so the clock/task rows are untouched;
         using border-top (not a separate <hr>) keeps the height inside
         .format-buttons.offsetHeight so updateWindowSize stays accurate. */
      .window .format-buttons {
        border-top: 1px solid var(--border);
        padding-top: 8px;
        margin-top: 2px;
      }
      .counts {
        font-size: 12px;
      }
      .calculator-content,
      .clock-content,
      .log-content {
        padding: 10px;
      }
      .calculator-input,
      .calculator-display,
      .log-input {
        width: 100%;
        padding: 10px;
        font-size: 18px;
        text-align: left;
        border: none;
        background: rgba(255, 255, 255, 0.3);
        color: #000;
        border-radius: 5px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      .calculator-display {
        background: rgba(255, 255, 255, 0.4);
        text-align: right;
      }
      .calculator-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
      .calculator-buttons button,
      .log-input-container button {
        padding: 15px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      .calculator-buttons .number {
        background: rgba(200, 200, 200, 0.5);
      }
      .calculator-buttons .operation,
      .log-input-container button {
        background: rgba(255, 165, 0, 0.5);
      }
      .calculator-buttons .special {
        background: rgba(255, 0, 0, 0.5);
      }
      /* The legacy .operation:hover / .special:hover rules that sat here were
         (0,3,0) and out-specified the token rule `.calculator-buttons
         button:hover` (0,2,1) — but only on `background`, so the modern rule
         still won `color`. Every operator key hovered accent teal on raw
         orange: 1.87:1 in dark mode. The token rules cover both states. */
      /* Legacy .calculator-history / .log-list background rules removed - unified in modern phbeks section */
      .nav-menu {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 8px 15px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        transition: all 0.3s ease;
        width: max-content;
        max-width: none;
        flex-wrap: nowrap;
      }

      /* The download chip owns the bottom-right corner and sits at z-index
         1001, one above the toolbar — so when the toolbar grows wide enough to
         reach it, the chip silently eats the clicks on whatever button is
         underneath. That was Reset at 1280px the moment v4.1.0 added Lock, and
         it would have been Reset again on the next button either way.
         Capping the width is the fix rather than reshuffling buttons: the
         toolbar is centred, so its right edge is centre + width/2, and holding
         the width under (viewport - 2×the corner the chip needs) keeps the two
         apart at every size. Over the cap the nav rows wrap to a third line,
         which is visible and harmless; sliding under an invisible link is
         neither. Not applied below 601px, where the toolbar moves to the top
         of the screen and the collision cannot happen. */
      @media (min-width: 601px) {
        .nav-menu {
          max-width: max(320px, calc(100vw - 440px));
        }
      }

      .nav-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .nav-menu.collapsed {
        width: 40px;
        padding: 8px;
      }
      .nav-menu button,
      .nav-menu a {
        position: relative;
        padding: 0 14px;
        height: 36px;
        font-size: 12px;
        border-radius: 8px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 5px;
        text-decoration: none;
        color: #fff;
        white-space: nowrap;
      }

      .nav-menu .nav-sticky {
        min-width: 140px;
        padding: 0 18px;
      }
      /* Legacy #theme-toggle / #log-toggle colour overrides removed: they
         outranked the unified nav-button styling further down and left LOG
         rendering blue and THEME grey while every sibling was card-coloured. */
      .nav-menu button.active {
        background: #28a745;
      }
      .nav-menu button.active:hover {
        background: #218838;
      }
      .nav-menu button::after,
      .nav-menu a::after {
        display: none;
      }

      #nav-tooltip {
        position: fixed;
        background: rgba(12, 15, 22, 0.92);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.2;
        min-height: 24px;
        min-width: 120px;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 3000;
      }

      #nav-tooltip.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .nav-menu button:hover::after,
      .nav-menu a:hover::after {
        opacity: 1;
      }
      .nav-group {
        display: flex;
        gap: 5px;
        padding: 0 10px;
        border-right: 1px solid rgba(255, 255, 255, 0.2);
      }
      .nav-group:last-child {
        border-right: none;
      }
      .nav-toggle {
        display: none;
        font-size: 18px;
        padding: 5px 10px;
      }
      .nav-menu.collapsed .nav-group,
      .nav-menu.collapsed button:not(.nav-toggle),
      .nav-menu.collapsed a {
        display: none;
      }
      .nav-menu.collapsed .nav-toggle {
        display: block;
      }
      @media (max-width: 600px) {
        .nav-menu {
          top: 5px;
          bottom: auto;
          padding: 5px;
        }
        .nav-menu button,
        .nav-menu a {
          padding: 6px 10px;
          font-size: 11px;
        }
      }
      #status {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        padding: 5px 10px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border-radius: 5px;
        display: none;
        z-index: 2000;
      }
      #search-replace {
        margin-top: 5px;
        display: none;
      }
      #search-replace.active {
        display: block;
      }
      .task-content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .task-input-container {
        display: flex;
        gap: 5px;
      }
      .task-input {
        flex: 1;
        padding: 5px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
      }
      /* Legacy .task-list border/background removed - now handled by modern unified rule */
      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
        font-size: 14px;
      }
      .task-item.completed {
        text-decoration: line-through;
        /* #888 was hardcoded and never themed: 3.54:1 on the white light-mode
           card, so a ticked task was struck through AND under-contrast. */
        color: var(--text-dim);
      }
      .task-item input[type="checkbox"] {
        cursor: pointer;
      }
      .color-palette {
        display: flex;
        gap: 5px;
        margin-top: 5px;
      }
      .color-swatch {
        width: 20px;
        height: 20px;
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid #ccc;
      }
      .color-swatch:hover {
        transform: scale(1.1);
      }
      .clock-content {
        padding: 10px;
        text-align: center;
        font-family: monospace;
      }
      .clock-time {
        font-size: 24px;
        margin-bottom: 5px;
      }
      .clock-date {
        font-size: 14px;
      }
      .log-content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .log-input-container {
        display: flex;
        gap: 5px;
      }
      .log-item {
        padding: 5px;
        font-size: 14px;
        /* White-on-white in light mode: the dividers simply weren't there. */
        border-bottom: 1px solid var(--border);
      }
      .log-item:last-child {
        border-bottom: none;
      }
      .log-item span {
        font-family: monospace;
      }

      .help-content {
        padding: 12px;
        height: calc(100% - 34px);
        overflow: auto;
      }

      /* Help window now inherits the unified scrollbar styles above */

      .help-text {
        margin: 0;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      /* Legacy #log-toggle skin removed - it is a nav button like any other and
         is styled by the unified nav rules (and .active) further down. */

      /* The drawing window was removed: its nav button has been commented out
         for a long time, so the styles and ~120 lines of canvas code behind it
         were unreachable. */

      .sticky-note-window {
        position: absolute;
        background: #ffff88;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        resize: both;
        /* Only the background transitions. Sticky notes were the one window
           type that also animated box-shadow, so the .active accent ring faded
           in and out over 0.3s while the border-color underneath snapped —
           two steps out of sync, which reads as the border pulsing on every
           focus change (loudest in dark mode, where the ring is high contrast
           against the canvas). Every other window snaps; now these do too. */
        transition: background 0.3s ease;
      }


      .sticky-note-header {
        background: rgba(200, 200, 200, 0.5);
        padding: 5px 10px;
        cursor: default;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }


      .sticky-note-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 10px;
        background: rgba(240, 240, 240, 0.9);
        border-bottom: 1px solid #ccc;
      }


      .sticky-note-content {
        width: 100%;
        height: calc(100% - 60px);
        padding: 10px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        border: none;
        outline: none;
        resize: none;
        background: transparent;
        color: #000;
      }

      .task-window {
        resize: both;
        overflow: hidden;
      }

      /* Duplicate legacy .task-list styles removed - modern unified rule at ~1217 handles consistency */
      .countdown-timer-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 15px;
        gap: 8px;
      }
      .countdown-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .countdown-display {
        font-family: monospace;
        font-size: 20px;
        margin-top: 5px;
      }
      .clear-note-container {
        position: absolute;
        left: 18px;
        bottom: 18px;
        z-index: 10;
      }
      .clear-note-button {
        padding: 2px 2px;
        font-size: 8px;
        border-radius: 2px;
        background: #f55;
        color: #fff;
        border: 1px solid #f55;
        cursor: pointer;
        box-shadow: none;
        transition: background 0.2s;
      }
      .clear-note-button--mini {
        height: 16px;
        padding: 0 6px;
        font-size: 8px;
        line-height: 1;
        align-self: center;
        background: #f55;
        color: #fff;
        border: 1px solid #f55;
        box-shadow: none;
      }
      .clear-note-button:hover {
        background: #d22;
        border-color: #d22;
      }
      .note-dropdown {
        display: none;
        position: absolute;
        left: 0;
        bottom: calc(100% + 28px);
        min-width: 180px;
        background: #fff;
        color: #222;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        z-index: 2000;
        padding: 5px 0;
      }
      .note-dropdown .note-dropdown-item {
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
      }
      .nav-tooltip-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.8;
      }
      .nav-tooltip-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
      }
      .nav-tooltip-link,
      .nav-tooltip-empty {
        background: transparent;
        border: 0;
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        text-align: left;
        padding: 0;
        cursor: pointer;
      }
      .nav-tooltip-link:hover {
        color: var(--accent);
      }
      .note-dropdown .note-dropdown-item:hover {
        background: #007bff;
        color: #fff;
      }
      .nav-group {
        position: relative; /* Needed for dropdown positioning */
      }
      /* Legacy minimize-window hard-coded colors removed - now controlled by modern .minimize-window rule using variables */
      .sticky-dropdown {
        display: none;
        position: absolute;
        left: 0;
        bottom: calc(100% + 28px);
        min-width: 180px;
        background: #fff;
        color: #222;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        z-index: 2000;
        padding: 5px 0;
      }
      .sticky-dropdown .note-dropdown-item {
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
      }
      .sticky-dropdown .note-dropdown-item:hover {
        background: #007bff;
        color: #fff;
      }
      .nav-btn-dropdown {
        position: relative;
        display: inline-block;
      }
      .lock-window,
      .sticky-lock-window {
        color: #fa0;
        font-size: 12px;
        cursor: pointer;
        transition: color 0.2s;
      }

      .lock-window:hover,
      .sticky-lock-window:hover {
        color: #c80;
      }

      .lock-window.locked,
      .sticky-lock-window.locked {
        color: #f50;
      }

      /* Phbeks.com visual system overrides */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #0c0f16;
        --bg-card: #141820;
        --bg-card-hover: #1a1f2b;
        --border: #1e2530;
        --accent: #00d4aa;
        --accent-dim: rgba(0, 212, 170, 0.12);
        --blue: #3b82f6;
        --purple: #a855f7;
        --orange: #f59e0b;
        /* #ef4444 measured 4.02:1 on the dark card - the destructive controls
           are the last place to be borderline. */
        --danger: #f87171;
        --danger-solid: #dc2626;
        --text: #e2e8f0;
        --text-dim: #8492a6;
        --text-muted: #4a5568;
        /* System font stack only — no Google Fonts / third-party CSS (privacy,
           offline integrity, and a tighter CSP without font CDNs). */
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "Cascadia Code", "Segoe UI Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
        /* A sticky note defaulted to --bg-card, making it pixel-identical to
           every other window - the one window type whose whole point is that
           you can pick it out at a glance. Warm, solid, high-contrast. */
        --sticky-bg: #2b2718;
        --sticky-text: #f6ecd2;
      }

      .light-mode {
        --bg: #f4f6fb;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --border: #d7dee8;
        /* #0ea5a3 measured ~2.9:1 as text on the light card - it is a fine
           border/glow colour but fails AA for the many places --accent is used
           as a foreground (active titles, links, operator keys). */
        --accent: #115e59;
        --accent-dim: rgba(17, 94, 89, 0.13);
        --danger: #a01818;
        --danger-solid: #b91c1c;
        --blue: #2563eb;
        --purple: #7c3aed;
        --orange: #f59e0b;
        --text: #0f172a;
        --text-dim: #475569;
        --text-muted: #64748b;
        --sticky-bg: #fff6c9;
        --sticky-text: #3b3210;
      }

      body,
      .light-mode,
      .dark-mode {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
      }

      /* The app never styled ::placeholder at all, so every prompt in it fell
         through to the UA default (#757575) in BOTH themes — 3.86:1 on the dark
         card the app boots into, 3.24:1 on a dark sticky note. --text-dim
         measures 5.6:1 dark / 7.5:1 light, and 4.7:1 / 7.0:1 on the sticky
         note's own background. opacity is reset for Firefox, which dims
         placeholders by default. */
      ::placeholder {
        color: var(--text-dim);
        opacity: 1;
      }

      /* Tells the UA which way scrollbars, spinners and other native widget
         chrome should render. Without it Chromium drew light-mode controls over
         the dark theme. */
      .dark-mode {
        color-scheme: dark;
      }
      .light-mode {
        color-scheme: light;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      .window,
      .calculator,
      .task-window,
      .clock-window,
      .log-window,
      .calendar-window,
      .sticky-note-window {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        color: var(--text);
      }

      .window:hover,
      .calculator:hover,
      .task-window:hover,
      .clock-window:hover,
      .log-window:hover,
      .calendar-window:hover,
      .sticky-note-window:hover {
        border-color: var(--accent);
      }

      .window-header,
      .calculator-header,
      .task-header,
      .clock-header,
      .log-header,
      .calendar-header,
      .help-header,
      .sticky-note-header {
        background: var(--bg-card-hover);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .window-controls,
      .calculator-controls,
      .task-controls,
      .clock-controls,
      .log-controls,
      .calendar-controls,
      .sticky-note-controls {
        display: flex;
        gap: 5px;
      }

      /* WCAG 2.5.8 (AA): 24x24 minimum for a pointer target. These were glyph-
         sized boxes — the lock 22x22 and the close "×" only 9px wide, because a
         thin text glyph is as wide as the character — so every window's title bar
         asked for pixel-accurate aim. The glyphs are unchanged; only the box they
         sit in grows, and it grows sideways and into the header's existing
         padding rather than making the bar taller. */
      .window-controls > *,
      .calculator-controls > *,
      .task-controls > *,
      .clock-controls > *,
      .log-controls > *,
      .calendar-controls > *,
      .sticky-note-controls > * {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        min-height: 24px;
      }

      .window-title,
      .calculator-title,
      .task-title,
      .clock-title,
      .log-title,
      .calendar-title,
      .help-title,
      .sticky-note-title {
        font-weight: 600;
        letter-spacing: 0.04em;
        font-size: 12px;
        text-transform: uppercase;
      }

      .textarea-container {
        border-color: var(--border);
        background: var(--bg-card);
        border-radius: 12px;
      }

      .line-numbers {
        background: var(--bg-card-hover);
        border-right-color: var(--border);
        /* --text-muted measured 2.19:1 dark / 3.46:1 light against the gutter;
           these are numbers people actually read. */
        color: var(--text-dim);
        font-family: var(--mono);
      }

      textarea,
      .sticky-note-content {
        color: var(--text);
        font-family: var(--mono);
      }

      .note-log-input,
      .task-input,
      .calculator-input,
      .calculator-display,
      .log-input,
      .cal-content input[type="text"],
      .cal-content input[type="date"],
      .cal-content input[type="time"],
      .cal-content input[type="number"],
      .cal-content select,
      #search-replace input {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
      }

      .calculator-display {
        background: var(--bg-card-hover);
      }

      /* .today-events / .events-section used to be listed here — dead CSS from
         the calendar deleted in v3.0. The v4 calendar uses .cal-* classes. */
      .calculator-history,
      .log-list,
      .task-list {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 8px;   /* normalized with other inner panels */
      }

      .nav-menu {
        background: rgba(20, 24, 32, 0.92);
        border: 1px solid var(--border);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        border-radius: 14px;
      }

      .light-mode .nav-menu {
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      }

      .light-mode .nav-menu button,
      .light-mode .nav-menu a,
      .dark-mode .nav-menu button,
      .dark-mode .nav-menu a {
        background: var(--bg-card);
        color: var(--text);
      }

      button,
      .nav-menu button,
      .nav-menu a,
      .calculator-buttons button,
      .log-input-container button,
      .note-log-button,
      .format-buttons button,
      #search-replace button,
      .clear-note-button {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--font);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 8px 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.2s;
      }

      .nav-menu button:hover,
      .nav-menu a:hover,
      .calculator-buttons button:hover,
      .log-input-container button:hover,
      .note-log-button:hover,
      .format-buttons button:hover,
      #search-replace button:hover,
      .clear-note-button:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--bg-card-hover);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        transform: translateY(-1px);
      }

      .calculator-buttons .operation,
      .log-input-container button,
      .note-log-button {
        background: var(--accent-dim);
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      }

      /* An id-specificity rule for #theme-toggle / #log-toggle /
         #calculator-toggle / #clock-toggle / #search-btn used to sit here. It
         existed only to neutralise the legacy skins those buttons carried, and
         those were deleted in v3.0 — but at (0,1,0,0) it also outranked
         `.nav-menu button:hover` (0,0,2,0) and `.nav-menu button.active`, so
         Calc, Clock, Log, Theme and Search stayed plain on hover while Note,
         Tasks and T2 highlighted. Removed: the shared nav rules already give
         every toolbar button the same resting, hover and active styling. */

      .calculator-buttons .special,
      .clear-note-button {
        background: color-mix(in srgb, var(--danger) 16%, transparent);
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
        text-transform: none;
        font-size: 0.7rem;
        padding: 6px 12px;
      }

      /* White on #ef4444 is 3.3:1; --danger-solid clears AA in both themes. */
      .clear-note-button,
      .clear-note-button.clear-note-button--mini {
        background: var(--danger-solid);
        color: #fff;
        border-color: var(--danger-solid);
        box-shadow: none;
      }

      .clear-note-button:hover,
      .clear-note-button.clear-note-button--mini:hover {
        background: #991b1b;
        border-color: #991b1b;
        color: #fff;
        transform: none;
      }

      /* Was a hard-coded dark-theme teal wash, which read as a stray blue tint
         against the light palette. */
      .nav-menu button.active,
      #log-toggle.active {
        background: var(--accent-dim);
        color: var(--accent);
        border-color: var(--accent);
      }

      /* Lock is the one toolbar control meant to be hit in a hurry — someone
         has walked up behind you and the notes are on screen. It is found by
         colour before it is found by reading, so it carries the solid danger
         red in both themes rather than the shared card fill. The theme rules
         above are (0,0,3,0); adding .nav-lock puts these at (0,0,4,0) so they
         win without an id or !important, and the same trick keeps the green
         .active fill off it. --danger-solid, not --danger: white on the
         lighter red is 3.3:1, which misses AA. */
      .nav-menu button.nav-lock,
      .light-mode .nav-menu button.nav-lock,
      .dark-mode .nav-menu button.nav-lock,
      .nav-menu button.nav-lock.active {
        background: var(--danger-solid);
        border-color: var(--danger-solid);
        color: #fff;
      }

      .nav-menu button.nav-lock:hover {
        background: #991b1b;
        border-color: #991b1b;
        color: #fff;
        transform: none;
      }

      .nav-menu button.nav-lock:focus-visible {
        outline: 2px solid var(--danger-solid);
        outline-offset: 2px;
      }

      .nav-menu button::after,
      .nav-menu a::after {
        font-family: var(--mono);
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-dim);
      }

      .nav-group {
        border-right-color: var(--border);
      }

      #status {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
      }

      .note-dropdown,
      .sticky-dropdown {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 12px;
      }

      .note-dropdown .note-dropdown-item:hover,
      .sticky-dropdown .note-dropdown-item:hover {
        background: var(--accent-dim);
        color: var(--accent);
      }


      .sticky-note-window {
        background: var(--sticky-bg);
        border-color: var(--border);
      }

      /* The header and toolbar are translucent washes rather than fixed
         colours, so they stay legible against whatever background colour the
         user picks in the swatch, not just the default. */
      .sticky-note-header,
      .sticky-note-toolbar {
        background: rgba(0, 0, 0, 0.16);
        border-bottom-color: rgba(0, 0, 0, 0.18);
        color: inherit;
      }

      .dark-mode .sticky-note-header,
      .dark-mode .sticky-note-toolbar {
        background: rgba(255, 255, 255, 0.07);
        border-bottom-color: rgba(255, 255, 255, 0.12);
      }

      /* Only the note itself carries a colour; everything inside inherits it.
         Giving the label and textarea their own `color` declarations meant an
         inline colour set on the note could never reach them (inheritance
         loses to a matching rule), so a custom text colour left the toolbar
         and title on the theme token — unreadable on a custom background. */
      .sticky-note-window {
        color: var(--sticky-text);
      }

      .sticky-note-toolbar label,
      .sticky-note-window .sticky-note-content,
      .sticky-note-window .sticky-note-title {
        color: inherit;
      }

      /* The active-window accent is skipped on a recoloured note — teal on an
         arbitrary user background is a contrast gamble the ring already covers. */
      .sticky-note-window[data-custom-color="true"].active > * > .sticky-note-title {
        color: inherit;
      }

      .sticky-note-window .edit-window,
      .sticky-note-window .minimize-window,
      .sticky-note-window .close-sticky-note,
      .sticky-note-window .sticky-lock-window {
        color: inherit;
        opacity: 0.85;
      }

      .sticky-note-window .edit-window:hover,
      .sticky-note-window .minimize-window:hover,
      .sticky-note-window .close-sticky-note:hover,
      .sticky-note-window .sticky-lock-window:hover {
        opacity: 1;
      }

      /* Locked stays legible but unmistakable against the note's own colours. */
      .sticky-note-window .sticky-lock-window.locked {
        color: #b91c1c;
        opacity: 1;
      }

      .dark-mode .sticky-note-window .sticky-lock-window.locked {
        color: #fca5a5;
      }

      /* The two swatch labels rendered at default body size, so a colour
         picker nobody uses twice a session dominated the note. */
      .sticky-note-toolbar {
        gap: 8px;
        padding: 6px 12px;
        font-size: 11px;
      }

      .sticky-note-toolbar label {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.9;
      }

      .sticky-note-toolbar input[type="color"] {
        width: 28px;
        height: 20px;
        padding: 0 2px;
        cursor: pointer;
      }

      /* Copy is the common action, so it sits first. Reset is the escape hatch:
         a note recoloured dark then viewed in light mode (or vice versa) would
         otherwise be unreadable with no way back. Both inherit currentColor so
         they stay legible against a custom note background. */
      .sticky-toolbar-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .sticky-note-toolbar .sticky-copy,
      .sticky-note-toolbar .sticky-reset-colors {
        background: transparent;
        border: 1px solid currentColor;
        color: inherit;
        /* 0.7 measured 3.94:1 in light mode */
        opacity: 0.88;
        font-size: 9px;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 999px;
      }

      .sticky-note-toolbar .sticky-copy:hover,
      .sticky-note-toolbar .sticky-reset-colors:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.12);
        color: inherit;
        border-color: currentColor;
        transform: none;
        box-shadow: none;
      }

      .dark-mode .sticky-note-toolbar .sticky-copy:hover,
      .dark-mode .sticky-note-toolbar .sticky-reset-colors:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .sticky-note-toolbar input[type="color"],
      .clock-window input[type="number"],
      .clock-window select {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 4px 6px;
        font-family: var(--mono);
      }

      .dark-mode .sticky-note-toolbar input[type="color"] {
        background: #0f131a;
      }

      .light-mode .sticky-note-toolbar input[type="color"] {
        background: #ffffff;
      }

      .window-content {
        position: relative;
        padding-bottom: 32px;
      }

      .clear-note-container {
        position: static;
        margin-top: 8px;
        align-self: flex-start;
      }

      /* A window belonging to the other desk. Deliberately a class and not
         style.display, which is the minimise flag: a window minimised on the
         canvas has to come back minimised when you return to the canvas, so
         the two states must not share a channel. !important because the
         window types set display in their own rules (.clock-window is flex),
         and minimise writes it inline. */
      .mode-hidden {
        display: none !important;
      }

      .clock-window {
        display: flex;
        flex-direction: column;
      }

      .clock-content {
        flex: 1;
        overflow: auto;
        padding: 20px;
        margin: 0 10px;
      }

      .clock-content > * {
        margin-bottom: 12px;
      }

      .clock-content > *:last-child {
        margin-bottom: 0;
      }

      .clock-content .timezone-times {
        margin: 12px 0 16px;
      }

      .clock-content .format-buttons {
        margin-bottom: 16px;
      }

      /* These two rules described a countdown inside .clock-content and had
         been inert since it was moved out to a sibling — moving it back in
         (below) switched them on for the first time, and between the wider gap
         and 8px on each side of both number inputs the row no longer fit,
         wrapping Reset onto a line of its own. The base .countdown-controls
         rule is the one that was actually keeping it on a single row, so let
         it. Only the top margin is wanted here. */
      .clock-content .countdown-controls {
        margin-top: 12px;
        padding-bottom: 6px;
      }

      .clock-content select {
        margin: 0 8px;
      }

      /* Inside .clock-content since v3.2.9 — it used to be a sibling below the
         flex:1 scroller, so every pixel the window was taller than its content
         opened as dead space between the stopwatch buttons and this block.
         The scroller's own padding covers it now. */
      .clock-content .countdown-timer-container {
        padding: 0;
        margin-top: 0;
      }

      /* Unified custom scrollbar styling - clock is the reference */
      .clock-content,
      .help-content,
      textarea,
      .t2-textarea,
      .sticky-note-content,
      .task-list,
      .log-list,
      .calculator-history,
      .t2-window .textarea-container,
      .nav-tooltip-list {
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 212, 170, 0.6) rgba(20, 24, 32, 0.7);
      }

      .clock-content::-webkit-scrollbar,
      .help-content::-webkit-scrollbar,
      textarea::-webkit-scrollbar,
      .t2-textarea::-webkit-scrollbar,
      .sticky-note-content::-webkit-scrollbar,
      .task-list::-webkit-scrollbar,
      .log-list::-webkit-scrollbar,
      .calculator-history::-webkit-scrollbar,
      .t2-window .textarea-container::-webkit-scrollbar,
      .nav-tooltip-list::-webkit-scrollbar {
        width: 10px;
      }

      .clock-content::-webkit-scrollbar-track,
      .help-content::-webkit-scrollbar-track,
      textarea::-webkit-scrollbar-track,
      .t2-textarea::-webkit-scrollbar-track,
      .sticky-note-content::-webkit-scrollbar-track,
      .task-list::-webkit-scrollbar-track,
      .log-list::-webkit-scrollbar-track,
      .calculator-history::-webkit-scrollbar-track,
      .t2-window .textarea-container::-webkit-scrollbar-track,
      .nav-tooltip-list::-webkit-scrollbar-track {
        background: rgba(20, 24, 32, 0.7);
        border-radius: 10px;
      }

      .clock-content::-webkit-scrollbar-thumb,
      .help-content::-webkit-scrollbar-thumb,
      textarea::-webkit-scrollbar-thumb,
      .t2-textarea::-webkit-scrollbar-thumb,
      .sticky-note-content::-webkit-scrollbar-thumb,
      .task-list::-webkit-scrollbar-thumb,
      .log-list::-webkit-scrollbar-thumb,
      .calculator-history::-webkit-scrollbar-thumb,
      .t2-window .textarea-container::-webkit-scrollbar-thumb,
      .nav-tooltip-list::-webkit-scrollbar-thumb {
        background: rgba(0, 212, 170, 0.6);
        border-radius: 10px;
        border: 2px solid rgba(20, 24, 32, 0.8);
      }

      .clock-content::-webkit-scrollbar-thumb:hover,
      .help-content::-webkit-scrollbar-thumb:hover,
      textarea::-webkit-scrollbar-thumb:hover,
      .t2-textarea::-webkit-scrollbar-thumb:hover,
      .sticky-note-content::-webkit-scrollbar-thumb:hover,
      .task-list::-webkit-scrollbar-thumb:hover,
      .log-list::-webkit-scrollbar-thumb:hover,
      .calculator-history::-webkit-scrollbar-thumb:hover,
      .t2-window .textarea-container::-webkit-scrollbar-thumb:hover,
      .nav-tooltip-list::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 212, 170, 0.8);
      }

      .light-mode .clock-content,
      .light-mode .help-content,
      .light-mode textarea,
      .light-mode .t2-textarea,
      .light-mode .sticky-note-content,
      .light-mode .task-list,
      .light-mode .log-list,
      .light-mode .calculator-history,
      .light-mode .t2-window .textarea-container,
      .light-mode .nav-tooltip-list {
        scrollbar-color: rgba(14, 165, 163, 0.6) rgba(226, 232, 240, 0.9);
      }

      .light-mode .clock-content::-webkit-scrollbar-track,
      .light-mode .help-content::-webkit-scrollbar-track,
      .light-mode textarea::-webkit-scrollbar-track,
      .light-mode .t2-textarea::-webkit-scrollbar-track,
      .light-mode .sticky-note-content::-webkit-scrollbar-track,
      .light-mode .task-list::-webkit-scrollbar-track,
      .light-mode .log-list::-webkit-scrollbar-track,
      .light-mode .calculator-history::-webkit-scrollbar-track,
      .light-mode .t2-window .textarea-container::-webkit-scrollbar-track,
      .light-mode .nav-tooltip-list::-webkit-scrollbar-track {
        background: rgba(226, 232, 240, 0.9);
      }

      .light-mode .clock-content::-webkit-scrollbar-thumb,
      .light-mode .help-content::-webkit-scrollbar-thumb,
      .light-mode textarea::-webkit-scrollbar-thumb,
      .light-mode .t2-textarea::-webkit-scrollbar-thumb,
      .light-mode .sticky-note-content::-webkit-scrollbar-thumb,
      .light-mode .task-list::-webkit-scrollbar-thumb,
      .light-mode .log-list::-webkit-scrollbar-thumb,
      .light-mode .calculator-history::-webkit-scrollbar-thumb,
      .light-mode .t2-window .textarea-container::-webkit-scrollbar-thumb,
      .light-mode .nav-tooltip-list::-webkit-scrollbar-thumb {
        background: rgba(14, 165, 163, 0.6);
        border: 2px solid rgba(226, 232, 240, 0.9);
      }

      .light-mode .clock-content::-webkit-scrollbar-thumb:hover,
      .light-mode .help-content::-webkit-scrollbar-thumb:hover,
      .light-mode textarea::-webkit-scrollbar-thumb:hover,
      .light-mode .t2-textarea::-webkit-scrollbar-thumb:hover,
      .light-mode .sticky-note-content::-webkit-scrollbar-thumb:hover,
      .light-mode .task-list::-webkit-scrollbar-thumb:hover,
      .light-mode .log-list::-webkit-scrollbar-thumb:hover,
      .light-mode .calculator-history::-webkit-scrollbar-thumb:hover,
      .light-mode .t2-window .textarea-container::-webkit-scrollbar-thumb:hover,
      .light-mode .nav-tooltip-list::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 163, 0.85);
      }

      .task-list:empty {
        border-color: transparent;
        background: transparent;
        padding: 0;
      }

      .calculator-history:empty {
        border-color: transparent;
        background: transparent;
        padding: 0;
      }

      .minimize-window:hover,
      .edit-window:hover,
      .close-window:hover,
      .close-calculator:hover,
      .close-task:hover,
      .close-clock:hover,
      .close-log:hover,
      .close-calendar:hover {
        color: var(--accent);
      }

      .minimize-window,
      .edit-window,
      .close-window,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log,
      .close-calendar {
        color: var(--text-muted);
      }

      /* The close glyph is a thin text "×" that reads smaller than its emoji
         siblings; nudge it up so it's an easier hit target without dominating. */
      .close-window,
      .close-sticky-note,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log,
      .close-calendar {
        font-size: 19px;
        line-height: 1;
      }

      /* These header control glyphs are text nodes, so the default `cursor: auto`
         resolves to the text I-beam on hover. Force the normal arrow instead. */
      .edit-window,
      .minimize-window,
      .close-window,
      .close-sticky-note,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log,
      .close-calendar {
        cursor: default;
      }

      .lock-window,
      .sticky-lock-window {
        color: var(--orange);
      }

      .lock-window.locked,
      .sticky-lock-window.locked {
        color: var(--danger);
      }

      .clock-content,
      .log-item span,
      .countdown-display {
        font-family: var(--mono);
      }

      .help-window {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        color: var(--text);
      }

      .help-header {
        background: var(--bg-card-hover);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        padding: 8px 12px;
      }

      .help-content {
        background: var(--bg-card);
        color: var(--text);
      }

      .help-text {
        color: var(--text-dim);
      }

      /* ==========================================================
         UX pass — everything below intentionally sits last so it
         wins on cascade order over the legacy rules above.
         ========================================================== */

      /* --- Focus: which window do Copy/Paste/Search act on? ---
         setActiveWindow() has always set .active, but nothing ever drew it.
         Hover is demoted to a neutral tint so it stops impersonating focus. */
      .window:hover,
      .calculator:hover,
      .task-window:hover,
      .clock-window:hover,
      .log-window:hover,
      .calendar-window:hover,
      .sticky-note-window:hover,
      .help-window:hover {
        border-color: var(--text-muted);
      }

      .window.active,
      .calculator.active,
      .task-window.active,
      .clock-window.active,
      .log-window.active,
      .calendar-window.active,
      .sticky-note-window.active,
      .help-window.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent), 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .active > .window-header,
      .active > .calculator-header,
      .active > .task-header,
      .active > .clock-header,
      .active > .log-header,
      .active > .calendar-header,
      .active > .help-header,
      .active > .sticky-note-header {
        background: var(--accent-dim);
      }

      .active > * > .window-title,
      .active > * > .calculator-title,
      .active > * > .task-title,
      .active > * > .clock-title,
      .active > * > .log-title,
      .active > * > .calendar-title,
      .active > * > .help-title,
      .active > * > .sticky-note-title,
      .active > .window-header > .window-title {
        color: var(--accent);
      }

      /* --- Keyboard accessibility: nothing had a focus ring at all. --- */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* --- Header control glyphs ---
         --text-muted on --bg-card is ~2.4:1, well under WCAG AA, and the
         glyphs are buttons so they need a pointer, not the default arrow. */
      .minimize-window,
      .edit-window,
      .close-window,
      .close-sticky-note,
      .close-calculator,
      .close-task,
      .close-clock,
      .close-log,
      .close-calendar,
      .lock-window,
      .sticky-lock-window {
        color: var(--text-dim);
        cursor: pointer;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        transition: color 0.15s ease, background 0.15s ease;
      }

      .minimize-window:hover,
      .edit-window:hover,
      .close-window:hover,
      .close-sticky-note:hover,
      .close-calculator:hover,
      .close-task:hover,
      .close-clock:hover,
      .close-log:hover,
      .close-calendar:hover {
        color: var(--accent);
        background: var(--accent-dim);
      }

      .close-window:hover,
      .close-sticky-note:hover,
      .close-calculator:hover,
      .close-task:hover,
      .close-clock:hover,
      .close-log:hover,
      .close-calendar:hover {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 16%, transparent);
      }

      /* --- Nav bar --- */
      /* The ☰ collapse control is a small-screen affordance. A later
         `display: inline-flex` on all buttons was un-hiding it on desktop,
         where clicking it collapsed the whole toolbar into a 40px pill. */
      .nav-menu .nav-toggle {
        display: none;
      }

      .nav-menu.collapsed .nav-toggle {
        display: inline-flex;
      }

      /* The tooltip hard-coded a near-black panel but took its text colour from
         --text, which in light mode is also near-black - unreadable. Both now
         come from the theme. */
      #nav-tooltip {
        max-width: min(320px, calc(100vw - 24px));
        white-space: normal;
        overflow-wrap: anywhere;
        background: var(--bg-card);
        color: var(--text);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      .light-mode #nav-tooltip {
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
      }

      /* No wash at all any more. This was a flat rgba(0,0,0,0.2), then a themed
         --bg-card-hover, and both had the same flaw: `textarea` and
         `.sticky-note-content` are `background: transparent`, so painting the
         readOnly state *replaced* whatever showed through — on a sticky note that
         is the note's own colour, including a custom one the user picked. Locking
         a yellow note turned it grey. Freezing is not a repaint; the cursor and
         the frozen message say it instead. */
      textarea[readonly],
      .sticky-note-content[readonly] {
        cursor: not-allowed;
      }

      .nav-tooltip-list {
        max-height: 210px;
        overflow-y: auto;
      }

      /* --- Status toast ---
         Was `bottom: 50px`, i.e. directly behind the bottom-centre nav menu,
         so every status message was invisible. Anchored opposite the nav. */
      #status {
        top: 18px;
        bottom: auto;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        z-index: 2500;
        margin: 0;
        pointer-events: none;
      }

      #status.showing {
        animation: status-in 0.18s ease-out;
      }

      /* The search panel occupies the same top-centre slot; drop the toast
         below it rather than letting the two stack on top of each other. */
      #search-replace.active ~ #status {
        top: 76px;
      }

      @keyframes status-in {
        from {
          opacity: 0;
          transform: translate(-50%, -8px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #status.showing {
          animation: none;
        }
        * {
          transition-duration: 0.01ms !important;
        }
      }

      /* --- App alert ---
         One card for every message the app must not lose: the countdown
         finishing (v3.2.17) and now calendar reminders (v4.0.0). The countdown
         used to end in an OS notification, which is the wrong surface for this
         app: it needs a permission the app never asks for, it is silently
         dropped under file:// in some browsers, and on a managed machine it
         leaks "CB App" into the desktop. This stays put until it is dismissed,
         so an alert that fires while you are in another tab is still there when
         you come back (unlike the 3s #status toast). Static by design: no
         pulse, no flash.

         Dead centre of the viewport, not the top-centre strip the toast and the
         search panel share: these are the messages you asked for and must not
         miss, and the eye lands in the middle. It also means no stacking rules
         against #status or #search-replace. */
      #app-alert {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2600;
        max-width: calc(100vw - 32px);
        padding: 18px 20px;
        border-radius: 14px;
        border: 1px solid var(--accent);
        background: var(--bg-card);
        color: var(--text);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
        font-family: var(--font);
        font-size: 14px;
      }

      #app-alert.showing {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      #app-alert .app-alert-icon {
        font-size: 26px;
        line-height: 1;
      }

      #app-alert .app-alert-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      #app-alert .app-alert-title {
        font-weight: 600;
        font-size: 16px;
        color: var(--accent);
        letter-spacing: 0.02em;
      }

      /* pre-line, because the catch-up card lists one reminder per line and the
         detail is set with textContent — user text never goes through innerHTML. */
      #app-alert .app-alert-detail {
        color: var(--text-dim);
        font-size: 13px;
        white-space: pre-line;
        /* An event title can be 200 characters with no spaces. .cal-event-title
           and .cal-event-note already break anywhere; this was the one place a
           title lands without it, and overflow-y:auto means it clips sideways. */
        overflow-wrap: anywhere;
        max-height: 40vh;
        overflow-y: auto;
      }

      #app-alert .app-alert-actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }

      /* The per-alert buttons live in their own span so showAppAlert() can empty
         it without touching Mute and Dismiss; display:contents keeps them in the
         same flex row as those two. */
      #app-alert .app-alert-extra {
        display: contents;
      }

      #app-alert button {
        font-family: var(--mono);
        font-size: 12px;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-card-hover);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
      }

      #app-alert button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      #app-alert button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Narrow screens: the icon/text/buttons row has nowhere to go sideways,
         so it stacks instead of squeezing the buttons to nothing. */
      @media (max-width: 480px) {
        #app-alert.showing {
          flex-wrap: wrap;
        }

        #app-alert .app-alert-actions {
          margin-left: 40px;
          width: 100%;
        }
      }

      /* --- Frozen windows ---
         Freezing must not repaint a window: the border and background belong to
         the note, and a frozen sticky that loses its colour or grows an outline
         is a worse bug than the silence this was meant to cure. The cursor is
         the only global signal — it costs no pixels — and the spoken message in
         wireFrozenFeedback() carries the rest.

         v3.2.18 shipped `border-style: dashed` on every readOnly field in a
         frozen window and it went wrong twice. `.sticky-note-content` and
         `textarea` declare `border: none`, which resets the *width* to the
         initial `medium` — so revealing the style painted a 3px dashed frame out
         of nowhere. And `:read-only` matches far more than text fields: every
         checkbox, colour swatch and select in the app is permanently read-only
         by that definition, so they were all outlined too. */
      [data-locked="true"] input:read-only,
      [data-locked="true"] textarea:read-only,
      [data-locked="true"] button:disabled,
      [data-locked="true"] select:disabled {
        cursor: not-allowed;
      }

      /* The one place a dashed frame is wanted: the countdown fields carry a
         real 1px border of their own, they are the controls that started this
         whole report, and a number box that refuses digits deserves to look
         like it will. */
      [data-locked="true"] .countdown-field input {
        border-style: dashed;
      }

      /* --- Notes ---
         .window-content reserved 32px for a .clear-note-container that no
         longer lives there (Clear moved into .format-buttons), leaving a dead
         gap under every note. */
      .window-content {
        padding-bottom: 10px;
      }

      /* --- Sticky notes ---
         Content was calc(100% - 60px) against a ~33px header plus a ~40px
         toolbar, so the textarea overflowed past the bottom of the note.
         Flex layout removes the hard-coded arithmetic entirely. */
      .sticky-note-window {
        display: flex;
        flex-direction: column;
      }

      .sticky-note-header,
      .sticky-note-toolbar {
        flex: 0 0 auto;
      }

      .sticky-note-content {
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
      }

      /* --- Task list --- */
      .task-window {
        display: flex;
        flex-direction: column;
      }

      .task-content {
        flex: 1 1 auto;
        min-height: 0;
      }

      .task-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
      }

      /* An empty task list read as a large unexplained void with a red
         destructive button floating in the middle of it. */
      .task-list:empty::before {
        content: "No tasks yet — add one above.";
        display: block;
        padding: 18px 6px;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }

      .task-list:empty {
        border-color: var(--border);
        background: var(--bg-card);
      }

      .task-item {
        border-radius: 6px;
        gap: 8px;
      }

      .task-item:hover {
        background: var(--bg-card-hover);
      }

      .task-item span {
        flex: 1;
        overflow-wrap: anywhere;
      }

      .task-item .task-delete {
        opacity: 0;
        color: var(--text-muted);
        background: transparent;
        border: 0;
        padding: 2px 6px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: opacity 0.15s ease, color 0.15s ease;
      }

      .task-item:hover .task-delete,
      .task-delete:focus-visible {
        opacity: 1;
      }

      .task-item .task-delete:hover {
        color: var(--danger);
      }

      .task-window .format-buttons {
        justify-content: flex-end;
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }

      /* --- Touch dragging ---
         Without touch-action:none the browser claims the gesture for panning
         and never delivers pointermove, so a title bar can be pressed but not
         dragged. Scoped to the title bars so content still scrolls normally. */
      .window-header,
      .task-header,
      .clock-header,
      .log-header,
      .calendar-header,
      .calculator-header,
      .help-header,
      .sticky-note-header {
        touch-action: none;
        cursor: grab;
        user-select: none;
      }

      .dragging > .window-header,
      .dragging > .task-header,
      .dragging > .clock-header,
      .dragging > .log-header,
      .dragging > .calendar-header,
      .dragging > .calculator-header,
      .dragging > .help-header,
      .dragging > .sticky-note-header {
        cursor: grabbing;
      }

      /* --- Drag feedback ---
         This used to be `opacity: 0.8` alone, which only ever read as a drag
         cue by accident. Compositing a white window over the light canvas at
         0.8 lands on rgb(253,253,254) — a 2/255 shift, invisible — so in light
         mode the only visible effect was windows underneath bleeding through,
         which looks like a rendering fault rather than "picked up". Dark mode
         got away with it because light text dims noticeably on a dark ground.
         A lift reads identically in both themes, so the ring and the scale do
         the load-bearing work and the opacity is free to go properly
         translucent — 0.8 in both themes, enough that the canvas reads through
         a window in flight. It also covers sticky notes and the help window,
         which the original rule omitted entirely. */
      .window.dragging,
      .calculator.dragging,
      .task-window.dragging,
      .clock-window.dragging,
      .log-window.dragging,
      .calendar-window.dragging,
      .sticky-note-window.dragging,
      .help-window.dragging {
        opacity: 0.8;
        transform: scale(1.015);
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent), 0 30px 60px rgba(0, 0, 0, 0.5);
        /* Don't animate the lift — a transition here lags the cursor. */
        transition: none;
      }

      .light-mode .window.dragging,
      .light-mode .calculator.dragging,
      .light-mode .task-window.dragging,
      .light-mode .clock-window.dragging,
      .light-mode .log-window.dragging,
      .light-mode .calendar-window.dragging,
      .light-mode .sticky-note-window.dragging,
      .light-mode .help-window.dragging {
        box-shadow: 0 0 0 1px var(--accent), 0 30px 60px rgba(15, 23, 42, 0.32);
      }

      @media (prefers-reduced-motion: reduce) {
        .dragging {
          transform: none !important;
        }
      }

      [data-locked="true"] > .window-header,
      [data-locked="true"] > .task-header,
      [data-locked="true"] > .clock-header,
      [data-locked="true"] > .log-header,
      [data-locked="true"] > .calendar-header,
      [data-locked="true"] > .calculator-header,
      [data-locked="true"] > .help-header,
      [data-locked="true"] > .sticky-note-header {
        cursor: default;
      }

      /* Native resize corners are effectively unusable with a finger. */
      @media (pointer: coarse) {
        .window,
        .task-window,
        .clock-window,
        .log-window,
        .calendar-window,
        .calculator,
        .sticky-note-window,
        .help-window,
        /* The note's real resize handle is on its container, which this rule
           always missed — so a touch device still showed one unusable native
           corner. The grip above replaces it. */
        .textarea-container {
          resize: none;
        }
      }

      /* --- Locked windows ---
         Locking now disables the controls inside any window type, so they need
         to read as unavailable rather than merely unresponsive. */
      button:disabled,
      input:disabled,
      select:disabled,
      textarea:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button:disabled:hover,
      .format-buttons button:disabled:hover,
      .calculator-buttons button:disabled:hover,
      .note-log-button:disabled:hover,
      .clear-note-button:disabled:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--border);
        color: inherit;
        background: inherit;
      }

      [data-locked="true"] .task-item:hover {
        background: transparent;
      }

      [data-locked="true"] .task-delete {
        display: none;
      }

      /* --- Calculator ---
         .calculator-buttons .number (0,0,2,0) outranked the shared button
         styling, so the digit keys stayed a flat light grey in dark mode while
         every other control was themed. */
      .calculator-buttons .number {
        background: var(--bg-card-hover);
        color: var(--text);
        border-color: var(--border);
      }

      .calculator-buttons .number:hover {
        background: var(--bg-card);
        border-color: var(--accent);
        color: var(--accent);
      }

      /* --- Clock ---
         The countdown row was bare " m" / " s" text nodes next to fixed-width
         inputs, which sat at different baselines and read as noise. */
      .countdown-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .countdown-field input[type="number"] {
        width: 62px;
        text-align: center;
      }

      .countdown-field span {
        font-family: var(--mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }

      .countdown-controls {
        flex-wrap: wrap;
        justify-content: center;
      }

      /* The countdown block is fixed-height chrome at the foot of the clock;
         only the scrolling region above it should absorb spare space. */
      .countdown-timer-container {
        flex: 0 0 auto;
      }

      /* --- Log --- */
      .log-window {
        display: flex;
        flex-direction: column;
      }

      /* --- Calendar (v4.0.0) ---
         Column layout with exactly one scroller (.cal-lower): the month grid is
         fixed chrome and must never be the thing that scrolls away, which is the
         mistake the clock's countdown row made before v3.2.x. */
      .calendar-window {
        display: flex;
        flex-direction: column;
      }

      .cal-content {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
      }

      .cal-monthbar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }

      .cal-monthbar .cal-month-label {
        flex: 1;
        text-align: center;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
      }

      .cal-grid {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }

      .cal-dayname {
        text-align: center;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        padding: 2px 0;
      }

      /* Fixed row height rather than square cells: at 480px wide a 1:1 cell is
         ~62px, so six rows ate the window and left the day's events squeezed
         into a sliver. The grid is a date picker, not the content. */
      .cal-day {
        position: relative;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--bg-card-hover);
        color: var(--text);
        cursor: pointer;
        padding: 0;
      }

      /* :not(.cal-empty) — the leading pad cells carry .cal-day too, so they lit
         up on hover while their own cursor said "not clickable". */
      .cal-day:not(.cal-empty):hover {
        border-color: var(--accent);
      }

      .cal-day.cal-empty {
        background: transparent;
        cursor: default;
      }

      .cal-day.cal-today {
        border-color: var(--orange);
        font-weight: 700;
      }

      .cal-day.cal-selected {
        background: var(--accent);
        color: var(--bg);
        font-weight: 700;
      }

      /* The dot says "something is here" without needing room for the title. */
      .cal-day.cal-has-events::after {
        content: "";
        position: absolute;
        bottom: 3px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
      }

      .cal-day.cal-selected.cal-has-events::after {
        background: var(--bg);
      }

      /* 4px of inner padding is not decoration: `overflow-y: auto` forces
         `overflow-x` to auto as well (visible is not a legal pairing), so this
         box clips sideways too — and the global focus ring is 2px drawn at a 2px
         offset, i.e. exactly 4px outside the control. Without the padding a
         focused full-width field looks sliced off at both edges, which is what
         the New event title box did. */
      .cal-lower {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 4px;
      }

      .cal-section-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--text-dim);
        text-transform: uppercase;
      }

      .cal-event {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-card-hover);
      }

      .cal-event-when {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        white-space: nowrap;
      }

      .cal-event-main {
        flex: 1;
        min-width: 0;
      }

      .cal-event-title {
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .cal-event-note {
        font-size: 11px;
        color: var(--text-dim);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .cal-event-meta {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        white-space: nowrap;
      }

      .cal-empty-note {
        font-size: 12px;
        color: var(--text-dim);
        font-style: italic;
      }

      .cal-form {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .cal-form-row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* gap 10px, not 4px: the same 4px focus ring sat straight on top of the
         text after each field, which is what made "min before" read as squashed
         against the number box. */
      .cal-form label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }

      /* Wide enough for three digits AND the spinner, which is ~17px of the
         field on its own. At 80px the arrows pushed the value into the left
         padding. */
      .cal-form .cal-lead-input {
        width: 96px;
      }

      .cal-form input[type="text"],
      .cal-form textarea {
        flex: 1;
        min-width: 120px;
      }

      .cal-form textarea {
        min-height: 62px;
        min-width: 0;
        font-family: var(--font);
        font-size: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px;
        color: var(--text);
      }

      .cal-filter {
        flex: 1;
        min-width: 0;
      }

      /* The shared input rule above only carries colour and font; the log and
         calculator inputs are 18px/10px-padded single fields, which is far too
         big for a form of eight controls.

         The height is pinned because the native date and time widgets carry
         their own internal padding — left alone they came out 28px and 31px
         against 26px for a text field, so a row of them stepped up and down. */
      .cal-content input,
      .cal-content select,
      .cal-content button {
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 8px;
      }

      .cal-form input:not([type="checkbox"]),
      .cal-form select,
      .cal-form button {
        height: 28px;
      }

      .cal-content input[type="checkbox"] {
        padding: 0;
      }

      .cal-monthbar button,
      .cal-section-head button {
        font-family: var(--mono);
      }

      .log-content {
        flex: 1 1 auto;
        min-height: 0;
      }

      .log-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
      }

      .log-list:empty::before {
        content: "No entries yet — log something above.";
        display: block;
        padding: 18px 6px;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }

      .log-item {
        display: flex;
        align-items: baseline;
        gap: 6px;
        border-radius: 6px;
      }

      .log-item:hover {
        background: var(--bg-card-hover);
      }

      .log-item .description {
        flex: 1;
        overflow-wrap: anywhere;
      }

      .log-item .timestamp {
        color: var(--text-dim);
        white-space: nowrap;
      }

      .log-delete {
        opacity: 0;
        color: var(--text-muted);
        background: transparent;
        border: 0;
        padding: 2px 6px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: opacity 0.15s ease, color 0.15s ease;
      }

      .log-item:hover .log-delete,
      .log-delete:focus-visible {
        opacity: 1;
      }

      .log-delete:hover {
        color: var(--danger);
      }

      [data-locked="true"] .log-delete {
        display: none;
      }

      [data-locked="true"] .log-item:hover {
        background: transparent;
      }

      /* --- Search / replace ---
         Was an unstyled div dropped into the whiteboard's flex column, so it
         appeared mid-canvas with no chrome and shoved the layout around. */
      #search-replace {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        margin: 0;
        display: none;
        gap: 8px;
        align-items: center;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 10px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        z-index: 2400;
      }

      #search-replace.active {
        display: flex;
      }

      #search-replace input {
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 12px;
        width: 170px;
        outline: none;
      }

      /* --- Download link ---
         Was a full-width right-aligned block flush against the viewport edge.
         Made it a deliberate corner chip that clears the nav menu. */
      /* Pinned to the bottom-right corner of the viewport in every layout and
         always above the window layer (windows are capped below 900, this sits
         at 1001), so it can never be covered or pushed off-screen. */
      .download-app-link {
        position: fixed;
        right: 16px;
        bottom: 16px;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-dim);
        z-index: 1001;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }

      /* Small print, and it stays small print on hover — the chip already turns
         red to say it writes a file, and a version stamp brightening along with
         it would read as part of the warning rather than as a label. */
      /* Was 9px at opacity 0.65, which computed to #5d6777 on --bg-card — 3.1:1,
         under AA for small text, and this is the one label that tells you which
         build you are looking at. A dimmer token at full opacity gets the same
         "secondary" reading at 5.7:1, and 10px is a build stamp people squint at
         on purpose. */
      .download-app-version {
        font-size: 10px;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }

      /* Deliberately the one control that highlights red rather than the accent
         teal: it writes a file to disk, so it reads as distinct from the
         in-app actions that all share the teal hover. */
      .download-app-link:hover,
      .download-app-link:focus-visible {
        color: var(--danger);
        border-color: var(--danger);
        background: var(--bg-card-hover);
      }

      .download-app-link:focus-visible {
        outline-color: var(--danger);
      }

      /* --- Empty canvas ---
         An app that opens to a featureless void gives the user nothing to
         act on. This hint is hidden by JS as soon as a window exists. */
      #empty-state {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        pointer-events: none;
        padding: 0 24px 160px;
        color: var(--text-muted);
      }

      #empty-state[hidden] {
        display: none;
      }

      #empty-state .empty-title {
