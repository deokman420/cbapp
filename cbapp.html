        <label for="sticky-note-text-color-${windowId}">Text:</label>
        <input type="color" id="sticky-note-text-color-${windowId}" value="${defaultTextColor}" onchange="changeStickyNoteTextColor('${windowId}', this.value)">
        <div class="sticky-toolbar-actions">
            <button class="sticky-copy" onclick="copyStickyNoteText('${windowId}')" title="Copy this note's text" aria-label="Copy sticky note text">Copy</button>
            <button class="sticky-reset-colors" onclick="resetStickyColors('${windowId}')" title="Reset colours to follow the theme" aria-label="Reset sticky note colours to follow the theme">Reset</button>
        </div>
    </div>
    <textarea class="sticky-note-content" placeholder="Write something..."></textarea>
`;

        windowsContainer.appendChild(newStickyNote);
        makeDraggable(newStickyNote);
        wireWindowFocus(newStickyNote);
        setActiveWindow(windowId);
        refreshChrome();
        const resizeObserver = new ResizeObserver(() => {
          const rect = newStickyNote.getBoundingClientRect();
          newStickyNote.dataset.width = newStickyNote.offsetWidth;
          newStickyNote.dataset.height = newStickyNote.offsetHeight;
          newStickyNote.dataset.x = rect.left;
          newStickyNote.dataset.y = rect.top;
          debouncedSave(220);
        });
        registerResizeObserver(windowId, resizeObserver);
        resizeObserver.observe(newStickyNote);
        return newStickyNote;
      }

      function saveSession() {
        // While restoring we rebuild the DOM by replaying add*() helpers, each of
        // which calls saveSession(); skip those so we never persist a partial
        // mid-restore snapshot. loadSessionFromStorage() does one final save itself.
        if (restoring) return;
        const session = {};
        document
          .querySelectorAll(".window, .task-window")
          .forEach((windowElement) => {
            const windowId = windowElement.id;
            const textarea = document.getElementById(`clipboard-${windowId}`);
            const title = windowElement.querySelector(
              ".window-title, .task-title, .sticky-note-title"
            ).textContent;
            session[windowId] = {
              position: {
                left: windowElement.dataset.x || "50",
                top: windowElement.dataset.y || "50",
              },
              width: windowElement.offsetWidth,
              height: windowElement.offsetHeight,
              zIndex: parseInt(windowElement.style.zIndex) || 0,
              minimized: windowElement.style.display === "none",
              content: textarea ? textarea.value : "",
              name: title,
              isTaskWindow: windowElement.classList.contains("task-window"),
              locked: windowElement.dataset.locked === "true", // Add this line
              tasks: windowElement.classList.contains("task-window")
                ? Array.from(windowElement.querySelectorAll(".task-item")).map(
                    (item) => ({
                      text: item.querySelector("span").textContent,
                      completed: item.classList.contains("completed"),
                    })
                  )
                : [],
            };
          });
        const clock = document.getElementById("clock");
        if (clock) {
          session.clock = {
            visible: clockVisible,
            position: {
              left: clock.dataset.x || "50",
              top: clock.dataset.y || "50",
            },
            width: clock.dataset.width || "200",
            height: clock.dataset.height || "150",
            name: clock.querySelector(".clock-title").textContent,
            clockFormat:
              document.getElementById("clock-format-clock")?.value || "12",
            locked: clock.dataset.locked === "true",
            minimized: clock.style.display === "none",
          };
        }
        if (document.getElementById("calculator")) {
          session.calculator = {
            visible: calculatorVisible,
            history: calculatorHistory,
            position: {
              left: document.getElementById("calculator").dataset.x || "50",
              top: document.getElementById("calculator").dataset.y || "50",
            },
            width: document.getElementById("calculator").dataset.width || "250",
            locked:
              document.getElementById("calculator").dataset.locked === "true",
            minimized:
              document.getElementById("calculator").style.display === "none",
          };
        }
        const log = document.getElementById("log");
        if (log) {
          session.log = {
            visible: logVisible,
            position: {
              left: log.dataset.x || "50",
              top: log.dataset.y || "50",
            },
            width: log.dataset.width || "300",
            height: log.dataset.height || "300",
            name: log.querySelector(".log-title").textContent,
            locked: log.dataset.locked === "true",
            minimized: log.style.display === "none",
            logs: Array.from(document.querySelectorAll(".log-item")).map(
              (item) => ({
                timestamp: item.querySelector(".timestamp").textContent,
                description: item.querySelector(".description").textContent,
              })
            ),
          };
        } else {
          session.log = {
            visible: logVisible,
            position: { left: "50", top: "50" },
            width: "300",
            height: "300",
            name: "Log",
            logs: logEntries,
          };
        }
        // The help window was the one window type that silently vanished on
        // refresh while every other one came back.
        const help = document.getElementById("help-window");
        session.help = help
          ? {
              visible: true,
              position: {
                left: help.dataset.x || "50",
                top: help.dataset.y || "50",
              },
              minimized: help.style.display === "none",
              locked: help.dataset.locked === "true",
            }
          : { visible: false };
        session.theme = document.body.className || "light-mode";
        document
          .querySelectorAll(".sticky-note-window")
          .forEach((stickyNote) => {
            const windowId = stickyNote.id;
            const content = stickyNote.querySelector(
              ".sticky-note-content"
            ).value;
            // Empty means "no explicit pick, follow the theme" - persist that
            // rather than snapshotting whatever the theme happened to be.
            const bgColor = stickyNote.style.backgroundColor || "";
            const textColor =
              stickyNote.querySelector(".sticky-note-content").style.color || "";
            const title =
              stickyNote.querySelector(".sticky-note-title").textContent;
            session[windowId] = {
              locked: stickyNote.dataset.locked === "true",
              position: {
                left: stickyNote.dataset.x || "50",
                top: stickyNote.dataset.y || "50",
              },
              width: stickyNote.offsetWidth,
              height: stickyNote.offsetHeight,
              zIndex: parseInt(stickyNote.style.zIndex) || 0,
              minimized: stickyNote.style.display === "none",
              content,
              color: bgColor,
              textColor,
              // Distinguishes a deliberate colour choice from a theme default
              // that merely happened to be inline. Absent in pre-v3.0 sessions,
              // which is what the restore heuristic is for.
              customColor: stickyNote.dataset.customColor === "true",
              name: title,
            };
          });
        session.zIndexCounter = zIndexCounter;
        try {
          const serialized = JSON.stringify(session);
          // Guard against localStorage quota exhaustion (typical limit ~5-10MB)
          if (serialized.length > 4500000) {
            console.warn("Session too large to save safely, skipping write.");
            return;
          }
          localStorage.setItem("notepadSession", serialized);
        } catch (e) {
          console.error("Failed to save session to localStorage:", e);
          showStatus("Failed to save session.");
        }
      }

    `;
        windowsContainer.appendChild(newWindow);

        const resizeObserver = new ResizeObserver(() => {
          updateWindowSize(windowId);
          debouncedSave(220);
        });
        registerResizeObserver(windowId, resizeObserver);
        resizeObserver.observe(textareaContainer);

      // Single builder for both new tasks and restored ones, so the two paths

      function createTaskItem(windowId, text, completed) {
        const taskItem = document.createElement("div");
        taskItem.className = "task-item" + (completed ? " completed" : "");

      function calculate() {
        const input = document.getElementById("calculator-input");
        const display = document.getElementById("calculator-display");
        if (input && display) {
          let expression = input.value;
          if (!expression) {
            display.value = "0";
            return;
          }
          try {
            let result = evaluateExpression(expression);
            display.value = isFinite(result) ? result : "Error";
            calculatorHistory.push({ expression, result: display.value });
            updateCalculatorHistory();
            saveSession();
          } catch {
            display.value = "Error";
            calculatorHistory.push({ expression, result: "Error" });
            updateCalculatorHistory();
            saveSession();
          }
        }
      }

      function evaluateExpression(expression) {
        expression = expression.replace(/×/g, "*").replace(/%/g, "/100");
        while (expression.includes("√")) {
          const sqrtIndex = expression.indexOf("√");
          let number = "";
          let i = sqrtIndex + 1;
          while (i < expression.length && /\d|\./.test(expression[i])) {
            number += expression[i];
            i++;
          }
          const sqrtValue = Math.sqrt(parseFloat(number));
          expression =
            expression.substring(0, sqrtIndex) +
            sqrtValue +
            expression.substring(i);
        }
        const tokens = expression.match(/(\d*\.?\d+|[+\-*/])/g);
        if (!tokens) throw new Error("Invalid expression");

        // This used to fold strictly left-to-right, so 2+3*4 gave 20 instead of
        // 14. Resolve × and ÷ in a first pass, then + and - in a second.
        const terms = [parseFloat(tokens[0])];
        const ops = [];
        if (isNaN(terms[0])) throw new Error("Invalid number");
        for (let i = 1; i < tokens.length; i += 2) {
          const operator = tokens[i];
          const nextNumber = parseFloat(tokens[i + 1]);
          if (isNaN(nextNumber)) throw new Error("Invalid number");
          if (operator === "*" || operator === "/") {
            const left = terms.pop();
            if (operator === "/" && nextNumber === 0) {
              throw new Error("Division by zero");
            }
            terms.push(operator === "*" ? left * nextNumber : left / nextNumber);
          } else {
            ops.push(operator);
            terms.push(nextNumber);
          }
        }

        let result = terms[0];
        for (let i = 0; i < ops.length; i++) {
          result = ops[i] === "+" ? result + terms[i + 1] : result - terms[i + 1];
        }
        return result;
      }

        document.getElementById("log-toggle").textContent = "Log";
        document.getElementById("log-toggle").classList.add("active");
        saveSession();
        showStatus("Log window opened!");
        return newWindow;
      }

      function toggleLog() {
        const log = document.getElementById("log");
        const logButton = document.getElementById("log-toggle");
        if (log && log.style.display === "none") {
          restoreWindow("log");
          return;
        }
        if (log) {
          log.remove();
          logVisible = false;
          logButton.textContent = "Log";
          logButton.classList.remove("active");
          showStatus("Log window hidden.");
        } else {
          addLog();
        }
        saveSession();
      }

      // Single builder for new and restored entries so the two can't drift, and
      // so both get the delete control the log previously lacked entirely - it
      // was append-only with no way to remove a mistyped line.
      function createLogItem(entry) {
        const logItem = document.createElement("div");
        logItem.className = "log-item";
        const ts = document.createElement("span");
        ts.className = "timestamp";
        ts.textContent = entry.timestamp;
        const sep = document.createTextNode(": ");
        const desc = document.createElement("span");
        desc.className = "description";
        desc.textContent = entry.description;
        const del = document.createElement("button");
        del.className = "log-delete";
        del.textContent = "×";
        del.title = "Delete this entry";
        del.setAttribute("aria-label", `Delete log entry: ${entry.description}`);
        del.onclick = (e) => {
          e.stopPropagation();
          const i = logEntries.indexOf(entry);
          if (i > -1) logEntries.splice(i, 1);
          logItem.remove();
          saveSession();
          showStatus("Log entry deleted.");
        };
        logItem.appendChild(ts);
        logItem.appendChild(sep);
        logItem.appendChild(desc);
        logItem.appendChild(del);
        return logItem;
      }

      function addLogEntry() {
        const logInput = document.getElementById("log-input");
        const logList = document.getElementById("log-list");
        if (!logInput || !logList) return;
        const description = logInput.value.trim();
        if (!description) {
          showStatus("Log entry cannot be empty.");
          logInput.focus();
          return;
        }
        const timestamp = new Date().toLocaleString("en-US", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        const entry = { timestamp, description };
        logEntries.push(entry);
        logList.appendChild(createLogItem(entry));
        logInput.value = "";
        logInput.focus();
        logList.scrollTop = logList.scrollHeight;
        saveSession();
        showStatus("Log entry added.");
      }

      function restoreLogEntries() {
        const logList = document.getElementById("log-list");
        if (!logList) return;
        logList.innerHTML = "";
        logEntries.forEach((entry) => logList.appendChild(createLogItem(entry)));
        logList.scrollTop = logList.scrollHeight;
      }

      // Pointer Events rather than mouse events: the old handler was
      // mousedown/mousemove/mouseup only, so on a touch screen a window could
      // not be moved at all. Pointer events cover mouse, touch and pen through
      // one path, and setPointerCapture keeps the drag alive if the finger
      // outruns the header.
      function makeDraggable(element) {
        const header = element.querySelector(HEADER_SELECTOR);
        if (!header) return;

        let dragPointerId = null;
        let offsetX = 0;
        let offsetY = 0;

        const onPointerMove = (e) => {
          if (e.pointerId !== dragPointerId) return;
          const spot = clampToCanvas(
            element.offsetWidth,
            element.offsetHeight,
            e.clientX - offsetX,
            e.clientY - offsetY
          );
          element.style.left = `${spot.x}px`;
          element.style.top = `${spot.y}px`;
          element.dataset.x = spot.x;
          element.dataset.y = spot.y;
        };

        const endDrag = (e) => {
          if (dragPointerId === null || (e && e.pointerId !== dragPointerId)) return;
          try {
            header.releasePointerCapture(dragPointerId);
          } catch (err) {
            /* capture may already be gone */
          }
          dragPointerId = null;
          document.body.style.userSelect = "";
          element.classList.remove("dragging");
          header.removeEventListener("pointermove", onPointerMove);
          header.removeEventListener("pointerup", endDrag);
          header.removeEventListener("pointercancel", endDrag);
          saveSession();
        };

        header.addEventListener("pointerdown", (e) => {
          // A locked window simply refuses the drag here. This used to be done
          // by nulling the handler and setting pointer-events:none on the
          // header, which also killed the lock and close buttons inside it and
          // forced toggleWindowLock to re-implement this whole handler.
          if (element.dataset.locked === "true") return;
          // Don't start a drag from a control in the title bar.
          if (e.target.closest("[role='button'], button, input, select")) return;
          if (e.button !== undefined && e.button !== 0) return; // left/primary only
          if (dragPointerId !== null) return; // ignore a second finger

          dragPointerId = e.pointerId;
          const rect = element.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          element.style.zIndex = nextWindowZ();
          document.body.style.userSelect = "none";
          element.classList.add("dragging");
          try {
            header.setPointerCapture(e.pointerId);
          } catch (err) {
            /* not fatal - the listeners below still track the drag */
          }
          header.addEventListener("pointermove", onPointerMove);
          header.addEventListener("pointerup", endDrag);
          header.addEventListener("pointercancel", endDrag);
        });
      }

      const HEADER_SELECTOR =
        ".window-header, .task-header, .clock-header, .log-header, .calculator-header, .help-header, .sticky-note-header";

      // What "locked" freezes inside a window. Text fields go readOnly rather
      // than disabled so a locked note can still be read, scrolled and copied;
      // everything else (buttons, checkboxes, selects, colour swatches) is
      // disabled outright. Title-bar controls are excluded - you must always be
      // able to unlock, minimize or close.
      function lockableControls(windowElement) {
        return Array.from(
          windowElement.querySelectorAll("textarea, input, select, button")
        ).filter((el) => !el.closest(HEADER_SELECTOR));
      }

      function applyWindowLock(windowElement, isLocked) {
        windowElement.dataset.locked = isLocked;
        // Unlocking must hand resize back to the stylesheet, not force "both"
        // onto every type: a note frame has no resize handle (it grows from its
        // inner .textarea-container), and the clock/calculator/log/help windows
        // are fixed-size by design.
        const resizables = [
          windowElement,
          ...windowElement.querySelectorAll(".textarea-container"),
        ];
        resizables.forEach((el) => {
          if (isLocked) el.style.resize = "none";
          else el.style.removeProperty("resize");
        });

        lockableControls(windowElement).forEach((el) => {
          const isTextField =
            el.tagName === "TEXTAREA" ||
            (el.tagName === "INPUT" &&
              ["text", "number", "search", ""].includes(el.type));
          const prop = isTextField ? "readOnly" : "disabled";
          if (isLocked) {
            // Remember the pre-lock state so unlocking doesn't, say, make the
            // calculator's always-readonly display editable.
            if (el.dataset.prevLockState === undefined) {
              el.dataset.prevLockState = el[prop] ? "1" : "0";
            }
            el[prop] = true;
          } else if (el.dataset.prevLockState !== undefined) {
            el[prop] = el.dataset.prevLockState === "1";
            delete el.dataset.prevLockState;
          }
        });

        const lockBtn = windowElement.querySelector(
          ".lock-window, .sticky-lock-window"
        );
        if (lockBtn) {
          lockBtn.textContent = isLocked ? "🔒" : "🔓";
          lockBtn.classList.toggle("locked", isLocked);
          lockBtn.title = isLocked
            ? "Unlock this window"
            : "Lock editing, dragging and resizing";
          lockBtn.setAttribute("aria-pressed", String(isLocked));
        }
      }

      // Lock = frozen content, no dragging, no resizing. Everything hangs off
      // dataset.locked, which makeDraggable() reads, so this no longer has to
      // null out and rebuild the drag handler (a near-copy of makeDraggable
      // that had already drifted from it).
      function toggleWindowLock(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        const isLocked = windowElement.dataset.locked !== "true";
        applyWindowLock(windowElement, isLocked);
        const label =
          windowElement.querySelector(
            ".window-title, .task-title, .sticky-note-title, .clock-title, .log-title, .calculator-title, .help-title"
          )?.textContent || "Window";
        showStatus(`${label} ${isLocked ? "locked" : "unlocked"}.`);
        saveSession();
      }

      function setActiveWindow(windowId) {
        const windowElement = document.getElementById(windowId);
        if (!windowElement) return;
        // Already on top and already marked - don't churn the z-index counter
        // on every mousedown, which used to inflate it without bound.
        const alreadyActive = windowElement.classList.contains("active");
        activeWindow = windowId;
        // The old selector omitted sticky notes, the calculator and help, so
        // those could keep a stale .active while another window was focused.
        document
          .querySelectorAll(WINDOW_SELECTOR)
          .forEach((win) => win.classList.remove("active"));
        windowElement.classList.add("active");
        if (!alreadyActive) {
          windowElement.style.zIndex = nextWindowZ();
        }
      }

      function updateLineNumbers(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          const lines = textarea.value.split("\n").length;
          lineNumbers.innerHTML =
            Array.from({ length: lines }, (_, i) => i + 1).join("<br>") || "1";
        }
      }

      function syncScroll(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const lineNumbers = document.getElementById(`line-numbers-${windowId}`);
        if (textarea && lineNumbers) {
          lineNumbers.scrollTop = textarea.scrollTop;
        }
      }

      function closeWindow(windowId) {
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          disconnectResizeObserver(windowId);
          windowElement.remove();
          if (activeWindow === windowId) {
            activeWindow = null;
            // Fall back to whatever is visually on top, not to whichever
            // happens to be first in document order.
            const remaining = Array.from(
              document.querySelectorAll(WINDOW_SELECTOR)
            ).filter((el) => el.style.display !== "none");
            if (remaining.length) {
              const topMost = remaining.reduce((a, b) =>
                (parseInt(b.style.zIndex) || 0) > (parseInt(a.style.zIndex) || 0)
                  ? b
                  : a
              );
              setActiveWindow(topMost.id);
            }
          }
          refreshChrome();
          debouncedSave(80);
        }
      }

      let currentEditable = null;

      function startRename(windowId) {
        if (currentEditable) endRename();
        const windowElement = document.getElementById(windowId);
        if (windowElement) {
          const titleSpan = windowElement.querySelector(
            ".window-title, .task-title, .sticky-note-title"
          );
          titleSpan.contentEditable = true;
          titleSpan.focus();
          document.execCommand("selectAll", false, null); // Select all text for easy editing
          currentEditable = { windowId, element: titleSpan };

          // Listen for Enter, Escape, or blur
          titleSpan.addEventListener("keydown", handleRenameKeydown);
          titleSpan.addEventListener("blur", endRename);
          document.addEventListener("mousedown", handleOutsideClick);
        }
      }

      function handleRenameKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          endRename();
        } else if (e.key === "Escape") {
          e.preventDefault();
          cancelRename();
        }
      }

      function handleOutsideClick(e) {
        if (
          currentEditable &&
          !e.target.closest(".window-title, .task-title, .sticky-note-title")
        ) {
          endRename();
        }
      }

      function endRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if empty, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = element.textContent.trim() || defaultName;

          currentEditable = null;
          saveSession();
        }
      }

      function cancelRename() {
        if (currentEditable) {
          const { windowId, element } = currentEditable;
          element.contentEditable = false;
          element.removeEventListener("keydown", handleRenameKeydown);
          element.removeEventListener("blur", endRename);
          document.removeEventListener("mousedown", handleOutsideClick);

          // Set default name if cancelled, based on window type
          let defaultName = "";
          if (element.classList.contains("window-title")) {
            defaultName = `Note ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("task-title")) {
            defaultName = `Task List ${windowId.replace("window", "")}`;
          } else if (element.classList.contains("sticky-note-title")) {
            defaultName = `Sticky Note ${windowId.replace("sticky-note-", "")}`;
          } else if (windowId === "log") {
            defaultName = "Log";
          } else if (element.classList.contains("clock-title")) {
            defaultName = "Clock";
          }
          element.textContent = defaultName;

          currentEditable = null;
          saveSession();
        }
      }
      // One copy path for both buttons. Prefers the async Clipboard API and
      // falls back to execCommand, which is what actually works under file://.
      // The old code selected the textarea and left it selected, so a copy
      // could be followed by a keystroke that wiped the note.
      async function copyToClipboard(text, emptyMessage) {
        if (!text) {
          showStatus(emptyMessage || "Nothing to copy.");
          return false;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            showStatus("Copied to clipboard.");
            return true;
          } catch {
            /* fall through to execCommand */
          }
        }
        // Copy via an offscreen field so the user's own selection and caret in
        // the note are left untouched.
        const scratch = document.createElement("textarea");
        scratch.value = text;
        scratch.setAttribute("readonly", "");
        scratch.style.cssText = "position:fixed;top:-1000px;opacity:0;";
        document.body.appendChild(scratch);
        scratch.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch {
          ok = false;
        }
        document.body.removeChild(scratch);
        showStatus(ok ? "Copied to clipboard." : "Copy failed — select and press Ctrl+C.");
        return ok;
      }

      function copyText() {
        if (!activeWindow) {
          showStatus("Select a note first, then copy.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Copy only works on a note.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Per-window one-click copy (the Copy button in each note/T2 format row).
      // Targets its own window rather than relying on activeWindow.
      function copyNoteText(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) {
          showStatus("Copy failed: note not found.");
          return;
        }
        copyToClipboard(textarea.value, "This note is empty.");
      }

      // Paste had three problems: navigator.clipboard.readText() does not exist
      // under file:// (which is how this app is meant to be run), it silently
      // REPLACED the note instead of inserting at the cursor, and every failure
      // collapsed into one unhelpful "Failed to paste text."
      async function pasteText() {
        if (!activeWindow) {
          showStatus("Select a note first, then paste.");
          return;
        }
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Paste only works into a note.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot paste: window is locked.");
          return;
        }

        let text = null;
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            text = await navigator.clipboard.readText();
          } catch {
            text = null; // blocked by permission, or unavailable on file://
          }
        }

        if (text === null) {
          // execCommand("paste") is disallowed from script in every current
          // browser, so the honest fallback is to focus the field and let the
          // user's own Ctrl+V through - the browser will then paste natively.
          textarea.focus();
          showStatus("Press Ctrl+V to paste into this note.");
          return;
        }

        insertIntoNote(activeWindow, text);
        showStatus("Pasted from clipboard.");
      }

      // Insert at the caret, replacing any selection, rather than overwriting
      // the whole note - and keep undo history intact where the browser
      // supports it.
      function insertIntoNote(windowId, text) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (!textarea) return;
        textarea.focus();
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        let inserted = false;
        try {
          inserted = document.execCommand("insertText", false, text);
        } catch {
          inserted = false;
        }
        if (!inserted) {
          textarea.value =
            textarea.value.slice(0, start) + text + textarea.value.slice(end);
          textarea.selectionStart = textarea.selectionEnd = start + text.length;
        }
        updateLineNumbers(windowId);
        updateCounts(windowId);
        updateWindowSize(windowId);
        saveSession();
      }

      function toUpperCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toUpperCase();
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Converted to uppercase.");
        } else {
          showStatus("Cannot convert: Window is locked.");
        }
      }

      function toLowerCase(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && !textarea.readOnly) {
          textarea.value = textarea.value.toLowerCase();
          updateLineNumbers(windowId);
          updateCounts(windowId);
          updateWindowSize(windowId);
          saveSession();
          showStatus("Converted to lowercase.");
        } else {
          showStatus("Cannot convert: Window is locked.");
        }
      }

      function updateCounts(windowId) {
        const textarea = document.getElementById(`clipboard-${windowId}`);
        const countDiv = document.getElementById(`counts-${windowId}`);
        if (textarea && countDiv) {
          const text = textarea.value;
          const words = text
            .trim()
            .split(/\s+/)
            .filter((word) => word.length > 0).length;
          countDiv.textContent = `Words: ${words}, Characters: ${text.length}`;
        }
      }

      function searchReplace() {
        if (!activeWindow) {
          showStatus("No active window selected.");
          return;
        }
        const searchInput = document.getElementById("search-input").value;
        const replaceInput = document.getElementById("replace-input").value;
        const textarea = document.getElementById(`clipboard-${activeWindow}`);
        if (!textarea) {
          showStatus("Search only works on a note. Select one first.");
          return;
        }
        if (textarea.readOnly) {
          showStatus("Cannot replace: window is locked.");
          return;
        }
        if (!searchInput) {
          showStatus("Enter something to search for.");
          document.getElementById("search-input").focus();
          return;
        }
        // Users type literal text here, not regular expressions. Passing it
        // straight to RegExp made "(" throw and characters like "." match
        // anything. Escape it and count the hits so there's real feedback.
        const escaped = searchInput.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp(escaped, "g");
        const matches = textarea.value.match(pattern);
        if (!matches) {
          showStatus(`No matches for "${searchInput}".`);
          return;
        }
        textarea.value = textarea.value.replace(pattern, replaceInput);
        updateLineNumbers(activeWindow);
        updateCounts(activeWindow);
        updateWindowSize(activeWindow);
        saveSession();
        showStatus(
          `Replaced ${matches.length} match${matches.length === 1 ? "" : "es"}.`
        );
      }

      function toggleSearchReplace() {
        const panel = document.getElementById("search-replace");
        const opened = panel.classList.toggle("active");
        const searchBtn = document.getElementById("search-btn");
        if (searchBtn) searchBtn.classList.toggle("active", opened);
        if (opened) document.getElementById("search-input").focus();
      }

      let _statusTimer = null;
      function showStatus(message) {
        const status = document.getElementById("status");
        if (!status) return;
        // Each call used to start its own un-cancelled 3s timer, so a burst of
        // messages left earlier timers to hide the newest one early.
        if (_statusTimer) clearTimeout(_statusTimer);
        status.textContent = message;
        status.style.display = "block";
        status.classList.remove("showing");
        void status.offsetWidth; // restart the entry animation
        status.classList.add("showing");
        _statusTimer = setTimeout(() => {
          status.style.display = "none";
          status.classList.remove("showing");
          _statusTimer = null;
        }, 3000);
      }

      function toggleNavMenu() {
        const navMenu = document.querySelector(".nav-menu");
        const collapsed = navMenu.classList.toggle("collapsed");
        const toggle = navMenu.querySelector(".nav-toggle");

      }
      function openInstructions(isT2 = false) {

        const windowId = windowElement.id;
        const textarea = document.getElementById(`clipboard-${windowId}`);
        if (textarea && windowElement) {
          if (isT2) {
            t2Count++;
            const t2Label =
              t2Count > 1 ? `T2 Template ${t2Count}` : "T2 Template";
            const templateText = `Company URL Or Company ID -

      function loadSessionFromStorage(session) {
        // Rebuild quietly: suppress the add*() helpers' internal saveSession() calls
        // so we never persist a half-built DOM, then write one complete snapshot below.
        restoring = true;
        let skippedOnRestore = 0;
        try {
        // Restore theme
        document.body.className = session.theme || "light-mode";

        // Restore windows
        Object.keys(session).forEach((key) => {
          if (key.startsWith("window")) {
            const windowData = session[key];
            let newWindow;
            if (windowData.isTaskWindow) {
              newWindow = addTaskWindow();
            } else {
              newWindow = addWindow();

            // add*() returns null once MAX_WINDOWS is hit. A saved session can
            // legitimately hold more windows than the current cap, and this
            // used to dereference the null and abort the entire restore -
            // losing every window after it, not just the extra one.
            if (!newWindow) {
              skippedOnRestore++;

            const windowElement = document.getElementById(newWindow.id);

            windowElement.style.left = `${windowData.position.left}px`;
            windowElement.style.top = `${windowData.position.top}px`;
            windowElement.style.width = `${windowData.width}px`;
            windowElement.style.height = `${windowData.height}px`;
            windowElement.dataset.x = windowData.position.left;
            windowElement.dataset.y = windowData.position.top;
            windowElement.dataset.width = windowData.width;
            windowElement.dataset.height = windowData.height;
            if (windowData.zIndex) windowElement.style.zIndex = windowData.zIndex;
            if (windowData.minimized) windowElement.style.display = "none";

                    createTaskItem(newWindow.id, task.text, task.completed)
                  );

              if (title) title.textContent = windowData.name;
            } else {
              const textarea = document.getElementById(
                `clipboard-${newWindow.id}`
              );
              if (textarea) textarea.value = windowData.content;
              const title = windowElement.querySelector(".window-title");
              if (title) title.textContent = windowData.name;
              updateLineNumbers(newWindow.id);
              updateCounts(newWindow.id);

            // task checkboxes and delete buttons created just above, leaving a

            // directly rather than flipping it, and fires no status toast.
            if (windowData.locked) {

              calculator.style.top = `${session.calculator.position.top}px`;
              calculator.dataset.x = session.calculator.position.left;
              calculator.dataset.y = session.calculator.position.top;
              calculatorHistory = session.calculator.history || [];

              help.style.top = `${session.help.position.top}px`;

              if (session.help.minimized) help.style.display = "none";
              if (session.help.locked) applyWindowLock(help, true);
            }
          } else if (key.startsWith("sticky-note")) {
            const stickyNoteData = session[key];
            const newStickyNote = addStickyNote();
            if (!newStickyNote) {
              skippedOnRestore++;
              return;
            }
            const stickyNoteElement = document.getElementById(newStickyNote.id);
            stickyNoteElement.style.left = `${stickyNoteData.position.left}px`;
            stickyNoteElement.style.top = `${stickyNoteData.position.top}px`;
            stickyNoteElement.style.width = `${stickyNoteData.width}px`;
            stickyNoteElement.style.height = `${stickyNoteData.height}px`;
            stickyNoteElement.dataset.x = stickyNoteData.position.left;
            stickyNoteElement.dataset.y = stickyNoteData.position.top;
            if (stickyNoteData.zIndex)
              stickyNoteElement.style.zIndex = stickyNoteData.zIndex;
            if (stickyNoteData.minimized)
              stickyNoteElement.style.display = "none";

            const content = stickyNoteElement.querySelector(
              ".sticky-note-content"
            );
            if (content) content.value = stickyNoteData.content;

            // Reapply colours only when they were a deliberate choice.
            // Sessions written before v3.0 have no customColor flag and stored
            // whatever the theme default was at creation time; reapplying those
            // is what left old notes stuck dark on a light canvas. Treat a
            // stored colour matching any known default as "not a choice".
            const bgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.color
              : !!stickyNoteData.color && !isDefaultStickyColor(stickyNoteData.color);
            const fgIsChoice = stickyNoteData.customColor
              ? !!stickyNoteData.textColor
              : !!stickyNoteData.textColor &&
                !isDefaultStickyColor(stickyNoteData.textColor);

            if (bgIsChoice) {
              stickyNoteElement.style.backgroundColor = stickyNoteData.color;
            }
            if (fgIsChoice && content) {
              content.style.color = stickyNoteData.textColor;
              // Keep the title/toolbar legible against a custom background.
              stickyNoteElement.style.color = stickyNoteData.textColor;
            }
            if (bgIsChoice || fgIsChoice) {
              stickyNoteElement.dataset.customColor = "true";
            }
            syncStickySwatches(stickyNoteElement);
            const title = stickyNoteElement.querySelector(".sticky-note-title");
            if (title && stickyNoteData.name) {
              title.textContent = stickyNoteData.name;
            }
            // Lock last, after the content exists. This used to be applied
            // twice - once here and again by a hand-rolled copy below - which
            // toggled it straight back off. One call, one source of truth.
            if (stickyNoteData.locked) {
              applyWindowLock(stickyNoteElement, true);
            }

        });
        // Keep new windows above everything restored (clear the highest restored z).
        const maxRestoredZ = Math.max(
          0,
          ...[...document.querySelectorAll(".window, .task-window, .sticky-note-window")]
            .map((el) => parseInt(el.style.zIndex) || 0)
        );
        zIndexCounter = Math.max(
          session.zIndexCounter || 0,
          maxRestoredZ + 1,
          zIndexCounter
        );
        // A session saved before the cap existed can carry huge z-indices that
        // would sit above the toolbar; renumber everything into 1..n.
        if (zIndexCounter >= WINDOW_Z_MAX) compactWindowZ();
        } finally {
          restoring = false;
        }
        // A session saved on a large display used to restore partly or wholly
        // off-screen on a smaller one, with no way to drag anything back.
        document
          .querySelectorAll(WINDOW_SELECTOR)
          .forEach((el) => clampWindowIntoView(el));
        refreshChrome();
        // One complete, consistent write now that the whole DOM is rebuilt.
        saveSession();
        // Reported by the caller so its own "Session restored!" doesn't
        // immediately overwrite the warning.
        return skippedOnRestore;

      function downloadSessionJSON() {
        try {
          saveSession(); // Ensure latest state is saved
          const session = localStorage.getItem("notepadSession");
          if (!session) {
            showStatus("No session data to download.");
            return;
          }
          const blob = new Blob([session], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "cbapp-session.json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showStatus("Session JSON downloaded!");
        } catch (e) {
          showStatus("Failed to download session.");
        }
      }

      const EMBEDDED_SESSION_ID = "cbapp-embedded-session";
      const CONSUMED_EXPORT_KEY = "cbappConsumedExport";

      // This used to serialise document.documentElement.outerHTML verbatim,
      // which baked every open window into the file as static markup. Those
      // copies had no event listeners (undraggable, unclosable), textarea
      // .value doesn't serialise so they came back EMPTY, they duplicated the
      // windows restored from localStorage, they carried a second #nav-tooltip
      // with a duplicate id, and windowCount reset to 0 so new windows collided
      // with the baked-in ids. Export a pristine document instead and carry the
      // session as embedded JSON, so the copy boots exactly like the original.
      function downloadCurrentHtml() {
        try {
          saveSession();
          const clone = document.documentElement.cloneNode(true);

          const clear = (sel) => {
            const el = clone.querySelector(sel);
            if (el) el.innerHTML = "";
          };
          clear("#windows");
          clear("#minimized-bar");
          clear("#status");
          // Created by script at load; leaving it in yields two same-id nodes.
          clone.querySelector("#nav-tooltip")?.remove();
          clone.querySelector("#empty-state")?.removeAttribute("hidden");
          clone.querySelector("#search-replace")?.classList.remove("active");
          clone
            .querySelectorAll(".nav-menu button.active")
            .forEach((b) => b.classList.remove("active"));
          clone.querySelector(".nav-menu")?.classList.remove("collapsed");
          clone.querySelector(`#${EMBEDDED_SESSION_ID}`)?.remove();

          const payload = {
            // Lets a re-opened export tell "this is a new file to load" from
            // "I already loaded this one, use my edits since".
            exportId: `${Date.now()}-${windowCount}-${noteCount}`,
            session: JSON.parse(localStorage.getItem("notepadSession") || "{}"),
          };
          const script = document.createElement("script");
          script.type = "application/json";
          script.id = EMBEDDED_SESSION_ID;
          // Escape < so a note containing a closing script tag can't break out.
          script.textContent = JSON.stringify(payload).replace(/</g, "\\u003c");
          clone.querySelector("body")?.appendChild(script);

          const html = "<!DOCTYPE html>\n" + clone.outerHTML;
          const blob = new Blob([html], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "cbapp.html";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showStatus("Downloaded cbapp.html with your session.");
        } catch (e) {
          console.error("Export failed:", e);
          showStatus("Failed to download HTML.");
        }
      }

      // Returns the session carried inside an exported copy, but only the first
      // time that particular export is opened - after that the user's own edits
      // in localStorage take precedence.
      function readEmbeddedSession() {
        const node = document.getElementById(EMBEDDED_SESSION_ID);
        if (!node) return null;
        try {
          const payload = JSON.parse(node.textContent);
          if (!payload || typeof payload.session !== "object") return null;
          if (localStorage.getItem(CONSUMED_EXPORT_KEY) === payload.exportId) {
            return null;
          }
          localStorage.setItem(CONSUMED_EXPORT_KEY, payload.exportId);
          return payload.session;
        } catch (e) {
          console.error("Embedded session unreadable:", e);
          return null;
        }
      }

      function importData() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json,application/json";
        input.style.display = "none";

        input.onchange = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const text = e.target.result;
              if (typeof text !== "string" || text.length > 4500000) {
                showStatus("Import failed: file too large or invalid.");
                return;
              }
              const session = JSON.parse(text);
              // Basic structural sanity check before trusting the import
              if (!session || typeof session !== "object") {
                showStatus("Import failed: not a valid session file.");
                return;
              }
              localStorage.setItem("notepadSession", JSON.stringify(session));
              loadSession(true); // clear current UI; the file dialog was the confirmation
              loadSessionFromStorage(session); // Load imported session
              showStatus("Session imported!");
            } catch (err) {
              showStatus("Failed to import session.");
            }
          };
          reader.readAsText(file);
        };

        document.body.appendChild(input);
        input.click();
        document.body.removeChild(input);
      }
      let countdownInterval = null;

      function startCountdown() {
        const minInput = document.getElementById("countdown-minutes");
        const secInput = document.getElementById("countdown-seconds");
        const display = document.getElementById("countdown-display");
        let minutes = parseInt(minInput.value, 10) || 0;
        let seconds = parseInt(secInput.value, 10) || 0;
        let totalMs = (minutes * 60 + seconds) * 1000;
        if (totalMs <= 0) {
          showStatus("Please enter a time greater than 0.");
          return;
        }
        countdownEndTime = Date.now() + totalMs;
        countdownActive = true;
        updateCountdownDisplay();
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateCountdownDisplay, 500);
        showStatus(`Countdown started for ${minutes} min ${seconds} sec!`);
      }

      function resetCountdown() {
        countdownActive = false;
        countdownEndTime = null;
        clearInterval(countdownInterval);
        const minInput = document.getElementById("countdown-minutes");
        const secInput = document.getElementById("countdown-seconds");
        const display = document.getElementById("countdown-display");
        let minutes = parseInt(minInput.value, 10) || 0;
        let seconds = parseInt(secInput.value, 10) || 0;
        display.textContent = `${Math.floor(minutes / 60)
          .toString()
          .padStart(2, "0")}:${(minutes % 60)
          .toString()
          .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        restoreFavicon();
      }

      function updateCountdownDisplay() {
        const display = document.getElementById("countdown-display");
        if (!countdownActive || !countdownEndTime) return;
        let msLeft = countdownEndTime - Date.now();
        if (msLeft <= 0) {
          display.textContent = "00:00:00";
          countdownActive = false;
          clearInterval(countdownInterval);
          upliftingNotification();
          setCountdownFavicon();
          return;
        }
        let totalSeconds = Math.floor(msLeft / 1000);
        let h = Math.floor(totalSeconds / 3600);
        let m = Math.floor((totalSeconds % 3600) / 60);
        let s = totalSeconds % 60;
        display.textContent = `${h.toString().padStart(2, "0")}:${m
          .toString()
          .padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }

      let _titleFlash = null;
      function upliftingNotification() {
        showStatus("🎉 Timer finished 🎉");
        // Flash the tab title, because the most likely reason you set a timer
        // is that you're looking at something else.
        if (_titleFlash) clearInterval(_titleFlash);
        const originalTitle = "CB App";
        let on = false;
        let ticks = 0;
        _titleFlash = setInterval(() => {
          on = !on;
          document.title = on ? "⏰ Timer finished" : originalTitle;
          if (++ticks >= 20) {
            clearInterval(_titleFlash);
            _titleFlash = null;
            document.title = originalTitle;
          }
        }, 700);
        const stopFlash = () => {
          if (_titleFlash) {
            clearInterval(_titleFlash);
            _titleFlash = null;
          }
          document.title = originalTitle;
          window.removeEventListener("focus", stopFlash);
        };
        window.addEventListener("focus", stopFlash);

        // Only use the OS notification if permission was already granted.
        // Firing requestPermission() here threw a browser permission dialog at
        // the user at a moment they never asked for one.
        if (window.Notification && Notification.permission === "granted") {
          try {
            new Notification("CB App", { body: "Timer finished." });
          } catch (e) {
            /* some browsers require a service worker; the toast already fired */
          }
        }
      }

      function setCountdownFavicon() {
        if (!originalFavicon) {
          const link = document.querySelector("link[rel~='icon']");
          if (link) originalFavicon = link.href;
        }
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          document.head.appendChild(link);
        }
        // Emoji favicon (works in most browsers)
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.font = "48px serif";
        ctx.fillText("🍽️", 8, 48);
        link.href = canvas.toDataURL();
      }

      function restoreFavicon() {
        if (originalFavicon) {
          let link = document.querySelector("link[rel~='icon']");
          if (link) link.href = originalFavicon;
        }

        let html = `<div class="nav-tooltip-title">${text}</div>`;
        // Calc, Clock and Help can only ever have one window, so their list was
        // always a single entry restating the title above it ("Toggle Clock" /
        // "- Clock") - it read as two stacked tooltips. Only list a singleton
        // when it is minimized, where the entry does something the button
        // can't: bring it back rather than toggle it.
        const SINGLETON_TYPES = ["calculator", "clock", "help"];
        const singletonHidden = (sel) => {
          const el = document.querySelector(sel);
          return !!el && el.style.display === "none";
        };
        if (type) {
          let selector = "";
          let titleSelector = "";
          let filter = null;
          if (type === "note") {
            selector = ".window";
            titleSelector = ".window-title";
            filter = (name) => !/^T2 Template(\s|$)/.test(name);
          } else if (type === "t2") {
            selector = ".window";
            titleSelector = ".window-title";
            filter = (name) => /^T2 Template(\s|$)/.test(name);
          } else if (type === "task") {
            selector = ".task-window";
            titleSelector = ".task-title";
          } else if (type === "sticky") {
            selector = ".sticky-note-window";
            titleSelector = ".sticky-note-title";
          } else if (type === "calculator") {
            selector = "#calculator";
            titleSelector = ".calculator-title";
          } else if (type === "clock") {
            selector = "#clock";
            titleSelector = ".clock-title";
          } else if (type === "help") {
            selector = ".help-window";
            titleSelector = ".help-title";
            filter = () => true;
          }
          const listWorthShowing =
            selector &&
            (!SINGLETON_TYPES.includes(type) || singletonHidden(selector));
          const items = listWorthShowing
            ? Array.from(document.querySelectorAll(selector))
            : [];
          const entries = items
            .map((win) => ({
              id: win.id,
              name: win.querySelector(titleSelector)?.textContent || win.id,
              hidden: win.style.display === "none",
            }))
            .filter((e) => !filter || filter(e.name));
          if (entries.length > 0) {
            html += '<div class="nav-tooltip-list">';
            entries.forEach((e) => {
              html += `<button class="nav-tooltip-link" data-target-id="${e.id}">- ${e.name}${
                e.hidden ? " (minimized)" : ""
              }</button>`;
            });
            html += "</div>";
          }
        }
        navTooltip.innerHTML = html;
        navTooltip
          .querySelectorAll(".nav-tooltip-link")
          .forEach((link) => {
            link.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              restoreWindow(link.getAttribute("data-target-id"));
              hideNavTooltip();
            });
          });
        // Anchoring to the button's own top edge meant a bottom-row tooltip
        // rendered straight over the top row's buttons. Clear the whole
        // toolbar instead, and flip below it when the toolbar is top-anchored.
        const rect = target.getBoundingClientRect();
        const nav = navMenuBounds();
        const gap = 10;
        const navIsTopAnchored = nav && nav.top < window.innerHeight / 2;

        navTooltip.classList.add("visible");
        navTooltip.style.transform = "none";
        navTooltip.style.left = "0px";
        navTooltip.style.top = "0px";
        const tip = navTooltip.getBoundingClientRect();

        let left = rect.left + rect.width / 2 - tip.width / 2;
        left = Math.min(
          Math.max(8, left),
          Math.max(8, window.innerWidth - tip.width - 8)
        );

        const anchor = nav || rect;
        let top = navIsTopAnchored
          ? anchor.bottom + gap
          : anchor.top - tip.height - gap;
        top = Math.min(
          Math.max(8, top),
          Math.max(8, window.innerHeight - tip.height - 8)
        );

        navTooltip.style.left = `${left}px`;
        navTooltip.style.top = `${top}px`;
      }

      function hideNavTooltip() {
        navTooltip.classList.remove("visible");
      }

      // Every toolbar button already carries a full description in
      // data-tooltip, but that is a custom div a screen reader never sees, and
      // the visible labels ("T2", "Calc") don't stand on their own. Derive the
      // accessible name from the tooltip instead of hand-writing 16 of them.
      document.querySelectorAll(".nav-menu [data-tooltip]").forEach((el) => {
        el.setAttribute("aria-label", el.getAttribute("data-tooltip"));
        if (el.tagName === "BUTTON") el.setAttribute("type", "button");
      });

      document.querySelectorAll(".nav-menu [data-tooltip]").forEach((el) => {
        el.addEventListener("focus", () => showNavTooltip(el));
        el.addEventListener("blur", hideNavTooltip);
        el.addEventListener("mouseenter", () => {
          if (tooltipHideTimer) clearTimeout(tooltipHideTimer);
          showNavTooltip(el);
        });
        el.addEventListener("mouseleave", () => {
          tooltipHideTimer = setTimeout(() => {
            if (!navTooltip.matches(":hover")) hideNavTooltip();
          }, 120);
        });
      });

      navTooltip.addEventListener("mouseenter", () => {
        if (tooltipHideTimer) clearTimeout(tooltipHideTimer);
      });
      navTooltip.addEventListener("mouseleave", hideNavTooltip);

      // Minimizing used to hide a window with the only route back being an
      // undiscoverable hover tooltip. refreshChrome() puts a restore chip in
      // the bottom-left bar so a minimized window is never lost.
      function minimizeWindow(windowId) {
        const win = document.getElementById(windowId);
        if (!win) return;
        win.style.display = "none";
        win.classList.remove("active");
        if (activeWindow === windowId) activeWindow = null;
        refreshChrome();
        showStatus("Minimized — click the chip below-left to restore.");
        saveSession();
      }

      function minimizeStickyNote(windowId) {
        minimizeWindow(windowId);
      }

      // --- Keyboard ---
      // The app was mouse-only: no shortcuts, and no way to dismiss the search
      // panel or an in-progress rename from the keyboard.
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (currentEditable) {
            cancelRename();
            return;
          }
          const panel = document.getElementById("search-replace");
          if (panel && panel.classList.contains("active")) {
            toggleSearchReplace();
            return;
          }
          hideNavTooltip();
          return;
        }

        if (!e.ctrlKey || !e.shiftKey || e.altKey) return;
        switch (e.key.toLowerCase()) {
          case "n":
            e.preventDefault();
            addWindow();
            break;
          case "t":
            e.preventDefault();
            addTaskWindow();
            break;
          case "f":
            e.preventDefault();
            toggleSearchReplace();
            break;
          case "w":
            e.preventDefault();
            if (activeWindow) closeWindow(activeWindow);
            break;
        }
      });

      // Header control glyphs are spans acting as buttons; give them Enter and
      // Space so they aren't mouse-only for keyboard users.
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const target = e.target;
        if (!target.matches || !target.matches('[role="button"][tabindex]')) return;
        e.preventDefault();
        target.click();
      });

      // A window parked near an edge could end up unreachable after the
      // viewport shrank; pull everything back into the usable canvas.
      let _resizeTimer = null;
      window.addEventListener("resize", () => {
        if (_resizeTimer) clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(() => {
          document
            .querySelectorAll(WINDOW_SELECTOR)
            .forEach((el) => clampWindowIntoView(el));
          setMaxDimensions();
          debouncedSave(200);
        }, 150);
      });

      (function logConsoleEasterEgg() {
        try {
          const titleStyle =
            "color:#00d4aa;font-weight:700;font-size:14px;font-family:JetBrains Mono,Consolas,monospace;";
          const hintStyle =
            "color:#8492a6;font-size:12px;font-family:JetBrains Mono,Consolas,monospace;";
          console.log("%cphbeks // cbapp", titleStyle);
          console.log("%cType cbappEgg() to reveal a secret.", hintStyle);
          window.cbappEgg = function () {
            console.log("%cYou found it. Keep building.", titleStyle);
          };
        } catch (e) {
          // Swallow console errors to avoid breaking app flow.
        }
      })();
    </script>
  </body>
